<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>羽毛球场站位点</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏸</text></svg>">
<style>
  :root{
    --bg:#eef2f6; --card:#fff; --text:#1a2b22; --text-2:#5b6b62; --text-3:#8a9a91;
    --border:#e4ebe6; --shadow:0 1px 2px rgba(20,50,35,.04), 0 8px 24px rgba(20,50,35,.05);
    --primary:#166b46; --primary-2:#1f8a5b; --primary-bright:#22a06b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent}
  body{
    margin:0; padding:16px 12px;
    background:
      radial-gradient(1000px 500px at 15% -5%, #d9ece1 0%, transparent 55%),
      radial-gradient(800px 400px at 90% 0%, #e3e9f7 0%, transparent 50%),
      var(--bg);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text); -webkit-font-smoothing:antialiased;
    min-height:100vh; -webkit-text-size-adjust:100%;
  }
  .app{max-width:620px; margin:0 auto; display:flex; flex-direction:column; gap:12px}
  .card{background:var(--card); border-radius:16px; border:1px solid var(--border); box-shadow:var(--shadow)}

  .header{
    padding:14px 18px; display:flex; align-items:flex-start; gap:14px; flex-wrap:nowrap;
    position:relative; overflow:hidden;
  }
  .header::before{
    content:''; position:absolute; top:-80px; right:-80px; width:240px; height:240px;
    background:radial-gradient(circle, rgba(31,138,91,.10) 0%, transparent 65%);
    pointer-events:none;
  }
  .header-left{display:flex; gap:12px; align-items:flex-start; flex:1; min-width:0; position:relative}
  .header-left > div:not(.logo){min-width:0; flex:1}
  .logo{
    width:42px; height:42px; flex-shrink:0; border-radius:12px;
    background:linear-gradient(135deg, var(--primary-bright), var(--primary));
    display:flex; align-items:center; justify-content:center; font-size:21px;
    box-shadow:0 4px 12px rgba(22,107,70,.28), inset 0 1px 0 rgba(255,255,255,.2);
  }
  h1{margin:0 0 4px; font-size:16.5px; font-weight:700; letter-spacing:.2px; line-height:1.35}
  .header p{margin:0; font-size:11.5px; color:var(--text-3); line-height:1.55; word-break:break-word}
  .header-actions{display:flex; gap:6px; align-items:center; flex-shrink:0; position:relative}
  .lang-btn{
    appearance:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    padding:3px 7px; background:transparent; border:none; border-radius:5px;
    color:var(--text-3); font-size:11.5px; font-weight:700; font-family:inherit;
    line-height:1; letter-spacing:.3px; opacity:.85;
    transition:color .15s, opacity .15s, transform .12s;
  }
  .lang-btn:hover{color:var(--primary); opacity:1}
  .lang-btn:active{transform:scale(.92)}
  .app.collapsed .header{display:none}

  .canvas-card{padding:0; overflow:hidden}
  .canvas-topbar{
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
    padding:9px 12px; border-bottom:1px solid #f0f4f1;
    font-size:11.5px; color:var(--text-2);
  }
  .sidebar-btn{
    flex-shrink:0;
    width:26px; height:26px; border-radius:7px;
    display:inline-flex; align-items:center; justify-content:center;
    background:#f0f5f2; border:1px solid var(--border); color:var(--text-2);
    cursor:pointer; padding:0; font-family:inherit;
    transition:background .15s, color .15s, transform .12s;
  }
  .sidebar-btn:hover{background:#e6efe9; color:var(--primary)}
  .sidebar-btn:active{transform:scale(.92)}
  .sidebar-btn svg{width:13px; height:13px; stroke-width:2.4; fill:none; stroke:currentColor; stroke-linecap:round}

  .collapse-btn{
    flex-shrink:0; width:24px; height:24px;
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border:none; border-radius:0;
    color:var(--text-3); cursor:pointer; padding:0;
    box-shadow:none; opacity:.75;
    transition:color .15s, transform .12s, opacity .15s;
    font-family:inherit;
  }
  .collapse-btn:hover{color:var(--primary); opacity:1}
  .collapse-btn:active{transform:scale(.9)}
  .collapse-btn svg{width:14px; height:14px; stroke-width:2.2; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round}
  .collapse-btn .chev-down{display:none}
  .app.collapsed .collapse-btn .chev-up{display:none}
  .app.collapsed .collapse-btn .chev-down{display:inline}

  .mode-toggle{
    appearance:none; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    padding:5px 13px; background:#e8eee9; border:1px solid transparent;
    border-radius:7px; color:var(--primary); font-weight:700; font-size:12px;
    font-family:inherit; line-height:1; letter-spacing:.3px; min-width:46px;
    transition:background .15s, color .15s, transform .12s;
  }
  .mode-toggle:hover{background:#dde6e0}
  .mode-toggle:active{transform:scale(.96)}
  .mode-toggle[data-mode="single"]{background:#e8f0f7; color:#1e6bb8}
  .mode-toggle[data-mode="single"]:hover{background:#dbe7f3}

  .tb-right{
    display:inline-flex; align-items:center; gap:6px;
    margin-left:auto; flex-shrink:0;
  }
  .pill-group{display:inline-flex; gap:3px; align-items:center}

  .pill{
    display:inline-flex; align-items:center; justify-content:center;
    padding:2px 8px; border-radius:999px;
    font-size:10.5px; font-weight:700; letter-spacing:.2px;
    border:1px solid transparent; white-space:nowrap; line-height:1.5;
    font-variant-numeric:tabular-nums;
    cursor: ns-resize;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  .pill:active{ transform: scale(.96); }

  .pill-height{
    background:rgba(31,111,139,.12);
    border-color:rgba(31,111,139,.28);
    color:#1f6f8b;
  }

  .canvas-wrap{padding:9px 10px 8px; display:flex; justify-content:center}
  canvas{
    display:block; border-radius:10px; touch-action:none; background:#f7fbf9;
    max-width:100%; box-shadow:0 1px 3px rgba(20,50,35,.06), 0 4px 14px rgba(20,50,35,.05);
  }
  .info-line{
    padding:0 12px 10px; font-size:11px; color:var(--text-3);
    text-align:center; line-height:1.6; font-variant-numeric:tabular-nums;
  }
  .info-line b{color:var(--text-2); font-weight:600}

  .footer{
    padding:2px 8px 6px; text-align:center; font-size:12px;
    color:var(--text-3); letter-spacing:.3px; line-height:1.7;
  }
  .footer b{color:var(--text-2); font-weight:600}
  #credit{cursor:pointer; user-select:none}

  .sidebar{
    position:fixed; top:0; left:0; bottom:0; width:min(330px, 88vw);
    background:#fff; z-index:60; transform:translateX(-103%);
    transition:transform .26s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column;
    box-shadow:4px 0 26px rgba(20,50,35,.14);
  }
  .sidebar.open{transform:none}
  .sidebar-mask{
    position:fixed; inset:0; background:rgba(10,30,20,.40);
    opacity:0; pointer-events:none; transition:opacity .26s; z-index:59;
    backdrop-filter:blur(1px); -webkit-backdrop-filter:blur(1px);
  }
  .sidebar-mask.open{opacity:1; pointer-events:auto}
  .sidebar-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 16px; color:#fff;
    background:linear-gradient(135deg, var(--primary-2), var(--primary));
    flex-shrink:0;
  }
  .sidebar-head h2{margin:0; font-size:14.5px; font-weight:700; letter-spacing:.2px}
  .sidebar-close{
    background:transparent; border:none; color:#fff; font-size:22px;
    line-height:1; cursor:pointer; padding:0 4px; font-family:inherit;
  }
  .sidebar-close:active{transform:scale(.9)}
  .sidebar-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .sidebar-foot{padding:10px 14px; border-top:1px solid var(--border); flex-shrink:0}
  .sidebar-foot button{
    width:100%; padding:8px; border-radius:8px; border:1px solid var(--border);
    background:#f5f9f6; color:var(--text-2); font-family:inherit; font-weight:600;
    font-size:12px; cursor:pointer; transition:background .15s;
  }
  .sidebar-foot button:hover{background:#eaf2ed}
  .sidebar-foot button:active{transform:scale(.98)}

  .s-group{padding:9px 14px 10px; border-bottom:1px solid #f0f4f1}
  .s-group:last-child{border-bottom:none}
  .s-title{
    font-size:10.5px; font-weight:700; color:var(--text-2);
    margin-bottom:7px; display:flex; justify-content:space-between; align-items:baseline; gap:6px;
  }
  .s-title span{font-weight:500; color:var(--text-3); font-size:9.5px; text-align:right}
  .s-grid{display:grid; grid-template-columns:1fr; gap:6px}
  .s-item{
    display:grid; grid-template-columns:74px 1fr 46px; gap:6px; align-items:center;
    font-size:11px; color:var(--text-2); min-width:0;
  }
  .s-item span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .s-item b{font-weight:700; color:var(--primary); text-align:right; font-variant-numeric:tabular-nums; font-size:11px}
  .s-item input[type=range]{width:100%; height:16px; accent-color:var(--primary); cursor:pointer; margin:0}
  .s-item.near b{color:#1f6f8b}
  .s-item.far b{color:#c0392b}

  .modal-mask{
    position:fixed; inset:0; z-index:70; background:rgba(10,30,20,.46);
    display:none; align-items:flex-start; justify-content:center;
    padding:26px 14px; overflow:auto; backdrop-filter:blur(2px);
    -webkit-overflow-scrolling:touch;
  }
  .modal-mask.open{display:flex}
  .modal{
    background:#fff; border-radius:16px; width:100%; max-width:660px;
    box-shadow:0 24px 70px rgba(0,0,0,.28); overflow:hidden;
    animation:pop .22s ease;
  }
  @keyframes pop{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; color:#fff;
    background:linear-gradient(135deg, var(--primary-2), var(--primary));
    position:sticky; top:0; z-index:1;
  }
  .modal-head h2{margin:0; font-size:16px; font-weight:650}
  .modal-close{
    background:transparent!important; box-shadow:none!important; color:#fff;
    font-size:24px; line-height:1; padding:0 6px; border:none; cursor:pointer;
  }
  .modal-body{
    padding:18px 22px 24px; font-size:14px; line-height:1.78; color:var(--text);
    max-height:76vh; overflow:auto; -webkit-overflow-scrolling:touch;
  }
  .modal-body h3{
    font-size:15px; margin:22px 0 8px; color:var(--primary); font-weight:650;
    padding-bottom:4px; border-bottom:1px solid #e8f0ec;
  }
  .modal-body h3:first-child{margin-top:0; border-top:none}
  .modal-body p{margin:6px 0}
  .modal-body .lead{
    color:var(--text); font-size:13.5px; background:#f2f7f4;
    padding:10px 13px; border-radius:8px; margin-bottom:12px;
    border-left:3px solid var(--primary);
  }
  .formula{
    background:#f2f7f4; border-left:3px solid var(--primary);
    padding:8px 13px; border-radius:6px; margin:8px 0;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
    font-size:14px; overflow-x:auto; white-space:nowrap;
  }
  .modal-body code{background:#eef2f6; padding:1px 6px; border-radius:5px; font-size:12.5px}
  .modal-body ul, .modal-body ol{margin:6px 0; padding-left:22px}
  .modal-body li{margin:4px 0}

  @media (max-width: 520px){
    body{padding:10px 8px}
    .app{gap:10px}
    .header{padding:11px 13px; gap:10px}
    .logo{width:36px; height:36px; font-size:18px; border-radius:10px}
    h1{font-size:14.5px}
    .header p{font-size:10.5px; line-height:1.45}
    .lang-btn{padding:2px 5px; font-size:11px}

    .canvas-topbar{padding:8px 10px; gap:5px; font-size:11px}
    .mode-toggle{padding:4px 11px; font-size:11.5px; min-width:42px}
    .pill{font-size:10px; padding:1px 7px}
    .tb-right{gap:5px}
    .sidebar-btn{width:24px; height:24px}
    .collapse-btn{width:20px; height:20px}
    .collapse-btn svg{width:12px; height:12px}

    .canvas-wrap{padding:7px 7px 6px}
    .info-line{font-size:10px; padding:0 10px 8px}

    .footer{font-size:11px}
    .modal-mask{padding:8px 6px}
    .modal{border-radius:13px}
    .modal-head{padding:12px 16px}
    .modal-head h2{font-size:15px}
    .modal-body{padding:14px 16px 20px; font-size:13.5px; line-height:1.72; max-height:84vh}
    .modal-body h3{font-size:14px; margin:18px 0 6px}
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="card header">
    <div class="header-left">
      <div class="logo">🏸</div>
      <div>
        <h1 id="pageTitle">羽毛球场站位点</h1>
        <p id="pageSub"></p>
      </div>
    </div>
    <div class="header-actions">
      <button id="langBtn" class="lang-btn" aria-label="Switch language">EN</button>
    </div>
  </header>

  <div class="card canvas-card">
    <div class="canvas-topbar">
      <button class="sidebar-btn" id="sidebarBtn" aria-label="参数">
        <svg viewBox="0 0 24 24">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <circle cx="9" cy="7" r="2.4" fill="none" stroke="currentColor"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
          <circle cx="15" cy="17" r="2.4" fill="none" stroke="currentColor"/>
        </svg>
      </button>

      <button class="mode-toggle" id="modeToggle" data-mode="double">双打</button>

      <div class="tb-right">
        <div class="pill-group" id="pillGroup">
          <span class="pill pill-height" id="pillHeight">击球点 2.8m</span>
          <span class="pill" id="pillClear" data-label="高">高 22%</span>
          <span class="pill" id="pillDrop"  data-label="吊">吊 23%</span>
          <span class="pill" id="pillKill"  data-label="杀">杀 55%</span>
        </div>
        <button class="collapse-btn" id="collapseBtn" aria-label="隐藏顶部">
          <svg class="chev-up" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg>
          <svg class="chev-down" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
        </button>
      </div>
    </div>

    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
    <div class="info-line" id="infoLine"></div>
  </div>

  <footer class="footer" id="credit">
    © <b>Robert Bogan Kang</b> <span id="footerText"></span>
  </footer>
</div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <h2 id="sidebarTitle">参数</h2>
    <button class="sidebar-close" id="sidebarClose" aria-label="关闭">×</button>
  </div>
  <div class="sidebar-body" id="sliders"></div>
  <div class="sidebar-foot">
    <button id="resetBtn">恢复默认</button>
  </div>
</aside>
<div class="sidebar-mask" id="sidebarMask"></div>

<div class="modal-mask" id="principleModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <div class="modal-head">
      <h2 id="pTitle">羽毛球场站位点 · 计算方法</h2>
      <button class="modal-close" id="principleClose" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="principleBody"></div>
  </div>
</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);

/* =========================================================
   1. 国际化
   ========================================================= */
const I18N = {
  zh: {
    title: '羽毛球场站位点',
    sub: '拖动对手点调位置 · 拖动胶囊调高度/概率 · 双击场地开关热力图 · 左侧 ☰ 调参数',
    doubles: '双打', singles: '单打',
    params: '参数', reset: '恢复默认',
    footer: '创作 · 保留所有权利',
    principleTitle: '羽毛球场站位点 · 计算方法',
    net: '网',
    lblNearDrop: '近吊',  lblNearDropV: '1.5 m',
    lblFrontPen: '前压',  lblFrontPenV: '4.0 m',
    lblFarDrop:  '远吊',  lblFarDropV:  '4.5 m',
    gSpeed: '球速', gSpeedHint: '初速 m/s · 衰减 1/m',
    gProb: '概率', gProbHint: '三者联动 · 总和 100%',
    gReach: '可达性', gReachHint: '启动延迟 s · 速度 m/s',
    gFilter: '过滤', gFilterHint: '过网 / 触及判定',
    sl_v0_smash: '杀球 v0', sl_lam_smash: '杀球 λ',
    sl_v0_clear: '平高 v0', sl_lam_clear: '平高 λ',
    sl_v0_drop_near: '近吊 v0', sl_lam_drop_near: '近吊 λ',
    sl_v0_drop_far: '远吊 v0', sl_lam_drop_far: '远吊 λ',
    sl_p_smash: '杀球 %', sl_p_clear: '平高 %', sl_p_drop: '吊球 %',
    sl_t_react: '启动延迟', sl_w_def: '反应宽度',
    sl_v_run: '跑动速度', sl_k2: '上网/后退',
    sl_dropMaxOverNet: '吊过网高',
    sl_clearLineY:  '触及位置线',
    sl_clearHeight: '举拍高度',
    collapseHide: '隐藏标题', collapseShow: '展开标题',
    langBtn: 'EN',
    pillHint: '拖动调整（上增下减）',
    heightHint: '上下拖动调整击球点高度',
    pillHeight: '击球点',
    ourBack: '后场', ourFront: '前场', ourSolo: '站位',
    infoContact: '击球点',
    infoSmash: '杀',
    infoClear: '平高',
    infoDrop: '吊',
    infoSpot: '站位',
    infoGap: '间距',
    infoDefense: '防守',
    infoAttack: '进攻',
    infoHeatOn: '热力图开',
    principleHTML: `
      <p class="lead"><b>一句话：</b>把「防守」和「进攻」当成<b>两个候选方案</b>，各自求出最优站位，再用同一个<b>期望净得分</b>公式打分，取分数更高的那个。</p>

      <h3>一、坐标系</h3>
      <ul>
        <li>场地长 <code>13.40 m</code>、宽 <code>6.10 m</code>，球网位于 <code>y = 0</code></li>
        <li>我方半场 <code>y &lt; 0</code>，对手半场 <code>y &gt; 0</code></li>
        <li>左侧标出：<b>网</b>、<b>近吊 1.5 m</b>、<b>前压 4.0 m</b>、<b>远吊 4.5 m</b></li>
      </ul>

      <h3>二、击球点高度</h3>
      <p>右上角胶囊可拖动，范围 <code>0.8–3.5 m</code>。高度影响：</p>
      <ul>
        <li><b>杀球概率</b>：低于网高时几乎无效，高于网高 0.8 m 后完全有效</li>
        <li><b>杀球球速</b>：高度越低初速越低（起跳发力受限）</li>
        <li><b>落点峰值</b>：低高度时杀球/平高落点前移</li>
      </ul>

      <h3>三、飞行时间</h3>
      <div class="formula">t(d) = (e<sup>λd</sup> − 1) / (λ · v₀)</div>
      <p><code>d</code> 为击球点到落点的距离，<code>v₀</code> 为初速，<code>λ</code> 为空气阻力衰减系数。吊球按落点距网远近在「近吊」与「远吊」之间线性插值。</p>

      <h3>四、可达概率</h3>
      <div class="formula">p = sigmoid( (t − t<sub>react</sub> − τ) / w )</div>
      <p><code>τ</code> 为跑动时间，<code>t<sub>react</sub></code> 为启动延迟，<code>w</code> 为反应宽度。后退方向等效距离乘以 <code>1/k₂</code> 惩罚。双打取「两人中至少一个够到」：<code>reach = 1 − (1−p₁)(1−p₂)</code>。</p>

      <h3>五、期望净得分</h3>
      <div class="formula">V(L) = reach(L) · c − (1 − reach(L))</div>
      <p><code>c</code> 为「接到后这拍我方占优的概率」，按球路加权：</p>
      <ul>
        <li>杀 <code>0.20</code> · 平高 <code>0.65</code> · 吊 <code>0.55</code></li>
      </ul>
      <div class="formula">c_base = p<sub>smash</sub>·0.20 + p<sub>clear</sub>·0.65 + p<sub>drop</sub>·0.55</div>
      <p>进攻方案额外加 <code>+0.15</code>（封顶 0.95）。</p>

      <h3>六、方案总分</h3>

/* =========================================================
   2. 参数定义（侧边栏顺序：概率 → 可达性 → 过滤 → 球速）
   ========================================================= */
const SLIDER_DEFS = [
  /* 概率 */
  { group:'prob',   key:'p_smash',       min:0,   max:100, step:1,    def:55 },

  { group:'reach',  key:'v_run',         min:3.0, max:6.5, step:0.1,  def:3.8 },

  { group:'speed',  key:'lam_clear',     min:0.08,max:0.35,step:0.01, def:0.18 },
  { group:'speed',  key:'v0_drop_near',  min:8,   max:24,  step:1,    def:14,  cls:'near' },

  { group:'speed',  key:'v0_drop_far',   min:14,  max:35,  step:1,    def:22,  cls:'far' },
  { group:'speed',  key:'lam_drop_far',  min:0.08,max:0.30,step:0.01, def:0.18, cls:'far' }

const PRM = {};

/* =========================================================
   3. 场地常量
   ========================================================= */
const L = 13.4, W = 6.10, HL = L/2, HW = W/2;
const SINGLES_HW = 2.59, SHORT_SVC = 1.98, LONG_SVC = 0.76;

const DROP_NEAR_EDGE = 1.5;
const DROP_FAR_EDGE  = 4.5;
const FRONT_PEN_Y    = 4.0;
const NET_H          = 1.55;

const C_COURT_LINE  = '#3a7d5c';
const C_COURT_FRAME = '#1e4d38';
const C_REF_BLUE    = 'rgba(31,111,139,0.22)';
const C_REF_RED     = 'rgba(192,57,43,0.16)';
const C_NET         = '#1e4d38';

const FONT_TAG_MAIN = 'bold 9px system-ui';
const FONT_TAG_SUB  = 'bold 8px system-ui';
const FONT_PLAYER   = 'bold 11px system-ui';
const FONT_OUR      = 'bold 12px system-ui';
const TAG_PADX      = 5;
const HALO_W        = 3.5;

const C_PERSON = '#111';

const C_BY_SHOT = { smash: 0.20, clear: 0.65, drop: 0.55 };
const ATTACK_BONUS = 0.15;
const C_CAP        = 0.95;

const HEAT_RGB = {
  smash: [192, 57, 43],
  clear: [45, 90, 200],
  drop:  [40, 170, 80]
};

/* 热力图 KDE 参数 */
const HEAT_CELL  = 0.08;
const HEAT_SIGMA = 0.26;
const HEAT_CUT   = 0.01;

/* 气动模型 */
const AERO = { dt: 0.005, tMax: 6.0, g: 9.81,
               RHO: 1.2, CD: 0.60, S_SHUTTLE: 0.003, M_SHUTTLE: 0.005 };
AERO.K_OVER_M = 0.5 * AERO.RHO * AERO.CD * AERO.S_SHUTTLE / AERO.M_SHUTTLE;

const SHOT_AZIM_SIG = { smash: 25, clear: 15, drop: 20 };

function landingKernel(type, y){
  const dn = -y;
  const shift = Math.max(0, Math.min(1.2, (2.8 - PRM.hh) * 0.6));
  if(type === 'smash') return Math.exp(-Math.pow((dn - (5.8 - shift)) / 1.2, 2));
  if(type === 'clear') return Math.exp(-Math.pow((dn - (5.5 - shift * 0.9)) / 1.4, 2));
  return Math.exp(-Math.pow((dn - 2.8) / 1.6, 2));
}

function getPlanC(probs, planType){
  const cBase = probs.ps * C_BY_SHOT.smash
              + probs.pc * C_BY_SHOT.clear
              + probs.pd * C_BY_SHOT.drop;
  return planType === 'attack' ? Math.min(C_CAP, cBase + ATTACK_BONUS) : cBase;
}

/* =========================================================
   4. 物理模型（站位优化器）
   ========================================================= */
function flightTime(v0, lam, d){
  if(d < 0.1) return 0.15;
  const x = lam * d;
  if(x > 15) return 3.0;
  return Math.max(0.15, Math.min(3.0, (Math.exp(x) - 1) / (lam * v0)));
}

function getDropParams(distFromNet){
  const u = Math.max(0, Math.min(1, (distFromNet - DROP_NEAR_EDGE) / (DROP_FAR_EDGE - DROP_NEAR_EDGE)));
  return {
    v0:  PRM.v0_drop_near  * (1-u) + PRM.v0_drop_far  * u,
    lam: PRM.lam_drop_near * (1-u) + PRM.lam_drop_far * u
  };
}

function runTime(pos, Lp){
  const dx = Lp.x - pos.x;
  const dy = Lp.y - pos.y;
  const dEff = dy > 0
    ? Math.sqrt(dx*dx + (dy/PRM.k2)*(dy/PRM.k2))
    : Math.hypot(dx, dy);
  return dEff / Math.max(0.5, PRM.v_run);
}

function sigmoid(x){
  if(x > 30) return 1;
  if(x < -30) return 0;
  return 1 / (1 + Math.exp(-x));
}

function pDef(pos, Lp, t){
  const tau = runTime(pos, Lp);
  return sigmoid((t - PRM.t_react - tau) / Math.max(0.02, PRM.w_def));
}

function smashSpeedFactor(){
  return Math.max(0.3, Math.min(1.0, (PRM.hh - NET_H + 0.3) / 1.0));
}

function getProbs(){
  const smashF = Math.max(0, Math.min(1, (PRM.hh - NET_H) / 0.8));
  const clearF = Math.max(0, Math.min(1, (PRM.hh - 1.0) / 1.0));
  let ps = PRM.p_smash / 100 * smashF;
  let pc = PRM.p_clear / 100 * clearF;
  let pd = PRM.p_drop / 100;
  const total = ps + pc + pd || 1;
  return { ps: ps/total, pc: pc/total, pd: pd/total };
}

function reachSet(pos, Lp, times){
  return {
    s: pDef(pos, Lp, times.t_smash),
    c: pDef(pos, Lp, times.t_clear),
    d: pDef(pos, Lp, times.t_drop)
  };
}

function pointValue(P1, P2, Lp, times, probs, c){
  const a = reachSet(P1, Lp, times);
  const b = P2 ? reachSet(P2, Lp, times) : null;
  const cp1 = c + 1;
  const rS = b ? 1 - (1 - a.s) * (1 - b.s) : a.s;
  const rC = b ? 1 - (1 - a.c) * (1 - b.c) : a.c;
  const rD = b ? 1 - (1 - a.d) * (1 - b.d) : a.d;
  return probs.ps * (rS * cp1 - 1)
       + probs.pc * (rC * cp1 - 1)
       + probs.pd * (rD * cp1 - 1);
}

function landingWeight(Lp, probs){
  const raw = probs.ps * landingKernel('smash', Lp.y)
            + probs.pc * landingKernel('clear', Lp.y)
            + probs.pd * landingKernel('drop',  Lp.y);
  return 0.12 + 0.88 * raw;
}

function evaluatePlan(P1, P2, items, probs, planType){
  const c = getPlanC(probs, planType);
  let sumW = 0, sumWV = 0;
  for(const it of items){
    const w = landingWeight(it.L, probs);
    const V = pointValue(P1, P2, it.L, it, probs, c);
    sumWV += w * V;
    sumW  += w;
  }
  return sumW > 0 ? sumWV / sumW : -1;
}

/* =========================================================
   5. 落点物理模拟（热力图用）
   ========================================================= */
function simulate(v0, h0, elevDeg, azimDeg, x0, y0, maxOverNet, clearFilter){
  const elev = elevDeg * Math.PI / 180;
  const azim = azimDeg * Math.PI / 180;
  let px = x0, py = y0, pz = h0;
  let vx = v0 * Math.cos(elev) * Math.sin(azim);
  let vy = -v0 * Math.cos(elev) * Math.cos(azim);
  let vz = v0 * Math.sin(elev);
  let t = 0;
  const km = AERO.K_OVER_M;
  const lineY = clearFilter ? -clearFilter.lineY : null;

  while(t < AERO.tMax){
    const sp = Math.hypot(vx, vy, vz);
    vx += -km * sp * vx * AERO.dt;
    vy += -km * sp * vy * AERO.dt;
    vz += (-km * sp * vz - AERO.g) * AERO.dt;
    const nx = px + vx * AERO.dt;
    const ny = py + vy * AERO.dt;
    const nz = pz + vz * AERO.dt;

    /* 过网判定 */
    if(py > 0 && ny <= 0){
      const f = py / (py - ny);
      const zc = pz + (nz - pz) * f;
      if(zc < NET_H) return null;
      if(maxOverNet != null && zc > NET_H + maxOverNet) return null;
    }
    /* 平高：穿过 y = −触及位置线 平面时的高度 < 举拍高度 → 被拦截 */
    if(clearFilter && py > lineY && ny <= lineY){
      const f = (py - lineY) / (py - ny);
      const zc = pz + (nz - pz) * f;
      if(zc < clearFilter.height) return null;
    }
    /* 落地 */
    if(nz <= 0){
      const f = pz / (pz - nz);
      const rx = px + (nx - px) * f;
      const ry = py + (ny - py) * f;
      /* 平高：落点未到触及线（比线更靠前）→ 对手轻松够到 */
      if(clearFilter && ry > lineY) return null;
      return { x: rx, y: ry };
    }

    px = nx; py = ny; pz = nz;
    t += AERO.dt;
  }
  return null;
}

const ELEV_MIN = -80, ELEV_MAX = 88;
const AZIM_MAX = 55;

function probe(v0, hitter, elev, azim, halfW, maxOverNet, clearFilter){
  const r = simulate(v0, PRM.hh, elev, azim, hitter.x, hitter.y, maxOverNet, clearFilter);
  if(!r) return null;
  if(r.y >= 0 || r.y < -HL || Math.abs(r.x) > halfW) return null;
  return r;
}

/* 粗筛：扫出物理上可行的仰角区间 [lo, hi] */
function coarseElevRanges(v0, hitter, halfW, fast, maxOverNet, clearFilter){
  const step = fast ? 1.5 : 1.0;
  const azims = fast ? [0] : [-20, -10, 0, 10, 20];

  const ranges = [];
  let lo = null, last = null;

  for(let elev = ELEV_MIN; elev <= ELEV_MAX + 1e-9; elev += step){
    let ok = false;
    for(const az of azims){
      if(probe(v0, hitter, elev, az, halfW, maxOverNet, clearFilter)){ ok = true; break; }
    }
    if(ok){
      if(lo === null) lo = elev;
      last = elev;
    } else if(lo !== null){
      ranges.push([Math.max(ELEV_MIN, lo - step), Math.min(ELEV_MAX, last + step)]);
      lo = null; last = null;
    }
  }
  if(lo !== null){
    ranges.push([Math.max(ELEV_MIN, lo - step), Math.min(ELEV_MAX, last + step)]);
  }
  return ranges;
}

/* 细筛：只在可行区间内加密，返回 {x,y,type,w}[] */
function genLandings(type, hitter, fast){
  const v0 = type === 'smash' ? PRM.v0_smash * smashSpeedFactor()
           : type === 'clear' ? PRM.v0_clear
           : PRM.v0_drop_near;
  const halfW = mode === 'single' ? SINGLES_HW : HW;
  const azimSig = SHOT_AZIM_SIG[type];

  const maxOverNet = type === 'drop' ? PRM.dropMaxOverNet : null;
  const clearFilter = type === 'clear'
    ? { lineY: PRM.clearLineY, height: PRM.clearHeight }
    : null;

  const ranges = coarseElevRanges(v0, hitter, halfW, fast, maxOverNet, clearFilter);
  if(!ranges.length) return [];

  const elevStep = fast ? 1.0 : 0.4;
  const azimStep = fast ? 6   : 3;
  const aLo = Math.max(-AZIM_MAX, -1.5 * azimSig);
  const aHi = Math.min(AZIM_MAX,   1.5 * azimSig);

  const landings = new Map();

  for(const [lo, hi] of ranges){
    for(let elev = lo; elev <= hi + 1e-9; elev += elevStep){
      for(let azim = aLo; azim <= aHi + 1e-9; azim += azimStep){
        const r = probe(v0, hitter, elev, azim, halfW, maxOverNet, clearFilter);
        if(!r) continue;

        const w = Math.exp(-Math.pow(azim / azimSig, 2))
                * landingKernel(type, r.y);
        if(w <= 0.01) continue;
        const key = elev.toFixed(2) + '_' + azim.toFixed(2);
        if(!landings.has(key)) landings.set(key, { x: r.x, y: r.y, type, w });
      }
    }
  }
  return Array.from(landings.values());
}

let cachedLandings = [];

function rebuildLandings(probs, fast){
  const hitter = opponents[0];
  const out = [];
  for(const type of SHOT_TYPES){
    const arr = genLandings(type, hitter, fast);
    const w0 = type === 'smash' ? probs.ps
             : type === 'clear' ? probs.pc
             : probs.pd;
    for(const L of arr) out.push({ x: L.x, y: L.y, type, w: L.w * w0 });
  }
  cachedLandings = out;
}

function measureTagWidth(line1, line2){
  ctx.save();
  ctx.font = FONT_TAG_MAIN;
  const w1 = ctx.measureText(line1).width;
  ctx.font = FONT_TAG_SUB;
  const w2 = line2 ? ctx.measureText(line2).width : 0;
  ctx.restore();
  return Math.max(w1, w2) + TAG_PADX * 2;
}

function computePadL(){
  const w = Math.max(
    measureTagWidth(t('net'), null),
    measureTagWidth(t('lblNearDrop'), t('lblNearDropV')),
    measureTagWidth(t('lblFrontPen'), t('lblFrontPenV')),
    measureTagWidth(t('lblFarDrop'),  t('lblFarDropV'))
  );
  return Math.ceil(w) + 12;

function lineStroke(a, b){

  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}

function roundRectPath(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}

function drawCourtTag(line1, line2, anchorX, anchorY, color, align){
  ctx.save();

  ctx.font = FONT_TAG_SUB;

  const tw = Math.max(w1, w2);

  const padX = TAG_PADX, padY = 3, lineH = 10;
  const rows = line2 ? 2 : 1;

  const h = lineH*rows + padY*2;

  let bx;
  if(align === 'right')       bx = anchorX - w;
  else if(align === 'center') bx = anchorX - w/2;
  else                        bx = anchorX;

  roundRectPath(ctx, bx, by, w, h, 3.5);

  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.06)';

    ctx.globalAlpha = 1;
  } else {
    ctx.font = FONT_TAG_MAIN;

}

function setup(){
  PAD_L = computePadL();
  LW = W*SCALE + PAD_L + PAD_R;
  LH = L*SCALE + PAD_T + PAD_B;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const wrap = canvas.parentElement, cs = getComputedStyle(wrap);
  const avail = wrap.clientWidth - (parseFloat(cs.paddingLeft)||0) - (parseFloat(cs.paddingRight)||0);
  let cw = Math.min(avail, LW), ch = cw * LH / LW;
  const maxH = Math.min(window.innerHeight * 0.75, 720);
  if(ch > maxH){ ch = maxH; cw = ch * LW / LH; }
  cw = Math.max(150, cw);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width  = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  const s = canvas.width / LW;
  ctx.setTransform(s, 0, 0, s, 0, 0);
}

/* =========================================================
   9. 站位求解
   ========================================================= */
function buildItems(hitter, step){
  const items = [];
  const sSpeed = PRM.v0_smash * smashSpeedFactor();
  for(let x = -HW+0.15; x <= HW-0.15+1e-9; x += step){
    for(let y = -HL+0.15; y <= -0.15+1e-9; y += step){
      const Lp = { x, y };
      const d = Math.hypot(Lp.x - hitter.x, Lp.y - hitter.y);
      const dp = getDropParams(-y);
      items.push({
        L: Lp,
        t_smash: flightTime(sSpeed, PRM.lam_smash, d),
        t_clear: flightTime(PRM.v0_clear, PRM.lam_clear, d),
        t_drop:  flightTime(dp.v0, dp.lam, d)
      });
    }
  }
  return items;
}

function optimizeSingle(items, otherPos, x0, x1, y0, y1, step, probs, planType){
  const c   = getPlanC(probs, planType);
  const cp1 = c + 1;
  const isDefense = planType === 'defense';

  const od = items.map(it => reachSet(otherPos, it.L, it));
  const wts = items.map(it => landingWeight(it.L, probs));

  const frontPenFactor = isDefense ? Math.max(0, probs.ps - probs.pd) * 1.5 : 0;

  let best = null, bestCost = Infinity;
  const n = items.length;

  for(let x = x0; x <= x1+1e-9; x += step){
    for(let y = y0; y <= y1+1e-9; y += step){
      const pos = { x, y };
      let minV = Infinity, sumWV = 0, sumW = 0;

      for(let i = 0; i < n; i++){
        const it = items[i], o = od[i];
        const my = reachSet(pos, it.L, it);

        const rS = 1 - (1 - my.s) * (1 - o.s);
        const rC = 1 - (1 - my.c) * (1 - o.c);
        const rD = 1 - (1 - my.d) * (1 - o.d);

        const V = probs.ps * (rS * cp1 - 1)
                + probs.pc * (rC * cp1 - 1)
                + probs.pd * (rD * cp1 - 1);

        const w  = wts[i];
        const wv = w * V;
        if(wv < minV) minV = wv;
        sumWV += wv; sumW += w;
      }
      const avgV = sumW > 0 ? sumWV / sumW : 0;
      const sep  = Math.hypot(x - otherPos.x, y - otherPos.y);
      const sepPen   = sep < 1.2 ? (1.2 - sep) * 0.25 : 0;
      const frontPen = (y > -FRONT_PEN_Y) ? (y + FRONT_PEN_Y) * frontPenFactor : 0;

      const cost = -(0.7 * minV + 0.3 * avgV) + sepPen + frontPen;
      if(cost < bestCost){ bestCost = cost; best = pos; }
    }
  }
  return best || { x:(x0+x1)/2, y:(y0+y1)/2 };
}

function optimizeSolo(items, probs, step){
  const c   = getPlanC(probs, 'solo');
  const cp1 = c + 1;
  const wts = items.map(it => landingWeight(it.L, probs));
  const n = items.length;
  const x0 = -HW + 0.30, x1 = HW - 0.30;
  const y0 = -HL + 0.40, y1 = -1.5;

  let best = null, bestCost = Infinity;

  for(let x = x0; x <= x1 + 1e-9; x += step){
    for(let y = y0; y <= y1 + 1e-9; y += step){
      const pos = { x, y };
      let sumWV = 0, sumW = 0;
      for(let i = 0; i < n; i++){
        const it = items[i];
        const my = reachSet(pos, it.L, it);
        const V = probs.ps * (my.s * cp1 - 1)
                + probs.pc * (my.c * cp1 - 1)
                + probs.pd * (my.d * cp1 - 1);
        const w = wts[i];
        sumWV += w * V; sumW += w;
      }
      const avgV = sumW > 0 ? sumWV / sumW : 0;
      const cost = -avgV;
      if(cost < bestCost){ bestCost = cost; best = pos; }
    }
  }
  return best || { x: 0, y: -4.0 };
}

function solveForScenario(items, probs, scenario, stepPos, iters, hitter){
  const sign = hitter.x >= 0 ? 1 : -1;
  const isDefense = scenario === 'defense';
  let P1, P2;
  let bx0_1, bx1_1, by0_1, by1_1;
  let bx0_2, bx1_2, by0_2, by1_2;

  if(isDefense){
    if(sign > 0){
      bx0_1 = 1.0;        bx1_1 = HW - 0.25;
      bx0_2 = -HW + 0.3;  bx1_2 = 1.0;
    } else {
      bx0_1 = -HW + 0.25; bx1_1 = -1.0;
      bx0_2 = -1.0;       bx1_2 = HW - 0.3;
    }
    by0_1 = -HL + 0.4; by1_1 = -3.2;
    by0_2 = -HL + 0.4; by1_2 = -3.2;
    P1 = { x: sign*2.2, y: -4.5 };
    P2 = { x: -sign*0.5, y: -4.5 };
  } else {
    bx0_1 = -1.6; bx1_1 = 1.6;
    by0_1 = -HL + 0.4; by1_1 = -4.2;
    bx0_2 = -2.4; bx1_2 = 2.4;
    by0_2 = -3.2; by1_2 = -1.4;
    P1 = { x: 0, y: -5.3 };
    P2 = { x: 0, y: -2.2 };
  }

  for(let it = 0; it < iters; it++){
    P1 = optimizeSingle(items, P2, bx0_1, bx1_1, by0_1, by1_1, stepPos, probs, scenario);
    P2 = optimizeSingle(items, P1, bx0_2, bx1_2, by0_2, by1_2, stepPos, probs, scenario);
  }
  return { P1, P2 };
}

function solve(fast){
  const single = mode === 'single';
  const hitter = opponents[0];
  const stepPts = fast ? 0.80 : 0.42;
  const stepPos = fast ? 0.55 : 0.28;
  const iters   = fast ? 1 : 4;

  const items = buildItems(hitter, stepPts);
  const probs = getProbs();

  rebuildLandings(probs, fast);

  if(single){
    const P1 = optimizeSolo(items, probs, stepPos);
    return { P1, P2: null, probs, scenario:'defense', valid:true };
  }

  const defRes = solveForScenario(items, probs, 'defense', stepPos, iters, hitter);
  const atkRes = solveForScenario(items, probs, 'attack',  stepPos, iters, hitter);

  const Edef = evaluatePlan(defRes.P1, defRes.P2, items, probs, 'defense');
  const Eatk = evaluatePlan(atkRes.P1, atkRes.P2, items, probs, 'attack');

  const scenario = Edef >= Eatk ? 'defense' : 'attack';
  const res = scenario === 'defense' ? defRes : atkRes;

  return { P1: res.P1, P2: res.P2, probs, scenario, valid: true };
}

/* ---- 落点热力图 ---- */
const heatCanvas = document.createElement('canvas');
const heatCtx = heatCanvas.getContext('2d');
let heatDirty = true;

function buildLandingHeatmap(landings){
  const cell = HEAT_CELL;
  const xMin = -HW, yMin = -HL;
  const GW = Math.ceil(2 * HW / cell) + 1;
  const GH = Math.ceil(HL / cell) + 1;

  const smash = new Float32Array(GW * GH);
  const clear = new Float32Array(GW * GH);
  const drop  = new Float32Array(GW * GH);

  const inv2s2 = 1 / (2 * HEAT_SIGMA * HEAT_SIGMA);
  const r = 3 * HEAT_SIGMA;

  for(const L of landings){
    const arr = L.type === 'smash' ? smash : L.type === 'clear' ? clear : drop;
    const i0 = Math.max(0, Math.floor((L.x - r - xMin) / cell));
    const i1 = Math.min(GW - 1, Math.ceil((L.x + r - xMin) / cell));
    const j0 = Math.max(0, Math.floor((L.y - r - yMin) / cell));
    const j1 = Math.min(GH - 1, Math.ceil((L.y + r - yMin) / cell));
    for(let j = j0; j <= j1; j++){
      const gy = yMin + j * cell;
      const dy = gy - L.y;
      const dy2 = dy * dy;
      for(let i = i0; i <= i1; i++){
        const gx = xMin + i * cell;
        const dx = gx - L.x;
        arr[j * GW + i] += L.w * Math.exp(-(dx*dx + dy2) * inv2s2);
      }
    }
  }

  let maxV = 0;
  for(let k = 0; k < GW * GH; k++){
    const t = smash[k] + clear[k] + drop[k];
    if(t > maxV) maxV = t;
  }
  return { GW, GH, cell, xMin, yMin, smash, clear, drop, max: maxV || 1 };
}

function computeLandingHeat(){
  if(!result.valid || !cachedLandings.length){ heatDirty = false; return; }

  const W = canvas.width, H = canvas.height;
  if(heatCanvas.width !== W || heatCanvas.height !== H){
    heatCanvas.width = W;
    heatCanvas.height = H;
  }

  const grid = buildLandingHeatmap(cachedLandings);
  const { GW, GH, cell, xMin, yMin, smash, clear, drop, max } = grid;
  const invMax = 1 / max;

  const img = heatCtx.createImageData(W, H);
  const data = img.data;

  const sx = W / LW, sy = H / LH;

  for(let py = 0; py < H; py++){
    const wy = HL - (py / sy - PAD_T) / SCALE;
    if(wy > 0 || wy < -HL) continue;
    const fy = (wy - yMin) / cell;
    const j0raw = Math.floor(fy);
    const ty = fy - j0raw;
    let jA, jB, tY;
    if(j0raw < 0){ jA = 0; jB = 0; tY = 0; }
    else if(j0raw > GH - 2){ jA = GH - 1; jB = GH - 1; tY = 0; }
    else { jA = j0raw; jB = j0raw + 1; tY = ty; }

    for(let px = 0; px < W; px++){
      const wx = (px / sx - PAD_L) / SCALE - HW;
      if(wx > HW || wx < -HW) continue;
      const fx = (wx - xMin) / cell;
      const i0raw = Math.floor(fx);
      const tx = fx - i0raw;
      let iA, iB, tX;
      if(i0raw < 0){ iA = 0; iB = 0; tX = 0; }
      else if(i0raw > GW - 2){ iA = GW - 1; iB = GW - 1; tX = 0; }
      else { iA = i0raw; iB = i0raw + 1; tX = tx; }

      const idx00 = jA*GW+iA, idx10 = jA*GW+iB, idx01 = jB*GW+iA, idx11 = jB*GW+iB;
      const s = (smash[idx00]*(1-tX)+smash[idx10]*tX)*(1-tY) + (smash[idx01]*(1-tX)+smash[idx11]*tX)*tY;
      const c = (clear[idx00]*(1-tX)+clear[idx10]*tX)*(1-tY) + (clear[idx01]*(1-tX)+clear[idx11]*tX)*tY;
      const d = (drop[idx00]*(1-tX)+drop[idx10]*tX)*(1-tY) + (drop[idx01]*(1-tX)+drop[idx11]*tX)*tY;

      const sum = s + c + d;
      const o = (py * W + px) * 4;
      if(sum < max * HEAT_CUT){ data[o+3] = 0; continue; }

      const norm = Math.min(1, Math.sqrt(sum * invMax));
      const inv = 1 / sum;
      data[o]   = (s * HEAT_RGB.smash[0] + c * HEAT_RGB.clear[0] + d * HEAT_RGB.drop[0]) * inv;
      data[o+1] = (s * HEAT_RGB.smash[1] + c * HEAT_RGB.clear[1] + d * HEAT_RGB.drop[1]) * inv;
      data[o+2] = (s * HEAT_RGB.smash[2] + c * HEAT_RGB.clear[2] + d * HEAT_RGB.drop[2]) * inv;
      data[o+3] = Math.min(225, norm * 215);
    }
  }
  heatCtx.putImageData(img, 0, 0);
  heatDirty = false;
}

function drawHeat(){
  if(!showHeat || !result.valid) return;
  if(heatCanvas.width !== canvas.width || heatCanvas.height !== canvas.height) heatDirty = true;
  if(heatDirty) computeLandingHeat();
  if(heatCanvas.width < 2) return;

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(heatCanvas, 0, 0, LW, LH);
  ctx.restore();
}

  ctx.strokeStyle = 'rgba(0,0,0,.30)'; ctx.lineWidth = 1; ctx.setLineDash([2,3]);
  ctx.beginPath();
  ctx.moveTo(c.x-15, c.y); ctx.lineTo(c.x+15, c.y);
  ctx.moveTo(c.x, c.y-15); ctx.lineTo(c.x, c.y+15);
  ctx.stroke();
  ctx.restore();

  drawLabelWithHalo(label, c.x, c.y+11, C_PERSON, FONT_OUR, 'center', 'top');
}

function drawOurs(){
  if(!result.valid) return;

  if(mode === 'single'){
    if(result.P1) drawOurPoint(result.P1, t('ourSolo'));
    return;
  }

  const isDef = result.scenario === 'defense';
  if(result.P1) drawOurPoint(result.P1, isDef ? (lang === 'zh' ? '我1' : 'Me1') : t('ourBack'));
  if(result.P2) drawOurPoint(result.P2, isDef ? (lang === 'zh' ? '我2' : 'Me2') : t('ourFront'));
}

function draw(){
  ctx.clearRect(0, 0, LW, LH);
  drawCourtBase();
  drawHeat();
  drawCourtLines();
  drawOpponent();
  drawOurs();
  drawCourtTags();
}

/* =========================================================
   11. DOM 引用
   ========================================================= */

const pillDrop       = $('pillDrop');

/* =========================================================
   12. 面板更新
   ========================================================= */
function updatePill(el, p, rgb){
  const pct = Math.round(p * 100);
  el.textContent = el.dataset.label + ' ' + pct + '%';
  const k = Math.min(1, p / 0.70);
  el.style.background  = `rgba(${rgb}, ${0.10 + 0.68 * k})`;
  el.style.borderColor = `rgba(${rgb}, ${0.18 + 0.42 * k})`;
  el.style.color = (p > 0.42) ? '#ffffff' : `rgb(${rgb})`;
}

function updateHeightPill(){
  pillHeight.textContent = t('pillHeight') + ' ' + PRM.hh.toFixed(1) + 'm';
  const k = clamp((PRM.hh - 0.8) / 2.7, 0, 1);
  const rgb = k < 0.5 ? '192,57,43' : '31,111,139';
  pillHeight.style.background  = `rgba(${rgb}, ${0.12 + 0.22 * k})`;
  pillHeight.style.borderColor = `rgba(${rgb}, ${0.28 + 0.28 * k})`;
  pillHeight.style.color = (k > 0.6) ? '#1f6f8b' : `rgb(${rgb})`;
}

function updateStats(){
  if(!result.valid) return;

  const single = mode === 'single';
  const probs = result.probs;

  updatePill(pillKill,  probs.ps, PILL_COLOR.kill);
  updatePill(pillDrop,  probs.pd, PILL_COLOR.drop);
  updatePill(pillClear, probs.pc, PILL_COLOR.clear);
  updateHeightPill();

  const ps = Math.round(probs.ps*100);
  const pc = Math.round(probs.pc*100);
  const pd = Math.round(probs.pd*100);
  const hhStr = PRM.hh.toFixed(1);
  const shotPart = t('infoSmash') + ' ' + ps + '% / ' + t('infoClear') + ' ' + pc + '% / ' + t('infoDrop') + ' ' + pd + '%';
  const heatPart = showHeat ? ' · ' + t('infoHeatOn') : '';

  if(single){
    const p = result.P1;
    infoLine.innerHTML =
      t('infoContact') + ' <b>' + hhStr + 'm</b> · ' + shotPart +
      ' · ' + t('infoSpot') + ' <b>(' + p.x.toFixed(1) + ', ' + p.y.toFixed(1) + ')</b>' +
      heatPart;
    return;
  }

  const dist = Math.hypot(result.P2.x - result.P1.x, result.P2.y - result.P1.y);
  infoLine.innerHTML =
    t('infoContact') + ' <b>' + hhStr + 'm</b> · ' + shotPart +
    ' · ' + t('infoGap') + ' <b>' + dist.toFixed(1) + 'm</b>' +
    ' · ' + t('infoSpot') + ' <b>(' + result.P1.x.toFixed(1) + ', ' + result.P1.y.toFixed(1) + ')</b>' +
    ' & <b>(' + result.P2.x.toFixed(1) + ', ' + result.P2.y.toFixed(1) + ')</b>' +
    ' · ' + (result.scenario === 'defense' ? t('infoDefense') : t('infoAttack')) +
    heatPart;
}

/* =========================================================
   13. 滑块显示格式
   ========================================================= */
function fmtSliderVal(val, step, isProb){
  if(step >= 1) return Math.round(val) + (isProb ? '%' : '');
  const digits = step < 0.1 ? 2 : 1;
  return val.toFixed(digits);
}

/* =========================================================
   14. 概率联动 & 滑块
   ========================================================= */
const sliderInputs = {};
const sliderVals = {};

function refreshProbSliders(){
  for(const k of PROB_KEYS){
    if(sliderInputs[k]){
      sliderInputs[k].value = Math.round(PRM[k]);
      sliderVals[k].textContent = Math.round(PRM[k]) + '%';
    }
  }
}

function syncProbs(changedKey){
  const others = PROB_KEYS.filter(k => k !== changedKey);
  const remain = Math.max(0, 100 - PRM[changedKey]);
  const sumOthers = PRM[others[0]] + PRM[others[1]];
  const r0 = sumOthers < 1e-6 ? remain / 2 : remain * PRM[others[0]] / sumOthers;
  PRM[others[0]] = r0;
  PRM[others[1]] = remain - r0;
}

function buildSliders(){
  const root = $('sliders');
  root.innerHTML = '';
  Object.keys(sliderInputs).forEach(k => delete sliderInputs[k]);
  Object.keys(sliderVals).forEach(k => delete sliderVals[k]);

  const groups = {};
  for(const d of SLIDER_DEFS){
    if(!groups[d.group]) groups[d.group] = [];
    groups[d.group].push(d);
  }

  const groupTitles = { speed:'gSpeed', prob:'gProb', reach:'gReach', filter:'gFilter' };
  const groupHints  = { speed:'gSpeedHint', prob:'gProbHint', reach:'gReachHint', filter:'gFilterHint' };
  let syncing = false;

  for(const gname of Object.keys(groups)){
    const gEl = document.createElement('div');
    gEl.className = 's-group';

    const title = document.createElement('div');
    title.className = 's-title';
    title.innerHTML = `<span>${t(groupTitles[gname])}</span><span>${t(groupHints[gname])}</span>`;
    gEl.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 's-grid';

    for(const d of groups[gname]){
      const item = document.createElement('div');
      item.className = 's-item' + (d.cls ? ' ' + d.cls : '');

      const label = document.createElement('span');
      label.textContent = t('sl_' + d.key);

      const input = document.createElement('input');
      input.type = 'range';
      input.min = d.min; input.max = d.max; input.step = d.step;
      input.value = PRM[d.key];

      const val = document.createElement('b');
      val.textContent = fmtSliderVal(PRM[d.key], d.step, gname === 'prob');

      sliderInputs[d.key] = input;
      sliderVals[d.key]   = val;

      input.addEventListener('input', () => {
        if(gname === 'prob'){
          if(syncing) return;
          syncing = true;
          PRM[d.key] = Math.max(0, Math.min(100, parseFloat(input.value)));
          syncProbs(d.key);
          refreshProbSliders();
          syncing = false;
        } else {
          PRM[d.key] = parseFloat(input.value);
          val.textContent = fmtSliderVal(PRM[d.key], d.step, false);
        }
        quality = 'fast';
        needsSolve = true;
        heatDirty = true;
      });

      item.appendChild(label);
      item.appendChild(input);
      item.appendChild(val);
      grid.appendChild(item);
    }

    gEl.appendChild(grid);
    root.appendChild(gEl);
  }
}

function setupPillDrag(el, key){
  let drag = null;
  el.title = t('pillHint');

  el.addEventListener('pointerdown', ev => {
    if(ev.button !== undefined && ev.button !== 0) return;
    ev.preventDefault();
    ev.stopPropagation();
    try { el.setPointerCapture(ev.pointerId); } catch(e){}
    drag = { startY: ev.clientY, startVal: PRM[key] };
  });

  el.addEventListener('pointermove', ev => {
    if(!drag) return;
    ev.preventDefault();
    const delta = Math.round((drag.startY - ev.clientY) / 4);
    const newVal = Math.max(0, Math.min(100, drag.startVal + delta));
    if(newVal === PRM[key]) return;
    PRM[key] = newVal;
    syncProbs(key);
    refreshProbSliders();
    quality = 'fast'; needsSolve = true; heatDirty = true;
    updateStats();
  });

  const finish = () => {
    if(!drag) return;
    drag = null;
    quality = 'full'; needsSolve = true; heatDirty = true;
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);
}

function setupHeightDrag(el){
  let drag = null;
  el.title = t('heightHint');

  el.addEventListener('pointerdown', ev => {
    if(ev.button !== undefined && ev.button !== 0) return;
    ev.preventDefault();
    ev.stopPropagation();
    try { el.setPointerCapture(ev.pointerId); } catch(e){}
    drag = { startY: ev.clientY, startVal: PRM.hh };
  });

  el.addEventListener('pointermove', ev => {
    if(!drag) return;
    ev.preventDefault();
    const delta = Math.round((drag.startY - ev.clientY) / 4) * 0.1;
    const newH = clamp(drag.startVal + delta, 0.8, 3.5);
    if(Math.abs(newH - PRM.hh) < 0.01) return;
    PRM.hh = Math.round(newH * 10) / 10;
    updateHeightPill();
    quality = 'fast'; needsSolve = true; heatDirty = true;
    updateStats();
  });

  const finish = () => {
    if(!drag) return;
    drag = null;
    quality = 'full'; needsSolve = true; heatDirty = true;
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);
}

/* =========================================================
   16. 语言 / 折叠 / 静态文本

function refreshStaticText(){
  document.documentElement.lang = (lang === 'zh') ? 'zh-CN' : 'en';

langBtnEl.addEventListener('click', () => {

});

collapseBtn.addEventListener('click', () => {
  const collapsed = appEl.classList.toggle('collapsed');
  collapseBtn.setAttribute('aria-label', collapsed ? t('collapseShow') : t('collapseHide'));
  requestAnimationFrame(() => { setup(); heatDirty = true; });
});

/* =========================================================
   17. 命中测试与交互
   ========================================================= */
function getW(ev){
  const r = canvas.getBoundingClientRect();
  return c2w((ev.clientX - r.left)/r.width*LW, (ev.clientY - r.top)/r.height*LH);
}

function hitOpponent(w){
  if(Math.hypot(w.x - opponents[0].x, w.y - opponents[0].y) < DR_HIT) return 0;
  return -1;
}

modeToggle.addEventListener('click', () => {
  mode = (mode === 'double') ? 'single' : 'double';
  quality = 'full'; needsSolve = true; heatDirty = true;
  refreshStaticText();
});

canvas.addEventListener('pointerdown', ev => {
  const w = getW(ev);
  const now = performance.now();
  const oppIdx = hitOpponent(w);

  if(oppIdx < 0){
    const dt = now - lastTap.time;
    const dd = Math.hypot(ev.clientX - lastTap.x, ev.clientY - lastTap.y);
    if(lastTap.time > 0 && dt < DOUBLE_TAP_MS && dd < DOUBLE_TAP_DIST){
      lastTap = {time:0, x:0, y:0};
      showHeat = !showHeat;
      heatDirty = true;
      updateStats();
      ev.preventDefault();
      return;
    }
    lastTap = {time: now, x: ev.clientX, y: ev.clientY};
    return;
  }

  lastTap = {time:0, x:0, y:0};

  dragIdx = oppIdx;
  dragStarted = false;
  dragStartPos = {x: ev.clientX, y: ev.clientY};
  canvas.setPointerCapture(ev.pointerId);
  canvas.style.cursor = 'grabbing';
  ev.preventDefault();
});

canvas.addEventListener('pointermove', ev => {
  const w = getW(ev);
  if(dragIdx >= 0){
    if(!dragStarted && dragStartPos){
      const dx = ev.clientX - dragStartPos.x, dy = ev.clientY - dragStartPos.y;
      if(Math.hypot(dx, dy) > DRAG_THRESHOLD){ dragStarted = true; }
      else return;
    }
    if(dragStarted){
      opponents[dragIdx].x = clamp(w.x, -HW + .15, HW - .15);
      opponents[dragIdx].y = clamp(w.y, 0.25, HL - .15);
      needsSolve = true; quality = 'fast'; heatDirty = true;
      ev.preventDefault();
    }
    return;
  }

  if(hitOpponent(w) >= 0) canvas.style.cursor = 'grab';
  else canvas.style.cursor = 'default';
});

function endDrag(ev){
  if(dragIdx >= 0 && dragStarted){ quality = 'full'; needsSolve = true; heatDirty = true; }
  dragIdx = -1; dragStarted = false; dragStartPos = null;
  canvas.style.cursor = 'default';
  if(ev && ev.pointerId !== undefined && canvas.hasPointerCapture(ev.pointerId)){
    canvas.releasePointerCapture(ev.pointerId);
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', () => { if(dragIdx < 0) canvas.style.cursor = 'default'; });

/* =========================================================
   18. 原理弹窗
   ========================================================= */
(function(){
  const mask = $('principleModal');
  const credit = $('credit');

  const openM  = () => { mask.classList.add('open'); document.body.style.overflow = 'hidden'; };
  const closeM = () => { mask.classList.remove('open'); document.body.style.overflow = ''; };

  credit.addEventListener('dblclick', openM);
  let lastTapTime = 0;
  credit.addEventListener('touchend', function(e){
    const now = Date.now();
    if(now - lastTapTime < 350){ e.preventDefault(); openM(); lastTapTime = 0; }
    else { lastTapTime = now; }
  }, {passive:false});

  $('principleClose').addEventListener('click', closeM);
  mask.addEventListener('click', function(e){ if(e.target === mask) closeM(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeM(); });
})();

/* =========================================================
   19. 主循环
   ========================================================= */
let last = 0;
function loop(ts){
  if(needsSolve && ts - last > (quality === 'fast' ? 70 : 0)){
    try{
      result = solve(quality === 'fast');
      heatDirty = true;
    } catch(err){
      console.error('solve error:', err);
    }
    needsSolve = false;
    last = ts;
    updateStats();
  }
  try{ draw(); }
  catch(err){ console.error('draw error:', err); }
  requestAnimationFrame(loop);
}

/* ---- 启动 ---- */
try{
  result = solve('full');
  heatDirty = true;
}catch(e){ console.error('init error:', e); }

buildSliders();
refreshStaticText();
setupPillDrag(pillClear, 'p_clear');
setupPillDrag(pillDrop,  'p_drop');
setupPillDrag(pillKill,  'p_smash');
setupHeightDrag(pillHeight);
requestAnimationFrame(loop);

window.addEventListener('resize', () => { setup(); heatDirty = true; });
window.addEventListener('orientationchange', () => setTimeout(() => { setup(); heatDirty = true; }, 250));

})();
