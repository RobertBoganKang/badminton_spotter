      const V_GAMMA = 3.0;
      const V_MAX = 6.0;
      const V_HANDLE_HIT = isTouch ? 0.75 : 0.45;
      const V_HANDLE_DOT = isTouch ? 9 : 7;
      const V_HANDLE_TIP = isTouch ? 7 : 5;

      const S0_DIST = 1.5;

      const DBLCLICK_MS = 420;
      const DBLCLICK_DIST = 60;
      const DRAG_START_THRESHOLD = 5;
      const LONG_PRESS_MS = 500;

      // A/B 速度比
      const RATIO_MIN = 0.8, RATIO_MAX = 1.2, RATIO_STEP = 0.01;
      const RATIO_SENS = 0.001;        // 每像素变化量（越小越"慢"）
      const RATIO_TAP_MS = 350;        // 双击判定窗口
      const RATIO_TAP_DIST = 40;

      const COLOR_PLAYER = '#111111';
      const COLOR_VEL = '#1e88e5';
      const COLOR_VEL_DZ = 'rgba(30,136,229,0.10)';
      const COLOR_VEL_DZ_EDGE = 'rgba(30,136,229,0.22)';
      const COLOR_VEL_GLOW = 'rgba(30,136,229,0.20)';
      const COLOR_VEL_TRI = 'rgba(30,136,229,0.65)';
      const COLOR_VEL_TXT = 'rgba(30,136,229,0.95)';
      const COLOR_BEST = '#d32f2f';
      const COLOR_GAP = '#757575';
      const COLOR_RANK = '#8e44ad';

      const C_GROUND = '#f7fbf9';
      const C_LINE = '#3a7d5c';
      const C_FRAME = '#1e4d38';
      const C_NET = '#1e4d38';

      const ZERO_V = { x: 0, y: 0 };
      const TARGET = { A_POS: 1, B_POS: 2, A_VEL: 3, B_VEL: 4 };

      /* =========================================================
       * 3. 状态
       * ========================================================= */
      const state = {
        mode: 'double',
        turnMode: false,
        turnParams: {
          reaction: 0.20,
          speedA: 3.8,
          speedB: 3.8,
          turnTmax: 0.55,
          turnTheta0: 25 * DEG,
          turnSpeedK: 0.45,
          moveAccel: 10,
          turnOverlapK: 0.25,
          fhBias: 0.18,
          leadFootBoost: 0.10,
          crossLineSpeedK: 0.92,
          backhandTurnK: 0.18,
          backhandTouchK: 0.88
        },
        showHeat: false,
        hover: null,
        speedRatio: 1,
        players: {
          a: {
            pos: { x: -1.2, y: 9.2 }, vel: { x: 0, y: 0 },
            velVisible: false, heading: Math.PI, hand: 'right'
          },
          b: {
            pos: { x: 1.2, y: 9.2 }, vel: { x: 0, y: 0 },
            velVisible: false, heading: Math.PI, hand: 'right'
          },
        },
        best: { pt: null, J: 0 },
        heat: [],
        heatMeta: null,
        corners: [],
        locus: [],
        gaps: [null, null],
      };

      const pointer = {
        id: null,
        startClient: null,
        dragTarget: null,
        dragActive: false,
        dragHandlePos: null,
        longPressTimer: null,
        longPressFired: false,
      };

      const dirty = { locus: true, grid: true };
      const markDirty = () => { dirty.locus = true; dirty.grid = true; };

      let lastGridCompute = 0;
      let lastTap = { time: 0, x: 0, y: 0, target: null };

      // 热力图离屏画布（唯一来源）
      let heatCanvas = null, heatCtx = null;

      const appEl = document.getElementById('app');
      const collapseBtn = document.getElementById('collapseBtn');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const langBtnEl = document.getElementById('langBtn');
      const pageSub = document.getElementById('pageSub');
      const legendBar = document.getElementById('legendBar');
      const modeToggleEl = document.getElementById('modeToggle');
      const ratioBtnEl = document.getElementById('ratioBtn');
      const ratioValEl = document.getElementById('ratioVal');
      const modeTurnBtnEl = document.getElementById('turnModeBtn');
      const footLegendEl = document.getElementById('footLegend');
      const rotationClusterEl = document.getElementById('rotationCluster');
      const rotationAEl = document.getElementById('rotationA');
      const rotationBEl = document.getElementById('rotationB');
      const sidebarEl = document.getElementById('turnSidebar');
      const sidebarMaskEl = document.getElementById('sidebarMask');
      const sidebarBtnEl = document.getElementById('sidebarBtn');
      const sidebarCloseEl = document.getElementById('sidebarClose');
      const speedAEl = document.getElementById('speedA');
      const speedBEl = document.getElementById('speedB');
      const speedAValueEl = document.getElementById('speedAValue');
      const speedBValueEl = document.getElementById('speedBValue');
      const turnResetBtnEl = document.getElementById('turnResetBtn');

      /* =========================================================
       * 4. 工具
       * ========================================================= */
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      const w2c = (pt) => ({
        x: (HALF_W + pt.x) * SCALE + PAD,
        y: (L - pt.y) * SCALE + PAD,
      });
      const c2w = (cx, cy) => ({
        x: (cx - PAD) / SCALE - HALF_W,
        y: L - (cy - PAD) / SCALE,
      });
      function clientToWorld(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return c2w(
          (clientX - rect.left) / rect.width * LOGICAL_W,
          (clientY - rect.top) / rect.height * LOGICAL_H
        );
      }

      const getEffectiveVel = (key) => {
        const p = state.players[key];
        if (!p.velVisible) return ZERO_V;
        if (key === 'b' && state.mode === 'single') return ZERO_V;
        return p.vel;
      };

      const isAnyVelocityVisible = () =>
        state.players.a.velVisible ||
        (state.mode === 'double' && state.players.b.velVisible);

      const isHot = (target) =>
        pointer.dragTarget === target || state.hover === target;

      // 数字格式化（整数不带小数）
      const fmtNum = (v) => v.toFixed(2).replace(/\.?0+$/, '');

      /* =========================================================
       * 5. 计算：难度 / 栅格 / 等难度线
       * ========================================================= */
      function startFactor(s, vmag) {
        if (vmag < 0.01) return 1.0;
        const projDist = s / vmag;
        const sig = 1 / (1 + Math.exp(-projDist / S0_DIST));
        const kFull = K_ADV + (K_REV - K_ADV) * (1 - sig);
        return 1 + (kFull - 1) * Math.min(vmag, 1.0);
      }

      function smoothRamp(v, lo, hi) {
        if (v <= lo) return 0;
        if (v >= hi) return 1;
        const u = (v - lo) / (hi - lo);
        return u * u * (3 - 2 * u);
      }

      function wrapAngle(angle) {
        return ((angle + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      }

      function turnPhaseTime(absTheta) {
        const p = state.turnParams;
        const deadzone = p.turnTheta0;
        const u = clamp((absTheta - deadzone) / (Math.PI - deadzone), 0, 1);
        return p.turnTmax * Math.pow(u, TURN.curveP);
      }

      function turnStepDelay(absTheta) {
        return absTheta <= TURN.stepThetaThreshold ? 0 : TURN.stepDelay;
      }

      function turnJointPenalty(absTheta) {
        if (absTheta <= TURN.jointSoftStart) return 0;
        if (absTheta >= TURN.jointHardLimit) return TURN.jointHardPenalty;
        const u = (absTheta - TURN.jointSoftStart) /
          (TURN.jointHardLimit - TURN.jointSoftStart);
        return TURN.jointSoftPenalty * u;
      }

      function turnArrivalForTarget(x, y, key, mul, velocity) {
        const player = state.players[key];
        const p = state.turnParams;
        const reaction = p.reaction;
        const leadPos = {
          x: clamp(player.pos.x + velocity.x * reaction, -HALF_W + 0.1, HALF_W - 0.1),
          y: clamp(player.pos.y + velocity.y * reaction, NET_Y + 0.1, L - 0.1)
        };
        const dx = x - leadPos.x;
        const dy = y - leadPos.y;
        const distance = Math.hypot(dx, dy);
        if (distance < 1e-9) return reaction;

        const movementAngle = Math.atan2(dx, dy);
        const rawDelta = wrapAngle(movementAngle - player.heading);
        const absTheta = Math.abs(rawDelta);
        const backhand = player.hand === 'right' ? rawDelta < 0 : rawDelta > 0;
        const backhandBlend = backhand ? smoothRamp(absTheta, 0, Math.PI / 2) : 0;
        const touchRadius = BODY_R * (1 - (1 - p.backhandTouchK) * backhandBlend);
        const runDistance = Math.max(0, distance - touchRadius);

        const ux = dx / distance;
        const uy = dy / distance;
        const speed = key === 'b' ? p.speedB : p.speedA;
        const lateralSpeed = speed * 0.95;
        const towardNetSpeed = speed * 1.15;
        const backwardSpeed = speed / 1.3;
        const directionalSpeed = y < leadPos.y ? towardNetSpeed : backwardSpeed;
        const baseSpeed = 1 / Math.hypot(ux / lateralSpeed, uy / directionalSpeed);
        const fhSign = player.hand === 'left' ? -1 : 1;
        const forehandBias = Math.max(0.2, 1 + p.fhBias * fhSign * Math.sin(rawDelta));
        const turnSpeedFactor = clamp(
          1 - p.turnSpeedK * Math.pow(absTheta / Math.PI, TURN.speedP),
          TURN.speedFloor,
          1
        );
        const forwardMove = Math.max(0, Math.cos(rawDelta));
        const backwardMove = Math.max(0, -Math.cos(rawDelta));
        const lateralMove = Math.abs(Math.sin(rawDelta));
        const footFactor = 1 / Math.max(1e-9, Math.sqrt(
          Math.pow(forwardMove / (1 + p.leadFootBoost), 2) +
          Math.pow(lateralMove / p.crossLineSpeedK, 2) +
          Math.pow(backwardMove, 2)
        ));
        const effectiveSpeed = Math.max(0.01, baseSpeed * forehandBias * turnSpeedFactor * footFactor);
        const acceleration = Math.max(0, Number(p.moveAccel) || 0);
        const accelerationTime = acceleration > 0 ? effectiveSpeed / acceleration : 0;
        const accelerationDistance = 0.5 * effectiveSpeed * accelerationTime;
        let translationTime = 0;
        if (runDistance > 0 && acceleration > 0) {
          translationTime = runDistance <= accelerationDistance
            ? Math.sqrt(2 * runDistance / acceleration)
            : accelerationTime + (runDistance - accelerationDistance) / effectiveSpeed;
        } else if (runDistance > 0) {
          translationTime = runDistance / effectiveSpeed;
        }
        const rotationTime = turnPhaseTime(absTheta) * (1 + p.backhandTurnK * backhandBlend);
        const stepDelay = turnStepDelay(absTheta) * (1 + p.backhandTurnK * 0.6 * backhandBlend);
        const limitPenalty = turnJointPenalty(absTheta) * (1 + p.backhandTurnK * 0.5 * backhandBlend);
        const tau = Math.max(translationTime, rotationTime) +
          p.turnOverlapK * Math.min(translationTime, rotationTime) +
          stepDelay + limitPenalty;
        return reaction + tau;
      }

      // vmag: 预计算的 |v|；mul: 速度倍率（A 为 r，B 为 1/r），越快 → 等效难度越低
      function evalAt(x, y, opp, v, vmag, mul = 1, key = null) {
        if (state.turnMode && key) return turnArrivalForTarget(x, y, key, mul, v);
        const dx = x - opp.x, dy = y - opp.y;
        const wy = dy >= 0 ? W_BACK : W_FWD;
        let base = Math.sqrt((W_X * dx) ** 2 + (wy * dy) ** 2);
        base *= startFactor(dx * v.x + dy * v.y, vmag);
        return base / mul;
      }

      function bodyEdgeFactor(x, y, opp, halfW = HALF_W) {
        const dx = x - opp.x, dy = y - opp.y;
        let f = 1;
        if (Math.hypot(dx, dy) < BODY_R) f *= K_BODY;
        const dEdge = Math.min(
          halfW - SAFE_DELTA - Math.abs(x),  // 使用传入的 halfW
          y - OPP_SIDE_Y_MIN,
          OPP_SIDE_Y_MAX - y
        );
        return f * (1 + K_EDGE * Math.exp(-Math.max(0, dEdge) / B0));
      }

      function difficulty(x, y, opp, v, vmag, mul = 1, halfW = HALF_W, key = null) {
        return evalAt(x, y, opp, v, vmag, mul, key) * bodyEdgeFactor(x, y, opp, halfW);
      }

      // 当前模式下的速度倍率
      function mulOf(key, mode) {
        return (key === 'b' ? state.turnParams.speedB : state.turnParams.speedA) /
          BASE_RUN_SPEED;
      }

      function computeGrid(o1, o2, v1, vm1, v2, vm2, step, mode) {
        const b = gridBounds(mode);
        const hw = halfWidthOf(mode);
        const nX = Math.max(1, Math.round((b.xMax - b.xMin) / step));
        const nY = Math.max(1, Math.round((b.yMax - b.yMin) / step));

        const m1 = mulOf('a', mode);
        const m2 = mulOf('b', mode);

        const heat = [];
        let bestPt = null, bestJ = -Infinity;
        let minTime = Infinity, maxTime = -Infinity;

        for (let i = 0; i <= nX; i++) {
          const x = b.xMin + (b.xMax - b.xMin) * i / nX;
          for (let j = 0; j <= nY; j++) {
            const y = b.yMin + (b.yMax - b.yMin) * j / nY;
            const base1 = evalAt(x, y, o1, v1, vm1, m1, 'a');

            let jv, time;
            if (mode === 'single') {
              const oppScore = base1 * bodyEdgeFactor(x, y, o1, hw);
              const dx = x - SINGLE_RETURN.x, dy = y - SINGLE_RETURN.y;
              jv = oppScore - W_ME_SINGLE * Math.sqrt(dx * dx + dy * dy);
              time = base1;
            } else {
              const base2 = evalAt(x, y, o2, v2, vm2, m2, 'b');
              jv = Math.min(
                base1 * bodyEdgeFactor(x, y, o1, hw),
                base2 * bodyEdgeFactor(x, y, o2, hw)
              );
              time = Math.min(base1, base2);
            }

            heat.push({ x, y, val: jv, time });
            if (jv > bestJ) { bestJ = jv; bestPt = { x, y }; }
            if (time < minTime) minTime = time;
            if (time > maxTime) maxTime = time;
          }
        }

        const raw = cornerSeeds(mode).map((s) => {
          let bx = s.x, by = s.y, bj = -Infinity;
          for (const h of heat) {
            if (Math.abs(h.x - s.x) <= CORNER_R + 1e-9 &&
              Math.abs(h.y - s.y) <= CORNER_R + 1e-9 &&
              h.val > bj) { bj = h.val; bx = h.x; by = h.y; }
          }
          return { x: bx, y: by, val: bj, distToSeed: Math.hypot(bx - s.x, by - s.y), rank: null };
        });

        // 过滤后剥掉 distToSeed（渲染不需要）
        const visible = raw
          .filter((c) => c.distToSeed <= CORNER_SHOW_R)
          .sort((a, b) => b.val - a.val)
          .map(({ distToSeed, ...rest }) => rest);

        let cursor = 2;
        for (const cb of visible) {
          cb.rank = Math.hypot(cb.x - bestPt.x, cb.y - bestPt.y) < ALREADY_BEST ? null : cursor++;
        }

        const span = (maxTime - minTime) || 1;
        // 只保留热力图需要的字段
        const heatOut = heat.map((h) => ({ x: h.x, y: h.y, norm: (h.time - minTime) / span }));

        return { best: { pt: bestPt, J: bestJ }, heat: heatOut, step, corners: visible };
      }

      function equiLocus(o1, o2, v1, vm1, v2, vm2, m1, m2) {
        if (Math.hypot(o2.x - o1.x, o2.y - o1.y) < MIN_GAP_DIST) return [];
        const F = (x, y) => difficulty(x, y, o1, v1, vm1, m1, HALF_W, 'a') -
          difficulty(x, y, o2, v2, vm2, m2, HALF_W, 'b');
        const xMin = -HALF_W - 0.5, xMax = HALF_W + 0.5;
        const yMin = OPP_SIDE_Y_MIN - 0.5, yMax = OPP_SIDE_Y_MAX + 0.5;
        const nx = Math.ceil((xMax - xMin) / LOCUS_STEP);
        const ny = Math.ceil((yMax - yMin) / LOCUS_STEP);
        const gx = (i) => xMin + i * LOCUS_STEP;
        const gy = (j) => yMin + j * LOCUS_STEP;

        const Fg = [];
        for (let j = 0; j <= ny; j++) {
          const row = new Array(nx + 1);
          for (let i = 0; i <= nx; i++) row[i] = F(gx(i), gy(j));
          Fg.push(row);
        }

        const lerp = (ax, ay, bx, by, fa, fb) => {
          const denom = fa - fb;
          if (Math.abs(denom) < 1e-9) return [ax, ay];
          const u = fa / denom;
          return [ax + (bx - ax) * u, ay + (by - ay) * u];
        };

        const segs = [];
        for (let j = 0; j < ny; j++) {
          for (let i = 0; i < nx; i++) {
            const tl = Fg[j][i], tr = Fg[j][i + 1], br = Fg[j + 1][i + 1], bl = Fg[j + 1][i];
            const c = (tl > 0 ? 8 : 0) | (tr > 0 ? 4 : 0) | (br > 0 ? 2 : 0) | (bl > 0 ? 1 : 0);
            if (c === 0 || c === 15) continue;
            const xL = gx(i), xR = gx(i + 1), yT = gy(j), yB = gy(j + 1);
            const top = () => lerp(xL, yT, xR, yT, tl, tr);
            const right = () => lerp(xR, yT, xR, yB, tr, br);
            const bot = () => lerp(xL, yB, xR, yB, bl, br);
            const left = () => lerp(xL, yT, xL, yB, tl, bl);
            let P = [];
            switch (c) {
              case 1: case 14: P = [left(), bot()]; break;
              case 2: case 13: P = [bot(), right()]; break;
              case 3: case 12: P = [left(), right()]; break;
              case 4: case 11: P = [top(), right()]; break;
              case 6: case 9: P = [top(), bot()]; break;
              case 7: case 8: P = [top(), left()]; break;
              case 5: P = [top(), right(), bot(), left()]; break;
              case 10: P = [top(), left(), bot(), right()]; break;
            }
            for (let k = 0; k + 1 < P.length; k += 2) segs.push([P[k], P[k + 1]]);
          }
        }
        return segs;
      }

      function computeGapPoints(segs, o1, o2, v1, vm1, v2, vm2, m1, m2) {
        if (!segs.length) return [null, null];

        const cands = [];
        const push = (x, y) => {
          if (Math.abs(x) > HALF_W - SAFE_DELTA) return;
          if (y < GRID_Y_MIN || y > GRID_Y_MAX) return;
          cands.push({
            x, y,
            s: Math.min(
              difficulty(x, y, o1, v1, vm1, m1, HALF_W, 'a'),
              difficulty(x, y, o2, v2, vm2, m2, HALF_W, 'b')
            )
          });
        };
        for (const [a, b] of segs) {
          for (let k = 0; k <= GAP_SAMPLES; k++) {
            const u = k / GAP_SAMPLES;
            push(a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u);
          }
        }
        if (!cands.length) return [null, null];

        const midX = (o1.x + o2.x) / 2, midY = (o1.y + o2.y) / 2;
        const dx = o2.x - o1.x, dy = o2.y - o1.y;
        const len = Math.hypot(dx, dy) || 1;
        const perpX = -dy / len, perpY = dx / len;

        let bestPos = null, bestNeg = null;
        for (const c of cands) {
          const s = (c.x - midX) * perpX + (c.y - midY) * perpY;
          if (s >= 0) { if (!bestPos || c.s > bestPos.s) bestPos = c; }
          else { if (!bestNeg || c.s > bestNeg.s) bestNeg = c; }
        }
        return [
          bestPos ? { x: bestPos.x, y: bestPos.y } : null,
          bestNeg ? { x: bestNeg.x, y: bestNeg.y } : null,
        ];
      }

      function recomputeLocus() {
        if (state.mode === 'double') {
          const v1 = getEffectiveVel('a');
          const v2 = getEffectiveVel('b');
          const vm1 = Math.hypot(v1.x, v1.y);
          const vm2 = Math.hypot(v2.x, v2.y);
          const m1 = mulOf('a');
          const m2 = mulOf('b');
          state.locus = equiLocus(state.players.a.pos, state.players.b.pos, v1, vm1, v2, vm2, m1, m2);
          state.gaps = computeGapPoints(
            state.locus, state.players.a.pos, state.players.b.pos,
            v1, vm1, v2, vm2, m1, m2
          );
        } else {
          state.locus = [];
          state.gaps = [null, null];
        }
        dirty.locus = false;
      }

      /* =========================================================
       * 6. 色阶 / 热力图离屏缓存
       * ========================================================= */
      function rampColor(tv) {
        if (tv < 0) tv = 0; else if (tv > 1) tv = 1;
        const stops = [
          [0.00, 69, 117, 180],
          [0.25, 145, 191, 219],
          [0.50, 255, 255, 191],
          [0.75, 252, 141, 89],
          [1.00, 215, 48, 39],
        ];
        let a = stops[0], b = stops[stops.length - 1];
        for (let i = 0; i < stops.length - 1; i++) {
          if (tv >= stops[i][0] && tv <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
        }
        const span = b[0] - a[0];
        const f = span > 0 ? (tv - a[0]) / span : 0;
        return [
          Math.round(a[1] + (b[1] - a[1]) * f),
          Math.round(a[2] + (b[2] - a[2]) * f),
          Math.round(a[3] + (b[3] - a[3]) * f),
        ];
      }

      function buildHeatCanvas(step, bounds) {
        if (!state.heat.length) { state.heatMeta = null; return; }
        const cols = Math.round((bounds.xMax - bounds.xMin) / step) + 1;
        const rows = Math.round((bounds.yMax - bounds.yMin) / step) + 1;

        if (!heatCanvas) {
          heatCanvas = document.createElement('canvas');
          heatCtx = heatCanvas.getContext('2d');
        }
        heatCanvas.width = cols;
        heatCanvas.height = rows;

        const img = heatCtx.createImageData(cols, rows);
        const data = img.data;
        for (const h of state.heat) {
          const ix = Math.round((h.x - bounds.xMin) / (bounds.xMax - bounds.xMin) * (cols - 1));
          const iy = Math.round((h.y - bounds.yMin) / (bounds.yMax - bounds.yMin) * (rows - 1));
          if (ix < 0 || ix >= cols || iy < 0 || iy >= rows) continue;
          const [r, g, bb] = rampColor(h.norm);       // ✅ 改名避开冲突
          const idx = ((rows - 1 - iy) * cols + ix) * 4;
          data[idx] = r; data[idx + 1] = g; data[idx + 2] = bb; data[idx + 3] = 255;
        }
        heatCtx.putImageData(img, 0, 0);

        state.heatMeta = {
          xMin: bounds.xMin, xMax: bounds.xMax,
          yMin: bounds.yMin, yMax: bounds.yMax,
          step
        };
      }

      /* =========================================================
       * 7. 计算调度
       * ========================================================= */
      function computeGridNow() {
        const step = pointer.dragActive ? GRID_STEP_FAST : GRID_STEP_FINE;
        const v1 = getEffectiveVel('a');
        const v2 = getEffectiveVel('b');
        const vm1 = Math.hypot(v1.x, v1.y);
        const vm2 = Math.hypot(v2.x, v2.y);
        const result = computeGrid(
          state.players.a.pos, state.players.b.pos,
          v1, vm1, v2, vm2, step, state.mode
        );
        state.best = result.best;
        state.heat = result.heat;
        state.corners = result.corners;
        buildHeatCanvas(step, gridBounds(state.mode));
      }

      /* =========================================================
       * 8. 渲染
       * ========================================================= */
      function getHandlePos(pt, vel) {
        const mag = Math.hypot(vel.x, vel.y);
        if (mag < 0.01) return { x: pt.x, y: pt.y + V_DEADZONE };
        const norm = Math.pow(Math.min(mag / V_MAX, 1), 1 / V_GAMMA);
        const dist = V_DEADZONE + norm * V_MAX * V_SCALE;
        return { x: pt.x + vel.x / mag * dist, y: pt.y + vel.y / mag * dist };
      }

      function drawHeat() {
        const m = state.heatMeta;
        if (!m || !heatCanvas) return;
        const tl = w2c({ x: m.xMin - m.step / 2, y: m.yMax + m.step / 2 });
        const br = w2c({ x: m.xMax + m.step / 2, y: m.yMin - m.step / 2 });
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(heatCanvas, tl.x, tl.y, br.x - tl.x, br.y - tl.y);
        ctx.restore();
      }

      function drawDeadzone(pt) {
        const p = w2c(pt);
        const r = V_DEADZONE * SCALE;
        ctx.save();
        ctx.beginPath();
        ctx.fillStyle = COLOR_VEL_DZ;
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.strokeStyle = COLOR_VEL_DZ_EDGE;
        ctx.lineWidth = 1;
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function drawVelocityHandle(pt, vel, handlePos, isActive) {
        const mag = Math.hypot(vel.x, vel.y);
        const c = w2c(pt);
        const h = w2c(handlePos);
        ctx.save();

        if (mag < 0.01) {
          if (isActive) {
            ctx.beginPath();
            ctx.fillStyle = COLOR_VEL_GLOW;
            ctx.arc(h.x, h.y, V_HANDLE_DOT + 8, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.beginPath();
          ctx.fillStyle = '#fff';
          ctx.arc(h.x, h.y, V_HANDLE_DOT, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = COLOR_VEL;
          ctx.lineWidth = 2.4;
          ctx.stroke();

          ctx.font = `bold ${isTouch ? 12 : 10}px system-ui`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillStyle = COLOR_VEL_TXT;
          ctx.fillText('初速度', h.x, h.y + V_HANDLE_DOT + 4);
          ctx.restore();
          return;
        }

        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(h.x, h.y);
        ctx.strokeStyle = COLOR_VEL;
        ctx.lineWidth = isTouch ? 2.4 : 2;
        ctx.lineCap = 'round';
        ctx.stroke();

        if (isActive) {
          ctx.beginPath();
          ctx.fillStyle = COLOR_VEL_GLOW;
          ctx.arc(h.x, h.y, V_HANDLE_TIP + 9, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.fillStyle = '#fff';
        ctx.arc(h.x, h.y, V_HANDLE_TIP, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = COLOR_VEL;
        ctx.lineWidth = isTouch ? 2.4 : 2;
        ctx.stroke();

        if (mag > 0.01) {
          ctx.beginPath();
          ctx.fillStyle = COLOR_VEL;
          ctx.arc(h.x, h.y, 2.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.font = `bold ${isTouch ? 12 : 11}px system-ui`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#ffffff';
          ctx.fillStyle = COLOR_VEL;
          const txt = `${mag.toFixed(1)} m/s`;
          ctx.strokeText(txt, h.x, h.y + V_HANDLE_TIP + 5);
          ctx.fillText(txt, h.x, h.y + V_HANDLE_TIP + 5);
        }
        ctx.restore();
      }

      function drawTurnPlayer(key, label, radius, hot, showHalo) {
        const player = state.players[key];
        const c = w2c(player.pos);
        const r = radius * (hot ? 1.08 : 1);
        const longRadius = r * 2.25;
        const shortRadius = Math.max(7.5, r * 1.08);
        const screenHeading = Math.atan2(-Math.cos(player.heading), Math.sin(player.heading));
        const ellipseAngle = screenHeading + Math.PI / 2;
        const footSign = player.hand === 'left' ? -1 : 1;
        const footLocalX = footSign * longRadius * 0.62;
        const footX = c.x + footLocalX * Math.cos(ellipseAngle);
        const footY = c.y + footLocalX * Math.sin(ellipseAngle);
        const footColor = player.hand === 'left' ? '#62c6eb' : '#1e88e5';

        if (showHalo) {
          ctx.beginPath();
          ctx.fillStyle = 'rgba(0,0,0,.08)';
          ctx.arc(c.x, c.y, Math.max(longRadius * 1.45, r * 2.7), 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.ellipse(c.x, c.y, longRadius, shortRadius, ellipseAngle, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = COLOR_PLAYER;
        ctx.lineWidth = 2;
        ctx.stroke();

        const faceLen = longRadius * 0.72;
        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(c.x + Math.cos(screenHeading) * faceLen, c.y + Math.sin(screenHeading) * faceLen);
        ctx.strokeStyle = 'rgba(0,0,0,.38)';
        ctx.lineWidth = 1.3;
        ctx.stroke();

        ctx.font = `bold ${isTouch ? 12 : 11}px system-ui`;
        ctx.fillStyle = COLOR_PLAYER;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(key.toUpperCase(), c.x, c.y + 0.5);

        ctx.beginPath();
        ctx.fillStyle = footColor;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.2;
        ctx.arc(footX, footY, 2.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (label) {
          ctx.font = `bold ${isTouch ? 12 : 11}px system-ui`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#fff';
          ctx.fillStyle = COLOR_PLAYER;
          ctx.strokeText(label, c.x, c.y - shortRadius - 5);
          ctx.fillText(label, c.x, c.y - shortRadius - 5);
        }
      }

      // suffix：标签右侧的小号倍率文字，如 "x2" / "x0.5"
      function drawDot(pt, color, label, radius, shrunk, suffix, showHalo = true) {
        const p = w2c(pt);
        const r = radius * (shrunk ? 0.8 : 1);

        if (showHalo) {
          ctx.beginPath();
          ctx.fillStyle = 'rgba(0,0,0,.10)';
          ctx.arc(p.x, p.y, r * 2.25, 0, Math.PI * 2);
          ctx.fill();
          ctx.save();
          ctx.strokeStyle = 'rgba(0,0,0,.27)';
          ctx.lineWidth = 1.1;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.arc(p.x, p.y, r * 1.65, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        if (!label) return;

        ctx.save();
        const labelFont = `bold ${isTouch ? 13 : 12}px system-ui`;
        const subFont = `bold ${isTouch ? 10 : 10}px system-ui`;
        const baseY = p.y - (r + 6);

        ctx.textBaseline = 'alphabetic';
        ctx.font = labelFont;
        const wl = ctx.measureText(label).width;
        let ws = 0;
        if (suffix) {
          ctx.font = subFont;
          ws = ctx.measureText(suffix).width;
        }
        const gapW = suffix ? 2 : 0;
        const startX = p.x - (wl + ws + gapW) / 2;

        ctx.textAlign = 'left';
        ctx.font = labelFont;
        ctx.fillStyle = color;
        ctx.fillText(label, startX, baseY);

        if (suffix) {
          ctx.font = subFont;
          ctx.fillStyle = COLOR_VEL;
          ctx.fillText(suffix, startX + wl + gapW, baseY);
        }
        ctx.restore();
      }

      function drawEquiLocus(segs) {
        if (!segs.length) return;
        ctx.save();
        ctx.strokeStyle = 'rgba(120,120,120,0.5)';
        ctx.lineWidth = 1.4;
        ctx.setLineDash([6, 6]);
        for (const [a, b] of segs) {
          const ca = w2c({ x: a[0], y: a[1] }), cb = w2c({ x: b[0], y: b[1] });
          ctx.beginPath();
          ctx.moveTo(ca.x, ca.y);
          ctx.lineTo(cb.x, cb.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawGapRing(pt) {
        const p = w2c(pt);
        ctx.save();
        ctx.beginPath();
        ctx.strokeStyle = COLOR_GAP;
        ctx.lineWidth = 2.4;
        ctx.setLineDash([4, 4]);
        ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font = 'bold 14px system-ui';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeText(t('gap'), p.x, p.y + 13);
        ctx.fillStyle = COLOR_GAP;
        ctx.fillText(t('gap'), p.x, p.y + 13);
        ctx.restore();
      }

      function drawBestHalo(pt) {
        const p = w2c(pt);
        ctx.beginPath();
        ctx.fillStyle = 'rgba(211,47,47,0.16)';
        ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawBestPoint(pt, J) {
        const p = w2c(pt);
        ctx.beginPath();
        ctx.fillStyle = COLOR_BEST;
        ctx.arc(p.x, p.y, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();

        const labelY = p.y - 10;

        ctx.save();
        ctx.textBaseline = 'bottom';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';

        ctx.font = `bold ${isTouch ? 14 : 15}px system-ui`;
        ctx.textAlign = 'right';
        ctx.fillStyle = COLOR_BEST;
        ctx.strokeText(t('best'), p.x - 2, labelY);
        ctx.fillText(t('best'), p.x - 2, labelY);

        ctx.font = `bold ${isTouch ? 13 : 12}px system-ui`;
        ctx.textAlign = 'left';
        ctx.lineWidth = 3;
        ctx.fillStyle = 'rgba(211,47,47,0.72)';
        const jText = `[${J.toFixed(1)}]`;
        ctx.strokeText(jText, p.x - 2, labelY);
        ctx.fillText(jText, p.x - 2, labelY);
        ctx.restore();
      }

      function drawCornerRanks(list) {
        ctx.save();
        ctx.textBaseline = 'middle';
        for (const cb of list) {
          if (cb.rank == null) continue;
          const p = w2c(cb);
          const text = String(cb.rank);

          ctx.font = 'bold 22px system-ui';
          ctx.lineWidth = 5;
          ctx.strokeStyle = '#ffffff';
          ctx.fillStyle = COLOR_RANK;

          ctx.textAlign = 'right';
          ctx.strokeText(text, p.x - 3, p.y);
          ctx.fillText(text, p.x - 3, p.y);

          ctx.font = `bold ${isTouch ? 12 : 11}px system-ui`;
          ctx.textAlign = 'left';
          ctx.lineWidth = 3;
          ctx.fillStyle = 'rgba(142,68,173,0.82)';
          const vText = `[${cb.val.toFixed(1)}]`;
          ctx.strokeText(vText, p.x + 3, p.y);
          ctx.fillText(vText, p.x + 3, p.y);
        }
        ctx.restore();
      }

      function render() {
        ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

        const tl = w2c({ x: -HALF_W, y: L });
        const br = w2c({ x: HALF_W, y: VIEW_Y_MIN });

        // 地面
        ctx.fillStyle = C_GROUND;
        ctx.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);

        // 热力图
        if (state.showHeat && heatCanvas) drawHeat();

        // 场内线
        ctx.save();
        ctx.strokeStyle = C_LINE;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.68;
        ctx.setLineDash([]);

        const SHORT_SERVICE_Y = NET_Y + 1.98;   // 前发球线
        const LONG_SERVICE_Y = L - 0.76;       // 双打后发球线

        // 1. 单打边线（内线）：始终画在 ±HALF_W_SINGLE
        for (const sx of [-HALF_W_SINGLE, HALF_W_SINGLE]) {
          const a = w2c({ x: sx, y: VIEW_Y_MIN });
          const b = w2c({ x: sx, y: L });
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        // 2. 前发球线和双打后发球线：横贯整个双打宽度
        for (const yy of [SHORT_SERVICE_Y, LONG_SERVICE_Y]) {
          const a = w2c({ x: -HALF_W, y: yy });
          const b = w2c({ x: HALF_W, y: yy });
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        // 3. 中线：从前发球线到底线
        {
          const a = w2c({ x: 0, y: SHORT_SERVICE_Y });
          const b = w2c({ x: 0, y: L });
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        ctx.restore();

        // 外框（双打边线）：网 → 底线
        const fA = w2c({ x: -HALF_W, y: NET_Y });
        const fB = w2c({ x: HALF_W, y: L });
        ctx.strokeStyle = C_FRAME;
        ctx.lineWidth = 2;
        ctx.strokeRect(fA.x, fB.y, fB.x - fA.x, fA.y - fB.y);
        ctx.beginPath();
        ctx.moveTo(tl.x, br.y);
        ctx.lineTo(tl.x, tl.y);
        ctx.lineTo(br.x, tl.y);
        ctx.lineTo(br.x, br.y);
        ctx.stroke();

        // 球网
        const n1 = w2c({ x: -HALF_W, y: NET_Y });
        const n2 = w2c({ x: HALF_W, y: NET_Y });
        ctx.beginPath();
        ctx.strokeStyle = C_NET;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.moveTo(n1.x, n1.y);
        ctx.lineTo(n2.x, n2.y);
        ctx.stroke();
        ctx.lineCap = 'butt';

        ctx.save();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.font = 'bold 12px system-ui';
        ctx.fillStyle = C_NET;
        ctx.fillText(t('net'), n1.x + 8, n1.y + 9);
        ctx.restore();

        // 等难度线
        if (state.mode === 'double' && (state.gaps[0] || state.gaps[1])) drawEquiLocus(state.locus);

        // 最优 / 结合部 / 角点
        if (state.best.pt) drawBestHalo(state.best.pt);
        if (state.mode === 'double') {
          if (state.gaps[0]) drawGapRing(state.gaps[0]);
          if (state.gaps[1]) drawGapRing(state.gaps[1]);
        }
        if (state.best.pt) drawBestPoint(state.best.pt, state.best.J);

        // 速度手柄
        const aHot = isHot(TARGET.A_POS) || isHot(TARGET.A_VEL);
        const bHot = isHot(TARGET.B_POS) || isHot(TARGET.B_VEL);
        const { a, b } = state.players;

        if (a.velVisible) {
          drawDeadzone(a.pos);
          const h = pointer.dragTarget === TARGET.A_VEL && pointer.dragHandlePos
            ? pointer.dragHandlePos
            : getHandlePos(a.pos, a.vel);
          drawVelocityHandle(a.pos, a.vel, h, isHot(TARGET.A_VEL));
        }
        if (state.mode === 'double' && b.velVisible) {
          drawDeadzone(b.pos);
          const h = pointer.dragTarget === TARGET.B_VEL && pointer.dragHandlePos
            ? pointer.dragHandlePos
            : getHandlePos(b.pos, b.vel);
          drawVelocityHandle(b.pos, b.vel, h, isHot(TARGET.B_VEL));
        }

        // 球员点（双打时半径随速度比缩放，标签右侧带倍率）
        if (state.mode === 'single') {
          if (state.turnMode) {
            drawTurnPlayer('a', t('opponent'), 9, aHot, !a.velVisible);
          } else {
            drawDot(a.pos, COLOR_PLAYER, t('opponent'), 9, aHot, '', !a.velVisible);
          }
        } else {
          const mA = state.speedRatio;
          const mB = 1 / mA;
          const showMul = Math.abs(mA - 1) > 1e-6;
          const rA = 9 * Math.sqrt(mA);
          const rB = 9 * Math.sqrt(mB);
          if (state.turnMode) {
            drawTurnPlayer('a', '对手 A', rA, aHot, !a.velVisible);
            drawTurnPlayer('b', '对手 B', rB, bHot, !b.velVisible);
          } else {
            drawDot(a.pos, COLOR_PLAYER, '对手 A', rA, aHot, showMul ? 'x' + fmtNum(mA) : '', !a.velVisible);
            drawDot(b.pos, COLOR_PLAYER, '对手 B', rB, bHot, showMul ? 'x' + fmtNum(mB) : '', !b.velVisible);
          }
        }

        // 四角次优
        if (state.corners.length) drawCornerRanks(state.corners);
      }

      /* =========================================================
       * 9. 主循环
       * ========================================================= */
      function frame() {
        if (dirty.locus) recomputeLocus();

        if (dirty.grid) {
          const now = performance.now();
          const throttle = pointer.dragActive ? THROTTLE_MS : 0;
          if (now - lastGridCompute >= throttle) {
            computeGridNow();
            dirty.grid = false;
            lastGridCompute = now;
          }
        }

        render();
        requestAnimationFrame(frame);
      }

      /* =========================================================
       * 10. 画布自适应
       * ========================================================= */
      function setupCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const wrap = canvas.parentElement;
        const cs = getComputedStyle(wrap);
        const padL = parseFloat(cs.paddingLeft) || 0;
        const padR = parseFloat(cs.paddingRight) || 0;
        const availW = wrap.clientWidth - padL - padR;

        let cssW = Math.min(availW, LOGICAL_W);
        let cssH = cssW * LOGICAL_H / LOGICAL_W;
        const maxH = Math.min(window.innerHeight * 0.72, 640);
        if (cssH > maxH) {
          cssH = maxH;
          cssW = cssH * LOGICAL_W / LOGICAL_H;
        }
        cssW = Math.max(180, cssW);

        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        const s = canvas.width / LOGICAL_W;
        ctx.setTransform(s, 0, 0, s, 0, 0);
      }

      window.addEventListener('resize', setupCanvas);
      window.addEventListener('orientationchange', () => setTimeout(setupCanvas, 250));
      if (window.ResizeObserver) {
        new ResizeObserver(() => setupCanvas()).observe(canvas.parentElement);
      }

      /* =========================================================
       * 11. 交互（Pointer Events 统一鼠标/触摸）
       * ========================================================= */
      function hitTest(w) {
        const { a, b } = state.players;
        if (a.velVisible) {
          const h = getHandlePos(a.pos, a.vel);
          if (Math.hypot(w.x - h.x, w.y - h.y) < V_HANDLE_HIT) return TARGET.A_VEL;
        }
        if (state.mode === 'double' && b.velVisible) {
          const h = getHandlePos(b.pos, b.vel);
          if (Math.hypot(w.x - h.x, w.y - h.y) < V_HANDLE_HIT) return TARGET.B_VEL;
        }
        if (Math.hypot(w.x - a.pos.x, w.y - a.pos.y) < DRAG_R) return TARGET.A_POS;
        if (state.mode === 'double' && Math.hypot(w.x - b.pos.x, w.y - b.pos.y) < DRAG_R) return TARGET.B_POS;
        return null;
      }

      function clearLongPress() {
        if (pointer.longPressTimer) {
          clearTimeout(pointer.longPressTimer);
          pointer.longPressTimer = null;
        }
      }

      function toggleVelocity(target) {
        const key = target === TARGET.A_POS ? 'a' : 'b';
        const p = state.players[key];
        p.velVisible = !p.velVisible;
        if (!p.velVisible) { p.vel.x = 0; p.vel.y = 0; }
        markDirty();
        updateSubtitle();
        updateLegend();
      }

      function movePlayer(target, w) {
        const key = target === TARGET.A_POS ? 'a' : 'b';
        const p = state.players[key];
        p.pos.x = clamp(w.x, -HALF_W + 0.1, HALF_W - 0.1);
        p.pos.y = clamp(w.y, NET_Y + 0.1, L - 0.1);
        markDirty();
      }

      function moveHandle(target, w) {
        const key = target === TARGET.A_VEL ? 'a' : 'b';
        const p = state.players[key];
        const nx = clamp(w.x, -HALF_W + 0.1, HALF_W - 0.1);
        const ny = clamp(w.y, VIEW_Y_MIN, L - 0.1);
        pointer.dragHandlePos = { x: nx, y: ny };

        const dx = nx - p.pos.x, dy = ny - p.pos.y;
        const dist = Math.hypot(dx, dy);
        if (dist < V_DEADZONE) {
          p.vel.x = 0; p.vel.y = 0;
        } else {
          const norm = Math.min((dist - V_DEADZONE) / (V_MAX * V_SCALE), 1);
          const speed = V_MAX * Math.pow(norm, V_GAMMA);
          p.vel.x = dx / dist * speed;
          p.vel.y = dy / dist * speed;
        }
        markDirty();
      }

      function handleTap(clientX, clientY) {
        const now = performance.now();
        const dx = clientX - lastTap.x, dy = clientY - lastTap.y;
        const w = clientToWorld(clientX, clientY);
        const target = hitTest(w);
        if (now - lastTap.time < DBLCLICK_MS &&
            Math.hypot(dx, dy) < DBLCLICK_DIST &&
            target === lastTap.target) {
          lastTap.time = 0;
          lastTap.target = null;
          if (target === TARGET.A_POS || target === TARGET.B_POS) {
            toggleVelocity(target);
          } else if (target === null) {
            state.showHeat = !state.showHeat;
            updateLegend();
          }
        } else {
          lastTap = {time: now, x: clientX, y: clientY, target};
        }
      }

      function onPointerDown(e) {
        if (pointer.id !== null) return;
        e.preventDefault();

        const w = clientToWorld(e.clientX, e.clientY);
        const target = hitTest(w);

        pointer.id = e.pointerId;
        pointer.startClient = { x: e.clientX, y: e.clientY };
        pointer.dragTarget = target;
        pointer.dragActive = false;
        pointer.dragHandlePos = null;
        pointer.longPressFired = false;

        try { canvas.setPointerCapture(e.pointerId); } catch (_) { }

        canvas.style.cursor = target ? 'grabbing' : 'default';
      }

      function onPointerMove(e) {
        if (pointer.id === null) {
          const w = clientToWorld(e.clientX, e.clientY);
          state.hover = hitTest(w);
          canvas.style.cursor = state.hover ? 'grab' : 'default';
          return;
        }
        if (e.pointerId !== pointer.id) return;

        if (!pointer.dragActive) {
          const dx = e.clientX - pointer.startClient.x;
          const dy = e.clientY - pointer.startClient.y;
          if (Math.hypot(dx, dy) < DRAG_START_THRESHOLD) return;
          pointer.dragActive = true;
          clearLongPress();
        }

        if (!pointer.dragTarget) return;

        const w = clientToWorld(e.clientX, e.clientY);
        if (pointer.dragTarget === TARGET.A_POS || pointer.dragTarget === TARGET.B_POS) {
          movePlayer(pointer.dragTarget, w);
        } else {
          moveHandle(pointer.dragTarget, w);
        }
        e.preventDefault();
      }

      function onPointerUp(e) {
        if (e.pointerId !== pointer.id) return;
        clearLongPress();

        const wasActive = pointer.dragActive;
        const longPressFired = pointer.longPressFired;

        if (!wasActive && !longPressFired) handleTap(e.clientX, e.clientY);
        if (wasActive) markDirty();

        pointer.id = null;
        pointer.dragTarget = null;
        pointer.dragActive = false;
        pointer.dragHandlePos = null;
        pointer.startClient = null;
        pointer.longPressFired = false;

        if (e.pointerType === 'mouse') {
          state.hover = hitTest(clientToWorld(e.clientX, e.clientY));
          canvas.style.cursor = state.hover ? 'grab' : 'default';
        } else {
          state.hover = null;
          canvas.style.cursor = 'default';
        }
      }

      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointercancel', onPointerUp);
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      window.addEventListener('blur', () => {
        clearLongPress();
        pointer.id = null;
        pointer.dragTarget = null;
        pointer.dragActive = false;
        pointer.dragHandlePos = null;
        pointer.startClient = null;
        pointer.longPressFired = false;
      });

      /* =========================================================
       * 11b. A/B 速度比控件
       * ========================================================= */
      let ratioPointer = null;
      let lastRatioTap = { time: 0, y: 0 };

      function setSpeedRatio(v) {
        const inv = 1 / RATIO_STEP;
        const snapped = Math.round(clamp(v, RATIO_MIN, RATIO_MAX) * inv) / inv;
        if (snapped === state.speedRatio) return;
        state.speedRatio = snapped;
        ratioValEl.textContent = fmtNum(snapped);
        updateTurnControls();
        markDirty();
      }

      ratioBtnEl.addEventListener('pointerdown', (e) => {
        if (ratioPointer) return;
        e.preventDefault();
        ratioPointer = {
          id: e.pointerId,
          startY: e.clientY,
          startRatio: state.speedRatio,
          moved: false,
        };
        try { ratioBtnEl.setPointerCapture(e.pointerId); } catch (_) { }
      });

      ratioBtnEl.addEventListener('pointermove', (e) => {
        if (!ratioPointer || e.pointerId !== ratioPointer.id) return;
        e.preventDefault();
        const dy = ratioPointer.startY - e.clientY;   // 上拖为正
        if (!ratioPointer.moved && Math.abs(dy) < 3) return;
        ratioPointer.moved = true;
        setSpeedRatio(ratioPointer.startRatio + dy * RATIO_SENS);
      });

      function endRatioPointer(e, cancelled) {
        if (!ratioPointer || e.pointerId !== ratioPointer.id) return;
        const moved = ratioPointer.moved;
        ratioPointer = null;
        if (cancelled || moved) return;

        const now = performance.now();
        if (now - lastRatioTap.time < RATIO_TAP_MS &&
          Math.abs(e.clientY - lastRatioTap.y) < RATIO_TAP_DIST) {
          lastRatioTap.time = 0;
          setSpeedRatio(1);
        } else {
          lastRatioTap = { time: now, y: e.clientY };
        }
      }

      ratioBtnEl.addEventListener('pointerup', (e) => endRatioPointer(e, false));
      ratioBtnEl.addEventListener('pointercancel', (e) => endRatioPointer(e, true));

      function headingDisplayDegrees(player) {
        let deg = Math.round(player.heading / DEG) % 360;
        if (deg < 0) deg += 360;
        return deg;
      }

      function updateTurnRotationUI() {
        const single = state.mode === 'single';
        rotationClusterEl.classList.toggle('is-visible', state.turnMode);
        footLegendEl.classList.toggle('is-visible', state.turnMode);
        footLegendEl.innerHTML = `<i></i>${tr('持拍侧脚', 'Racket-side foot')}`;
        rotationBEl.style.display = single ? 'none' : '';
        [['a', rotationAEl], ['b', rotationBEl]].forEach(([key, button]) => {
          const player = state.players[key];
          button.textContent = `${key.toUpperCase()} ${player.hand === 'left' ? tr('左', 'Left') : tr('右', 'Right')} ${headingDisplayDegrees(player)}°`;
          button.classList.toggle('is-left-hand', player.hand === 'left');
        });
      }

      function updateTurnControls() {
        const p = state.turnParams;
        const values = {
          turnReaction: p.reaction.toFixed(2) + ' s',
          turnTmax: p.turnTmax.toFixed(2) + ' s',
          turnTheta0: Math.round(p.turnTheta0 / DEG) + '°',
          turnSpeedK: Math.round(p.turnSpeedK * 100) + '%',
          moveAccel: p.moveAccel > 0 ? fmtNum(p.moveAccel) + ' m/s²' : tr('关闭', 'Off'),
          turnOverlapK: Math.round(p.turnOverlapK * 100) + '%',
          fhBias: Math.round(p.fhBias * 100) + '%',
          leadFootBoost: Math.round(p.leadFootBoost * 100) + '%',
          crossLineSpeedK: Math.round(p.crossLineSpeedK * 100) + '%',
          backhandTurnK: Math.round(p.backhandTurnK * 100) + '%',
          backhandTouchK: Math.round(p.backhandTouchK * 100) + '%'
        };
        for (const [id, text] of Object.entries(values)) {
          const out = document.getElementById(id + 'Value');
          if (out) out.textContent = text;
        }
        speedAEl.value = p.speedA;
        speedBEl.value = p.speedB;
        speedAValueEl.textContent = p.speedA.toFixed(1) + ' m/s';
        speedBValueEl.textContent = p.speedB.toFixed(1) + ' m/s';
        document.querySelectorAll('[data-turn]').forEach((input) => {
          const key = input.dataset.turn;
          input.value = key === 'turnTheta0' ? p[key] / DEG : p[key];
        });
        state.speedRatio = p.speedA / p.speedB;
      }

      document.querySelectorAll('[data-turn]').forEach((input) => {
        input.addEventListener('input', () => {
          const key = input.dataset.turn;
          let value = parseFloat(input.value);
          if (key === 'turnTheta0') value *= DEG;
          state.turnParams[key] = value;
          updateTurnControls();
          if (state.turnMode) markDirty();
        });
      });

      document.querySelectorAll('[data-speed]').forEach((input) => {
        input.addEventListener('input', () => {
          const key = input.dataset.speed === 'b' ? 'speedB' : 'speedA';
          state.turnParams[key] = parseFloat(input.value);
          state.speedRatio = state.turnParams.speedA / state.turnParams.speedB;
          ratioValEl.textContent = fmtNum(state.speedRatio);
          updateTurnControls();
          markDirty();
        });
      });

      function openTurnSidebar() {
        sidebarEl.classList.add('open');
        sidebarMaskEl.classList.add('open');
      }

      function closeTurnSidebar() {
        sidebarEl.classList.remove('open');
        sidebarMaskEl.classList.remove('open');
      }

      sidebarBtnEl.addEventListener('click', openTurnSidebar);
      sidebarCloseEl.addEventListener('click', closeTurnSidebar);
      sidebarMaskEl.addEventListener('click', closeTurnSidebar);

      let rotationPointer = null;
      function bindCourtRotation(button, key) {
        button.addEventListener('pointerdown', (event) => {
          if (button.disabled || (event.button !== undefined && event.button !== 0)) return;
          rotationPointer = {
            pointerId: event.pointerId,
            key,
            startY: event.clientY,
            startHeading: state.players[key].heading,
            moved: false
          };
          try {button.setPointerCapture(event.pointerId);} catch (_) {}
          event.preventDefault();
          event.stopPropagation();
        });

        button.addEventListener('pointermove', (event) => {
          if (!rotationPointer || rotationPointer.pointerId !== event.pointerId ||
              rotationPointer.key !== key) return;
          const dy = rotationPointer.startY - event.clientY;
          if (!rotationPointer.moved) {
            if (Math.abs(dy) < 3) return;
            rotationPointer.moved = true;
          }
          state.players[key].heading = wrapAngle(rotationPointer.startHeading + dy * 0.7 * DEG);
          updateTurnRotationUI();
          markDirty();
          event.preventDefault();
          event.stopPropagation();
        });

        button.addEventListener('pointerup', (event) => {
          if (!rotationPointer || rotationPointer.pointerId !== event.pointerId) return;
          const moved = rotationPointer.moved;
          rotationPointer = null;
          if (!moved) {
            const player = state.players[key];
            player.hand = player.hand === 'left' ? 'right' : 'left';
            updateTurnRotationUI();
            markDirty();
          }
          event.preventDefault();
          event.stopPropagation();
        });

        button.addEventListener('pointercancel', () => {
          rotationPointer = null;
        });
      }

      bindCourtRotation(rotationAEl, 'a');
      bindCourtRotation(rotationBEl, 'b');

      /* =========================================================
       * 12. 界面文案 / 语言 / 折叠 / 模式
       * ========================================================= */
      function updateSubtitle() {
        const single = state.mode === 'single';
        const hint = isAnyVelocityVisible() ? t('subVelActive') : t('subHint');
        pageSub.textContent = (single ? t('subSingle') : t('subDouble')) + hint;
      }

      function updateLegend() {
        const single = state.mode === 'single';
        let html = '';
        html += single
          ? `<span><i class="dot" style="background:#111"></i>${t('opponent')}</span>`
          : `<span><i class="dot" style="background:#111"></i>${t('player')}</span>`;
        if (isAnyVelocityVisible()) html += `<span><i class="arrow-legend"></i>${t('initialVel')}</span>`;
        html += `<span><i class="dot" style="background:#d32f2f"></i>${t('best')}</span>`;
        if (!single) html += `<span><i class="ring"></i>${t('gap')}</span>`;
        html += `<span><i class="num">2</i>${t('corner')}</span>`;
        if (state.showHeat) html += `<span><i class="heat-legend"></i>${t('arrival')}</span>`;
        legendBar.innerHTML = html;
      }

      function updateUIForMode() {
        modeToggleEl.textContent = state.mode === 'single' ? t('singles') : t('doubles');
        modeToggleEl.dataset.mode = state.mode;
        modeTurnBtnEl.textContent = state.turnMode ? tr('转身', 'Turn') : tr('非转身', 'No turn');
        modeTurnBtnEl.classList.toggle('is-on', state.turnMode);
        ratioBtnEl.hidden = true;
        ratioBtnEl.style.display = 'none';
        speedBEl.closest('.sidebar-param').style.display = state.mode === 'single' ? 'none' : '';
        ratioValEl.textContent = fmtNum(state.speedRatio);
        updateTurnRotationUI();
        updateTurnControls();
        updateSubtitle();
        updateLegend();
      }

      function applyLanguage() {
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.title = t('title');
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
        langBtnEl.textContent = t('langBtn');
        updateUIForMode();

        const pBody = document.getElementById('principleBody');
        if (pBody) pBody.innerHTML = t('principleHTML');

        const collapsed = appEl.classList.contains('collapsed');
        collapseBtn.setAttribute('aria-label', collapsed ? t('collapseShow') : t('collapseHide'));
      }
      window.__applyLang = applyLanguage;

      langBtnEl.addEventListener('click', () => {
        lang = lang === 'zh' ? 'en' : 'zh';
        applyLanguage();
      });

      collapseBtn.addEventListener('click', () => {
        const collapsed = appEl.classList.toggle('collapsed');
        collapseBtn.setAttribute('aria-label', collapsed ? t('collapseShow') : t('collapseHide'));
        requestAnimationFrame(setupCanvas);
      });

      modeToggleEl.addEventListener('click', () => {
        state.mode = state.mode === 'double' ? 'single' : 'double';
        if (state.mode === 'single') {
          pointer.dragTarget = null;
          pointer.dragActive = false;
        }
        updateUIForMode();
        markDirty();
      });

      modeTurnBtnEl.addEventListener('click', () => {
        state.turnMode = !state.turnMode;
        markDirty();
        updateUIForMode();
      });

      /* =========================================================
       * 13. 启动
       * ========================================================= */
      setupCanvas();
      applyLanguage();
      requestAnimationFrame(frame);
    })();
  </script>

  <!-- ==================== 原理说明 Modal ==================== -->
  <div class="modal-mask" id="principleModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pTitle">
      <div class="modal-head">
        <h2 id="pTitle" data-i18n="principleTitle">羽毛球远身场地落点 · 计算原理</h2>
        <button class="modal-close" id="principleClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="principleBody"></div>
    </div>
  </div>

  <script>
    (function () {
      var mask = document.getElementById('principleModal');
      var credit = document.getElementById('credit');

      // 首段脚本启动时 modal 的 principleBody 尚未解析，这里补一次填充
      if (typeof window.__applyLang === 'function') window.__applyLang();

      function openM() { mask.classList.add('open'); document.body.style.overflow = 'hidden'; }
      function closeM() { mask.classList.remove('open'); document.body.style.overflow = ''; }

      if (credit) {
        credit.addEventListener('dblclick', openM);
        var lastTap = 0;
        credit.addEventListener('touchend', function (e) {
          var now = Date.now();
          if (now - lastTap < 350) { e.preventDefault(); openM(); lastTap = 0; }
          else { lastTap = now; }
        }, { passive: false });
      }

      document.getElementById('principleClose').addEventListener('click', closeM);
      mask.addEventListener('click', function (e) { if (e.target === mask) closeM(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeM(); });
    })();
  </script>
</body>
