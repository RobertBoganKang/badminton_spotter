<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>羽毛球远身场地落点</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <style>
    :root {
      --bg: #eef2f6;
      --card: #ffffff;
      --text: #1a2b22;
      --text-2: #5b6b62;
      --text-3: #8a9a91;
      --border: #e4ebe6;
      --border-hover: #cfd9d2;
      --shadow: 0 1px 2px rgba(20, 50, 35, .04), 0 8px 24px rgba(20, 50, 35, .05);
      --primary: #166b46;
      --primary-2: #1f8a5b;
      --primary-bright: #22a06b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background:
        radial-gradient(1000px 500px at 15% -5%, #d9ece1 0%, transparent 55%),
        radial-gradient(800px 400px at 90% 0%, #e3e9f7 0%, transparent 50%),
        var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button {
      font-family: inherit
    }

    button:focus {
      outline: none
    }

    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow)
    }

    /* Header */
    .header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(31, 138, 91, .1) 0%, transparent 65%);
      pointer-events: none;
    }

    .header-left {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      flex: 1;
      min-width: 0;
      position: relative
    }

    .header-left>div:not(.logo) {
      min-width: 0;
      flex: 1
    }

    .logo {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-bright), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(22, 107, 70, .28), inset 0 1px 0 rgba(255, 255, 255, .2);
    }

    h1 {
      margin: 0 0 3px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .2px;
      line-height: 1.4
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.5;
      word-break: break-word
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      position: relative
    }

    .lang-btn {
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 7px;
      background: transparent;
      border: none;
      border-radius: 5px;
      box-shadow: none;
      color: var(--text-3);
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .3px;
      opacity: .85;
      transition: color .15s, opacity .15s, transform .12s;
      touch-action: manipulation;
    }

    .lang-btn:hover {
      color: var(--primary);
      opacity: 1
    }

    .lang-btn:active {
      transform: scale(.92)
    }

    .app.collapsed .header {
      display: none
    }

    /* 画布卡片 */
    .canvas-card {
      padding: 0;
      overflow: hidden
    }

    .canvas-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid #f0f4f1;
    }

    .mode-toggle {
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 14px;
      background: #e8eee9;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
      letter-spacing: .3px;
      min-width: 46px;
      transition: background .15s, color .15s, transform .12s;
      touch-action: manipulation;
    }

    .mode-toggle:hover {
      background: #dde6e0
    }

    .mode-toggle:active {
      transform: scale(.96)
    }

    .mode-toggle[data-mode="single"] {
      background: #e8f0f7;
      color: #1e6bb8
    }

    .mode-toggle[data-mode="single"]:hover {
      background: #dbe7f3
    }

    /* A/B 速度比控件 */
    .ratio-btn {
      appearance: none;
      cursor: ns-resize;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: #eef3f8;
      border: 1px solid transparent;
      border-radius: 7px;
      color: #1e6bb8;
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
      letter-spacing: .3px;
      transition: background .15s, transform .12s;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }

    .ratio-btn:hover {
      background: #e2ebf5
    }

    .ratio-btn:active {
      transform: scale(.96)
    }

    .ratio-btn .ratio-label {
      font-size: 10.5px;
      opacity: .7
    }

    .ratio-btn .ratio-val {
      min-width: 26px;
      text-align: center
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--text-3);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      font-weight: 500
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block
    }

    .ring {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.6px dashed #757575;
      display: inline-block
    }

    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #f3e8fa;
      color: #8e44ad;
      font-size: 10px;
      font-weight: 700;
      font-style: normal;
    }

    .arrow-legend {
      display: inline-block;
      width: 0;
      height: 0;
      border-left: 11px solid #1e88e5;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      vertical-align: middle;
      margin: 0 1px;
    }

    .heat-legend {
      display: inline-block;
      width: 26px;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #4575b4, #91bfdb, #ffffbf, #fc8d59, #d73027);
      vertical-align: middle;
    }

    .collapse-btn {
      margin-left: auto;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 0;
      color: var(--text-3);
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      box-shadow: none;
      transition: color .15s, transform .12s;
      opacity: .75;
      touch-action: manipulation;
    }

    .collapse-btn:hover {
      color: var(--primary);
      opacity: 1
    }

    .collapse-btn:active {
      transform: scale(.9)
    }

    .collapse-btn svg {
      width: 12px;
      height: 12px;
      stroke-width: 2.2;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .collapse-btn .chev-down {
      display: none
    }

    .app.collapsed .collapse-btn .chev-up {
      display: none
    }

    .app.collapsed .collapse-btn .chev-down {
      display: inline
    }

    .canvas-wrap {
      padding: 10px 12px 12px;
      display: flex;
      justify-content: center
    }

    canvas {
      display: block;
      border-radius: 10px;
      touch-action: none;
      cursor: default;
      background: #f7fbf9;
      max-width: 100%;
      box-shadow: 0 1px 3px rgba(20, 50, 35, .06), 0 4px 14px rgba(20, 50, 35, .05);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Footer */
    .footer {
      padding: 2px 8px 6px;
      text-align: center;
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: .3px;
      line-height: 1.7;
    }

    .footer b {
      color: var(--text-2);
      font-weight: 600
    }

    #credit {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Modal */
    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(10, 30, 20, .46);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 26px 14px;
      overflow: auto;
      backdrop-filter: blur(2px);
      -webkit-overflow-scrolling: touch;
    }

    .modal-mask.open {
      display: flex
    }

    .modal {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
      overflow: hidden;
      animation: pop .22s ease;
    }

    @keyframes pop {
      from {
        transform: translateY(14px);
        opacity: .6
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 650
    }

    .modal-close {
      background: transparent !important;
      box-shadow: none !important;
      color: #fff;
      font-size: 24px;
      line-height: 1;
      padding: 0 6px;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    .modal-body {
      padding: 18px 22px 24px;
      font-size: 14px;
      line-height: 1.78;
      color: var(--text);
      max-height: 76vh;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    .modal-body h3 {
      font-size: 15px;
      margin: 22px 0 8px;
      color: var(--primary);
      font-weight: 650;
      padding-bottom: 4px;
      border-bottom: 1px solid #e8f0ec;
    }

    .modal-body h3:first-child {
      margin-top: 0;
      border-top: none
    }

    .modal-body p {
      margin: 6px 0
    }

    .modal-body .lead {
      color: var(--text);
      font-size: 13.5px;
      background: #f2f7f4;
      padding: 10px 13px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 3px solid var(--primary);
    }

    .formula {
      background: #f2f7f4;
      border-left: 3px solid var(--primary);
      padding: 8px 13px;
      border-radius: 6px;
      margin: 8px 0;
      font-family: "Cambria Math", "Times New Roman", Georgia, serif;
      font-size: 14px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .modal-body code {
      background: #eef2f6;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 12.5px
    }

    .modal-body .muted {
      color: var(--text-2);
      font-size: 12.5px;
      background: #fafbfa;
      padding: 6px 10px;
      border-radius: 6px;
      border-left: 2px solid #cfd8d3;
    }

    .modal-body ul,
    .modal-body ol {
      margin: 6px 0;
      padding-left: 22px
    }

    .modal-body li {
      margin: 4px 0
    }

    .modal-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      margin: 8px 0
    }

    .modal-body th,
    .modal-body td {
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid #edf2ef
    }

    .modal-body th {
      color: var(--text-2);
      font-weight: 600;
      background: #f7fbf9
    }

    @media (max-width: 520px) {
      body {
        padding: 12px 10px
      }

      .app {
        gap: 10px
      }

      .header {
        padding: 12px 14px;
        gap: 10px;
        flex-wrap: nowrap
      }

      .header-left {
        gap: 10px;
        flex: 1;
        min-width: 0
      }

      .logo {
        width: 36px;
        height: 36px;
        font-size: 18px;
        border-radius: 10px;
        flex-shrink: 0
      }

      h1 {
        font-size: 14.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
      }

      .header p {
        font-size: 12px;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden
      }

      .header-actions {
        width: auto;
        gap: 6px;
        flex-shrink: 0
      }

      .lang-btn {
        flex: 0 0 auto;
        padding: 2px 5px;
        font-size: 11px
      }

      .canvas-topbar {
        padding: 8px 12px 6px;
        gap: 6px 8px
      }

      .mode-toggle {
        padding: 4px 12px;
        font-size: 11.5px;
        min-width: 42px;
        flex-shrink: 0;
        order: 1
      }

      .ratio-btn {
        padding: 4px 9px;
        font-size: 11.5px;
        gap: 4px;
        flex-shrink: 0;
        order: 2
      }

      .ratio-btn .ratio-label {
        font-size: 10px
      }

      .ratio-btn .ratio-val {
        min-width: 22px
      }

      .collapse-btn {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        margin-left: auto;
        order: 3
      }

      .collapse-btn svg {
        width: 10px;
        height: 10px;
        stroke-width: 2.2
      }

      .legend {
        font-size: 11px;
        gap: 8px;
        order: 4;
        flex-basis: 100%;
        padding-top: 6px;
        border-top: 1px solid #f0f4f1;
      }

      .legend span {
        gap: 3px
      }

      .canvas-wrap {
        padding: 8px
      }

      .footer {
        font-size: 11px
      }

      .modal-mask {
        padding: 8px 6px
      }

      .modal {
        border-radius: 13px
      }

      .modal-head {
        padding: 12px 16px
      }

      .modal-head h2 {
        font-size: 15px
      }

      .modal-close {
        font-size: 22px;
        padding: 0 4px
      }

      .modal-body {
        padding: 14px 16px 20px;
        font-size: 13.5px;
        line-height: 1.72;
        max-height: 84vh
      }

      .modal-body h3 {
        font-size: 14px;
        margin: 18px 0 6px
      }

      .modal-body .lead {
        font-size: 13px;
        padding: 8px 11px
      }

      .modal-body .formula {
        font-size: 12.5px;
        padding: 6px 10px
      }

      .modal-body ul,
      .modal-body ol {
        padding-left: 18px
      }
    }

    .sidebar-btn {
      appearance: none;
      width: 28px;
      height: 28px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text-2);
      background: #f0f5f2;
      cursor: pointer;
    }

    .sidebar-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .turn-mode-toggle {
      appearance: none;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text-2);
      background: #f3f6f4;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 700;
    }

    .turn-mode-toggle.is-on {
      color: #fff;
      border-color: #164f3a;
      background: #164f3a;
    }

    .court-foot-legend {
      display: none;
      align-items: center;
      gap: 4px;
      color: #1e88e5;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .court-foot-legend.is-visible {
      display: inline-flex;
    }

    .court-foot-legend i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #1e88e5;
    }

    .court-rotation-cluster {
      display: none;
      align-items: stretch;
      height: 20px;
      align-self: center;
    }

    .court-rotation-cluster.is-visible {
      display: inline-flex;
    }

    .court-rotation-pill {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 20px;
      min-height: 20px;
      padding: 0 7px;
      border: 1px solid rgba(30, 136, 229, .3);
      color: #1e88e5;
      background: rgba(30, 136, 229, .1);
      cursor: ns-resize;
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      touch-action: none;
    }

    .court-rotation-pill:first-child {
      border-radius: 999px 0 0 999px;
    }

    .court-rotation-pill:last-child {
      border-radius: 0 999px 999px 0;
      margin-left: -1px;
    }

    .court-rotation-pill.is-left-hand {
      color: #4aaed0;
      border-color: rgba(74, 174, 208, .45);
      background: rgba(74, 174, 208, .16);
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 90;
      width: min(330px, 88vw);
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 4px 0 26px rgba(20, 50, 35, .14);
      transform: translateX(-103%);
      transition: transform .26s cubic-bezier(.4, 0, .2, 1);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-mask {
      position: fixed;
      inset: 0;
      z-index: 89;
      display: none;
      background: rgba(8, 25, 17, .28);
      backdrop-filter: blur(2px);
    }

    .sidebar-mask.open {
      display: block;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      border-bottom: 1px solid var(--border);
    }

    .sidebar-head h2 {
      margin: 0;
      font-size: 14.5px;
    }

    .sidebar-close {
      width: auto;
      height: auto;
      border: 0;
      border-radius: 0;
      color: #fff;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
    }

    .sidebar-body {
      flex: 1;
      overflow: auto;
      padding: 0;
    }

    .sidebar-foot {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-foot button {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-2);
      background: #f5f9f6;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
    }

    .court-top-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .sidebar-group {
      margin: 0;
      padding: 9px 14px 10px;
      border-bottom: 1px solid #f0f4f1;
    }

    .sidebar-group h3 {
      margin: 0 0 7px;
      color: var(--text-2);
      font-size: 10.5px;
      letter-spacing: 0;
      text-transform: none;
    }

    .sidebar-param {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 28px;
      padding: 0;
    }

    .sidebar-param label {
      display: flex;
      flex-direction: column;
      color: var(--text-2);
      font-size: 10.5px;
      line-height: 1.25;
    }

    .sidebar-param output {
      margin-top: 2px;
      color: var(--primary);
      font-size: 9.5px;
      font-weight: 700;
    }

    .sidebar-param input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .turn-sidebar-hint {
      padding: 8px 10px;
      margin-bottom: 12px;
      border-radius: 9px;
      color: var(--text-2);
      background: #f2f7f4;
      font-size: 10.5px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="app" id="app">

    <header class="card header">
      <div class="header-left">
        <div class="logo">🎯</div>
        <div>

      <p class="lead"><b>In short:</b> Among all legal landing spots in the opponent's half, find the one that is <b>hardest for the opponent to reach</b>. <b>Singles</b> additionally deducts the cost of "can I recover to the centre after my shot"; <b>doubles</b> only considers opponent difficulty. Opponents may be stationary or have an initial velocity.</p>

      <h3>1. Court and coordinate system</h3>

      <p>A and B handles are independent. Drag the blue handle: inside the deadzone velocity is 0; outside it an arrow appears. Speed curve is slow-first / fast-later (finer at low speed), capped at 6 m/s.</p>

      <h3>4. Startup correction (smooth)</h3>

      <p>The sigmoid makes k take its mid value at projection distance 0, blending smoothly to 0.7 / 1.8. k = 1 when v = 0.</p>

        <li>Weighted running distance × startup correction</li>
        <li>× body-shot bonus (×1.6 when distance to opponent &lt; 0.45 m)</li>

      <p>The boundary where "difficulty to A equals difficulty to B" is traced numerically with marching squares. Gap points = on each side of the perpendicular, take the point that maximises <code>min(difficulty A, difficulty B)</code>. The line is not drawn when players are &lt; 1.0 m apart.</p>

      let lang = 'zh';

      const L = 13.40;

          { x: b.xMin, y: b.yMax },
