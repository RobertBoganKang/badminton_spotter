<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>羽毛球场站位点</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦵</text></svg>">
  <style>
    :root {
      --bg: #eef2f6;
      --card: #fff;
      --text: #1a2b22;
      --text-2: #5b6b62;
      --text-3: #8a9a91;
      --border: #e4ebe6;
      --shadow: 0 1px 2px rgba(20, 50, 35, .04), 0 8px 24px rgba(20, 50, 35, .05);
      --primary: #166b46;
      --primary-2: #1f8a5b;
      --primary-bright: #22a06b;
      --seg-clear: 45, 90, 200;
      --seg-drop: 40, 170, 80;
      --seg-kill: 192, 57, 43;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px 12px;
      background: radial-gradient(1000px 500px at 15% -5%, #d9ece1 0%, transparent 55%),
        radial-gradient(800px 400px at 90% 0%, #e3e9f7 0%, transparent 50%), var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .header {
      padding: 14px 18px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: nowrap;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(31, 138, 91, .10) 0%, transparent 65%);
      pointer-events: none;
    }

    .header-left {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      flex: 1;
      min-width: 0;
      position: relative;
    }

    .header-left>div:not(.logo) {
      min-width: 0;
      flex: 1;
    }

    .logo {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-bright), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      box-shadow: 0 4px 12px rgba(22, 107, 70, .28), inset 0 1px 0 rgba(255, 255, 255, .2);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: .2px;
      line-height: 1.35;
    }

    .header p {
      margin: 0;
      font-size: 11.5px;
      color: var(--text-3);
      line-height: 1.55;
      word-break: break-word;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      position: relative;
    }

    .lang-btn {
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 7px;
      background: transparent;
      border: none;
      border-radius: 5px;
      color: var(--text-3);
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1;
      letter-spacing: .3px;
      opacity: .85;
      transition: color .15s, opacity .15s, transform .12s;
    }

    .lang-btn:hover {
      color: var(--primary);
      opacity: 1;
    }

    .lang-btn:active {
      transform: scale(.92);
    }

    .app.collapsed .header {
      display: none;
    }

    .canvas-card {
      padding: 0;
      overflow: hidden;
    }

    .canvas-topbar {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      padding: 9px 12px;
      border-bottom: 1px solid #f0f4f1;
      font-size: 11.5px;
      color: var(--text-2);
    }

    .sidebar-btn {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f0f5f2;
      border: 1px solid var(--border);
      color: var(--text-2);
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      transition: background .15s, color .15s, transform .12s;
    }

    .sidebar-btn:hover {
      background: #e6efe9;
      color: var(--primary);
    }

    .sidebar-btn:active {
      transform: scale(.92);
    }

    .sidebar-btn svg {
      width: 13px;
      height: 13px;
      stroke-width: 2.4;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
    }

    .collapse-btn {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      padding: 0;
      opacity: .75;
      transition: color .15s, transform .12s, opacity .15s;
      font-family: inherit;
    }

    .collapse-btn:hover {
      color: var(--primary);
      opacity: 1;
    }

    .collapse-btn:active {
      transform: scale(.9);
    }

    .collapse-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .collapse-btn .chev-down {
      display: none;
    }

    .app.collapsed .collapse-btn .chev-up {
      display: none;
    }

    .app.collapsed .collapse-btn .chev-down {
      display: inline;
    }

    .mode-toggle {
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 13px;
      background: #e8eee9;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      font-family: inherit;
      line-height: 1;
      letter-spacing: .3px;
      min-width: 46px;
      transition: background .15s, color .15s, transform .12s;
    }

    .mode-toggle:hover {
      background: #dde6e0;
    }

    .mode-toggle:active {
      transform: scale(.96);
    }

    .mode-toggle[data-mode="single"] {
      background: #e8f0f7;
      color: #1e6bb8;
    }

    .mode-toggle[data-mode="single"]:hover {
      background: #dbe7f3;
    }

    .tb-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: 0;
    }

    .pill-group {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .2px;
      border: 1px solid transparent;
      white-space: nowrap;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      cursor: ns-resize;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .pill:active {
      transform: scale(.96);
    }

    .pill-height {
      background: rgba(31, 111, 139, .12);
      border-color: rgba(31, 111, 139, .28);
      color: #1f6f8b;
    }

    .pill-score {
      background: rgba(108, 60, 225, .12);
      border-color: rgba(108, 60, 225, .28);
      color: #6c3ce1;
    }

    .pill-score[hidden] {
      display: none !important;
    }

    .seg-group {
      display: inline-flex;
      align-items: stretch;
      flex-shrink: 0;
      border-radius: 999px;
    }

    .seg {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 9px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .2px;
      border: 1px solid transparent;
      white-space: nowrap;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      cursor: ns-resize;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      margin-left: -1px;
      transition: filter .15s;
    }

    .seg:first-child {
      margin-left: 0;
    }

    .seg:hover {
      z-index: 1;
      filter: brightness(.96);
    }

    .seg:active {
      filter: brightness(.92);
    }

    .seg-clear {
      border-radius: 999px 0 0 999px;
      background: rgba(var(--seg-clear), .12);
      border-color: rgba(var(--seg-clear), .28);
      color: rgb(var(--seg-clear));
    }

    .seg-drop {
      border-radius: 0;
      background: rgba(var(--seg-drop), .12);
      border-color: rgba(var(--seg-drop), .28);
      color: rgb(var(--seg-drop));
    }

    .seg-kill {
      border-radius: 0 999px 999px 0;
      background: rgba(var(--seg-kill), .12);
      border-color: rgba(var(--seg-kill), .28);
      color: rgb(var(--seg-kill));
    }

    .canvas-wrap {
      padding: 9px 10px 8px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 8px;
    }

    canvas {
      display: block;
      border-radius: 10px;
      touch-action: none;
      background: #f7fbf9;
      max-width: 100%;
      box-shadow: 0 1px 3px rgba(20, 50, 35, .06), 0 4px 14px rgba(20, 50, 35, .05);
    }

    #sideCanvas {
      flex: 0 0 auto;
      touch-action: none;
    }

    .info-line {
      padding: 0 12px 10px;
      font-size: 11px;
      color: var(--text-3);
      text-align: center;
      line-height: 1.6;
      font-variant-numeric: tabular-nums;
    }

    .info-line b {
      color: var(--text-2);
      font-weight: 600;
    }

    .footer {
      padding: 2px 8px 6px;
      text-align: center;
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: .3px;
      line-height: 1.7;
    }

    .footer b {
      color: var(--text-2);
      font-weight: 600;
    }

    #credit {
      cursor: pointer;
      user-select: none;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(330px, 88vw);
      background: #fff;
      z-index: 60;
      transform: translateX(-103%);
      transition: transform .26s cubic-bezier(.4, 0, .2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 26px rgba(20, 50, 35, .14);
    }

    .sidebar.open {
      transform: none;
    }

    .sidebar-mask {
      position: fixed;
      inset: 0;
      background: rgba(10, 30, 20, .40);
      opacity: 0;
      pointer-events: none;
      transition: opacity .26s;
      z-index: 59;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
    }

    .sidebar-mask.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      flex-shrink: 0;
    }

    .sidebar-head h2 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .sidebar-close {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
      font-family: inherit;
    }

    .sidebar-close:active {
      transform: scale(.9);
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      user-select: none;
      -webkit-user-select: none;
    }

    .sidebar-foot {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-foot button {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f5f9f6;
      color: var(--text-2);
      font-family: inherit;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background .15s;
    }

    .sidebar-foot button:hover {
      background: #eaf2ed;
    }

    .sidebar-foot button:active {
      transform: scale(.98);
    }

    .s-group {
      padding: 9px 14px 10px;
      border-bottom: 1px solid #f0f4f1;
    }

    .s-group:last-child {
      border-bottom: none;
    }

    .s-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }

    .s-title span {
      font-weight: 500;
      color: var(--text-3);
      font-size: 9.5px;
      text-align: right;
    }

    .s-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .s-item {
      display: grid;
      grid-template-columns: 74px 1fr 46px;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: var(--text-2);
      min-width: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .s-item.dual {
      grid-template-columns: 76px 1fr 58px;
    }

    .s-item span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .s-item b {
      font-weight: 700;
      color: var(--primary);
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
    }

    .s-item.dual b {
      font-size: 10px;
    }

    .s-item input[type=range] {
      width: 100%;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
      margin: 0;
      outline: none;
    }

    .s-item input[type=range]:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .r2 {
      position: relative;
      height: 20px;
      width: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    .r2-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 4px;
      margin-top: -2px;
      border-radius: 2px;
      background: #e4ebe6;
    }

    .r2-fill {
      position: absolute;
      top: 50%;
      height: 4px;
      margin-top: -2px;
      border-radius: 2px;
      background: var(--primary);
      opacity: .45;
    }

    .r2-thumb {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--primary);
      box-shadow: 0 1px 3px rgba(20, 50, 35, .25);
      cursor: grab;
      touch-action: none;
      transition: background .12s;
    }

    .r2-thumb:active {
      cursor: grabbing;
      background: #e6f2ec;
    }

    .s-curve {
      margin-top: 8px;
      padding: 6px 0 2px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .s-curve canvas {
      width: 100%;
      height: 64px;
      border-radius: 6px;
      background: #f7fbf9;
      border: 1px solid var(--border);
      display: block;
      box-shadow: none;
    }

    .s-curve-caption {
      font-size: 9.5px;
      color: var(--text-3);
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: .2px;
      line-height: 1.5;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(10, 30, 20, .46);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 26px 14px;
      overflow: auto;
      backdrop-filter: blur(2px);
      -webkit-overflow-scrolling: touch;
    }

    .modal-mask.open {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 660px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
      overflow: hidden;
      animation: pop .22s ease;
    }

    @keyframes pop {
      from {
        transform: translateY(14px);
        opacity: .6;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    .modal-close {
      background: transparent !important;
      box-shadow: none !important;
      color: #fff;
      font-size: 24px;
      line-height: 1;
      padding: 0 6px;
      border: none;
      cursor: pointer;
    }

    .modal-body {
      padding: 18px 22px 24px;
      font-size: 14px;
      line-height: 1.78;
      color: var(--text);
      max-height: 76vh;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-body h3 {
      font-size: 15px;
      margin: 22px 0 8px;
      color: var(--primary);
      font-weight: 650;
      padding-bottom: 4px;
      border-bottom: 1px solid #e8f0ec;
    }

    .modal-body h3:first-child {
      margin-top: 0;
      border-top: none;
    }

    .modal-body p {
      margin: 6px 0;
    }

    .modal-body .lead {
      color: var(--text);
      font-size: 13.5px;
      background: #f2f7f4;
      padding: 10px 13px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 3px solid var(--primary);
    }

    .formula {
      background: #f2f7f4;
      border-left: 3px solid var(--primary);
      padding: 8px 13px;
      border-radius: 6px;
      margin: 8px 0;
      font-family: "Cambria Math", "Times New Roman", Georgia, serif;
      font-size: 14px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .modal-body code {
      background: #eef2f6;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 12.5px;
    }

    .modal-body ul,
    .modal-body ol {
      margin: 6px 0;
      padding-left: 22px;
    }

    .modal-body li {
      margin: 4px 0;
    }

    @media (max-width: 520px) {
      body {
        padding: 10px 8px;
      }

      .app {
        gap: 10px;
      }

      .header {
        padding: 11px 13px;
        gap: 10px;
      }

      .logo {
        width: 36px;
        height: 36px;
        font-size: 18px;
        border-radius: 10px;
      }

      h1 {
        font-size: 14.5px;
      }

      .header p {
        font-size: 10.5px;
        line-height: 1.45;
      }

      .lang-btn {
        padding: 2px 5px;
        font-size: 11px;
      }

      .canvas-topbar {
        padding: 8px 10px;
        gap: 5px;
        font-size: 11px;
      }

      .mode-toggle {
        padding: 4px 11px;
        font-size: 11.5px;
        min-width: 42px;
      }

      .pill {
        font-size: 10px;
        padding: 1px 7px;
      }

      .seg {
        font-size: 10px;
        padding: 1px 7px;
      }

      .tb-right {
        gap: 5px;
      }

      .sidebar-btn {
        width: 24px;
        height: 24px;
      }

      .collapse-btn {
        width: 20px;
        height: 20px;
      }

      .collapse-btn svg {
        width: 12px;
        height: 12px;
      }

      .canvas-wrap {
        padding: 7px 6px 6px;
        gap: 6px;
      }

      .info-line {
        font-size: 10px;
        padding: 0 10px 8px;
      }

      .footer {
        font-size: 11px;
      }

      .modal-mask {
        padding: 8px 6px;
      }

      .modal {
        border-radius: 13px;
      }

      .modal-head {
        padding: 12px 16px;
      }

      .modal-head h2 {
        font-size: 15px;
      }

      .modal-body {
        padding: 14px 16px 20px;
        font-size: 13.5px;
        line-height: 1.72;
        max-height: 84vh;
      }

      .modal-body h3 {
        font-size: 14px;
        margin: 18px 0 6px;
      }
    }
  </style>
</head>

<body>

  <div class="app" id="app">
    <header class="card header">
      <div class="header-left">
        <div class="logo">🦵</div>
        <div>
          <h1 id="pageTitle">羽毛球场站位点</h1>
          <p id="pageSub"></p>
        </div>
      </div>
      <div class="header-actions">
        <button id="langBtn" class="lang-btn" aria-label="Switch language">EN</button>
      </div>
    </header>

    <div class="card canvas-card">
      <div class="canvas-topbar">
        <button class="sidebar-btn" id="sidebarBtn" aria-label="参数">
          <svg viewBox="0 0 24 24">
            <line x1="4" y1="7" x2="20" y2="7" />

      <p class="lead"><b>一句话：</b>用物理模拟生成所有可能的杀/高/吊落点（含多初速度与过滤），按概率加权，求让<b>期望净得分 V 最大</b>的站位。目标是最小化总体失球率。</p>

      <h3>一、坐标系与真实物理</h3>
      <ul>
        <li>场地长 <code>13.40 m</code>、宽 <code>6.10 m</code>，球网位于 <code>y = 0</code>；我方 <code>y &lt; 0</code>，对手 <code>y &gt; 0</code></li>
        <li>阻力系数随速度变化：<code>CD(v) = 0.50 + 0.30/(1+(v/8)²)</code>。低速（&lt;10 m/s）约 0.65–0.80，高速（&gt;40 m/s）约 0.50–0.55。</li>
      </ul>

      <h3>二、三种球路的生成（两端等角切分 + 多初速度扫描）</h3>
      <p><b>落点方向由目标线上的等距采样点决定</b>：把参考线两端各向外延伸 1 m 得到一条扩展线段，在这条线段上<b>等距离取 N+1 个采样点</b>；从击球点分别连向每个采样点，就得到 N+1 条扫描方位角——中间角度疏、两侧角度密，更贴近“瞄点”直觉，而 1 m 的外延仍保证边线附近有足够可选角度；仰角在该方位角下扫描，找出物理可行的弹道。<b>所有方位角等权</b>，落点再按距离核（落点深浅偏好）与初速度权重加权。</p>
      <p><b>杀球</b>：瞄<b>控高线</b>。「杀球最大初速度」滑块（默认 60 m/s）代表个人能打出的<b>最大</b>球速；实际生成时在 <code>0.55×～1.00×（最大值 × 高度因子）</code> 之间做多档速度扫描（快模式 4 档 / 完整模式 6 档），速度权重 <code>0.20 + 0.80·u²</code> 向高速端倾斜。仰角只扫「球拍→球网上沿连线角」到 +10° 这一段，始终平射或向下，略微向上不超过 10°。</p>
      <p><b>吊球</b>：瞄<b>球网线</b>，初速度在「吊球初速度」区间内多档扫描，接近上限的权重按 <code>exp(−2.5·u²)</code> 衰减；仰角 <b>−80°~+88° 全扫</b>并用几何预筛分段（保留近网陡压与向上挑吊）。</p>
      <p><b>高球</b>：瞄<b>控高线</b>，目标是“<b>最快到达控高参考线</b>”。初速度在「高球初速度」区间内几何扫描（粗筛 + 几何插值加密），仰角 −10~60° 扫描，直接模拟到真实落地：</p>
      <ul>
        <li>过网高度必须 ≥ <code>高球过网最低</code>（默认 2.7 m）——<b>只限下限，不限上限</b></li>
        <li>落点必须 ≤ <code>−控高参考线</code>（默认 −4.0 m），未到底线丢弃</li>
        <li>落点必须在场地内（y ∈ (−6.7, 0)，|x| ≤ 半场宽）</li>
        <li>如果一轮扫描没有任何合格路径，整体提高初速度（×1.12）重试，最多 6 轮</li>
      </ul>
      <p>初速度权重按温和钟形（mid 在 55% 处），落点分布是真实落点；信息栏显示“高最快”= 所有合格路径中的最短落地时间。得分系数随落点深度增加（3 m→0.45，6 m→0.70），深的高球更难接。</p>
      <p><b>截击轨迹</b>：每条最终落点都会在<b>我方半场、z ∈ [z_min, z_max]</b> 高度区间（默认 0.1 ~ 2.5 m，可在参数面板调整）内按仿真步长采样截击点（快模式每 125 ms 一个点，完整模式每 50 ms 一个点），供下一步求最优截击时刻。</p>

      <h3>三、可达概率（最优截击点 + 真实反应曲线 + 方向速度 + 触及半径）</h3>
      <div class="formula">p(t<sub>avail</sub>) = 0.92 · σ( k · (t<sub>avail</sub> − t<sub>mid</sub>) )</div>
      <p>反应曲线由「下限」与「上限」两个参数标定：下限 <code>t₀</code> 处 p≈2%（纯反应时），上限 <code>t₁</code> 处 p≈88%（充分反应 + 一步 + 出手），上限 92%（判断/技术/回球质量损耗）。<b>A、B 两名球员各自拥有一条独立的反应曲线、独立的触及半径与独立的跑动速度</b>，在同一个曲线图里用绿色（A）与红色（B）同时画出；参数完全相同时自动合并为一条并标注“A/B”。</p>
      <p><b>最优截击点</b>：不再假设只能在落地点接球。对每条轨迹，<b>从后往前</b>遍历所有可接高度的点（<code>z ∈ [z_min, z_max]</code>，默认 0.1~2.5 m，可调），求 <code>t<sub>avail</sub> = t_point − runTime(pos, point)</code> 的最大值——球员可以选择“提前在空中截击”或“等到落地”，取最有利的时机。由于轨迹按时间递增，遍历时一旦发现当前点的 <code>t_point ≤ bestT<sub>avail</sub></code> 就直接提前终止（后续点 t 只会更小，不可能更优）。</p>
      <p><b>方向速度分离</b>：上网 <code>1.15 × v_run</code>、横向 <code>0.95 × v_run</code>、后退 <code>v_run / k₂</code>；合成 <code>t<sub>run</sub> = d<sub>touch</sub> / v<sub>eff</sub></code>。双打中 A、B 各用自己的跑动速度，站位大小与“快/慢”标签随之变化。</p>
      <p><b>触及半径随球种缩放</b>：杀球 ×0.72（贴地，半径最小）、吊球 ×0.95（下落慢 + 0.08 s 缓冲）、高球 ×1.0。</p>
      <p>双打联合接球率：<code>reach = 1 − (1−p₁)(1−p₂)</code>。</p>

      <h3>四、期望净得分与优化器</h3>
      <div class="formula">V(站位) = Σ<sub>L</sub> w(L) · [reach(L) · c(L) − (1 − reach(L))] / Σ w(L)</div>
      <p><b>单打</b>：网格 + 局部精修（使用 A 的跑动速度与反应曲线）。<b>双打</b>：全枚举所有位置对（粗网格 → 局部精修），A 用 A 的参数、B 用 B 的参数，过近惩罚：两人距离 &lt; 2 m 时按二次曲线惩罚。</p>

      <h3>五、优劣评分（1–1000）</h3>
      <p>求解器把搜索到的<b>所有</b>候选站位（单打的全部网格点 / 双打的全部位置对）按期望净得分 V 从高到低排序，再<b>非等距采样 1000 个</b>作为展示序列——<b>优的一端更密集，劣的一端更稀疏</b>。<b>1000 分 = 最优站位</b>，<b>1 分 = 采样序列中最差的位置</b>。顶部「优劣」胶囊上下拖动即可在候选之间切换。<b>“优劣”胶囊只在热力图开启时显示</b>（双击场地开关热力图）。<b>拖动球员或双击「优劣」胶囊会自动恢复到 1000（最优站位）。</b></p>

      <h3>五之二、次优解点云（新）</h3>
      <p>默认叠加显示在球场上的是<b>次优解点云</b>：把「候选列表」中排名靠前的 N 个站位（单打 1 个点/候选，双打 2 个点/候选）全部画成紫色半透明小圆点，点越密集的区域说明该位置的候选越多、越集中。参数面板「次优解」组里的「前 N 个候选」滑块控制 N 的大小（默认 100，范围 1–1000）。<b>双击场地</b>可在「点云」与「落点热力图」之间切换：双击后点云消失，只留下原来的落点热力图（以及原先热力图开启时才会出现的「优劣」胶囊）。</p>

      <h3>六、信息栏诊断</h3>
      <p>信息栏显示当前站位下<b>杀接 / 高接 / 吊接</b>三类球的实际平均 reach（已含空中截击），以及高球最快落地时间（“高最快”）。如果看到杀接 0% 或两人都挤到前场，检查吊球初速度上限、控高参考线是否太远，或反应曲线是否被拖宽。</p>

      <h3>七、热力图与侧视图</h3>
      <p>落点用距离核 × 初速度/高度权加权，做高斯 KDE。<b style="color:#c0392b">红=杀</b>、<b style="color:#2d5ac8">蓝=高</b>、<b style="color:#28aa50">绿=吊</b>。双击场地开关。右侧侧视图把同一批轨迹按高度-场地长度投到剖面中，同样分红/蓝/绿三类，与主视图联动开关。</p>

      <h3>八、交互与局限</h3>
      <ul>
        <li><b>拖动对手点</b> → 调整击球位置（自动恢复优劣 1000）</li>
        <li><b>拖动“击球高”胶囊</b> → 调整击球高度（影响杀球速度、高球可用角度）</li>
        <li><b>拖动概率胶囊</b> → 调整杀/吊/高概率</li>
        <li><b>拖动“优劣”胶囊</b>（仅热力图开启时可见）→ 在 1–1000 名候选站位间切换</li>
        <li><b>双击“优劣”胶囊</b> → 恢复到最大值 1000（最优站位）</li>
        <li><b>双击场地空白</b> → 在「次优解点云 / 落点热力图」之间切换</li>
        <li><b>参数面板</b> → 初速度、控高参考线、高球过网最低、可接高度范围、反应曲线、A/B 跑速与触及半径、过滤、次优解点云范围</li>
        <li>站位是概率意义上的最优，不是绝对最优；双打用独立 OR 合并，未建模让球/分工</li>
        <li>截击只建模了“水平跑动 + 高度可选”，未建模跳跃/弯腰的速度差异</li>
      </ul>
    `

      <p class="lead"><b>In short:</b> Simulate all possible smash/clear/drop landings (with multi initial-speed and filters), weight by probability, and find the position maximising the <b>expected net score V</b>.</p>
      <h3>1. Coordinates &amp; real physics</h3>
      <ul>
        <li>Court 13.40 × 6.10 m; net at <code>y=0</code>; we <code>y&lt;0</code>, opponent <code>y&gt;0</code></li>
        <li>Speed-dependent drag: <code>CD(v)=0.50+0.30/(1+(v/8)²)</code>. Low speed ≈0.65–0.80, high speed ≈0.50–0.55.</li>
      </ul>
      <h3>2. Shot generation (equal-angle split between the two endpoints + multi initial speed)</h3>
      <p><b>Aim direction comes from equally spaced sample points on the target line</b>: extend the reference line 1 m past each sideline, then place <b>N+1 equally spaced points</b> along that segment; the ray from the contact point to each sample point gives one scanning azimuth — denser near the sidelines, sparser in the middle, which matches a “point-aiming” intuition, while the 1 m overhang still covers edge angles. Elevation is swept at each azimuth to find physically feasible trajectories. <b>All azimuths are equally weighted</b>; landings are then weighted by the distance kernel × initial-speed weight.</p>
      <p><b>Smash</b>: aims at the <b>baseline reference line</b>. The “smash initial speed max” slider (default 60 m/s) is the player's <b>maximum</b> shuttle speed; generation scans <code>0.55×–1.00× (max × height factor)</code> in multiple steps (4 fast / 6 full) with speed weight <code>0.20 + 0.80·u²</code> biased toward the fast end. Elevation is only swept from the racket→net-top line up to +10°.</p>
      <p><b>Drop</b>: aims at the <b>net line</b>, multi initial-speed scan inside the “drop initial speed” range with high-end weighted by <code>exp(−2.5·u²)</code>; elevation swept <b>−80°~+88°</b> (full range, segmented by geometric pre-screening).</p>
      <p><b>Clear</b>: aims at the <b>baseline reference line</b>, goal is <b>fastest arrival at that line</b>. Initial speed scanned geometrically inside the “clear initial speed” range (coarse + geometric interpolation), elevation −10~60°, simulated to real landing:</p>
      <ul>
        <li>Crossing height at net must be ≥ <code>clear net min H</code> (default 2.7 m) — <b>lower bound only, no upper bound</b></li>

      <h3>3. Reach probability (best intercept point + realistic reaction + directional speed + touch radius)</h3>
      <div class="formula">p(t<sub>avail</sub>) = 0.92 · σ( k · (t<sub>avail</sub> − t<sub>mid</sub>) )</div>
      <p>The reaction curve is calibrated by a <b>lower bound</b> <code>t₀</code> (p≈2%) and an <b>upper bound</b> <code>t₁</code> (p≈88%), cap 92%. <b>A and B each own an independent reaction curve, touch radius and run speed</b>; both curves are drawn in the same chart, green = A, red = B. When all parameters are identical they merge into a single “A/B” curve.</p>
      <p><b>Best intercept point</b>: the model traverses the trajectory <b>back to front</b> over all reachable-height points (<code>z ∈ [z_min, z_max]</code>) and takes the maximum of <code>t<sub>avail</sub> = t_point − runTime(pos, point)</code>. The loop breaks as soon as <code>t_point ≤ bestT<sub>avail</sub></code>.</p>
      <p><b>Directional speed</b>: forward <code>1.15×v_run</code>, sideways <code>0.95×v_run</code>, backward <code>v_run/k₂</code>. In doubles <b>A and B each use their own parameters</b>.</p>

      <h3>5. Rank score (1–1000)</h3>

      <h3>5b. Sub-optimal cloud (new)</h3>

          const n = trace.length >> 1;
          if (!n) continue;
          const wPer = Ld.w / n;
          const g = grids[Ld.type];

          for (let k = 0; k < n; k++) {
            const py = trace[k * 2];
            const pz = trace[k * 2 + 1];
            if (pz < 0 || pz > sideZMax) continue;

            const ci = (py - Y0) / cell;
            const cj = (pz - Z0) / cell;
            const i0 = Math.max(0, Math.floor(ci) - R);
            const i1 = Math.min(GY - 1, Math.ceil(ci) + R);
            const j0 = Math.max(0, Math.floor(cj) - R);
            const j1 = Math.min(GZ - 1, Math.ceil(cj) + R);
            for (let j = j0; j <= j1; j++) {

              const dz2 = dz * dz;
              const rowBase = j * GY;
              for (let i = i0; i <= i1; i++) {

                g[rowBase + i] += wPer * Math.exp(-(dy * dy + dz2) * inv2s2);

            else { jA = j0raw; jB = j0raw + 1; tY = fz - j0raw; }

            const r0 = jA * GY, r1 = jB * GY;
            const w00 = (1 - tX) * (1 - tY), w10 = tX * (1 - tY);
            const w01 = (1 - tX) * tY, w11 = tX * tY;
            const i00 = r0 + iA, i10 = r0 + iB, i01 = r1 + iA, i11 = r1 + iB;

            const s = smash[i00] * w00 + smash[i10] * w10 + smash[i01] * w01 + smash[i11] * w11;
            const c = clear[i00] * w00 + clear[i10] * w10 + clear[i01] * w01 + clear[i11] * w11;
            const d = drop[i00] * w00 + drop[i10] * w10 + drop[i01] * w01 + drop[i11] * w11;

            const sum = s + c + d;
            const o = (py * W + px) * 4;
            if (sum < maxV * HEAT_CUT) continue;

            const norm = Math.min(1, Math.sqrt(sum * invMax));
            const inv = 1 / sum;
            data[o] = (s * SHOT_COLOR.smash[0] + c * SHOT_COLOR.clear[0] + d * SHOT_COLOR.drop[0]) * inv;
            data[o + 1] = (s * SHOT_COLOR.smash[1] + c * SHOT_COLOR.clear[1] + d * SHOT_COLOR.drop[1]) * inv;
            data[o + 2] = (s * SHOT_COLOR.smash[2] + c * SHOT_COLOR.clear[2] + d * SHOT_COLOR.drop[2]) * inv;
            data[o + 3] = Math.min(230, norm * 220);
          }
        }

        sideHeatCtx.putImageData(img, 0, 0);
        sideHeatReady = true;
      }

      /* 身高 = 头顶高度；头圆心 = 头顶 − 头半径 */
      function drawSidePerson(y, color, heightM) {
        const sy = sideCourtTop + (HL - y) * sideScaleY;
        const fullLen = Math.max(10, heightM * sideScaleZ);

        const headR = clamp(fullLen * 0.13, 2.5, SIDE_HEAD_R);
        const bodyLen = Math.max(2, fullLen - headR * 2);
        const headX = sideGroundX + bodyLen + headR;   // 圆心
        // 头顶 = headX + headR = sideGroundX + fullLen

        sctx.strokeStyle = color;
        sctx.lineWidth = SIDE_BODY_LW;
        sctx.lineCap = 'round';
        sctx.beginPath();
        sctx.moveTo(sideGroundX, sy);
        sctx.lineTo(sideGroundX + bodyLen, sy);
        sctx.stroke();
        sctx.lineCap = 'butt';

        sctx.beginPath();
        sctx.fillStyle = color;
        sctx.arc(headX, sy, headR, 0, Math.PI * 2);
        sctx.fill();
        sctx.strokeStyle = 'rgba(255,255,255,.9)';
        sctx.lineWidth = 1.0;
        sctx.stroke();
      }

      function drawRacketContact() {
        const sy = sideCourtTop + (HL - opponents[0].y) * sideScaleY;
        const hx = sideGroundX + PRM.hh * sideScaleZ;

        const fullLen = Math.max(10, personHeights[0] * sideScaleZ);
        const headRight = sideGroundX + fullLen;

        sctx.save();
        sctx.strokeStyle = 'rgba(31,111,139,0.35)';
        sctx.lineWidth = 1;
        sctx.setLineDash([2, 3]);
        sctx.beginPath();
        sctx.moveTo(sideGroundX + 2, sy);
        sctx.lineTo(hx, sy);
        sctx.stroke();
        sctx.restore();

        const rx = 11.0, ry = 7.0;
        const fromX = headRight + 1;
        const toX = Math.max(fromX, hx - rx);
        if (toX > fromX) {
          sctx.strokeStyle = '#111';
          sctx.lineWidth = 1.8;
          sctx.lineCap = 'round';
          sctx.beginPath();
          sctx.moveTo(fromX, sy);
          sctx.lineTo(toX, sy);
          sctx.stroke();
          sctx.lineCap = 'butt';
        }

        sctx.beginPath();
        sctx.ellipse(hx, sy, rx, ry, 0, 0, Math.PI * 2);
        sctx.fillStyle = '#ffffff';
        sctx.fill();
        sctx.strokeStyle = '#111';
        sctx.lineWidth = 1.6;
        sctx.stroke();

        sctx.beginPath();
        sctx.fillStyle = '#111';
        sctx.arc(hx, sy, 2.2, 0, Math.PI * 2);
        sctx.fill();
        sctx.strokeStyle = '#fff';
        sctx.lineWidth = 0.9;
        sctx.stroke();

        const label = lang === 'zh' ? '击球点' : 'Contact';
        const hLabel = PRM.hh.toFixed(1) + ' m';
        sctx.font = 'bold 8px system-ui';
        const tw1 = sctx.measureText(label).width;
        sctx.font = '7px system-ui';
        const tw2 = sctx.measureText(hLabel).width;
        const tw = Math.max(tw1, tw2);

        let lx = hx + rx + 3;
        if (lx + tw > sideW - 1) lx = Math.max(1, sideW - 1 - tw);

        let ly = sy - ry - 8;
        if (ly - 4 < 2) ly = sy + ry + 8;

        sctx.textAlign = 'left';
        sctx.textBaseline = 'middle';
        sctx.lineWidth = 2.6;
        sctx.strokeStyle = '#fff';

        sctx.font = 'bold 8px system-ui';
        sctx.strokeText(label, lx, ly - 4);
        sctx.fillStyle = '#111';
        sctx.fillText(label, lx, ly - 4);

        sctx.font = '7px system-ui';
        sctx.strokeText(hLabel, lx, ly + 5);
        sctx.fillStyle = '#111';
        sctx.fillText(hLabel, lx, ly + 5);
      }

      function drawSide() {
        if (!sideCanvas.width || !sideCanvas.height) return;

        if (SIDE_Z_MAX !== (showHeat ? SIDE_Z_MAX_HEAT : SIDE_Z_MAX_PLAIN)) {
          setup();
          heatDirty = true;
          sideHeatDirty = true;
          suboptDirty = true;
        }

        sctx.clearRect(0, 0, sideW, sideH);
        sctx.fillStyle = '#f7fbf9';
        sctx.fillRect(0, 0, sideW, sideH);

        if (showHeat && result.valid && cachedLandings.length) {
          if (sideHeatDirty && quality === 'full') {
            try { computeSideHeat(); } catch (e) { console.error('side heat error:', e); }
            sideHeatDirty = false;
          }
          if (sideHeatReady) {
            sctx.imageSmoothingEnabled = true;
            sctx.drawImage(sideHeatCanvas, 0, 0, sideW, sideH);
          }
        }

        const yTop = sideCourtTop - 2;
        const yBot = sideCourtTop + L * sideScaleY + 2;

        sctx.strokeStyle = C_COURT_FRAME;
        sctx.lineWidth = 2.4;
        sctx.lineCap = 'round';
        sctx.beginPath();
        sctx.moveTo(sideGroundX, yTop);
        sctx.lineTo(sideGroundX, yBot);
        sctx.stroke();
        sctx.lineCap = 'butt';

        const ticks = [HL, HL - LONG_SVC, SHORT_SVC, -SHORT_SVC, -(HL - LONG_SVC), -HL];
        for (const ty of ticks) {
          const sy = sideCourtTop + (HL - ty) * sideScaleY;
          const isEnd = Math.abs(Math.abs(ty) - HL) < 1e-6;
          sctx.fillStyle = isEnd ? C_COURT_FRAME : C_COURT_LINE;
          const tw = isEnd ? 6 : 4;
          const th = isEnd ? 2.6 : 1.8;
          sctx.fillRect(sideGroundX + 1, sy - th / 2, tw, th);
        }

        /* 网：butt 端点，长度严格 = NET_H × sideScaleZ */
        const netSy = sideCourtTop + HL * sideScaleY;
        const netLen = NET_H * sideScaleZ;
        sctx.strokeStyle = C_NET;
        sctx.lineWidth = 5;
        sctx.lineCap = 'butt';
        sctx.beginPath();
        sctx.moveTo(sideGroundX, netSy);
        sctx.lineTo(sideGroundX + netLen, netSy);
        sctx.stroke();
        sctx.lineCap = 'butt';

        const ourColor = result.precise ? C_PERSON : C_PERSON_PENDING;
        drawSidePerson(opponents[0].y, C_PERSON, personHeights[0]);

        if (result.valid) {
          if (result.P1) drawSidePerson(result.P1.y, ourColor, personHeights[1]);
          if (mode === 'double' && result.P2) drawSidePerson(result.P2.y, ourColor, personHeights[2]);
        }

        if (result.valid) drawRacketContact();
      }

      /* ============================================================
         五、主画布尺寸与布局
         ============================================================ */
      function setup() {
        SIDE_Z_MAX = showHeat ? SIDE_Z_MAX_HEAT : SIDE_Z_MAX_PLAIN;
        PAD_L = computePadL();
        LW = W * SCALE + PAD_L + PAD_R;
        LH = L * SCALE + PAD_T + PAD_B;

        const dpr = DPR;
        const wrap = canvas.parentElement, cs = getComputedStyle(wrap);
        const availTotal = wrap.clientWidth
          - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
        const maxH = Math.min(window.innerHeight * 0.75, 900);

        const K = SIDE_Z_MAX * SCALE / LW;
        const B = sideGroundX + 8;

        const cwByHeight = Math.min(LW, maxH * LW / LH);
        const cwByWidthZ = (availTotal - SIDE_GAP - B) / (1 + K);

        let cw = Math.min(LW, cwByHeight, cwByWidthZ);
        cw = Math.max(cw, 110);
        let ch = cw * LH / LW;

        let sideWc = availTotal - cw - SIDE_GAP;
        const sideNeed = B + K * cw;   // 侧视图实际绘制内容所需宽度
        if (sideWc > sideNeed) sideWc = sideNeed;
        sideWc = Math.max(120, sideWc);

        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        canvas.width = Math.round(cw * dpr);
        canvas.height = Math.round(ch * dpr);
        const s = canvas.width / LW;
        ctx.setTransform(s, 0, 0, s, 0, 0);

        mainScale = cw / LW;
        sideW = sideWc;
        sideH = ch;
        setupSide();
      }

      function setShowHeat(on) {
        on = !!on;
        if (showHeat === on) return;
        showHeat = on;
        SIDE_Z_MAX = on ? SIDE_Z_MAX_HEAT : SIDE_Z_MAX_PLAIN;
        setup();              // 重算主视图/侧视图布局与比例尺
        heatDirty = true;     // 主视图热力图需重算（画布尺寸变了）
        sideHeatDirty = true; // 侧视图热力图需重算
        suboptDirty = true;   // 次优解点云需重绘
      }

      setup();

      /* ============================================================
         六、物理与可达性
         ============================================================ */
      function touchScale(type) {
        if (type === 'smash') return 0.72;
        if (type === 'drop') return 0.95;
        return 1.0;
      }

      function reachParams(t0, t1in) {
        const t1 = Math.max(t1in, t0 + 0.05);
        const l0 = Math.log(REACH_P0 / (REACH_PMAX - REACH_P0));
        const l1 = Math.log(REACH_P1 / (REACH_PMAX - REACH_P1));
        const k = (l1 - l0) / (t1 - t0);
        const tMid = t0 - l0 / k;
        return { t0, t1, k, tMid };
      }

      function reachProb(tAvail, rp) {
        return REACH_PMAX / (1 + Math.exp(-rp.k * (tAvail - rp.tMid)));
      }

      function ctxOf(which) {
        const s = (which === 'b') ? 'b' : 'a';
        return {
          vRun: PRM['v_run_' + s],
          rTouch: PRM['r_touch_' + s],
          rp: reachParams(PRM['t_react_' + s], PRM['t_full_' + s])
        };
      }

      function ctxEqual(a, b) {
        return a.vRun === b.vRun && a.rTouch === b.rTouch &&
          Math.abs(a.rp.t0 - b.rp.t0) < 1e-9 && Math.abs(a.rp.t1 - b.rp.t1) < 1e-9;
      }

      function abDiffers() {
        return Math.abs(PRM.v_run_a - PRM.v_run_b) > 1e-9 ||
          Math.abs(PRM.r_touch_a - PRM.r_touch_b) > 1e-9 ||
          Math.abs(PRM.t_react_a - PRM.t_react_b) > 1e-9 ||
          Math.abs(PRM.t_full_a - PRM.t_full_b) > 1e-9;
      }

      function smoothRamp(v, lo, hi) {
        if (v <= lo) return 0;
        if (v >= hi) return 1;
        const u = (v - lo) / (hi - lo);
        return u * u * (3 - 2 * u);
      }

      function cValue(type, y) {
        const d = -y;
        if (type === 'smash') return 0.30 + 0.15 * (1 - smoothRamp(d, 1, 3));
        if (type === 'clear') {
          const depth = Math.max(0, Math.min(1, (d - 3.0) / 3.0));
          return 0.45 + 0.25 * depth;
        }
        return 0.30 + 0.20 * (1 - smoothRamp(d, 1, 3));
      }

      function landingKernel(type, y, oppDist) {
        const dn = -y;
        const baseCenter = type === 'smash' ? 5.8 : 2.8;
        const shiftK = type === 'drop' ? 0.8 : 0.5;
        const hShift = Math.max(0, Math.min(1.2, (HH_DEFAULT - PRM.hh) * 0.6));
        const center = Math.max(0.5, baseCenter - (4.6 - oppDist) * shiftK - hShift);
        const sigma = type === 'smash' ? 1.2 : 1.6;
        const u = (dn - center) / sigma;
        return Math.exp(-u * u);
      }

      function v0WeightDrop(v0) {
        const lo = PRM.v0_drop_lo;
        const hi = PRM.v0_drop_hi;
        if (hi <= lo) return v0 >= lo ? 1 : 0;
        const u = (v0 - lo) / (hi - lo);
        return Math.exp(-2.5 * u * u);
      }

      function runTime(pos, Lp, type, c) {
        const dx = Lp.x - pos.x;
        const dy = Lp.y - pos.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 1e-12) return 0;

        const rTouch = c.rTouch * touchScale(type);
        const dEff = Math.sqrt(d2);
        const dTouch = dEff - rTouch;
        if (dTouch <= 0) return 0;

        const vr = c.vRun;
        const invD = 1 / dEff;
        const ux = dx * invD;
        const uy = dy * invD;
        const vSide = vr * V_SIDE_K;
        const vBack = vr / Math.max(1.0, PRM.k2);
        const vy = (uy >= 0) ? vr * V_FWD_K : vBack;
        const kx = ux / vSide;
        const ky = uy / vy;
        return dTouch * Math.sqrt(kx * kx + ky * ky);
      }

      function interceptFallback(item, tau, c) {
        const extra = (item.type === 'drop' ? DROP_EXTRA_T : 0);
        const tInt = T_INTERCEPT[item.type] || 0;
        const tAvail = item.t - tau + tInt + extra;
        return { tAvail, p: reachProb(tAvail, c.rp), q: Math.exp(-LAMBDA_RUN * tau) };
      }

      function interceptStats(pos, item, c) {
        const type = item.type;
        const trace = item.trace;

        if (!trace || trace.length < 2) {
          return interceptFallback(item, runTime(pos, item.L, type, c), c);
        }

        const extra = (type === 'drop' ? DROP_EXTRA_T : 0);
        const rTouch = c.rTouch * touchScale(type);
        const vr = c.vRun;
        const vSide = vr * V_SIDE_K;
        const vFwd = vr * V_FWD_K;
        const vBack = vr / Math.max(1.0, PRM.k2);
        const invSide2 = 1 / (vSide * vSide);
        const invFwd2 = 1 / (vFwd * vFwd);
        const invBack2 = 1 / (vBack * vBack);

        const px = pos.x, py = pos.y;
        const n = trace.length;

        let bestAvail = -Infinity;
        let bestTau = 0;

        for (let i = n - 1; i >= 0; i--) {
          const pt = trace[i];
          if (pt.t <= bestAvail) break;

          const dx = pt.x - px;
          const dy = pt.y - py;
          const d2 = dx * dx + dy * dy;

          if (d2 < 1e-12) {
            if (pt.t > bestAvail) { bestAvail = pt.t; bestTau = 0; }
            continue;
          }

          const dEff = Math.sqrt(d2);
          const dTouch = dEff - rTouch;

          if (dTouch <= 0) {
            if (pt.t > bestAvail) { bestAvail = pt.t; bestTau = 0; }
            continue;
          }

          const invD = 1 / dEff;
          const ux = dx * invD;
          const uy = dy * invD;
          const invV2 = (uy >= 0) ? invFwd2 : invBack2;
          const tau = dTouch * Math.sqrt(ux * ux * invSide2 + uy * uy * invV2);
          const avail = pt.t - tau;

          if (avail > bestAvail) { bestAvail = avail; bestTau = tau; }
        }

        if (bestAvail === -Infinity) {
          return interceptFallback(item, runTime(pos, item.L, type, c), c);
        }

        const tAvail = bestAvail + extra;
        return { tAvail, p: reachProb(tAvail, c.rp), q: Math.exp(-LAMBDA_RUN * bestTau) };
      }

      function smashSpeedFactor() {
        return Math.max(0.3, Math.min(1.0, (PRM.hh - NET_H + 0.3) / 1.0));
      }

      function getProbs() {
        const smashF = Math.max(0, Math.min(1, (PRM.hh - NET_H) / 0.8));
        const clearF = Math.max(0, Math.min(1, (PRM.hh - 1.0) / 1.0));
        const ps = PRM.p_smash / 100 * smashF;
        const pc = PRM.p_clear / 100 * clearF;
        const pd = PRM.p_drop / 100;
        const total = ps + pc + pd || 1;
        return { ps: ps / total, pc: pc / total, pd: pd / total };
      }

      function simulate(v0, h0, elevDeg, azimDeg, x0, y0, opts) {
        opts = opts || {};
        const maxOverNet = opts.maxOverNet;
        const minNetH = opts.minNetH != null ? opts.minNetH : NET_H;
        const trace = opts.trace || null;
        const capture = opts.capture || null;
        const captureStep = opts.captureStep || CAPTURE_STEP;

        const elev = elevDeg * Math.PI / 180;
        const azim = azimDeg * Math.PI / 180;
        let px = x0, py = y0, pz = h0;
        let vx = v0 * Math.cos(elev) * Math.sin(azim);
        let vy = -v0 * Math.cos(elev) * Math.cos(azim);
        let vz = v0 * Math.sin(elev);
        let t = 0;
        const dt = AERO.dt;
        const dropLimit = (maxOverNet != null) ? NET_H + maxOverNet : Infinity;
        const zLo = Math.min(PRM.z_min, PRM.z_max);
        const zHi = Math.max(PRM.z_min, PRM.z_max);
        let crossedNet = false;
        let traceStepI = 0;
        let captureStepI = 0;

        while (t < AERO.tMax) {
          const sp = Math.sqrt(vx * vx + vy * vy + vz * vz);
          const km = AERO_K * cdOf(sp);
          vx += -km * sp * vx * dt;
          vy += -km * sp * vy * dt;
          vz += (-km * sp * vz - AERO.g) * dt;

          const nx = px + vx * dt;
          const ny = py + vy * dt;
          const nz = pz + vz * dt;

          if (py > 0 && ny <= 0) {
            const f = py / (py - ny);
            const zc = pz + (nz - pz) * f;
            if (zc < minNetH) return null;
            if (zc > dropLimit) return null;
            crossedNet = true;
          }
          if (crossedNet && nz > dropLimit) return null;

          if (nz <= 0) {
            const f = pz / (pz - nz);
            const rx = px + (nx - px) * f;
            const ry = py + (ny - py) * f;
            if (capture && ry < 0) {
              capture.push({ x: rx, y: ry, z: 0, t: t + f * dt });
            }
            return { x: rx, y: ry, t: t + f * dt };
          }

          if (capture && ny < 0 && nz >= zLo && nz <= zHi) {
            captureStepI++;
            if (captureStepI % captureStep === 0) {
              capture.push({ x: nx, y: ny, z: nz, t: t + dt });
            }
          }

          px = nx; py = ny; pz = nz;
          t += dt;

          if (trace) {
            traceStepI++;
            if (traceStepI % SIDE_TRACE_EVERY === 0) trace.push(ny, nz);
          }
        }
        return null;
      }

      /* ============================================================
         七、球路落点生成
         ============================================================ */

      function halfWidth() {
        return mode === 'single' ? SINGLES_HW : HW;
      }

      function targetAzims(hitter, hw, ty, n) {
        if (n <= 0) return [0];

        const xHalf = hw + TARGET_X_MARGIN;
        const dy = hitter.y - ty;
        const azims = new Array(n + 1);

        if (Math.abs(dy) < 1e-6) {
          for (let i = 0; i <= n; i++) azims[i] = 0;
          return azims;
        }

        for (let i = 0; i <= n; i++) {
          const px = -xHalf + (2 * xHalf) * i / n;
          azims[i] = Math.atan2(px - hitter.x, dy) * 180 / Math.PI;
        }
        return azims;
      }

      function probe(v0, hitter, elev, azim, hw, opts) {
        const r = simulate(v0, PRM.hh, elev, azim, hitter.x, hitter.y, opts || {});
        if (!r) return null;
        if (r.y >= 0 || r.y < -HL || Math.abs(r.x) > hw) return null;
        return r;
      }

      function coarseElevRanges(v0, hitter, hw, fast, opts, coarseMode, azims) {
        const step = coarseMode ? 2.0 : (fast ? 1.2 : 0.8);
        if (!azims || !azims.length) {
          azims = coarseMode ? [0] : (fast ? [0] : [-20, -10, 0, 10, 20]);
        }
        const ranges = [];
        let lo = null, last = null;

        for (let elev = ELEV_MIN; elev <= ELEV_MAX + 1e-9; elev += step) {
          let ok = false;
          for (const az of azims) {
            if (probe(v0, hitter, elev, az, hw, opts)) { ok = true; break; }
          }
          if (ok) {
            if (lo === null) lo = elev;
            last = elev;
          } else if (lo !== null) {
            ranges.push([Math.max(ELEV_MIN, lo - step), Math.min(ELEV_MAX, last + step)]);
            lo = null; last = null;
          }
        }
        if (lo !== null) {
          ranges.push([Math.max(ELEV_MIN, lo - step), Math.min(ELEV_MAX, last + step)]);
        }
        return ranges;
      }

      function smashV0Weight(u) {
        return 0.20 + 0.80 * u * u;
      }

      function genSmashLandings(hitter, fast) {
        const hw = halfWidth();
        const v0Max = PRM.v0_smash * smashSpeedFactor();
        const v0Min = v0Max * SMASH_V0_MIN_REL;
        const ty = -PRM.clearLineY;
        const azims = targetAzims(hitter, hw, ty, fast ? 10 : 20);

        const elevStep = fast ? 1.5 : 0.6;
        const nV = fast ? 4 : 6;

        const landings = new Map();
        let maxW = 0;

        for (const azim of azims) {
          const azimRad = azim * Math.PI / 180;
          const elevCrit = Math.atan2(
            (NET_H - PRM.hh) * Math.cos(azimRad),
            hitter.y
          ) * 180 / Math.PI;

          const elevLo = Math.max(ELEV_MIN, elevCrit);
          const elevHi = SMASH_ELEV_MAX_UP;
          if (elevLo > elevHi) continue;

          for (let k = 0; k < nV; k++) {
            const u = nV > 1 ? k / (nV - 1) : 1;
            const v0 = v0Min + (v0Max - v0Min) * u;
            const wV = smashV0Weight(u);

            for (let elev = elevLo; elev <= elevHi + 1e-9; elev += elevStep) {
              const r = probe(v0, hitter, elev, azim, hw, null);
              if (!r) continue;

              const w = wV * landingKernel('smash', r.y, hitter.y);
              if (w <= 1e-12) continue;
              if (w > maxW) maxW = w;

              const key = azim.toFixed(2) + '_' + elev.toFixed(2) + '_' + k;
              if (!landings.has(key)) {
                landings.set(key, { x: r.x, y: r.y, type: 'smash', w, t: r.t, v0, elev, azim });
              }
            }
          }
        }

        if (maxW <= 1e-9) return [];
        const th = maxW * W_MIN_REL;
        return Array.from(landings.values()).filter(Ld => Ld.w >= th);
      }

      function genDropLandings(hitter, fast) {
        const hw = halfWidth();
        const opts = { maxOverNet: PRM.dropMaxOverNet };
        const ty = 0;
        const azimList = targetAzims(hitter, hw, ty, fast ? 10 : 18);

        const nProbe = Math.min(fast ? 4 : 5, azimList.length);
        const azimProbe = [];
        for (let i = 0; i < nProbe; i++) {
          const idx = Math.round(i * (azimList.length - 1) / Math.max(1, nProbe - 1));
          azimProbe.push(azimList[idx]);
        }

        const vLo = PRM.v0_drop_lo;
        const vHi = Math.max(vLo + 1, PRM.v0_drop_hi);
        const nCoarse = fast ? 4 : 5;

        const validV0 = [];
        for (let k = 0; k < nCoarse; k++) {
          const v0 = vLo * Math.pow(vHi / vLo, k / (nCoarse - 1));
          const ranges = coarseElevRanges(v0, hitter, hw, fast, opts, true, azimProbe);
          if (ranges.length) validV0.push(v0);
        }
        if (!validV0.length) return [];

        const v0Final = [];
        for (let k = 0; k < validV0.length; k++) {
          v0Final.push(validV0[k]);
          if (k + 1 < validV0.length) v0Final.push(Math.sqrt(validV0[k] * validV0[k + 1]));
        }

        const elevStep = fast ? 0.8 : 0.30;

        const landings = new Map();
        let maxW = 0;

        for (const v0 of v0Final) {
          const vw = v0WeightDrop(v0);
          if (vw < 1e-6) continue;

          const ranges = coarseElevRanges(v0, hitter, hw, fast, opts, false, azimProbe);
          if (!ranges.length) continue;

          for (const [lo, hi] of ranges) {
            for (let elev = lo; elev <= hi + 1e-9; elev += elevStep) {
              for (let i = 0; i < azimList.length; i++) {
                const azim = azimList[i];
                const r = probe(v0, hitter, elev, azim, hw, opts);
                if (!r) continue;
                const w = vw * landingKernel('drop', r.y, hitter.y);
                if (w <= 1e-12) continue;
                if (w > maxW) maxW = w;
                const key = v0.toFixed(1) + '_' + azim.toFixed(2) + '_' + elev.toFixed(2);
                if (!landings.has(key)) {
                  landings.set(key, { x: r.x, y: r.y, type: 'drop', w, t: r.t, v0, elev, azim });
                }
              }
            }
          }
        }

        if (maxW <= 1e-9) return [];
        const th = maxW * W_MIN_REL;
        return Array.from(landings.values()).filter(Ld => Ld.w >= th);
      }

      function genClearLandings(hitter, fast) {
        const hw = halfWidth();
        const lineY = -PRM.clearLineY;
        const opts = { minNetH: PRM.clearHeight };
        const azimList = targetAzims(hitter, hw, lineY, fast ? 10 : 18);

        const elevLo = -10, elevHi = 60;
        const elevStep = fast ? 2.0 : 1.0;
        const nCoarse = fast ? 4 : 5;

        let vLo = PRM.v0_clear_lo;
        let vHi = Math.max(vLo + 1, PRM.v0_clear_hi);

        for (let attempt = 0; attempt < 6; attempt++) {
          const coarse = [];
          for (let k = 0; k < nCoarse; k++)
            coarse.push(vLo * Math.pow(vHi / vLo, k / (nCoarse - 1)));
          const v0s = [];
          for (let k = 0; k < coarse.length; k++) {
            v0s.push(coarse[k]);
            if (k + 1 < coarse.length) v0s.push(Math.sqrt(coarse[k] * coarse[k + 1]));
          }

          const mid = vLo + (vHi - vLo) * 0.55;
          const sig = Math.max(0.5, (vHi - vLo) * 0.40);

          const landings = new Map();
          let maxW = 0;

          for (const v0 of v0s) {
            const vw = Math.exp(-Math.pow((v0 - mid) / sig, 2));
            if (vw < 1e-6) continue;
            for (let i = 0; i < azimList.length; i++) {
              const azim = azimList[i];
              for (let elev = elevLo; elev <= elevHi + 1e-9; elev += elevStep) {
                const r = probe(v0, hitter, elev, azim, hw, opts);
                if (!r) continue;
                if (r.y > lineY) continue;

                const w = vw;
                if (w <= 1e-12) continue;
                if (w > maxW) maxW = w;

                const key = v0.toFixed(1) + '_' + azim.toFixed(2) + '_' + elev.toFixed(1);
                if (!landings.has(key)) {
                  landings.set(key, { x: r.x, y: r.y, type: 'clear', w, t: r.t, v0, elev, azim });
                }
              }
            }
          }

          if (landings.size > 0) {
            const th = maxW * W_MIN_REL;
            return Array.from(landings.values()).filter(Ld => Ld.w >= th);
          }

          vLo *= 1.12;
          vHi *= 1.12;
        }
        return [];
      }

      function genLandings(type, hitter, fast) {
        if (type === 'drop') return genDropLandings(hitter, fast);
        if (type === 'clear') return genClearLandings(hitter, fast);
        return genSmashLandings(hitter, fast);
      }

      let cachedLandings = [];

      function rebuildLandings(probs, fast) {
        const hitter = opponents[0];
        const capStep = fast ? CAPTURE_STEP_FAST : CAPTURE_STEP;
        const out = [];

        for (const type of SHOT_TYPES) {
          const arr = genLandings(type, hitter, fast);
          if (!arr.length) continue;

          let sumW = 0;
          for (const Ld of arr) sumW += Ld.w;
          if (sumW <= 1e-9) continue;

          const targetW = type === 'smash' ? probs.ps
            : type === 'clear' ? probs.pc
              : probs.pd;
          const scale = targetW / sumW;

          for (const Ld of arr) {
            const trace = [];
            const opts = { capture: trace, captureStep: capStep };
            if (type === 'drop') opts.maxOverNet = PRM.dropMaxOverNet;
            else if (type === 'clear') opts.minNetH = PRM.clearHeight;

            simulate(Ld.v0, PRM.hh, Ld.elev, Ld.azim, hitter.x, hitter.y, opts);

            out.push({
              x: Ld.x, y: Ld.y, type, w: Ld.w * scale, t: Ld.t,
              v0: Ld.v0, elev: Ld.elev, azim: Ld.azim,
              trace
            });
          }
        }
        cachedLandings = out;
      }

      function buildItemsFromLandings(landings, cellSize) {
        const buckets = new Map();
        for (const Ld of landings) {
          if (Ld.w <= 0) continue;
          const gx = Math.round(Ld.x / cellSize);
          const gy = Math.round(Ld.y / cellSize);
          const tBin = Math.round(Ld.t / 0.12);
          const key = Ld.type + '_' + gx + '_' + gy + '_' + tBin;
          let b = buckets.get(key);
          if (!b) {
            b = { sx: 0, sy: 0, w: 0, tSum: 0, type: Ld.type, repW: -1, repTrace: null };
            buckets.set(key, b);
          }
          b.sx += Ld.x * Ld.w;
          b.sy += Ld.y * Ld.w;
          b.w += Ld.w;
          b.tSum += Ld.t * Ld.w;
          if (Ld.w > b.repW && Ld.trace && Ld.trace.length) {
            b.repW = Ld.w;
            b.repTrace = Ld.trace;
          }
        }
        const items = [];
        for (const b of buckets.values()) {
          if (b.w <= 1e-9) continue;
          items.push({
            L: { x: b.sx / b.w, y: b.sy / b.w },
            w: b.w,
            type: b.type,
            t: b.tSum / b.w,
            trace: b.repTrace
          });
        }
        return items;
      }

      function avgReachByType(items, P1, P2, ctxA, ctxB) {
        const acc = {
          smash: { s: 0, w: 0 },
          clear: { s: 0, w: 0 },
          drop: { s: 0, w: 0 }
        };
        for (const it of items) {
          const sA = interceptStats(P1, it, ctxA);
          let r = sA.p;
          if (P2 && ctxB) {
            const sB = interceptStats(P2, it, ctxB);
            r = 1 - (1 - sA.p) * (1 - sB.p);
          }
          acc[it.type].s += r * it.w;
          acc[it.type].w += it.w;
        }
        const out = {};
        for (const k in acc) {
          out[k] = acc[k].w > 0 ? acc[k].s / acc[k].w : 0;
        }
        return out;
      }

      /* ============================================================
         八、站位优化
         ============================================================ */
      function itemV(pos1, pos2, item, ctxA, ctxB) {
        const sA = interceptStats(pos1, item, ctxA);
        const pa = sA.p * sA.q;
        let r = pa;
        if (pos2 && ctxB) {
          const sB = interceptStats(pos2, item, ctxB);
          const pb = sB.p * sB.q;
          r = 1 - (1 - pa) * (1 - pb);
        }
        const cv = cValue(item.type, item.L.y);
        return r * (cv + 1) - 1;
      }

      function overlapPenalty(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const sep = Math.sqrt(dx * dx + dy * dy);
        if (sep >= SEP_MIN_DIST) return 0;
        const u = (SEP_MIN_DIST - sep) / SEP_MIN_DIST;
        return SEP_PEN_K * u * u;
      }

      function totalV(pos, items, otherPos, ctxA, ctxB) {
        let sumWV = 0, sumW = 0;
        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          sumWV += it.w * itemV(pos, otherPos, it, ctxA, ctxB);
          sumW += it.w;
        }
        return sumW > 0 ? sumWV / sumW : -1;
      }

      function optimizeSolo(items, step, ctxA) {
        const x0 = -HW + 0.30, x1 = HW - 0.30;
        const y0 = -HL + 0.40, y1 = -0.5;

        const cands = [];
        let bestPos = null, bestV = -Infinity;

        for (let x = x0; x <= x1 + 1e-9; x += step) {
          for (let y = y0; y <= y1 + 1e-9; y += step) {
            const v = totalV({ x, y }, items, null, ctxA, null);
            cands.push({ P1: { x, y }, P2: null, V: v });
            if (v > bestV) { bestV = v; bestPos = { x, y }; }
          }
        }

        if (!bestPos) {
          const a = { x: 0, y: -4.0 };
          return { best: a, cands: [{ P1: a, P2: null, V: 0 }] };
        }

        let ax = bestPos.x, ay = bestPos.y, av = bestV;
        let h = Math.max(0.10, step * 0.5);
        const MIN_H = step > 0.25 ? 0.10 : 0.01;

        while (h >= MIN_H - 1e-9) {
          let guard = 0;
          while (guard++ < 400) {
            let bx = ax, by = ay, bv = av, moved = false;
            for (let k = -1; k <= 1; k++) {
              for (let m = -1; m <= 1; m++) {
                if (k === 0 && m === 0) continue;
                const nx = ax + k * h, ny = ay + m * h;
                if (nx < x0 || nx > x1 || ny < y0 || ny > y1) continue;
                const v = totalV({ x: nx, y: ny }, items, null, ctxA, null);
                if (v > bv + 1e-9) { bx = nx; by = ny; bv = v; moved = true; }
              }
            }
            if (!moved) break;
            ax = bx; ay = by; av = bv;
          }
          h *= 0.5;
        }

        cands.sort((a, b) => b.V - a.V);
        return { best: { x: ax, y: ay }, cands };
      }

      function optimizeDouble(items, fast, ctxA, ctxB) {
        const N = items.length;
        if (!N) {
          const a = { x: -1.5, y: -3 }, b = { x: 1.5, y: -3 };
          return { best: [a, b], cands: [{ P1: a, P2: b, V: 0 }] };
        }

        const sameV = ctxEqual(ctxA, ctxB);

        const aArr = new Float64Array(N);
        let sumW = 0;
        for (let i = 0; i < N; i++) {
          sumW += items[i].w;
          aArr[i] = items[i].w * (cValue(items[i].type, items[i].L.y) + 1);
        }

        const gridStep = fast ? 0.6 : 0.4;
        const xs = [], ys = [];
        for (let x = -2.6; x <= 2.6 + 1e-9; x += gridStep) xs.push(+x.toFixed(2));
        for (let y = -0.5; y >= -6.3 - 1e-9; y -= gridStep) ys.push(+y.toFixed(2));

        const pos = [];
        for (const y of ys) for (const x of xs) pos.push({ x, y });
        const M = pos.length;

        const PA = new Array(M), PB = new Array(M);
        const SA = new Float64Array(M), SB = new Float64Array(M);
        for (let p = 0; p < M; p++) {
          const arrA = new Float64Array(N);
          const arrB = new Float64Array(N);
          let sa = 0, sb = 0;
          for (let i = 0; i < N; i++) {
            const it = items[i];
            const sA = interceptStats(pos[p], it, ctxA);
            const pa = sA.p * sA.q;
            let pb;
            if (sameV) {
              pb = pa;
            } else {
              const sB = interceptStats(pos[p], it, ctxB);
              pb = sB.p * sB.q;
            }
            arrA[i] = pa; arrB[i] = pb;
            sa += aArr[i] * pa; sb += aArr[i] * pb;
          }
          PA[p] = arrA; PB[p] = arrB; SA[p] = sa; SB[p] = sb;
        }

        const cands = [];
        for (let i = 0; i < M; i++) {
          const Pi = PA[i], pi = pos[i];
          for (let j = 0; j < M; j++) {
            const Pj = PB[j];
            let s = SA[i] + SB[j];
            for (let k = 0; k < N; k++) s -= aArr[k] * Pi[k] * Pj[k];
            const V = (s - sumW) / sumW - overlapPenalty(pi, pos[j]);
            cands.push({ P1: pi, P2: pos[j], V });
          }
        }
        cands.sort((a, b) => b.V - a.V);

        let pA = { x: cands[0].P1.x, y: cands[0].P1.y };
        let pB = { x: cands[0].P2.x, y: cands[0].P2.y };
        let bestV = cands[0].V;

        const scoreAt = (a, b) => {
          let s = 0;
          for (let k = 0; k < N; k++) {
            const it = items[k];
            const sA = interceptStats(a, it, ctxA);
            const pa = sA.p * sA.q;
            let pb;
            if (sameV) {
              pb = pa;
            } else {
              const sB = interceptStats(b, it, ctxB);
              pb = sB.p * sB.q;
            }
            const r = 1 - (1 - pa) * (1 - pb);
            s += aArr[k] * r;
          }
          return (s - sumW) / sumW - overlapPenalty(a, b);
        };

        const clampX = v => clamp(v, -2.7, 2.7);
        const clampY = v => clamp(v, -6.3, -0.5);

        let h = 0.20;
        const MIN_H = fast ? 0.10 : 0.01;

        while (h >= MIN_H - 1e-9) {
          let guard = 0;
          while (guard++ < 200) {
            let improved = false;

            let bv = bestV, bA = pA;
            for (let k = -1; k <= 1; k++) {
              for (let m = -1; m <= 1; m++) {
                if (k === 0 && m === 0) continue;
                const cand = { x: clampX(pA.x + k * h), y: clampY(pA.y + m * h) };
                const v = scoreAt(cand, pB);
                if (v > bv + 1e-9) { bv = v; bA = cand; }
              }
            }
            if (bv > bestV + 1e-9) { pA = bA; bestV = bv; improved = true; }

            bv = bestV; let bB = pB;
            for (let k = -1; k <= 1; k++) {
              for (let m = -1; m <= 1; m++) {
                if (k === 0 && m === 0) continue;
                const cand = { x: clampX(pB.x + k * h), y: clampY(pB.y + m * h) };
                const v = scoreAt(pA, cand);
                if (v > bv + 1e-9) { bv = v; bB = cand; }
              }
            }
            if (bv > bestV + 1e-9) { pB = bB; bestV = bv; improved = true; }

            if (!improved) break;
          }
          h *= 0.5;
        }

        return { best: [pA, pB], cands };
      }

      function sampleCandidates(list, n) {
        if (!list.length) return [];
        if (list.length <= n) return list.slice();
        const out = new Array(n);
        const M = list.length;
        const denom = n - 1;
        let lastIdx = -1;
        for (let i = 0; i < n; i++) {
          const u = denom > 0 ? i / denom : 0;
          let idx = Math.round((M - 1) * Math.pow(u, SCORE_SAMPLE_POW));
          if (idx <= lastIdx) idx = lastIdx + 1;
          if (idx > M - 1) idx = M - 1;
          out[i] = list[idx];
          lastIdx = idx;
        }
        return out;
      }

      function scoreIndex(score, n) {
        if (n <= 1) return 0;
        const idx = Math.round((SCORE_LEVELS - score) * (n - 1) / (SCORE_LEVELS - 1));
        return Math.max(0, Math.min(n - 1, idx));
      }

      function solve(fast) {
        const stepPos = fast ? 0.45 : 0.20;

        const probs = getProbs();
        rebuildLandings(probs, fast);

        let clearTMin = null;
        for (const Ld of cachedLandings) {
          if (Ld.type === 'clear') {
            if (clearTMin == null || Ld.t < clearTMin) clearTMin = Ld.t;
          }
        }

        const cellSize = fast ? 0.25 : 0.18;
        let items = buildItemsFromLandings(cachedLandings, cellSize);

        if (!items.length) {
          items = [{ L: { x: 0, y: -PRM.clearLineY }, w: 1, type: 'clear', t: 0.6, trace: null }];
        }

        const precise = !fast;
        const ctxA = ctxOf('a');
        const ctxB = ctxOf('b');

        let bestP1, bestP2, cands;
        if (mode === 'single') {
          const r = optimizeSolo(items, stepPos, ctxA);
          bestP1 = r.best;
          bestP2 = null;
          cands = r.cands;
        } else {
          const r = optimizeDouble(items, fast, ctxA, ctxB);
          bestP1 = r.best[0];
          bestP2 = r.best[1];
          cands = r.cands;
        }

        candidateItems = items;
        candidateList = sampleCandidates(cands, SCORE_LEVELS);
        if (candidateList.length) {
          candidateList[0] = { P1: bestP1, P2: bestP2, V: cands.length ? cands[0].V : 0 };
        } else {
          candidateList = [{ P1: bestP1, P2: bestP2, V: 0 }];
        }

        const pick = candidateList[scoreIndex(scoreLevel, candidateList.length)];

        const reachStats = mode === 'single'
          ? avgReachByType(items, pick.P1, null, ctxA, null)
          : avgReachByType(items, pick.P1, pick.P2, ctxA, ctxB);

        return { P1: pick.P1, P2: pick.P2, valid: true, precise, reachStats, clearTMin };
      }

      function applyScore() {
        if (!candidateList.length) return;
        const c = candidateList[scoreIndex(scoreLevel, candidateList.length)];
        if (!c) return;

        result.P1 = c.P1;
        result.P2 = c.P2;
        result.valid = true;

        if (candidateItems) {
          const ctxA = ctxOf('a');
          const ctxB = ctxOf('b');
          result.reachStats = mode === 'single'
            ? avgReachByType(candidateItems, c.P1, null, ctxA, null)
            : avgReachByType(candidateItems, c.P1, c.P2, ctxA, ctxB);
        }

        updateStats();
      }

      /* ============================================================
         九、主视图绘制
         ============================================================ */
      function drawCourtBase() {
        const tl = w2c({ x: -HW, y: HL }), br = w2c({ x: HW, y: -HL });
        ctx.fillStyle = '#f7fbf9';
        ctx.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
      }

      function drawCourtLines() {
        const tl = w2c({ x: -HW, y: HL }), br = w2c({ x: HW, y: -HL });
        const w = br.x - tl.x, h = br.y - tl.y;

        ctx.strokeStyle = C_COURT_LINE; ctx.lineWidth = 1.3 / mainScale; ctx.setLineDash([]);
        for (const yy of [HL, HL - LONG_SVC, SHORT_SVC, -SHORT_SVC, -(HL - LONG_SVC), -HL]) {
          lineStroke(w2c({ x: -HW, y: yy }), w2c({ x: HW, y: yy }));
        }
        for (const xx of [-HW, HW, -SINGLES_HW, SINGLES_HW]) {
          lineStroke(w2c({ x: xx, y: -HL }), w2c({ x: xx, y: HL }));
        }
        for (const s of [-1, 1]) {
          lineStroke(w2c({ x: 0, y: s * SHORT_SVC }), w2c({ x: 0, y: s * HL }));
        }

        ctx.strokeStyle = C_COURT_FRAME; ctx.lineWidth = 2.2 / mainScale;
        ctx.strokeRect(tl.x, tl.y, w, h);

        const n1 = w2c({ x: -HW, y: 0 }), n2 = w2c({ x: HW, y: 0 });
        ctx.beginPath(); ctx.strokeStyle = C_NET; ctx.lineWidth = 5 / mainScale;
        ctx.lineCap = 'round';
        ctx.moveTo(n1.x, n1.y); ctx.lineTo(n2.x, n2.y); ctx.stroke();
        ctx.lineCap = 'butt';

        ctx.save();
        ctx.setLineDash([3, 4]);
        ctx.lineWidth = 1 / mainScale;
        ctx.strokeStyle = C_REF_BLUE;
        for (const dn of [DROP_NEAR_EDGE, DROP_FAR_EDGE]) {
          lineStroke(w2c({ x: -HW, y: -dn }), w2c({ x: HW, y: -dn }));
        }
        ctx.setLineDash([2, 6]);
        ctx.strokeStyle = C_REF_RED;
        lineStroke(w2c({ x: -HW, y: -PRM.clearLineY }), w2c({ x: HW, y: -PRM.clearLineY }));
        ctx.restore();
      }

      function drawCourtTags() {
        const tagRightX = w2c({ x: -HW, y: 0 }).x - 6;
        const lineV = PRM.clearLineY.toFixed(1) + ' m';

        drawCourtTag(t('lblNearDrop'), nearDropLabel(), tagRightX, w2c({ x: 0, y: -DROP_NEAR_EDGE }).y, '#1f6f8b', 'right');
        drawCourtTag(t('lblFrontPen'), lineV, tagRightX, w2c({ x: 0, y: -PRM.clearLineY }).y - 8, '#c0392b', 'right');
        drawCourtTag(t('lblFarDrop'), farDropLabel(), tagRightX, w2c({ x: 0, y: -DROP_FAR_EDGE }).y + 8, '#1f6f8b', 'right');
        drawCourtTag(t('net'), null, tagRightX, w2c({ x: 0, y: 0 }).y, C_NET, 'right');
      }

      /* ---- 主视图热力图 ---- */
      const heatCanvas = document.createElement('canvas');
      const heatCtx = heatCanvas.getContext('2d');

      function buildLandingHeatmap(landings) {
        const cell = HEAT_CELL;
        const xMin = -HW, yMin = -HL;
        const GW = Math.ceil(2 * HW / cell) + 1;
        const GH = Math.ceil(HL / cell) + 1;

        const smash = new Float32Array(GW * GH);
        const clear = new Float32Array(GW * GH);
        const drop = new Float32Array(GW * GH);

        const inv2s2 = 1 / (2 * HEAT_SIGMA * HEAT_SIGMA);
        const r = 3 * HEAT_SIGMA;

        for (const Ld of landings) {
          const arr = Ld.type === 'smash' ? smash : Ld.type === 'clear' ? clear : drop;
          const i0 = Math.max(0, Math.floor((Ld.x - r - xMin) / cell));
          const i1 = Math.min(GW - 1, Math.ceil((Ld.x + r - xMin) / cell));
          const j0 = Math.max(0, Math.floor((Ld.y - r - yMin) / cell));
          const j1 = Math.min(GH - 1, Math.ceil((Ld.y + r - yMin) / cell));
          for (let j = j0; j <= j1; j++) {
            const gy = yMin + j * cell;
            const dy = gy - Ld.y;
            const dy2 = dy * dy;
            for (let i = i0; i <= i1; i++) {
              const gx = xMin + i * cell;
              const dx = gx - Ld.x;
              arr[j * GW + i] += Ld.w * Math.exp(-(dx * dx + dy2) * inv2s2);
            }
          }
        }

        let maxV = 0;
        for (let k = 0; k < GW * GH; k++) {
          const tt = smash[k] + clear[k] + drop[k];
          if (tt > maxV) maxV = tt;
        }
        return { GW, GH, cell, xMin, yMin, smash, clear, drop, max: maxV || 1 };
      }

      function computeLandingHeat() {
        if (!result.valid || !cachedLandings.length) { heatDirty = false; return; }

        const W = canvas.width, H = canvas.height;
        if (heatCanvas.width !== W || heatCanvas.height !== H) {
          heatCanvas.width = W;
          heatCanvas.height = H;
        }

        const grid = buildLandingHeatmap(cachedLandings);
        const { GW, GH, cell, xMin, yMin, smash, clear, drop, max } = grid;
        const invMax = 1 / max;

        const img = heatCtx.createImageData(W, H);
        const data = img.data;

        const sx = W / LW, sy = H / LH;

        for (let py = 0; py < H; py++) {
          const wy = HL - (py / sy - PAD_T) / SCALE;
          if (wy > 0 || wy < -HL) continue;
          const fy = (wy - yMin) / cell;
          const j0raw = Math.floor(fy);
          const ty = fy - j0raw;
          let jA, jB, tY;
          if (j0raw < 0) { jA = 0; jB = 0; tY = 0; }
          else if (j0raw > GH - 2) { jA = GH - 1; jB = GH - 1; tY = 0; }
          else { jA = j0raw; jB = j0raw + 1; tY = ty; }

          for (let px = 0; px < W; px++) {
            const wx = (px / sx - PAD_L) / SCALE - HW;
            if (wx > HW || wx < -HW) continue;
            const fx = (wx - xMin) / cell;
            const i0raw = Math.floor(fx);
            const tx = fx - i0raw;
            let iA, iB, tX;
            if (i0raw < 0) { iA = 0; iB = 0; tX = 0; }
            else if (i0raw > GW - 2) { iA = GW - 1; iB = GW - 1; tX = 0; }
            else { iA = i0raw; iB = i0raw + 1; tX = tx; }

            const idx00 = jA * GW + iA, idx10 = jA * GW + iB, idx01 = jB * GW + iA, idx11 = jB * GW + iB;
            const s = (smash[idx00] * (1 - tX) + smash[idx10] * tX) * (1 - tY) + (smash[idx01] * (1 - tX) + smash[idx11] * tX) * tY;
            const c = (clear[idx00] * (1 - tX) + clear[idx10] * tX) * (1 - tY) + (clear[idx01] * (1 - tX) + clear[idx11] * tX) * tY;
            const d = (drop[idx00] * (1 - tX) + drop[idx10] * tX) * (1 - tY) + (drop[idx01] * (1 - tX) + drop[idx11] * tX) * tY;

            const sum = s + c + d;
            const o = (py * W + px) * 4;
            if (sum < max * HEAT_CUT) continue;

            const norm = Math.min(1, Math.sqrt(sum * invMax));
            const inv = 1 / sum;
            data[o] = (s * SHOT_COLOR.smash[0] + c * SHOT_COLOR.clear[0] + d * SHOT_COLOR.drop[0]) * inv;
            data[o + 1] = (s * SHOT_COLOR.smash[1] + c * SHOT_COLOR.clear[1] + d * SHOT_COLOR.drop[1]) * inv;
            data[o + 2] = (s * SHOT_COLOR.smash[2] + c * SHOT_COLOR.clear[2] + d * SHOT_COLOR.drop[2]) * inv;
            data[o + 3] = Math.min(225, norm * 215);
          }
        }
        heatCtx.putImageData(img, 0, 0);
        heatDirty = false;
      }

      function drawHeat() {
        if (!showHeat || !result.valid) return;
        if (heatCanvas.width !== canvas.width || heatCanvas.height !== canvas.height) heatDirty = true;
        if (heatDirty) computeLandingHeat();
        if (heatCanvas.width < 2) return;

        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(heatCanvas, 0, 0, LW, LH);
        ctx.restore();
      }

      /* ---- 次优解点云 ---- */
      const suboptCanvas = document.createElement('canvas');
      const suboptCtx = suboptCanvas.getContext('2d');
      const CLOUD_GRAD = [
        [108, 60, 225],
        [74, 100, 214],
        [40, 155, 155],
        [31, 138, 91]
      ];

      function cloudColorAt(u) {
        u = Math.max(0, Math.min(1, u));
        const f = u * (CLOUD_GRAD.length - 1);
        const i = Math.min(CLOUD_GRAD.length - 2, Math.floor(f));
        const t = f - i;
        const a = CLOUD_GRAD[i], b = CLOUD_GRAD[i + 1];
        return [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t
        ];
      }

      function gaussBlurField(src, GW, GH, cell) {
        const sigC = CLOUD_SIGMA / cell;
        const rad = Math.max(1, Math.ceil(sigC * 3));
        const ker = new Float32Array(rad * 2 + 1);
        let ksum = 0;
        for (let i = -rad; i <= rad; i++) {
          const v = Math.exp(-(i * i) / (2 * sigC * sigC));
          ker[i + rad] = v;
          ksum += v;
        }
        for (let i = 0; i < ker.length; i++) ker[i] /= ksum;

        const tmp = new Float32Array(GW * GH);
        for (let j = 0; j < GH; j++) {
          const row = j * GW;
          for (let i = 0; i < GW; i++) {
            let acc = 0;
            const k0 = Math.max(-rad, -i);
            const k1 = Math.min(rad, GW - 1 - i);
            for (let k = k0; k <= k1; k++) acc += src[row + i + k] * ker[k + rad];
            tmp[row + i] = acc;
          }
        }

        const out = new Float32Array(GW * GH);
        for (let j = 0; j < GH; j++) {
          const j0 = Math.max(-rad, -j);
          const j1 = Math.min(rad, GH - 1 - j);
          for (let i = 0; i < GW; i++) {
            let acc = 0;
            for (let k = j0; k <= j1; k++) acc += tmp[(j + k) * GW + i] * ker[k + rad];
            out[j * GW + i] = acc;
          }
        }
        return out;
      }

      function rebuildSuboptCloud() {
        const W = canvas.width, H = canvas.height;
        if (!W || !H) return;
        if (suboptCanvas.width !== W || suboptCanvas.height !== H) {
          suboptCanvas.width = W;
          suboptCanvas.height = H;
        }
        suboptDirty = false;

        const N = Math.min(PRM.suboptTop, candidateList.length);
        suboptCtx.setTransform(1, 0, 0, 1, 0, 0);
        suboptCtx.clearRect(0, 0, W, H);
        if (N <= 0) return;

        const cell = CLOUD_CELL;
        const xMin = -HW, yMin = -HL;
        const GW = Math.ceil(2 * HW / cell) + 1;
        const GH = Math.ceil(HL / cell) + 1;
        const BINS = CLOUD_RANK_BINS;

        const binField = [];
        for (let b = 0; b < BINS; b++) binField.push(new Float32Array(GW * GH));

        const splatBinned = (p, u) => {
          if (!p) return;
          const fx = (p.x - xMin) / cell;
          const fy = (p.y - yMin) / cell;
          if (fx < 0 || fx > GW - 1 || fy < 0 || fy > GH - 1) return;

          const i = Math.floor(fx), j = Math.floor(fy);
          const tx = fx - i, ty = fy - j;
          const i1 = Math.min(GW - 1, i + 1);
          const j1 = Math.min(GH - 1, j + 1);

          const bf = u * (BINS - 1);
          const b0 = Math.min(BINS - 1, Math.max(0, Math.floor(bf)));
