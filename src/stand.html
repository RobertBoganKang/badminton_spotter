<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>羽毛球场站位点</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦵</text></svg>">
  <style>
    /* ============================================================
       1. 设计变量
       ============================================================ */
    :root {
      --bg: #eef2f6;
      --card: #fff;
      --text: #1a2b22;
      --text-2: #5b6b62;
      --text-3: #8a9a91;
      --border: #e4ebe6;
      --shadow: 0 1px 2px rgba(20, 50, 35, .04), 0 8px 24px rgba(20, 50, 35, .05);
      --primary: #166b46;
      --primary-2: #1f8a5b;
      --primary-bright: #22a06b;

      --seg-clear: 45, 90, 200;
      --seg-drop: 40, 170, 80;
      --seg-kill: 192, 57, 43;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body {
      margin: 0;
      padding: 16px 12px;
      background: radial-gradient(1000px 500px at 15% -5%, #d9ece1 0%, transparent 55%), radial-gradient(800px 400px at 90% 0%, #e3e9f7 0%, transparent 50%), var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%
    }

    .app {
      max-width: 620px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow)
    }

    /* ============================================================
       2. 页头
       ============================================================ */
    .header {
      padding: 14px 18px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: nowrap;
      position: relative;
      overflow: hidden
    }

    .header::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(31, 138, 91, .10) 0%, transparent 65%);
      pointer-events: none
    }

    .header-left {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      flex: 1;
      min-width: 0;
      position: relative
    }

    .header-left>div:not(.logo) {
      min-width: 0;
      flex: 1
    }

    .logo {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-bright), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      box-shadow: 0 4px 12px rgba(22, 107, 70, .28), inset 0 1px 0 rgba(255, 255, 255, .2)
    }

    h1 {
      margin: 0 0 4px;
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: .2px;
      line-height: 1.35
    }

    .header p {
      margin: 0;
      font-size: 11.5px;
      color: var(--text-3);
      line-height: 1.55;
      word-break: break-word
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      position: relative
    }

    .lang-btn {
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 7px;
      background: transparent;
      border: none;
      border-radius: 5px;
      color: var(--text-3);
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1;
      letter-spacing: .3px;
      opacity: .85;
      transition: color .15s, opacity .15s, transform .12s
    }

    .lang-btn:hover {
      color: var(--primary);
      opacity: 1
    }

    .lang-btn:active {
      transform: scale(.92)
    }

    .app.collapsed .header {
      display: none
    }

    /* ============================================================
       3. 画布卡片 & 顶栏
       ============================================================ */
    .canvas-card {
      padding: 0;
      overflow: hidden
    }

    .canvas-topbar {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      padding: 9px 12px;
      border-bottom: 1px solid #f0f4f1;
      font-size: 11.5px;
      color: var(--text-2)
    }

    .sidebar-btn {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f0f5f2;
      border: 1px solid var(--border);
      color: var(--text-2);
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      transition: background .15s, color .15s, transform .12s
    }

    .sidebar-btn:hover {
      background: #e6efe9;
      color: var(--primary)
    }

    .sidebar-btn:active {
      transform: scale(.92)
    }

    .sidebar-btn svg {
      width: 13px;
      height: 13px;
      stroke-width: 2.4;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round
    }

    .collapse-btn {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 0;
      color: var(--text-3);
      cursor: pointer;
      padding: 0;
      box-shadow: none;
      opacity: .75;
      transition: color .15s, transform .12s, opacity .15s;
      font-family: inherit
    }

    .collapse-btn:hover {
      color: var(--primary);
      opacity: 1
    }

    .collapse-btn:active {
      transform: scale(.9)
    }

    .collapse-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .collapse-btn .chev-down {
      display: none
    }

    .app.collapsed .collapse-btn .chev-up {
      display: none
    }

    .app.collapsed .collapse-btn .chev-down {
      display: inline
    }

    .mode-toggle {
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 13px;
      background: #e8eee9;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      font-family: inherit;
      line-height: 1;
      letter-spacing: .3px;
      min-width: 46px;
      transition: background .15s, color .15s, transform .12s
    }

    .mode-toggle:hover {
      background: #dde6e0
    }

    .mode-toggle:active {
      transform: scale(.96)
    }

    .mode-toggle[data-mode="single"] {
      background: #e8f0f7;
      color: #1e6bb8
    }

    .mode-toggle[data-mode="single"]:hover {
      background: #dbe7f3
    }

    .tb-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-shrink: 0
    }

    /* ============================================================
       4. 胶囊组
       ============================================================ */
    .pill-group {
      display: inline-flex;
      gap: 3px;
      align-items: center
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .2px;
      border: 1px solid transparent;
      white-space: nowrap;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      cursor: ns-resize;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none
    }

    .pill:active {
      transform: scale(.96);
    }

    .pill-height {
      background: rgba(31, 111, 139, .12);
      border-color: rgba(31, 111, 139, .28);
      color: #1f6f8b
    }

    .seg-group {
      display: inline-flex;
      align-items: stretch;
      flex-shrink: 0;
      border-radius: 999px
    }

    .seg {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 9px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .2px;
      border: 1px solid transparent;
      white-space: nowrap;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      cursor: ns-resize;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      margin-left: -1px;
      transition: filter .15s
    }

    .seg:first-child {
      margin-left: 0
    }

    .seg:hover {
      z-index: 1;
      filter: brightness(.96)
    }

    .seg:active {
      filter: brightness(.92)
    }

    .seg-clear {
      border-radius: 999px 0 0 999px;
      background: rgba(var(--seg-clear), .12);
      border-color: rgba(var(--seg-clear), .28);
      color: rgb(var(--seg-clear))
    }

    .seg-drop {
      border-radius: 0;
      background: rgba(var(--seg-drop), .12);
      border-color: rgba(var(--seg-drop), .28);
      color: rgb(var(--seg-drop))
    }

    .seg-kill {
      border-radius: 0 999px 999px 0;
      background: rgba(var(--seg-kill), .12);
      border-color: rgba(var(--seg-kill), .28);
      color: rgb(var(--seg-kill))
    }

    /* ============================================================
       5. 画布与信息栏
       ============================================================ */
    .canvas-wrap {
      padding: 9px 10px 8px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 8px
    }

    canvas {
      display: block;
      border-radius: 10px;
      touch-action: none;
      background: #f7fbf9;
      max-width: 100%;
      box-shadow: 0 1px 3px rgba(20, 50, 35, .06), 0 4px 14px rgba(20, 50, 35, .05)
    }

    #sideCanvas {
      flex: 0 0 auto;
      touch-action: none
    }

    .info-line {
      padding: 0 12px 10px;
      font-size: 11px;
      color: var(--text-3);
      text-align: center;
      line-height: 1.6;
      font-variant-numeric: tabular-nums
    }

    .info-line b {
      color: var(--text-2);
      font-weight: 600
    }

    .footer {
      padding: 2px 8px 6px;
      text-align: center;
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: .3px;
      line-height: 1.7
    }

    .footer b {
      color: var(--text-2);
      font-weight: 600
    }

    #credit {
      cursor: pointer;
      user-select: none
    }

    /* ============================================================
       6. 侧边栏
       ============================================================ */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(330px, 88vw);
      background: #fff;
      z-index: 60;
      transform: translateX(-103%);
      transition: transform .26s cubic-bezier(.4, 0, .2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 26px rgba(20, 50, 35, .14)
    }

    .sidebar.open {
      transform: none
    }

    .sidebar-mask {
      position: fixed;
      inset: 0;
      background: rgba(10, 30, 20, .40);
      opacity: 0;
      pointer-events: none;
      transition: opacity .26s;
      z-index: 59;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px)
    }

    .sidebar-mask.open {
      opacity: 1;
      pointer-events: auto
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      flex-shrink: 0
    }

    .sidebar-head h2 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: .2px
    }

    .sidebar-close {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
      font-family: inherit
    }

    .sidebar-close:active {
      transform: scale(.9)
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      user-select: none;
      -webkit-user-select: none
    }

    .sidebar-foot {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0
    }

    .sidebar-foot button {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f5f9f6;
      color: var(--text-2);
      font-family: inherit;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background .15s
    }

    .sidebar-foot button:hover {
      background: #eaf2ed
    }

    .sidebar-foot button:active {
      transform: scale(.98)
    }

    .s-group {
      padding: 9px 14px 10px;
      border-bottom: 1px solid #f0f4f1
    }

    .s-group:last-child {
      border-bottom: none
    }

    .s-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px
    }

    .s-title span {
      font-weight: 500;
      color: var(--text-3);
      font-size: 9.5px;
      text-align: right
    }

    .s-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px
    }

    .s-item {
      display: grid;
      grid-template-columns: 74px 1fr 46px;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: var(--text-2);
      min-width: 0;
      user-select: none;
      -webkit-user-select: none
    }

    .s-item span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .s-item b {
      font-weight: 700;
      color: var(--primary);
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 11px
    }

    .s-item input[type=range] {
      width: 100%;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
      margin: 0;
      outline: none
    }

    .s-item input[type=range]:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px
    }

    .s-curve {
      margin-top: 8px;
      padding: 6px 0 2px;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .s-curve canvas {
      width: 100%;
      height: 64px;
      border-radius: 6px;
      background: #f7fbf9;
      border: 1px solid var(--border);
      display: block;
      box-shadow: none
    }

    .s-curve-caption {
      font-size: 9.5px;
      color: var(--text-3);
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: .2px;
      line-height: 1.5
    }

    /* ============================================================
       7. 弹窗
       ============================================================ */
    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(10, 30, 20, .46);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 26px 14px;
      overflow: auto;
      backdrop-filter: blur(2px);
      -webkit-overflow-scrolling: touch
    }

    .modal-mask.open {
      display: flex
    }

    .modal {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 660px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
      overflow: hidden;
      animation: pop .22s ease
    }

    @keyframes pop {
      from {
        transform: translateY(14px);
        opacity: .6;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      position: sticky;
      top: 0;
      z-index: 1
    }

    .modal-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 650
    }

    .modal-close {
      background: transparent !important;
      box-shadow: none !important;
      color: #fff;
      font-size: 24px;
      line-height: 1;
      padding: 0 6px;
      border: none;
      cursor: pointer
    }

    .modal-body {
      padding: 18px 22px 24px;
      font-size: 14px;
      line-height: 1.78;
      color: var(--text);
      max-height: 76vh;
      overflow: auto;
      -webkit-overflow-scrolling: touch
    }

    .modal-body h3 {
      font-size: 15px;
      margin: 22px 0 8px;
      color: var(--primary);
      font-weight: 650;
      padding-bottom: 4px;
      border-bottom: 1px solid #e8f0ec
    }

    .modal-body h3:first-child {
      margin-top: 0;
      border-top: none
    }

    .modal-body p {
      margin: 6px 0;
    }

    .modal-body .lead {
      color: var(--text);
      font-size: 13.5px;
      background: #f2f7f4;
      padding: 10px 13px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 3px solid var(--primary)
    }

    .formula {
      background: #f2f7f4;
      border-left: 3px solid var(--primary);
      padding: 8px 13px;
      border-radius: 6px;
      margin: 8px 0;
      font-family: "Cambria Math", "Times New Roman", Georgia, serif;
      font-size: 14px;
      overflow-x: auto;
      white-space: nowrap
    }

    .modal-body code {
      background: #eef2f6;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 12.5px
    }

    .modal-body ul,
    .modal-body ol {
      margin: 6px 0;
      padding-left: 22px
    }

    .modal-body li {
      margin: 4px 0;
    }

    /* ============================================================
       8. 响应式
       ============================================================ */
    @media (max-width: 520px) {
      body {
        padding: 10px 8px;
      }

      .app {
        gap: 10px;
      }

      .header {
        padding: 11px 13px;
        gap: 10px;
      }

      .logo {
        width: 36px;
        height: 36px;
        font-size: 18px;
        border-radius: 10px;
      }

      h1 {
        font-size: 14.5px;
      }

      .header p {
        font-size: 10.5px;
        line-height: 1.45;
      }

      .lang-btn {
        padding: 2px 5px;
        font-size: 11px;
      }

      .canvas-topbar {
        padding: 8px 10px;
        gap: 5px;
        font-size: 11px;
      }

      .mode-toggle {
        padding: 4px 11px;
        font-size: 11.5px;
        min-width: 42px;
      }

      .pill {
        font-size: 10px;
        padding: 1px 7px;
      }

      .seg {
        font-size: 10px;
        padding: 1px 7px;
      }

      .tb-right {
        gap: 5px;
      }

      .sidebar-btn {
        width: 24px;
        height: 24px;
      }

      .collapse-btn {
        width: 20px;
        height: 20px;
      }

      .collapse-btn svg {
        width: 12px;
        height: 12px;
      }

      .canvas-wrap {
        padding: 7px 6px 6px;
        gap: 6px;
      }

      .info-line {
        font-size: 10px;
        padding: 0 10px 8px;
      }

      .footer {
        font-size: 11px;
      }

      .modal-mask {
        padding: 8px 6px;
      }

      .modal {
        border-radius: 13px;
      }

      .modal-head {
        padding: 12px 16px;
      }

      .modal-head h2 {
        font-size: 15px;
      }

      .modal-body {
        padding: 14px 16px 20px;
        font-size: 13.5px;
        line-height: 1.72;
        max-height: 84vh;
      }

      .modal-body h3 {
        font-size: 14px;
        margin: 18px 0 6px;
      }
    }
  </style>
</head>

<body>

  <div class="app" id="app">
    <header class="card header">
      <div class="header-left">
        <div class="logo">🦵</div>
        <div>
          <h1 id="pageTitle">羽毛球场站位点</h1>
          <p id="pageSub"></p>
        </div>
      </div>
      <div class="header-actions">
        <button id="langBtn" class="lang-btn" aria-label="Switch language">EN</button>
      </div>
    </header>

    <div class="card canvas-card">
      <div class="canvas-topbar">
        <button class="sidebar-btn" id="sidebarBtn" aria-label="参数">
          <svg viewBox="0 0 24 24">
            <line x1="4" y1="7" x2="20" y2="7" />
            <circle cx="9" cy="7" r="2.4" fill="none" stroke="currentColor" />
            <line x1="4" y1="17" x2="20" y2="17" />
            <circle cx="15" cy="17" r="2.4" fill="none" stroke="currentColor" />
          </svg>
        </button>

        <button class="mode-toggle" id="modeToggle" data-mode="double">双打</button>

        <div class="tb-right">
          <div class="pill-group" id="pillGroup">
            <span class="pill pill-height" id="pillHeight">击球高 2.8m</span>
            <div class="seg-group" role="group" aria-label="高吊杀概率">
              <span class="seg seg-clear" id="pillClear" data-label="高">高 22%</span>
              <span class="seg seg-drop" id="pillDrop" data-label="吊">吊 23%</span>
              <span class="seg seg-kill" id="pillKill" data-label="杀">杀 55%</span>
            </div>
          </div>
          <button class="collapse-btn" id="collapseBtn" aria-label="隐藏顶部">
            <svg class="chev-up" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 10l4-4 4 4" />
            </svg>
            <svg class="chev-down" viewBox="0 0 16 16" aria-hidden="true">
