      function cdOf(v) {
        const u = v / 8;
        return 0.50 + 0.30 / (1 + u * u);
      }

      const SHOT_AZIM_SIG = {smash: 25, clear: 15, drop: 20};

      const REACH_P0 = 0.02, REACH_P1 = 0.88, REACH_PMAX = 0.92;
      const DROP_EXTRA_T = 0.04;

      const V_FWD_K = 1.15, V_SIDE_K = 0.95;

      const SPEED_BASE = 3.8;

      /* ---- 运行时状态 ---- */
      let mode = 'double';
      let opponents = [{x: 0, y: 4.6}];
      let dragIdx = -1, dragStarted = false, dragStartPos = null;
      let needsSolve = true, quality = 'full';
      let lastTap = {time: 0, x: 0, y: 0};
      let showHeat = false;

      let result = {
        P1: {x: 2.2, y: -4.5}, P2: {x: -0.5, y: -4.5},
        valid: false,
        precise: false,
        reachStats: null,
        highTMin: null
      };

      function randHeight() {
        return 1.60 + Math.random() * 0.25;
      }
      const personHeights = [randHeight(), randHeight(), randHeight()];

      const DR_HIT = ('ontouchstart' in window) ? 1.0 : 0.55;
      const DOUBLE_TAP_MS = 300;
      const DOUBLE_TAP_DIST = 32;
      const DRAG_THRESHOLD = 6;

      const SCALE = 40;
      const PAD_R = 20, PAD_T = 20, PAD_B = 20;
      let PAD_L = 85;
      let LW = W * SCALE + PAD_L + PAD_R;
      let LH = L * SCALE + PAD_T + PAD_B;

      const canvas = $('canvas');
      const ctx = canvas.getContext('2d');

      const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

      /* ============================================================
         三、坐标与绘制辅助
         ============================================================ */
      function w2c(p) {return {x: PAD_L + (p.x + HW) * SCALE, y: PAD_T + (HL - p.y) * SCALE};}
      function c2w(cx, cy) {return {x: (cx - PAD_L) / SCALE - HW, y: HL - (cy - PAD_T) / SCALE};}

      function measureTagWidth(line1, line2) {
        ctx.save();
        ctx.font = FONT_TAG_MAIN;
        const w1 = ctx.measureText(line1).width;
        ctx.font = FONT_TAG_SUB;
        const w2 = line2 ? ctx.measureText(line2).width : 0;
        ctx.restore();
        return Math.max(w1, w2) + TAG_PADX * 2;
      }

      /* 标签第二行从物理常量生成，避免与 DROP_*_EDGE 不同步 */
      function nearDropLabel() {return DROP_NEAR_EDGE.toFixed(1) + ' m';}
      function farDropLabel() {return DROP_FAR_EDGE.toFixed(1) + ' m';}

      function computePadL() {
        const w = Math.max(
          measureTagWidth(t('net'), null),
          measureTagWidth(t('lblNearDrop'), nearDropLabel()),
          measureTagWidth(t('lblFrontPen'), PRM.clearLineY.toFixed(1) + ' m'),
          measureTagWidth(t('lblFarDrop'), farDropLabel())
        );
        return Math.ceil(w) + 12;
      }

      function lineStroke(a, b) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function roundRectPath(c, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      }

      function drawLabelWithHalo(text, x, y, color, font, align, baseline) {
        ctx.save();
        ctx.font = font;
        ctx.textAlign = align;
        ctx.textBaseline = baseline;
        ctx.lineWidth = HALO_W;
        ctx.strokeStyle = '#fff';
        ctx.fillStyle = color;
        ctx.strokeText(text, x, y);
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      function drawCourtTag(line1, line2, anchorX, anchorY, color, align) {
        ctx.save();
        ctx.font = FONT_TAG_MAIN;
        const w1 = ctx.measureText(line1).width;
        ctx.font = FONT_TAG_SUB;
        const w2 = line2 ? ctx.measureText(line2).width : 0;
        const tw = Math.max(w1, w2);

        const padX = TAG_PADX, padY = 3, lineH = 10;
        const rows = line2 ? 2 : 1;
        const w = tw + padX * 2;
        const h = lineH * rows + padY * 2;

        let bx;
        if (align === 'right') bx = anchorX - w;
        else if (align === 'center') bx = anchorX - w / 2;
        else bx = anchorX;
        const by = anchorY - h / 2;

        roundRectPath(ctx, bx, by, w, h, 3.5);
        ctx.fillStyle = 'rgba(255,255,255,0.94)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.06)';
        ctx.lineWidth = 0.8;
        ctx.stroke();

        const cx = bx + w / 2;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = color;

        if (line2) {
          ctx.font = FONT_TAG_MAIN;
          ctx.fillText(line1, cx, by + padY + lineH * 0.5 + 0.3);
          ctx.font = FONT_TAG_SUB;
          ctx.globalAlpha = 0.85;
          ctx.fillText(line2, cx, by + padY + lineH * 1.5 + 0.3);
          ctx.globalAlpha = 1;
        } else {
          ctx.font = FONT_TAG_MAIN;
          ctx.fillText(line1, cx, by + h / 2 + 0.3);
        }
        ctx.restore();
      }

      /* ============================================================
         四、侧视图
         ============================================================ */
      const sideCanvas = $('sideCanvas');
      const sctx = sideCanvas.getContext('2d');

      const SIDE_Z_MAX = 12.0;
      const SIDE_GAP = 8;

      const SIDE_HEAD_R = 5.2;
      const SIDE_BODY_LW = 5.0;

      let sideW = 150, sideH = 400;
      const sideGroundX = 12;
      let sideScaleZ = 12;
      let sideScaleY = 40;
      let sideCourtTop = 0;

      const sideHeatCanvas = document.createElement('canvas');
      const sideHeatCtx = sideHeatCanvas.getContext('2d');
      let sideHeatDirty = true;
      let sideHeatReady = false;

      function setupSide() {
        sideCourtTop = PAD_T * sideH / LH;
        sideScaleY = SCALE * sideH / LH;
        sideScaleZ = (sideW - sideGroundX - 8) / SIDE_Z_MAX;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        sideCanvas.style.width = sideW + 'px';
        sideCanvas.style.height = sideH + 'px';
        sideCanvas.width = Math.round(sideW * dpr);
        sideCanvas.height = Math.round(sideH * dpr);
        sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        sideHeatDirty = true;
        sideHeatReady = false;
      }

      function buildSideHeatGrid() {
        const cell = 0.15;
        const Y0 = -HL, Z0 = 0;
        const GY = Math.ceil((2 * HL) / cell) + 1;
        const GZ = Math.ceil(SIDE_Z_MAX / cell) + 1;

        const smash = new Float32Array(GY * GZ);
        const clear = new Float32Array(GY * GZ);
        const drop = new Float32Array(GY * GZ);
        const grids = {smash, clear, drop};

        const sigma = 0.20;
        const inv2s2 = 1 / (2 * sigma * sigma);
        const R = 3;

        const hitter = opponents[0];
        const h0 = PRM.hh;

        for (const Ld of cachedLandings) {
          if (Ld.v0 == null) continue;

          const trace = [];
          const opts = {trace};
          if (Ld.type === 'drop') opts.maxOverNet = PRM.dropMaxOverNet;
          else if (Ld.type === 'clear') opts.minNetH = PRM.clearHeight;

          simulate(Ld.v0, h0, Ld.elev, Ld.azim, hitter.x, hitter.y, opts);

          const n = trace.length >> 1;
          if (!n) continue;
          const wPer = Ld.w / n;
          const g = grids[Ld.type];

          for (let k = 0; k < n; k++) {
            const py = trace[k * 2];
            const pz = trace[k * 2 + 1];
            if (pz < 0 || pz > SIDE_Z_MAX) continue;

            const ci = (py - Y0) / cell;
            const cj = (pz - Z0) / cell;
            const i0 = Math.max(0, Math.floor(ci) - R);
            const i1 = Math.min(GY - 1, Math.ceil(ci) + R);
            const j0 = Math.max(0, Math.floor(cj) - R);
            const j1 = Math.min(GZ - 1, Math.ceil(cj) + R);
            for (let j = j0; j <= j1; j++) {
              const dz = Z0 + j * cell - pz;
              const dz2 = dz * dz;
              const rowBase = j * GY;
              for (let i = i0; i <= i1; i++) {
                const dy = Y0 + i * cell - py;
                g[rowBase + i] += wPer * Math.exp(-(dy * dy + dz2) * inv2s2);
              }
            }
          }
        }

        return {GY, GZ, cell, Y0, Z0, grids};
      }

      function computeSideHeat() {
        sideHeatReady = false;
        const grid = buildSideHeatGrid();
        const GY = grid.GY, GZ = grid.GZ, cell = grid.cell, Y0 = grid.Y0, Z0 = grid.Z0;
        const smash = grid.grids.smash, clear = grid.grids.clear, drop = grid.grids.drop;

        let maxV = 0;
        const total = GY * GZ;
        for (let k = 0; k < total; k++) {
          const tt = smash[k] + clear[k] + drop[k];
          if (tt > maxV) maxV = tt;
        }
        if (maxV <= 1e-9) return;

        const W = sideCanvas.width, H = sideCanvas.height;
        if (sideHeatCanvas.width !== W || sideHeatCanvas.height !== H) {
          sideHeatCanvas.width = W;
          sideHeatCanvas.height = H;
        }

        const dpr = W / sideW;
        const invMax = 1 / maxV;
        const img = sideHeatCtx.createImageData(W, H);
        const data = img.data;

        for (let py = 0; py < H; py++) {
          const cssY = py / dpr;
          const wy = HL - (cssY - sideCourtTop) / sideScaleY;
          if (wy > HL || wy < -HL) continue;

          const fy = (wy - Y0) / cell;
          let iA, iB, tX;
          const i0raw = Math.floor(fy);
          if (i0raw < 0) {iA = 0; iB = 0; tX = 0;}
          else if (i0raw > GY - 2) {iA = GY - 1; iB = GY - 1; tX = 0;}
          else {iA = i0raw; iB = i0raw + 1; tX = fy - i0raw;}

          for (let px = 0; px < W; px++) {
            const cssX = px / dpr;
            const wz = (cssX - sideGroundX) / sideScaleZ;
            if (wz < 0 || wz > SIDE_Z_MAX) continue;

            const fz = (wz - Z0) / cell;
            let jA, jB, tY;
            const j0raw = Math.floor(fz);
            if (j0raw < 0) {jA = 0; jB = 0; tY = 0;}
            else if (j0raw > GZ - 2) {jA = GZ - 1; jB = GZ - 1; tY = 0;}
            else {jA = j0raw; jB = j0raw + 1; tY = fz - j0raw;}

            const r0 = jA * GY, r1 = jB * GY;
            const w00 = (1 - tX) * (1 - tY), w10 = tX * (1 - tY);
            const w01 = (1 - tX) * tY, w11 = tX * tY;
            const i00 = r0 + iA, i10 = r0 + iB, i01 = r1 + iA, i11 = r1 + iB;

            const s = smash[i00] * w00 + smash[i10] * w10 + smash[i01] * w01 + smash[i11] * w11;
            const c = clear[i00] * w00 + clear[i10] * w10 + clear[i01] * w01 + clear[i11] * w11;
            const d = drop[i00] * w00 + drop[i10] * w10 + drop[i01] * w01 + drop[i11] * w11;

            const sum = s + c + d;
            const o = (py * W + px) * 4;
            if (sum < maxV * HEAT_CUT) continue;

            const norm = Math.min(1, Math.sqrt(sum * invMax));
            const inv = 1 / sum;
            data[o] = (s * HEAT_RGB.smash[0] + c * HEAT_RGB.clear[0] + d * HEAT_RGB.drop[0]) * inv;
            data[o + 1] = (s * HEAT_RGB.smash[1] + c * HEAT_RGB.clear[1] + d * HEAT_RGB.drop[1]) * inv;
            data[o + 2] = (s * HEAT_RGB.smash[2] + c * HEAT_RGB.clear[2] + d * HEAT_RGB.drop[2]) * inv;
            data[o + 3] = Math.min(230, norm * 220);
          }
        }

        sideHeatCtx.putImageData(img, 0, 0);
        sideHeatReady = true;
      }

      function drawSidePerson(y, color, heightM) {
        const sy = sideCourtTop + (HL - y) * sideScaleY;
        const headR = SIDE_HEAD_R;
        const fullLen = Math.max(10, heightM * sideScaleZ);
        const bodyLen = Math.max(2, fullLen - headR * 2);
        const headX = sideGroundX + bodyLen + headR;

        sctx.strokeStyle = color;
        sctx.lineWidth = SIDE_BODY_LW;
        sctx.lineCap = 'round';
        sctx.beginPath();
        sctx.moveTo(sideGroundX, sy);
        sctx.lineTo(sideGroundX + bodyLen, sy);
        sctx.stroke();
        sctx.lineCap = 'butt';

        sctx.beginPath();
        sctx.fillStyle = color;
        sctx.arc(headX, sy, headR, 0, Math.PI * 2);
        sctx.fill();
        sctx.strokeStyle = 'rgba(255,255,255,.9)';
        sctx.lineWidth = 1.0;
        sctx.stroke();
      }

      function drawRacketContact() {
        const sy = sideCourtTop + (HL - opponents[0].y) * sideScaleY;
        const hx = sideGroundX + PRM.hh * sideScaleZ;

        const fullLen = Math.max(10, personHeights[0] * sideScaleZ);
        const headRight = sideGroundX + fullLen;

        sctx.save();
        sctx.strokeStyle = 'rgba(31,111,139,0.35)';
        sctx.lineWidth = 1;
        sctx.setLineDash([2, 3]);
        sctx.beginPath();
        sctx.moveTo(sideGroundX + 2, sy);
        sctx.lineTo(hx, sy);
        sctx.stroke();
        sctx.restore();

        const rx = 6.0, ry = 4.0;

        const fromX = headRight + 1;
        let toX = hx - rx;
        if (toX < fromX) toX = fromX;
        if (toX > fromX) {
          sctx.strokeStyle = '#111';
          sctx.lineWidth = 1.8;
          sctx.lineCap = 'round';
          sctx.beginPath();
          sctx.moveTo(fromX, sy);
          sctx.lineTo(toX, sy);
          sctx.stroke();
          sctx.lineCap = 'butt';
        }

        sctx.beginPath();
        sctx.ellipse(hx, sy, rx, ry, 0, 0, Math.PI * 2);
        sctx.fillStyle = 'rgba(0,0,0,0.04)';
        sctx.fill();
        sctx.strokeStyle = '#111';
        sctx.lineWidth = 1.6;
        sctx.stroke();

        sctx.beginPath();
        sctx.fillStyle = '#111';
        sctx.arc(hx, sy, 2.2, 0, Math.PI * 2);
        sctx.fill();
        sctx.strokeStyle = '#fff';
        sctx.lineWidth = 0.9;
        sctx.stroke();

        const label = lang === 'zh' ? '击球点' : 'Contact';
        const hLabel = PRM.hh.toFixed(1) + ' m';
        sctx.font = 'bold 8px system-ui';
        const tw1 = sctx.measureText(label).width;
        sctx.font = '7px system-ui';
        const tw2 = sctx.measureText(hLabel).width;
        const tw = Math.max(tw1, tw2);

        let lx = hx + rx + 3;
        if (lx + tw > sideW - 1) lx = Math.max(1, sideW - 1 - tw);
        let ly = sy + ry + 8;
        if (ly > sideCourtTop + L * sideScaleY - 2) ly = sy - ry - 12;

        sctx.textAlign = 'left';
        sctx.textBaseline = 'middle';
        sctx.lineWidth = 2.6;
        sctx.strokeStyle = '#fff';

        sctx.font = 'bold 8px system-ui';
        sctx.strokeText(label, lx, ly - 4);
        sctx.fillStyle = '#111';
        sctx.fillText(label, lx, ly - 4);

        sctx.font = '7px system-ui';
        sctx.strokeText(hLabel, lx, ly + 5);
        sctx.fillStyle = '#111';
        sctx.fillText(hLabel, lx, ly + 5);
      }

      function drawSide() {
        if (!sideCanvas.width || !sideCanvas.height) return;

        sctx.clearRect(0, 0, sideW, sideH);
        sctx.fillStyle = '#f7fbf9';
        sctx.fillRect(0, 0, sideW, sideH);

        if (showHeat && result.valid && cachedLandings.length) {
          if (sideHeatDirty && quality === 'full') {
            try {computeSideHeat();} catch (e) {console.error('side heat error:', e);}
            sideHeatDirty = false;
          }
          if (sideHeatReady) {
            sctx.imageSmoothingEnabled = true;
            sctx.drawImage(sideHeatCanvas, 0, 0, sideW, sideH);
          }
        }

        const yTop = sideCourtTop - 2;
        const yBot = sideCourtTop + L * sideScaleY + 2;

        sctx.strokeStyle = C_COURT_FRAME;
        sctx.lineWidth = 2.4;
        sctx.lineCap = 'round';
        sctx.beginPath();
        sctx.moveTo(sideGroundX, yTop);
        sctx.lineTo(sideGroundX, yBot);
        sctx.stroke();
        sctx.lineCap = 'butt';

        const ticks = [HL, HL - LONG_SVC, SHORT_SVC, -SHORT_SVC, -(HL - LONG_SVC), -HL];
        for (const ty of ticks) {
          const sy = sideCourtTop + (HL - ty) * sideScaleY;
          const isEnd = Math.abs(Math.abs(ty) - HL) < 1e-6;
          sctx.fillStyle = isEnd ? C_COURT_FRAME : C_COURT_LINE;
          const tw = isEnd ? 6 : 4;
          const th = isEnd ? 2.6 : 1.8;
          sctx.fillRect(sideGroundX + 1, sy - th / 2, tw, th);
        }

        const netSy = sideCourtTop + HL * sideScaleY;
        const netLen = NET_H * sideScaleZ;
        const cssMainW = parseFloat(canvas.style.width) || LW;
        const netLW = Math.max(3, 5 * cssMainW / LW);
        sctx.strokeStyle = C_NET;
        sctx.lineWidth = netLW;
        sctx.lineCap = 'round';
        sctx.beginPath();
        sctx.moveTo(sideGroundX, netSy);
        sctx.lineTo(sideGroundX + netLen, netSy);
        sctx.stroke();
        sctx.lineCap = 'butt';

        const ourColor = result.precise ? '#111' : '#b4bdb8';

        drawSidePerson(opponents[0].y, '#111', personHeights[0]);

        if (result.valid) {
          if (mode === 'single') {
            if (result.P1) drawSidePerson(result.P1.y, ourColor, personHeights[1]);
          } else {
            if (result.P1) drawSidePerson(result.P1.y, ourColor, personHeights[1]);
            if (result.P2) drawSidePerson(result.P2.y, ourColor, personHeights[2]);
          }
        }

        if (result.valid) drawRacketContact();
      }

      /* ============================================================
         五、主画布尺寸与布局
         ============================================================ */
      function setup() {
        PAD_L = computePadL();
        LW = W * SCALE + PAD_L + PAD_R;
        LH = L * SCALE + PAD_T + PAD_B;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const wrap = canvas.parentElement, cs = getComputedStyle(wrap);
        const availTotal = wrap.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
        const maxH = Math.min(window.innerHeight * 0.75, 720);

        let sideWc = clamp(maxH * 0.36, 130, 200);
        let cw = 300, ch = 400;
        for (let it = 0; it < 4; it++) {
          let availMain = availTotal - sideWc - SIDE_GAP;
          if (availMain < 90) availMain = 90;

          cw = Math.min(availMain, LW);
          if (cw < 110) cw = 110;
          ch = cw * LH / LW;
          if (ch > maxH) {ch = maxH; cw = ch * LW / LH;}

          const nw = clamp(ch * 0.36, 130, 200);
          if (Math.abs(nw - sideWc) < 0.5) {sideWc = nw; break;}
          sideWc = nw;
        }

        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        canvas.width = Math.round(cw * dpr);
        canvas.height = Math.round(ch * dpr);
        const s = canvas.width / LW;
        ctx.setTransform(s, 0, 0, s, 0, 0);

        sideW = sideWc;
        sideH = ch;
        setupSide();
      }
      setup();

      /* ============================================================
         六、物理与可达性
         ============================================================ */
      function touchScale(type) {
        if (type === 'smash') return 0.72;
        if (type === 'drop') return 0.95;
        return 1.0;
      }

      function reachParams() {
        const t0 = PRM.t_react;
        const t1 = Math.max(PRM.t_full, t0 + 0.05);
        const l0 = Math.log(REACH_P0 / (REACH_PMAX - REACH_P0));
        const l1 = Math.log(REACH_P1 / (REACH_PMAX - REACH_P1));
        const k = (l1 - l0) / (t1 - t0);
        const tMid = t0 - l0 / k;
        return {t0, t1, k, tMid};
      }

      function reachProb(tAvail) {
        const {k, tMid} = reachParams();
        return REACH_PMAX / (1 + Math.exp(-k * (tAvail - tMid)));
      }

      function cValue(type, y) {
        const d = -y;
        const ramp = (lo, hi) => {
          if (d <= lo) return 0;
          if (d >= hi) return 1;
          const u = (d - lo) / (hi - lo);
          return u * u * (3 - 2 * u);
        };
        if (type === 'smash') return 0.30 + 0.15 * (1 - ramp(1, 3));
        if (type === 'clear') {
          const depth = Math.max(0, Math.min(1, (d - 3.0) / 3.0));
          return 0.45 + 0.25 * depth;
        }
        return 0.30 + 0.20 * (1 - ramp(1, 3));
      }

      function landingKernel(type, y, oppDist) {
        const dn = -y;
        const baseCenter = type === 'smash' ? 5.8 : 1.9;
        const shiftK = type === 'drop' ? 0.8 : 0.5;
        const hShift = Math.max(0, Math.min(1.2, (HH_DEFAULT - PRM.hh) * 0.6));
        const center = Math.max(0.5, baseCenter - (4.6 - oppDist) * shiftK - hShift);
        const sigma = type === 'smash' ? 1.2 : 1.1;
        return Math.exp(-Math.pow((dn - center) / sigma, 2));
      }

      function v0WeightDrop(v0) {
        const lo = PRM.v0_drop_lo;
        const hi = PRM.v0_drop_hi;
        if (hi <= lo) return v0 >= lo ? 1 : 0;
        const u = (v0 - lo) / (hi - lo);
        return Math.exp(-2.5 * u * u);
      }

      function runTime(pos, Lp, type, vRun) {
        const dx = Lp.x - pos.x;
        const dy = Lp.y - pos.y;
        const dEff = Math.hypot(dx, dy);
        if (dEff < 1e-6) return 0;

        const rTouch = PRM.r_touch * touchScale(type);
        const dTouch = Math.max(0, dEff - rTouch);
        if (dTouch <= 0) return 0;

        const vr = (vRun != null) ? vRun : PRM.v_run_a;
        const ux = dx / dEff, uy = dy / dEff;
        const vSide = vr * V_SIDE_K;
        const vy = (uy >= 0 ? vr * V_FWD_K : vr / Math.max(1.0, PRM.k2));
        const vEff = 1 / Math.hypot(ux / vSide, uy / vy);
        return dTouch / vEff;
      }

      function pDef(pos, Lp, t, type, vRun) {
        const tau = runTime(pos, Lp, type, vRun);
        const tAvail = t - tau + (type === 'drop' ? DROP_EXTRA_T : 0);
        return reachProb(tAvail);
      }

      const LAMBDA_RUN = 0.6;

      function qRun(pos, item, vRun) {
        const tau = runTime(pos, item.L, item.type, vRun);
        return Math.exp(-LAMBDA_RUN * tau);
      }

      function smashSpeedFactor() {
        return Math.max(0.3, Math.min(1.0, (PRM.hh - NET_H + 0.3) / 1.0));
      }

      function getProbs() {
        const smashF = Math.max(0, Math.min(1, (PRM.hh - NET_H) / 0.8));
        const clearF = Math.max(0, Math.min(1, (PRM.hh - 1.0) / 1.0));
        const ps = PRM.p_smash / 100 * smashF;
        const pc = PRM.p_clear / 100 * clearF;
        const pd = PRM.p_drop / 100;
        const total = ps + pc + pd || 1;
        return {ps: ps / total, pc: pc / total, pd: pd / total};
      }

      function simulate(v0, h0, elevDeg, azimDeg, x0, y0, opts) {
        opts = opts || {};
        const maxOverNet = opts.maxOverNet;
        const minNetH = opts.minNetH != null ? opts.minNetH : NET_H;
        const trace = opts.trace || null;

        const elev = elevDeg * Math.PI / 180;
        const azim = azimDeg * Math.PI / 180;
        let px = x0, py = y0, pz = h0;
        let vx = v0 * Math.cos(elev) * Math.sin(azim);
        let vy = -v0 * Math.cos(elev) * Math.cos(azim);
        let vz = v0 * Math.sin(elev);
        let t = 0;
        const dt = AERO.dt;
        const dropLimit = (maxOverNet != null) ? NET_H + maxOverNet : Infinity;
        let crossedNet = false;
        let stepI = 0;

        while (t < AERO.tMax) {
          const sp = Math.hypot(vx, vy, vz);
          const km = AERO_K * cdOf(sp);
          vx += -km * sp * vx * dt;
          vy += -km * sp * vy * dt;
          vz += (-km * sp * vz - AERO.g) * dt;

          const nx = px + vx * dt;
          const ny = py + vy * dt;
          const nz = pz + vz * dt;

          if (py > 0 && ny <= 0) {
            const f = py / (py - ny);
            const zc = pz + (nz - pz) * f;
            if (zc < minNetH) return null;
            if (zc > dropLimit) return null;
            crossedNet = true;
          }
          if (crossedNet && nz > dropLimit) return null;

          if (nz <= 0) {
            const f = pz / (pz - nz);
            const rx = px + (nx - px) * f;
            const ry = py + (ny - py) * f;
            return {x: rx, y: ry, t: t + f * dt};
          }

          px = nx; py = ny; pz = nz;
          t += dt;

          if (trace) {
            stepI++;
            if (stepI % 24 === 0) trace.push(ny, nz);
          }
        }
        return null;
      }

      const ELEV_MIN = -80, ELEV_MAX = 88;
      const AZIM_MAX = 55;

      function probe(v0, hitter, elev, azim, halfW, maxOverNet) {
        const r = simulate(v0, PRM.hh, elev, azim, hitter.x, hitter.y, {maxOverNet});
        if (!r) return null;
        if (r.y >= 0 || r.y < -HL || Math.abs(r.x) > halfW) return null;
        return r;
      }

      function coarseElevRanges(v0, hitter, halfW, fast, maxOverNet, coarseMode) {
        const step = coarseMode ? 2.0 : (fast ? 1.2 : 0.8);
        const azims = coarseMode ? [0] : (fast ? [0] : [-20, -10, 0, 10, 20]);
        const ranges = [];
        let lo = null, last = null;

        for (let elev = ELEV_MIN; elev <= ELEV_MAX + 1e-9; elev += step) {
          let ok = false;
          for (const az of azims) {
            if (probe(v0, hitter, elev, az, halfW, maxOverNet)) {ok = true; break;}
          }
          if (ok) {
            if (lo === null) lo = elev;
            last = elev;
          } else if (lo !== null) {
            ranges.push([Math.max(ELEV_MIN, lo - step), Math.min(ELEV_MAX, last + step)]);
            lo = null; last = null;
          }
        }
        if (lo !== null) {
          ranges.push([Math.max(ELEV_MIN, lo - step), Math.min(ELEV_MAX, last + step)]);
        }
        return ranges;
      }

      /* ============================================================
         七、球路落点生成
         ============================================================ */
      const W_MIN_REL = 0.01;

      function genSmashLandings(hitter, fast) {
        const v0 = PRM.v0_smash * smashSpeedFactor();
        const halfW = mode === 'single' ? SINGLES_HW : HW;
        const azimSig = SHOT_AZIM_SIG.smash;

        const azimStep = fast ? 3 : 1.5;
        const elevStep = fast ? 1.5 : 0.5;
        const elevMaxUp = 10;

        const aLo = -AZIM_MAX;
        const aHi = AZIM_MAX;

        const landings = new Map();
        let maxW = 0;

        for (let azim = aLo; azim <= aHi + 1e-9; azim += azimStep) {
          const azimRad = azim * Math.PI / 180;
          const elevCrit = Math.atan2(
            (NET_H - PRM.hh) * Math.cos(azimRad),
            hitter.y
          ) * 180 / Math.PI;

          const elevLo = Math.max(ELEV_MIN, elevCrit);
          const elevHi = Math.min(ELEV_MAX, elevMaxUp);
          if (elevLo > elevHi) continue;

          for (let elev = elevLo; elev <= elevHi + 1e-9; elev += elevStep) {
            const r = probe(v0, hitter, elev, azim, halfW, null);
            if (!r) continue;

            const w = Math.exp(-Math.pow(azim / azimSig, 2))
              * landingKernel('smash', r.y, hitter.y);
            if (w <= 1e-12) continue;
            if (w > maxW) maxW = w;

            const key = elev.toFixed(2) + '_' + azim.toFixed(2);
            if (!landings.has(key)) {
              landings.set(key, {x: r.x, y: r.y, type: 'smash', w, t: r.t, v0, elev, azim});
            }
          }
        }

        if (maxW <= 1e-9) return [];
        const th = maxW * W_MIN_REL;
        return Array.from(landings.values()).filter(Ld => Ld.w >= th);
      }

      function genDropLandings(hitter, fast) {
        const halfW = mode === 'single' ? SINGLES_HW : HW;
        const azimSig = SHOT_AZIM_SIG.drop;
        const maxOverNet = PRM.dropMaxOverNet;
        const vLo = PRM.v0_drop_lo;
        const vHi = Math.max(vLo + 1, PRM.v0_drop_hi);

        const aLo = Math.max(-AZIM_MAX, -1.5 * azimSig);
        const aHi = Math.min(AZIM_MAX, 1.5 * azimSig);

        const nCoarse = fast ? 3 : 5;
        const validV0 = [];
        for (let k = 0; k < nCoarse; k++) {
          const v0 = vLo * Math.pow(vHi / vLo, k / (nCoarse - 1));
          const ranges = coarseElevRanges(v0, hitter, halfW, fast, maxOverNet, true);
          if (ranges.length) validV0.push(v0);
        }
        if (!validV0.length) return [];

        const v0Final = [];
        for (let k = 0; k < validV0.length; k++) {
          v0Final.push(validV0[k]);
          if (k + 1 < validV0.length) v0Final.push(Math.sqrt(validV0[k] * validV0[k + 1]));
        }

        const elevStep = fast ? 0.8 : 0.30;
        const azimStep = fast ? 6 : 3;
        const landings = new Map();
        let maxW = 0;

        for (const v0 of v0Final) {
          const ranges = coarseElevRanges(v0, hitter, halfW, fast, maxOverNet, false);
          if (!ranges.length) continue;
          const vw = v0WeightDrop(v0);

          for (const [lo, hi] of ranges) {
            for (let elev = lo; elev <= hi + 1e-9; elev += elevStep) {
              for (let azim = aLo; azim <= aHi + 1e-9; azim += azimStep) {
                const r = probe(v0, hitter, elev, azim, halfW, maxOverNet);
                if (!r) continue;
                const w = Math.exp(-Math.pow(azim / azimSig, 2))
                  * landingKernel('drop', r.y, hitter.y)
                  * vw;
                if (w <= 1e-12) continue;
                if (w > maxW) maxW = w;
                const key = v0.toFixed(1) + '_' + elev.toFixed(2) + '_' + azim.toFixed(2);
                if (!landings.has(key)) {
                  landings.set(key, {x: r.x, y: r.y, type: 'drop', w, t: r.t, v0, elev, azim});
                }
              }
            }
          }
        }
        const th = maxW * W_MIN_REL;
        return Array.from(landings.values()).filter(Ld => Ld.w >= th);
      }

      function genClearLandings(hitter, fast) {
        const halfW = mode === 'single' ? SINGLES_HW : HW;
        const azimSig = SHOT_AZIM_SIG.clear;
        const lineY = -PRM.clearLineY;
        const netMinH = PRM.clearHeight;

        const elevLo = -10, elevHi = 60;
        const elevStep = fast ? 2.0 : 0.6;
        const azimStep = fast ? 5 : 2.0;
        const aLo = Math.max(-AZIM_MAX, -1.5 * azimSig);
        const aHi = Math.min(AZIM_MAX, 1.5 * azimSig);
        const nCoarse = fast ? 3 : 5;

        let vLo = PRM.v0_clear_lo;
        let vHi = Math.max(vLo + 1, PRM.v0_clear_hi);

        for (let attempt = 0; attempt < 6; attempt++) {
          const coarseV0 = [];
          for (let k = 0; k < nCoarse; k++)
            coarseV0.push(vLo * Math.pow(vHi / vLo, k / (nCoarse - 1)));
          const v0Final = [];
          for (let k = 0; k < coarseV0.length; k++) {
            v0Final.push(coarseV0[k]);
            if (k + 1 < coarseV0.length)
              v0Final.push(Math.sqrt(coarseV0[k] * coarseV0[k + 1]));
          }

          const mid = vLo + (vHi - vLo) * 0.55;
          const sig = Math.max(0.5, (vHi - vLo) * 0.40);

          const landings = new Map();
          let maxW = 0;

          for (const v0 of v0Final) {
            const vw = Math.exp(-Math.pow((v0 - mid) / sig, 2));
            for (let elev = elevLo; elev <= elevHi + 1e-9; elev += elevStep) {
              for (let azim = aLo; azim <= aHi + 1e-9; azim += azimStep) {
                const r = simulate(v0, PRM.hh, elev, azim, hitter.x, hitter.y, {
                  minNetH: netMinH
                });
                if (!r) continue;
                if (r.y >= 0 || r.y < -HL || Math.abs(r.x) > halfW) continue;
                if (r.y > lineY) continue;

                const w = Math.exp(-Math.pow(azim / azimSig, 2)) * vw;
                if (w <= 1e-12) continue;
                if (w > maxW) maxW = w;

                const key = v0.toFixed(1) + '_' + elev.toFixed(1) + '_' + azim.toFixed(1);
                if (!landings.has(key)) {
                  landings.set(key, {x: r.x, y: r.y, type: 'clear', w, t: r.t, v0, elev, azim});
                }
              }
            }
          }

          if (landings.size > 0) {
            const th = maxW * W_MIN_REL;
            return Array.from(landings.values()).filter(Ld => Ld.w >= th);
          }

          vLo *= 1.12;
          vHi *= 1.12;
        }
        return [];
      }

      function genLandings(type, hitter, fast) {
        if (type === 'drop') return genDropLandings(hitter, fast);
        if (type === 'clear') return genClearLandings(hitter, fast);
        return genSmashLandings(hitter, fast);
      }

      let cachedLandings = [];

      function rebuildLandings(probs, fast) {
        const hitter = opponents[0];
        const out = [];
        for (const type of SHOT_TYPES) {
          const arr = genLandings(type, hitter, fast);
          if (!arr.length) continue;

          let sumW = 0;
          for (const Ld of arr) sumW += Ld.w;
          if (sumW <= 1e-9) continue;

          const targetW = type === 'smash' ? probs.ps
            : type === 'clear' ? probs.pc
              : probs.pd;
          const scale = targetW / sumW;

          for (const Ld of arr) {
            out.push({
              x: Ld.x, y: Ld.y, type, w: Ld.w * scale, t: Ld.t,
              v0: Ld.v0, elev: Ld.elev, azim: Ld.azim
            });
          }
        }
        cachedLandings = out;
      }

      function buildItemsFromLandings(landings, cellSize) {
        const buckets = new Map();
        for (const Ld of landings) {
          if (Ld.w <= 0) continue;
          const gx = Math.round(Ld.x / cellSize);
          const gy = Math.round(Ld.y / cellSize);
          const tBin = Math.round(Ld.t / 0.12);
          const key = Ld.type + '_' + gx + '_' + gy + '_' + tBin;
          let b = buckets.get(key);
          if (!b) {b = {sx: 0, sy: 0, w: 0, tSum: 0, type: Ld.type}; buckets.set(key, b);}
          b.sx += Ld.x * Ld.w;
          b.sy += Ld.y * Ld.w;
          b.w += Ld.w;
          b.tSum += Ld.t * Ld.w;
        }
        const items = [];
        for (const b of buckets.values()) {
          if (b.w <= 1e-9) continue;
          items.push({
            L: {x: b.sx / b.w, y: b.sy / b.w},
            w: b.w,
            type: b.type,
            t: b.tSum / b.w
          });
        }
        return items;
      }

      function avgReachByType(items, P1, P2, v1, v2) {
        const acc = {
          smash: {s: 0, w: 0},
          clear: {s: 0, w: 0},
          drop: {s: 0, w: 0}
        };
        for (const it of items) {
          const pa = pDef(P1, it.L, it.t, it.type, v1);
          let r = pa;
          if (P2) {
            const pb = pDef(P2, it.L, it.t, it.type, v2);
            r = 1 - (1 - pa) * (1 - pb);
          }
          acc[it.type].s += r * it.w;
          acc[it.type].w += it.w;
        }
        const out = {};
        for (const k in acc) {
          out[k] = acc[k].w > 0 ? acc[k].s / acc[k].w : 0;
        }
        return out;
      }

      /* ============================================================
         八、站位优化
         ============================================================ */
      function itemV(pos1, pos2, item, v1, v2) {
        const pa = pDef(pos1, item.L, item.t, item.type, v1) * qRun(pos1, item, v1);
        let r = pa;
        if (pos2) {
          const pb = pDef(pos2, item.L, item.t, item.type, v2) * qRun(pos2, item, v2);
          r = 1 - (1 - pa) * (1 - pb);
        }
        const c = cValue(item.type, item.L.y);
        return r * (c + 1) - 1;
      }

      function overlapPenalty(a, b) {
        const sep = Math.hypot(a.x - b.x, a.y - b.y);
        return sep < SEP_MIN_DIST
          ? SEP_PEN_K * Math.pow((SEP_MIN_DIST - sep) / SEP_MIN_DIST, 2)
          : 0;
      }

      function totalV(pos, items, otherPos, v1, v2) {
        let sumWV = 0, sumW = 0;
        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          sumWV += it.w * itemV(pos, otherPos, it, v1, v2);
          sumW += it.w;
        }
        return sumW > 0 ? sumWV / sumW : -1;
      }

      function optimizeSolo(items, step) {
        const x0 = -HW + 0.30, x1 = HW - 0.30;
        const y0 = -HL + 0.40, y1 = -0.5;
        const vA = PRM.v_run_a;

        let bestPos = null, bestV = -Infinity;
        for (let x = x0; x <= x1 + 1e-9; x += step) {
          for (let y = y0; y <= y1 + 1e-9; y += step) {
            const v = totalV({x, y}, items, null, vA, vA);
            if (v > bestV) {bestV = v; bestPos = {x, y};}
          }
        }
        if (!bestPos) return {x: 0, y: -4.0};

        let ax = bestPos.x, ay = bestPos.y, av = bestV;
        const STEP = [-0.1, -0.05, 0.05, 0.1];
        for (let round = 0; round < 60; round++) {
          let improved = false;
          for (const dx of STEP) for (const dy of STEP) {
            const nx = ax + dx, ny = ay + dy;
            if (nx < x0 || nx > x1 || ny < y0 || ny > y1) continue;
            const v = totalV({x: nx, y: ny}, items, null, vA, vA);
            if (v > av + 1e-9) {ax = nx; ay = ny; av = v; improved = true;}
          }
          if (!improved) break;
        }
        return {x: ax, y: ay};
      }

      function optimizeDouble(items, fast) {
        const N = items.length;
        if (!N) return [{x: -1.5, y: -3}, {x: 1.5, y: -3}];

        const vA = PRM.v_run_a, vB = PRM.v_run_b;

        const aArr = new Float64Array(N);
        let sumW = 0;
        for (let i = 0; i < N; i++) {
          sumW += items[i].w;
          aArr[i] = items[i].w * (cValue(items[i].type, items[i].L.y) + 1);
        }

        const gridStep = fast ? 0.6 : 0.4;
        const xs = [], ys = [];
        for (let x = -2.6; x <= 2.6 + 1e-9; x += gridStep) xs.push(+x.toFixed(2));
        for (let y = -0.5; y >= -6.3 - 1e-9; y -= gridStep) ys.push(+y.toFixed(2));

        const pos = [];
        for (const y of ys) for (const x of xs) pos.push({x, y});
        const M = pos.length;

        const PA = new Array(M), PB = new Array(M);
        const SA = new Float64Array(M), SB = new Float64Array(M);
        for (let p = 0; p < M; p++) {
          const arrA = new Float64Array(N);
          const arrB = new Float64Array(N);
          let sa = 0, sb = 0;
          for (let i = 0; i < N; i++) {
            const it = items[i];
            const pa = pDef(pos[p], it.L, it.t, it.type, vA) * qRun(pos[p], it, vA);
            const pb = pDef(pos[p], it.L, it.t, it.type, vB) * qRun(pos[p], it, vB);
            arrA[i] = pa; arrB[i] = pb;
            sa += aArr[i] * pa; sb += aArr[i] * pb;
          }
          PA[p] = arrA; PB[p] = arrB; SA[p] = sa; SB[p] = sb;
        }

        let bi = 0, bj = 0, bs = -Infinity;
        for (let i = 0; i < M; i++) {
          const Pi = PA[i];
          const pi = pos[i];
          for (let j = 0; j < M; j++) {
            const Pj = PB[j];
            let s = SA[i] + SB[j];
            for (let k = 0; k < N; k++) s -= aArr[k] * Pi[k] * Pj[k];
            const V = (s - sumW) / sumW - overlapPenalty(pi, pos[j]);
            if (V > bs) {bs = V; bi = i; bj = j;}
          }
        }

        let pA = {x: pos[bi].x, y: pos[bi].y};
        let pB = {x: pos[bj].x, y: pos[bj].y};
        let bestV = bs;

        const scoreAt = (a, b) => {
          let s = 0;
          for (let k = 0; k < N; k++) {
            const it = items[k];
            const pa = pDef(a, it.L, it.t, it.type, vA) * qRun(a, it, vA);
            const pb = pDef(b, it.L, it.t, it.type, vB) * qRun(b, it, vB);
            const r = 1 - (1 - pa) * (1 - pb);
            s += aArr[k] * r;
          }
          return (s - sumW) / sumW - overlapPenalty(a, b);
        };

        const clampX = v => clamp(v, -2.7, 2.7);
        const clampY = v => clamp(v, -6.3, -0.5);
        const STEP = fast ? [-0.2, 0.2] : [-0.2, -0.1, -0.05, 0.05, 0.1, 0.2];

        for (let round = 0; round < 6; round++) {
          let improved = false;

          let bv = bestV, bA = pA;
          for (const dx of STEP) for (const dy of STEP) {
            const cand = {x: clampX(pA.x + dx), y: clampY(pA.y + dy)};
            const v = scoreAt(cand, pB);
            if (v > bv + 1e-9) {bv = v; bA = cand;}
          }
          if (bv > bestV + 1e-9) {pA = bA; bestV = bv; improved = true;}

          bv = bestV; let bB = pB;
          for (const dx of STEP) for (const dy of STEP) {
            const cand = {x: clampX(pB.x + dx), y: clampY(pB.y + dy)};
            const v = scoreAt(pA, cand);
            if (v > bv + 1e-9) {bv = v; bB = cand;}
          }
          if (bv > bestV + 1e-9) {pB = bB; bestV = bv; improved = true;}

          if (!improved) break;
        }

        return [pA, pB];
      }

      function solve(fast) {
        const stepPos = fast ? 0.45 : 0.20;

        const probs = getProbs();
        rebuildLandings(probs, fast);

        let highTMin = null;
        for (const Ld of cachedLandings) {
          if (Ld.type === 'clear') {
            if (highTMin == null || Ld.t < highTMin) highTMin = Ld.t;
          }
        }

        const cellSize = fast ? 0.35 : 0.18;
        let items = buildItemsFromLandings(cachedLandings, cellSize);

        if (!items.length) {
          items = [{L: {x: 0, y: -PRM.clearLineY}, w: 1, type: 'clear', t: 0.6}];
        }

        const precise = !fast;
        const vA = PRM.v_run_a, vB = PRM.v_run_b;

        if (mode === 'single') {
          const P1 = optimizeSolo(items, stepPos);
          return {P1, P2: null, valid: true, precise, reachStats: avgReachByType(items, P1, null, vA, vA), highTMin};
        }

        const [P1, P2] = optimizeDouble(items, fast);
        return {P1, P2, valid: true, precise, reachStats: avgReachByType(items, P1, P2, vA, vB), highTMin};
      }

      /* ============================================================
         九、主视图绘制
         ============================================================ */
      function drawCourtBase() {
        const tl = w2c({x: -HW, y: HL}), br = w2c({x: HW, y: -HL});
        ctx.fillStyle = '#f7fbf9';
        ctx.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
      }

      function drawCourtLines() {
        const tl = w2c({x: -HW, y: HL}), br = w2c({x: HW, y: -HL});
        const w = br.x - tl.x, h = br.y - tl.y;

        ctx.strokeStyle = C_COURT_LINE; ctx.lineWidth = 1.3; ctx.setLineDash([]);
        for (const yy of [HL, HL - LONG_SVC, SHORT_SVC, -SHORT_SVC, -(HL - LONG_SVC), -HL]) {
          lineStroke(w2c({x: -HW, y: yy}), w2c({x: HW, y: yy}));
        }
        for (const xx of [-HW, HW, -SINGLES_HW, SINGLES_HW]) {
          lineStroke(w2c({x: xx, y: -HL}), w2c({x: xx, y: HL}));
        }
        for (const s of [-1, 1]) {
          lineStroke(w2c({x: 0, y: s * SHORT_SVC}), w2c({x: 0, y: s * HL}));
        }

        ctx.strokeStyle = C_COURT_FRAME; ctx.lineWidth = 2.2;
        ctx.strokeRect(tl.x, tl.y, w, h);

        const n1 = w2c({x: -HW, y: 0}), n2 = w2c({x: HW, y: 0});
        ctx.beginPath(); ctx.strokeStyle = C_NET; ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.moveTo(n1.x, n1.y); ctx.lineTo(n2.x, n2.y); ctx.stroke();
        ctx.lineCap = 'butt';

        ctx.save();
        ctx.setLineDash([3, 4]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = C_REF_BLUE;
        for (const dn of [DROP_NEAR_EDGE, DROP_FAR_EDGE]) {
          lineStroke(w2c({x: -HW, y: -dn}), w2c({x: HW, y: -dn}));
        }
        ctx.setLineDash([2, 6]);
        ctx.strokeStyle = C_REF_RED;
        const ly = PRM.clearLineY;
        lineStroke(w2c({x: -HW, y: -ly}), w2c({x: HW, y: -ly}));
        ctx.restore();
      }

      function drawCourtTags() {
        const tagRightX = w2c({x: -HW, y: 0}).x - 6;
        const lineV = PRM.clearLineY.toFixed(1) + ' m';

        drawCourtTag(t('lblNearDrop'), nearDropLabel(), tagRightX, w2c({x: 0, y: -DROP_NEAR_EDGE}).y, '#1f6f8b', 'right');
        drawCourtTag(t('lblFrontPen'), lineV, tagRightX, w2c({x: 0, y: -PRM.clearLineY}).y - 8, '#c0392b', 'right');
        drawCourtTag(t('lblFarDrop'), farDropLabel(), tagRightX, w2c({x: 0, y: -DROP_FAR_EDGE}).y + 8, '#1f6f8b', 'right');
        drawCourtTag(t('net'), null, tagRightX, w2c({x: 0, y: 0}).y, C_NET, 'right');
      }

      /* ---- 主视图热力图 ---- */
      const heatCanvas = document.createElement('canvas');
      const heatCtx = heatCanvas.getContext('2d');
      let heatDirty = true;

      function buildLandingHeatmap(landings) {
        const cell = HEAT_CELL;
        const xMin = -HW, yMin = -HL;
        const GW = Math.ceil(2 * HW / cell) + 1;
        const GH = Math.ceil(HL / cell) + 1;

        const smash = new Float32Array(GW * GH);
        const clear = new Float32Array(GW * GH);
        const drop = new Float32Array(GW * GH);

        const inv2s2 = 1 / (2 * HEAT_SIGMA * HEAT_SIGMA);
        const r = 3 * HEAT_SIGMA;

        for (const Ld of landings) {
          const arr = Ld.type === 'smash' ? smash : Ld.type === 'clear' ? clear : drop;
          const i0 = Math.max(0, Math.floor((Ld.x - r - xMin) / cell));
          const i1 = Math.min(GW - 1, Math.ceil((Ld.x + r - xMin) / cell));
          const j0 = Math.max(0, Math.floor((Ld.y - r - yMin) / cell));
          const j1 = Math.min(GH - 1, Math.ceil((Ld.y + r - yMin) / cell));
          for (let j = j0; j <= j1; j++) {
            const gy = yMin + j * cell;
            const dy = gy - Ld.y;
            const dy2 = dy * dy;
            for (let i = i0; i <= i1; i++) {
              const gx = xMin + i * cell;
              const dx = gx - Ld.x;
              arr[j * GW + i] += Ld.w * Math.exp(-(dx * dx + dy2) * inv2s2);
            }
          }
        }

        let maxV = 0;
        for (let k = 0; k < GW * GH; k++) {
          const tt = smash[k] + clear[k] + drop[k];
          if (tt > maxV) maxV = tt;
        }
        return {GW, GH, cell, xMin, yMin, smash, clear, drop, max: maxV || 1};
      }

      function computeLandingHeat() {
        if (!result.valid || !cachedLandings.length) {heatDirty = false; return;}

        const W = canvas.width, H = canvas.height;
        if (heatCanvas.width !== W || heatCanvas.height !== H) {
          heatCanvas.width = W;
          heatCanvas.height = H;
        }

        const grid = buildLandingHeatmap(cachedLandings);
        const {GW, GH, cell, xMin, yMin, smash, clear, drop, max} = grid;
        const invMax = 1 / max;

        const img = heatCtx.createImageData(W, H);
        const data = img.data;

        const sx = W / LW, sy = H / LH;

        for (let py = 0; py < H; py++) {
          const wy = HL - (py / sy - PAD_T) / SCALE;
          if (wy > 0 || wy < -HL) continue;
          const fy = (wy - yMin) / cell;
          const j0raw = Math.floor(fy);
          const ty = fy - j0raw;
          let jA, jB, tY;
          if (j0raw < 0) {jA = 0; jB = 0; tY = 0;}
          else if (j0raw > GH - 2) {jA = GH - 1; jB = GH - 1; tY = 0;}
          else {jA = j0raw; jB = j0raw + 1; tY = ty;}

          for (let px = 0; px < W; px++) {
            const wx = (px / sx - PAD_L) / SCALE - HW;
            if (wx > HW || wx < -HW) continue;
            const fx = (wx - xMin) / cell;
            const i0raw = Math.floor(fx);
            const tx = fx - i0raw;
            let iA, iB, tX;
            if (i0raw < 0) {iA = 0; iB = 0; tX = 0;}
            else if (i0raw > GW - 2) {iA = GW - 1; iB = GW - 1; tX = 0;}
            else {iA = i0raw; iB = i0raw + 1; tX = tx;}

            const idx00 = jA * GW + iA, idx10 = jA * GW + iB, idx01 = jB * GW + iA, idx11 = jB * GW + iB;
            const s = (smash[idx00] * (1 - tX) + smash[idx10] * tX) * (1 - tY) + (smash[idx01] * (1 - tX) + smash[idx11] * tX) * tY;
            const c = (clear[idx00] * (1 - tX) + clear[idx10] * tX) * (1 - tY) + (clear[idx01] * (1 - tX) + clear[idx11] * tX) * tY;
            const d = (drop[idx00] * (1 - tX) + drop[idx10] * tX) * (1 - tY) + (drop[idx01] * (1 - tX) + drop[idx11] * tX) * tY;

            const sum = s + c + d;
            const o = (py * W + px) * 4;
            if (sum < max * HEAT_CUT) continue;

            const norm = Math.min(1, Math.sqrt(sum * invMax));
            const inv = 1 / sum;
            data[o] = (s * HEAT_RGB.smash[0] + c * HEAT_RGB.clear[0] + d * HEAT_RGB.drop[0]) * inv;
            data[o + 1] = (s * HEAT_RGB.smash[1] + c * HEAT_RGB.clear[1] + d * HEAT_RGB.drop[1]) * inv;
            data[o + 2] = (s * HEAT_RGB.smash[2] + c * HEAT_RGB.clear[2] + d * HEAT_RGB.drop[2]) * inv;
            data[o + 3] = Math.min(225, norm * 215);
          }
        }
        heatCtx.putImageData(img, 0, 0);
        heatDirty = false;
      }

      function drawHeat() {
        if (!showHeat || !result.valid) return;
        if (heatCanvas.width !== canvas.width || heatCanvas.height !== canvas.height) heatDirty = true;
        if (heatDirty) computeLandingHeat();
        if (heatCanvas.width < 2) return;

        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(heatCanvas, 0, 0, LW, LH);
        ctx.restore();
      }

      function drawOpponent() {
        const p = opponents[0], c = w2c(p);

        ctx.beginPath(); ctx.fillStyle = 'rgba(0,0,0,.10)';
        ctx.arc(c.x, c.y, 21, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.3;
        ctx.setLineDash([3, 3]); ctx.arc(c.x, c.y, 15, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath(); ctx.fillStyle = C_PERSON;
        ctx.arc(c.x, c.y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

        drawLabelWithHalo(lang === 'zh' ? '对手' : 'Opp', c.x, c.y - 11, C_PERSON, FONT_PLAYER, 'center', 'bottom');
      }

      function speedDotRadius(vRun) {
        const k = (vRun != null ? vRun : SPEED_BASE) / SPEED_BASE;
        return 8 * clamp(0.45 + 0.55 * k, 0.62, 1.60);
      }

      function speedTag(v, otherV) {
        const d = v - otherV;
        if (Math.abs(d) < 0.05) return '';
        return d > 0 ? t('tagFast') : t('tagSlow');
      }

      function drawOurPoint(p, label, vRun) {
        const c = w2c(p);
        const col = result.precise ? C_PERSON : C_PERSON_PENDING;
        const lineCol = result.precise ? 'rgba(0,0,0,.30)' : C_PERSON_PENDING_LINE;
        const rad = speedDotRadius(vRun);
        const arm = rad * 1.9;

        ctx.beginPath(); ctx.fillStyle = col;
        ctx.arc(c.x, c.y, rad, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

        ctx.save();
        ctx.strokeStyle = lineCol; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
        ctx.beginPath();
        ctx.moveTo(c.x - arm, c.y); ctx.lineTo(c.x + arm, c.y);
        ctx.moveTo(c.x, c.y - arm); ctx.lineTo(c.x, c.y + arm);
        ctx.stroke();
        ctx.restore();

        drawLabelWithHalo(label, c.x, c.y + rad + 3, col, FONT_OUR, 'center', 'top');
      }

      function drawOurs() {
        if (!result.valid) return;

        const vA = PRM.v_run_a, vB = PRM.v_run_b;

        if (mode === 'single') {
          if (result.P1) drawOurPoint(result.P1, t('ourSolo'), vA);
          return;
        }

        const P1 = result.P1, P2 = result.P2;
        if (!P1 || !P2) return;

        const dX = Math.abs(P1.x - P2.x);
        const dY = Math.abs(P1.y - P2.y);

        let baseA, baseB;
        if (dX >= dY) {
          const aIsLeft = P1.x <= P2.x;
          baseA = aIsLeft ? t('labelLeft') : t('labelRight');
          baseB = aIsLeft ? t('labelRight') : t('labelLeft');
        } else {
          const aIsRear = P1.y < P2.y;
          baseA = aIsRear ? t('ourBack') : t('ourFront');
          baseB = aIsRear ? t('ourFront') : t('ourBack');
        }

        drawOurPoint(P1, speedTag(vA, vB) + baseA, vA);
        drawOurPoint(P2, speedTag(vB, vA) + baseB, vB);
      }

      function draw() {
        ctx.clearRect(0, 0, LW, LH);
        drawCourtBase();
        drawHeat();
        drawCourtLines();
        drawOpponent();
        drawOurs();
        drawCourtTags();
      }

      /* ============================================================
         十、DOM 引用与 UI
         ============================================================ */
      const infoLine = $('infoLine');
      const pageSub = $('pageSub');
      const pageTitle = $('pageTitle');
      const modeToggle = $('modeToggle');
      const pillKill = $('pillKill');
      const pillDrop = $('pillDrop');
      const pillClear = $('pillClear');
      const pillHeight = $('pillHeight');
      const footerText = $('footerText');
      const sidebarTitle = $('sidebarTitle');
      const resetBtn = $('resetBtn');
      const appEl = $('app');
      const collapseBtn = $('collapseBtn');
      const langBtnEl = $('langBtn');

      function updatePill(el, p, rgb) {
        const pct = Math.round(p * 100);
        el.textContent = el.dataset.label + ' ' + pct + '%';
        const k = Math.min(1, p / 0.70);
        el.style.background = `rgba(${rgb}, ${0.10 + 0.68 * k})`;
        el.style.borderColor = `rgba(${rgb}, ${0.18 + 0.42 * k})`;
        el.style.color = (p > 0.42) ? '#ffffff' : `rgb(${rgb})`;
      }

      function updateHeightPill() {
        pillHeight.textContent = t('pillHeight') + ' ' + PRM.hh.toFixed(1) + 'm';
        const k = clamp((PRM.hh - 0.8) / 2.7, 0, 1);
        const rgb = k < 0.5 ? '192,57,43' : '31,111,139';
        pillHeight.style.background = `rgba(${rgb}, ${0.12 + 0.22 * k})`;
        pillHeight.style.borderColor = `rgba(${rgb}, ${0.28 + 0.28 * k})`;
        pillHeight.style.color = (k > 0.6) ? '#1f6f8b' : `rgb(${rgb})`;
      }

      function updateStats() {
        if (!result.valid) return;

        const single = mode === 'single';
        const probs = getProbs();

        updatePill(pillKill, probs.ps, SHOT_RGB.kill);
        updatePill(pillDrop, probs.pd, SHOT_RGB.drop);
        updatePill(pillClear, probs.pc, SHOT_RGB.clear);
        updateHeightPill();

        const ps = Math.round(probs.ps * 100);
        const pc = Math.round(probs.pc * 100);
        const pd = Math.round(probs.pd * 100);
        const hhStr = PRM.hh.toFixed(1);
        const shotPart = t('infoSmash') + ' ' + ps + '% / ' + t('infoClear') + ' ' + pc + '% / ' + t('infoDrop') + ' ' + pd + '%';
        const heatPart = showHeat ? ' · ' + t('infoHeatOn') : '';
        const highPart = (result.highTMin != null)
          ? ' · ' + t('infoHighMin') + ' ' + result.highTMin.toFixed(2) + 's'
          : '';

        const rs = result.reachStats;
        let reachPart = '';
        if (rs) {
          const sm = Math.round((rs.smash || 0) * 100);
          const cl = Math.round((rs.clear || 0) * 100);
          const dr = Math.round((rs.drop || 0) * 100);
          reachPart = ' · ' + t('infoReachSmash') + ' ' + sm + '% / ' +
            t('infoReachClear') + ' ' + cl + '% / ' +
            t('infoReachDrop') + ' ' + dr + '%';
        }

        if (single) {
          infoLine.innerHTML =
            t('infoContact') + ' <b>' + hhStr + 'm</b> · ' + shotPart + reachPart + highPart + heatPart;
          return;
        }

        const dist = Math.hypot(result.P2.x - result.P1.x, result.P2.y - result.P1.y);
        infoLine.innerHTML =
          t('infoContact') + ' <b>' + hhStr + 'm</b> · ' + shotPart + reachPart +
          ' · ' + t('infoGap') + ' <b>' + dist.toFixed(1) + 'm</b>' + highPart + heatPart;
      }

      function fmtSliderVal(val, step, isProb) {
        if (step >= 1) return Math.round(val) + (isProb ? '%' : '');
        const digits = step < 0.1 ? 2 : 1;
        return val.toFixed(digits);
      }

      let reachCurveCanvas = null;
      let reachCurveCaption = null;

      function drawReachCurve() {
        if (!reachCurveCanvas) return;
        const el = reachCurveCanvas;
        const W = el.clientWidth || 240;
        const H = el.clientHeight || 64;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const cw = Math.round(W * dpr), chh = Math.round(H * dpr);
        if (el.width !== cw || el.height !== chh) {el.width = cw; el.height = chh;}
        const c = el.getContext('2d');
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        c.clearRect(0, 0, W, H);

        const padL = 24, padR = 8, padT = 6, padB = 14;
        const plotW = Math.max(10, W - padL - padR);
        const plotH = Math.max(10, H - padT - padB);

        const {t0, t1} = reachParams();
        const tMax = Math.max(1.0, t1 + 0.3);

        const xOf = tt => padL + (tt / tMax) * plotW;
        const yOf = p => padT + (1 - p) * plotH;

        c.strokeStyle = 'rgba(31,138,91,0.10)';
        c.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
          const y = padT + (plotH / 4) * i;
          c.beginPath(); c.moveTo(padL, y); c.lineTo(padL + plotW, y); c.stroke();
        }

        c.strokeStyle = 'rgba(31,138,91,0.30)';
        c.setLineDash([3, 3]);
        c.beginPath(); c.moveTo(padL, yOf(0.5)); c.lineTo(padL + plotW, yOf(0.5)); c.stroke();
        c.setLineDash([]);

        c.strokeStyle = 'rgba(192,57,43,0.35)';
        c.beginPath(); c.moveTo(xOf(t0), padT); c.lineTo(xOf(t0), padT + plotH); c.stroke();
        c.strokeStyle = 'rgba(31,111,139,0.35)';
        c.beginPath(); c.moveTo(xOf(t1), padT); c.lineTo(xOf(t1), padT + plotH); c.stroke();

        c.beginPath();
        const N = 96;
        for (let i = 0; i <= N; i++) {
          const tt = (i / N) * tMax;
          const p = reachProb(tt);
          const x = xOf(tt), y = yOf(p);
          if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
        }
        c.lineTo(xOf(tMax), yOf(0));
        c.lineTo(xOf(0), yOf(0));
        c.closePath();
        c.fillStyle = 'rgba(31,138,91,0.10)';
        c.fill();

        c.beginPath();
        c.strokeStyle = '#1f8a5b';
        c.lineWidth = 2;
        c.lineJoin = 'round';
        for (let i = 0; i <= N; i++) {
          const tt = (i / N) * tMax;
          const p = reachProb(tt);
          const x = xOf(tt), y = yOf(p);
          if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
        }
        c.stroke();

        c.fillStyle = '#8a9a91';
        c.font = '9px system-ui';
        c.textAlign = 'right';
        c.textBaseline = 'middle';
        c.fillText('100%', padL - 3, padT + 2);
        c.fillText('0%', padL - 3, padT + plotH - 2);
        c.textAlign = 'center';
        c.textBaseline = 'top';
        c.fillText('0s', padL, padT + plotH + 2);
        c.fillText(tMax.toFixed(1) + 's', padL + plotW, padT + plotH + 2);

        const p0 = reachProb(t0);
        const p1 = reachProb(t1);
        c.fillStyle = '#c0392b';
        c.beginPath(); c.arc(xOf(t0), yOf(p0), 3, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#1f6f8b';
        c.beginPath(); c.arc(xOf(t1), yOf(p1), 3, 0, Math.PI * 2); c.fill();

        if (reachCurveCaption) {
          reachCurveCaption.textContent = t('curveCaption')(t0, p0 * 100, t1, p1 * 100);
        }
      }

      /* ============================================================
         十一、参数面板
         ============================================================ */
      const sliderInputs = {};
      const sliderVals = {};

      function refreshProbSliders() {
        for (const k of PROB_KEYS) {
          if (sliderInputs[k]) {
            sliderInputs[k].value = Math.round(PRM[k]);
            sliderVals[k].textContent = Math.round(PRM[k]) + '%';
          }
        }
      }

      function syncProbs(changedKey) {
        const others = PROB_KEYS.filter(k => k !== changedKey);
        const remain = Math.max(0, 100 - PRM[changedKey]);
        const sumOthers = PRM[others[0]] + PRM[others[1]];
        const r0 = sumOthers < 1e-6 ? remain / 2 : remain * PRM[others[0]] / sumOthers;
        PRM[others[0]] = r0;
        PRM[others[1]] = remain - r0;
      }

      function buildSliders() {
        const root = $('sliders');
        root.innerHTML = '';
        Object.keys(sliderInputs).forEach(k => delete sliderInputs[k]);
        Object.keys(sliderVals).forEach(k => delete sliderVals[k]);
        reachCurveCanvas = null;
        reachCurveCaption = null;

        const groups = {};
        for (const d of SLIDER_DEFS) {
          if (!groups[d.group]) groups[d.group] = [];
          groups[d.group].push(d);
        }

        const groupTitles = {speed: 'gSpeed', prob: 'gProb', reach: 'gReach', filter: 'gFilter'};
        const groupHints = {speed: 'gSpeedHint', prob: 'gProbHint', reach: 'gReachHint', filter: 'gFilterHint'};
        let syncing = false;

        for (const gname of Object.keys(groups)) {
          const gEl = document.createElement('div');
          gEl.className = 's-group';

          const title = document.createElement('div');
          title.className = 's-title';
          title.innerHTML = `<span>${t(groupTitles[gname])}</span><span>${t(groupHints[gname])}</span>`;
          gEl.appendChild(title);

          const grid = document.createElement('div');
          grid.className = 's-grid';

          for (const d of groups[gname]) {
            const item = document.createElement('div');
            item.className = 's-item';

            const label = document.createElement('span');
            label.textContent = t('sl_' + d.key);

            const input = document.createElement('input');
            input.type = 'range';
            input.min = d.min; input.max = d.max; input.step = d.step;
            input.value = PRM[d.key];

            const val = document.createElement('b');
            val.textContent = fmtSliderVal(PRM[d.key], d.step, gname === 'prob');

            sliderInputs[d.key] = input;
            sliderVals[d.key] = val;

            input.addEventListener('input', () => {
              if (gname === 'prob') {
                if (syncing) return;
                syncing = true;
                PRM[d.key] = Math.max(0, Math.min(100, parseFloat(input.value)));
                syncProbs(d.key);
                refreshProbSliders();
                syncing = false;
              } else {
                PRM[d.key] = parseFloat(input.value);
                val.textContent = fmtSliderVal(PRM[d.key], d.step, false);
                if (gname === 'reach') requestAnimationFrame(drawReachCurve);
              }
              quality = 'fast';
              needsSolve = true;
              heatDirty = true;
              sideHeatDirty = true;
            });

            item.appendChild(label);
            item.appendChild(input);
            item.appendChild(val);
            grid.appendChild(item);
          }

          gEl.appendChild(grid);

          if (gname === 'reach') {
            const curveBox = document.createElement('div');
            curveBox.className = 's-curve';
            const cvs = document.createElement('canvas');
            const caption = document.createElement('div');
            caption.className = 's-curve-caption';
            curveBox.appendChild(cvs);
            curveBox.appendChild(caption);
            gEl.appendChild(curveBox);
            reachCurveCanvas = cvs;
            reachCurveCaption = caption;
          }

          root.appendChild(gEl);
        }

        requestAnimationFrame(drawReachCurve);
      }

      /* ============================================================
         十二、胶囊拖拽
         ============================================================ */
      function setupPillDrag(el, key) {
        let drag = null;
        el.title = t('pillHint');

        el.addEventListener('pointerdown', ev => {
          if (ev.button !== undefined && ev.button !== 0) return;
          ev.preventDefault();
          ev.stopPropagation();
          try {el.setPointerCapture(ev.pointerId);} catch (e) { }
          drag = {startY: ev.clientY, startVal: PRM[key]};
        });

        el.addEventListener('pointermove', ev => {
          if (!drag) return;
          ev.preventDefault();
          const delta = Math.round((drag.startY - ev.clientY) / 4);
          const newVal = Math.max(0, Math.min(100, drag.startVal + delta));
          if (newVal === PRM[key]) return;
          PRM[key] = newVal;
          syncProbs(key);
          refreshProbSliders();
          quality = 'fast'; needsSolve = true; heatDirty = true; sideHeatDirty = true;
          updateStats();
        });

        const finish = () => {
          if (!drag) return;
          drag = null;
          quality = 'full'; needsSolve = true; heatDirty = true; sideHeatDirty = true;
        };
        el.addEventListener('pointerup', finish);
        el.addEventListener('pointercancel', finish);
      }

      function setupHeightDrag(el) {
        let drag = null;
        el.title = t('heightHint');

        el.addEventListener('pointerdown', ev => {
          if (ev.button !== undefined && ev.button !== 0) return;
          ev.preventDefault();
          ev.stopPropagation();
          try {el.setPointerCapture(ev.pointerId);} catch (e) { }
          drag = {startY: ev.clientY, startVal: PRM.hh};
        });

        el.addEventListener('pointermove', ev => {
          if (!drag) return;
          ev.preventDefault();
          const delta = Math.round((drag.startY - ev.clientY) / 4) * 0.1;
          const newH = clamp(drag.startVal + delta, 0.8, 3.5);
          if (Math.abs(newH - PRM.hh) < 0.01) return;
          PRM.hh = Math.round(newH * 10) / 10;
          updateHeightPill();
          quality = 'fast'; needsSolve = true; heatDirty = true; sideHeatDirty = true;
          updateStats();
        });

        const finish = () => {
          if (!drag) return;
          drag = null;
          quality = 'full'; needsSolve = true; heatDirty = true; sideHeatDirty = true;
        };
        el.addEventListener('pointerup', finish);
        el.addEventListener('pointercancel', finish);
      }

      /* ============================================================
         十三、侧边栏
         ============================================================ */
      const sidebar = $('sidebar');
      const sidebarMask = $('sidebarMask');

      function openSidebar() {
        sidebar.classList.add('open');
        sidebarMask.classList.add('open');
        document.body.style.overflow = 'hidden';
        requestAnimationFrame(drawReachCurve);
      }
      function closeSidebar() {
        sidebar.classList.remove('open');
        sidebarMask.classList.remove('open');
        document.body.style.overflow = '';
      }

      $('sidebarBtn').addEventListener('click', openSidebar);
      $('sidebarClose').addEventListener('click', closeSidebar);
      sidebarMask.addEventListener('click', closeSidebar);

      resetBtn.addEventListener('click', () => {
        SLIDER_DEFS.forEach(d => {PRM[d.key] = d.def;});
        PRM.hh = HH_DEFAULT;
        buildSliders();
        updateHeightPill();
        quality = 'full';
        needsSolve = true;
        heatDirty = true;
        sideHeatDirty = true;
      });

      /* ============================================================
         十四、静态文案刷新
         ============================================================ */
      function refreshStaticText() {
        document.documentElement.lang = (lang === 'zh') ? 'zh-CN' : 'en';
        document.title = t('title');
        pageTitle.textContent = t('title');
        pageSub.textContent = t('sub');
        footerText.textContent = t('footer');
        sidebarTitle.textContent = t('params');
        resetBtn.textContent = t('reset');
        langBtnEl.textContent = t('langBtn');

        $('pTitle').textContent = t('principleTitle');
        $('principleBody').innerHTML = t('principleHTML');

        pillKill.dataset.label = lang === 'zh' ? '杀' : 'Sm';
        pillDrop.dataset.label = lang === 'zh' ? '吊' : 'Dr';
        pillClear.dataset.label = lang === 'zh' ? '高' : 'Hi';
        [pillKill, pillDrop, pillClear].forEach(p => {p.title = t('pillHint');});

        const collapsed = appEl.classList.contains('collapsed');
        collapseBtn.setAttribute('aria-label', collapsed ? t('collapseShow') : t('collapseHide'));

        modeToggle.textContent = mode === 'single' ? t('singles') : t('doubles');
        modeToggle.dataset.mode = mode;

        updateHeightPill();
        updateStats();
      }

      langBtnEl.addEventListener('click', () => {
        lang = (lang === 'zh') ? 'en' : 'zh';
        buildSliders();
        refreshStaticText();
        setup();
        heatDirty = true;
        sideHeatDirty = true;
      });

      collapseBtn.addEventListener('click', () => {
        const collapsed = appEl.classList.toggle('collapsed');
        collapseBtn.setAttribute('aria-label', collapsed ? t('collapseShow') : t('collapseHide'));
        requestAnimationFrame(() => {setup(); heatDirty = true; sideHeatDirty = true;});
      });

      /* ============================================================
         十五、画布交互
         ============================================================ */
      function getW(ev) {
        const r = canvas.getBoundingClientRect();
        return c2w((ev.clientX - r.left) / r.width * LW, (ev.clientY - r.top) / r.height * LH);
      }

      function hitOpponent(w) {
        if (Math.hypot(w.x - opponents[0].x, w.y - opponents[0].y) < DR_HIT) return 0;
        return -1;
      }

      modeToggle.addEventListener('click', () => {
        mode = (mode === 'double') ? 'single' : 'double';
        quality = 'full'; needsSolve = true; heatDirty = true; sideHeatDirty = true;
        refreshStaticText();
      });

      canvas.addEventListener('pointerdown', ev => {
        const w = getW(ev);
        const now = performance.now();
        const oppIdx = hitOpponent(w);

        if (oppIdx < 0) {
          const dt = now - lastTap.time;
          const dd = Math.hypot(ev.clientX - lastTap.x, ev.clientY - lastTap.y);
          if (lastTap.time > 0 && dt < DOUBLE_TAP_MS && dd < DOUBLE_TAP_DIST) {
            lastTap = {time: 0, x: 0, y: 0};
            showHeat = !showHeat;
            heatDirty = true;
            sideHeatDirty = true;
            updateStats();
            ev.preventDefault();
            return;
          }
          lastTap = {time: now, x: ev.clientX, y: ev.clientY};
          return;
        }

        lastTap = {time: 0, x: 0, y: 0};

        dragIdx = oppIdx;
        dragStarted = false;
        dragStartPos = {x: ev.clientX, y: ev.clientY};
        canvas.setPointerCapture(ev.pointerId);
        canvas.style.cursor = 'grabbing';
        ev.preventDefault();
      });

      canvas.addEventListener('pointermove', ev => {
        const w = getW(ev);
        if (dragIdx >= 0) {
          if (!dragStarted && dragStartPos) {
            const dx = ev.clientX - dragStartPos.x, dy = ev.clientY - dragStartPos.y;
            if (Math.hypot(dx, dy) > DRAG_THRESHOLD) {dragStarted = true;}
            else return;
          }
          if (dragStarted) {
            opponents[dragIdx].x = clamp(w.x, -HW + .15, HW - .15);
            opponents[dragIdx].y = clamp(w.y, 0.25, HL - .15);
            needsSolve = true; quality = 'fast'; heatDirty = true; sideHeatDirty = true;
            ev.preventDefault();
          }
          return;
        }

        if (hitOpponent(w) >= 0) canvas.style.cursor = 'grab';
        else canvas.style.cursor = 'default';
      });

      function endDrag(ev) {
        if (dragIdx >= 0 && dragStarted) {
          quality = 'full'; needsSolve = true; heatDirty = true; sideHeatDirty = true;
        }
        dragIdx = -1; dragStarted = false; dragStartPos = null;
        canvas.style.cursor = 'default';
        if (ev && ev.pointerId !== undefined && canvas.hasPointerCapture(ev.pointerId)) {
          canvas.releasePointerCapture(ev.pointerId);
        }
      }
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);
      canvas.addEventListener('pointerleave', () => {if (dragIdx < 0) canvas.style.cursor = 'default';});

      /* ============================================================
         十六、计算方法弹窗
         ============================================================ */
      (function () {
        const mask = $('principleModal');
        const credit = $('credit');

        const openM = () => {mask.classList.add('open'); document.body.style.overflow = 'hidden';};
        const closeM = () => {mask.classList.remove('open'); document.body.style.overflow = '';};

        credit.addEventListener('dblclick', openM);
        let lastTapTime = 0;
        credit.addEventListener('touchend', function (e) {
          const now = Date.now();
          if (now - lastTapTime < 350) {e.preventDefault(); openM(); lastTapTime = 0;}
          else {lastTapTime = now;}
        }, {passive: false});

        $('principleClose').addEventListener('click', closeM);
        mask.addEventListener('click', function (e) {if (e.target === mask) closeM();});
        document.addEventListener('keydown', function (e) {if (e.key === 'Escape') closeM();});
      })();

      /* ============================================================
         十七、主循环
         ============================================================ */
      let last = 0;
      function loop(ts) {
        if (needsSolve && ts - last > (quality === 'fast' ? 70 : 0)) {
          try {
            result = solve(quality === 'fast');
            heatDirty = true;
            sideHeatDirty = true;
          } catch (err) {
            console.error('solve error:', err);
          }
          needsSolve = false;
          last = ts;
          updateStats();
        }
        try {draw();}
        catch (err) {console.error('draw error:', err);}
        try {drawSide();}
        catch (err) {console.error('side draw error:', err);}
        requestAnimationFrame(loop);
      }

      try {
        result = solve('full');
        heatDirty = true;
        sideHeatDirty = true;
      } catch (e) {console.error('init error:', e);}

      buildSliders();
      refreshStaticText();
      setupPillDrag(pillClear, 'p_clear');
      setupPillDrag(pillDrop, 'p_drop');
      setupPillDrag(pillKill, 'p_smash');
      setupHeightDrag(pillHeight);
      requestAnimationFrame(loop);

      window.addEventListener('resize', () => {setup(); heatDirty = true; sideHeatDirty = true;});
      window.addEventListener('orientationchange', () => setTimeout(() => {
        setup(); heatDirty = true; sideHeatDirty = true;
      }, 250));

    })();
  </script>
</body>

</html>
