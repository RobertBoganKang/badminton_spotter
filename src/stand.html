      /* ---- 主视图热力图 ---- */
      const heatCanvas = document.createElement('canvas');
      const heatCtx = heatCanvas.getContext('2d');

      function buildLandingHeatmap(landings) {
        const cell = HEAT_CELL;
        const xMin = -HW, yMin = -HL;
        const GW = Math.ceil(2 * HW / cell) + 1;
        const GH = Math.ceil(HL / cell) + 1;

        const smash = new Float32Array(GW * GH);
        const clear = new Float32Array(GW * GH);
        const drop = new Float32Array(GW * GH);

        const inv2s2 = 1 / (2 * HEAT_SIGMA * HEAT_SIGMA);
        const r = 3 * HEAT_SIGMA;

        for (const Ld of landings) {
          const arr = Ld.type === 'smash' ? smash : Ld.type === 'clear' ? clear : drop;
          const i0 = Math.max(0, Math.floor((Ld.x - r - xMin) / cell));
          const i1 = Math.min(GW - 1, Math.ceil((Ld.x + r - xMin) / cell));
          const j0 = Math.max(0, Math.floor((Ld.y - r - yMin) / cell));
          const j1 = Math.min(GH - 1, Math.ceil((Ld.y + r - yMin) / cell));
          for (let j = j0; j <= j1; j++) {
            const gy = yMin + j * cell;
            const dy = gy - Ld.y;
            const dy2 = dy * dy;
            for (let i = i0; i <= i1; i++) {
              const gx = xMin + i * cell;
              const dx = gx - Ld.x;
              arr[j * GW + i] += Ld.w * Math.exp(-(dx * dx + dy2) * inv2s2);
            }
          }
        }

        let maxV = 0;
        for (let k = 0; k < GW * GH; k++) {
          const tt = smash[k] + clear[k] + drop[k];
          if (tt > maxV) maxV = tt;
        }
        return {GW, GH, cell, xMin, yMin, smash, clear, drop, max: maxV || 1};
      }

      function computeLandingHeat() {
        if (!result.valid || !cachedLandings.length) {heatDirty = false; return;}

        const W = canvas.width, H = canvas.height;
        if (heatCanvas.width !== W || heatCanvas.height !== H) {
          heatCanvas.width = W;
          heatCanvas.height = H;
        }

        const grid = buildLandingHeatmap(cachedLandings);
        const {GW, GH, cell, xMin, yMin, smash, clear, drop, max} = grid;
        const invMax = 1 / max;

        const img = heatCtx.createImageData(W, H);
        const data = img.data;

        const sx = W / LW, sy = H / LH;

        for (let py = 0; py < H; py++) {
          const wy = HL - (py / sy - PAD_T) / SCALE;
          if (wy > 0 || wy < -HL) continue;
          const fy = (wy - yMin) / cell;
          const j0raw = Math.floor(fy);
          const ty = fy - j0raw;
          let jA, jB, tY;
          if (j0raw < 0) {jA = 0; jB = 0; tY = 0;}
          else if (j0raw > GH - 2) {jA = GH - 1; jB = GH - 1; tY = 0;}
          else {jA = j0raw; jB = j0raw + 1; tY = ty;}

          for (let px = 0; px < W; px++) {
            const wx = (px / sx - PAD_L) / SCALE - HW;
            if (wx > HW || wx < -HW) continue;
            const fx = (wx - xMin) / cell;
            const i0raw = Math.floor(fx);
            const tx = fx - i0raw;
            let iA, iB, tX;
            if (i0raw < 0) {iA = 0; iB = 0; tX = 0;}
            else if (i0raw > GW - 2) {iA = GW - 1; iB = GW - 1; tX = 0;}
            else {iA = i0raw; iB = i0raw + 1; tX = tx;}

            const idx00 = jA * GW + iA, idx10 = jA * GW + iB, idx01 = jB * GW + iA, idx11 = jB * GW + iB;
            const s = (smash[idx00] * (1 - tX) + smash[idx10] * tX) * (1 - tY) + (smash[idx01] * (1 - tX) + smash[idx11] * tX) * tY;
            const c = (clear[idx00] * (1 - tX) + clear[idx10] * tX) * (1 - tY) + (clear[idx01] * (1 - tX) + clear[idx11] * tX) * tY;
            const d = (drop[idx00] * (1 - tX) + drop[idx10] * tX) * (1 - tY) + (drop[idx01] * (1 - tX) + drop[idx11] * tX) * tY;

            const sum = s + c + d;
            const o = (py * W + px) * 4;
            if (sum < max * HEAT_CUT) continue;

            const norm = Math.min(1, Math.sqrt(sum * invMax));
            const inv = 1 / sum;
            data[o] = (s * SHOT_COLOR.smash[0] + c * SHOT_COLOR.clear[0] + d * SHOT_COLOR.drop[0]) * inv;
            data[o + 1] = (s * SHOT_COLOR.smash[1] + c * SHOT_COLOR.clear[1] + d * SHOT_COLOR.drop[1]) * inv;
            data[o + 2] = (s * SHOT_COLOR.smash[2] + c * SHOT_COLOR.clear[2] + d * SHOT_COLOR.drop[2]) * inv;
            data[o + 3] = Math.min(225, norm * 215);
          }
        }
        heatCtx.putImageData(img, 0, 0);
        heatDirty = false;
      }

      function drawHeat() {
        if (!showHeat || !result.valid) return;
        if (heatCanvas.width !== canvas.width || heatCanvas.height !== canvas.height) heatDirty = true;
        if (heatDirty) computeLandingHeat();
        if (heatCanvas.width < 2) return;

        ctx.save();
        ctx.imageSmoothingEnabled = false;
        drawRotatedImage(
          ctx,
          heatCanvas,
          LW,
          LH,
          PAD_L + HW * SCALE,
          PAD_T + HL * SCALE
        );
        ctx.restore();
      }

      /* ---- 次优解点云 ---- */
      const suboptCanvas = document.createElement('canvas');
      const suboptCtx = suboptCanvas.getContext('2d');
      const CLOUD_GRAD = [
        [215, 48, 39],
        [252, 141, 89],
        [255, 255, 191],
        [145, 191, 219],
        [69, 117, 180]
      ];

      function cloudColorAt(u) {
        u = Math.max(0, Math.min(1, u));
        const f = u * (CLOUD_GRAD.length - 1);
        const i = Math.min(CLOUD_GRAD.length - 2, Math.floor(f));
        const t = f - i;
        const a = CLOUD_GRAD[i], b = CLOUD_GRAD[i + 1];
        return [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t
        ];
      }

      function gaussBlurField(src, GW, GH, cell) {
        const sigC = CLOUD_SIGMA / cell;
        const rad = Math.max(1, Math.ceil(sigC * 3));
        const ker = new Float32Array(rad * 2 + 1);
        let ksum = 0;
        for (let i = -rad; i <= rad; i++) {
          const v = Math.exp(-(i * i) / (2 * sigC * sigC));
          ker[i + rad] = v;
          ksum += v;
        }
        for (let i = 0; i < ker.length; i++) ker[i] /= ksum;

        const tmp = new Float32Array(GW * GH);
        for (let j = 0; j < GH; j++) {
          const row = j * GW;
          for (let i = 0; i < GW; i++) {
            let acc = 0;
            const k0 = Math.max(-rad, -i);
            const k1 = Math.min(rad, GW - 1 - i);
            for (let k = k0; k <= k1; k++) acc += src[row + i + k] * ker[k + rad];
            tmp[row + i] = acc;
          }
        }

        const out = new Float32Array(GW * GH);
        for (let j = 0; j < GH; j++) {
          const j0 = Math.max(-rad, -j);
          const j1 = Math.min(rad, GH - 1 - j);
          for (let i = 0; i < GW; i++) {
            let acc = 0;
            for (let k = j0; k <= j1; k++) acc += tmp[(j + k) * GW + i] * ker[k + rad];
            out[j * GW + i] = acc;
          }
        }
        return out;
      }

      function rebuildSuboptCloud() {
        const W = canvas.width, H = canvas.height;
        if (!W || !H) return;
        if (suboptCanvas.width !== W || suboptCanvas.height !== H) {
          suboptCanvas.width = W;
          suboptCanvas.height = H;
        }
        suboptDirty = false;

        const N = Math.min(topN, candidateList.length);
        suboptCtx.setTransform(1, 0, 0, 1, 0, 0);
        suboptCtx.clearRect(0, 0, W, H);
        if (N <= 0) return;

        const cell = CLOUD_CELL;
        const xMin = -HW, yMin = -HL;
        const GW = Math.ceil(2 * HW / cell) + 1;
        const GH = Math.ceil(HL / cell) + 1;
        const BINS = CLOUD_RANK_BINS;

        const binField = [];
        for (let b = 0; b < BINS; b++) binField.push(new Float32Array(GW * GH));

        const splatBinned = (p, u) => {
          if (!p) return;
          const fx = (p.x - xMin) / cell;
          const fy = (p.y - yMin) / cell;
          if (fx < 0 || fx > GW - 1 || fy < 0 || fy > GH - 1) return;

          const i = Math.floor(fx), j = Math.floor(fy);
          const tx = fx - i, ty = fy - j;
          const i1 = Math.min(GW - 1, i + 1);
          const j1 = Math.min(GH - 1, j + 1);

          const bf = u * (BINS - 1);
          const b0 = Math.min(BINS - 1, Math.max(0, Math.floor(bf)));
          const b1 = Math.min(BINS - 1, b0 + 1);
          const bt = bf - b0;

          const f0 = binField[b0], f1 = binField[b1];
          const w00 = (1 - tx) * (1 - ty);
          const w10 = tx * (1 - ty);
          const w01 = (1 - tx) * ty;
          const w11 = tx * ty;

          f0[j * GW + i] += w00 * (1 - bt);
          f0[j * GW + i1] += w10 * (1 - bt);
          f0[j1 * GW + i] += w01 * (1 - bt);
          f0[j1 * GW + i1] += w11 * (1 - bt);
          if (b1 !== b0) {
            f1[j * GW + i] += w00 * bt;
            f1[j * GW + i1] += w10 * bt;
            f1[j1 * GW + i] += w01 * bt;
            f1[j1 * GW + i1] += w11 * bt;
          }
        };

        const denom = Math.max(1, topMax - 1);
        for (let k = 0; k < N; k++) {
          const c = candidateList[k];
          if (!c) continue;
          const u = Math.pow(Math.min(1, k / denom), 0.58);
          splatBinned(c.P1, u);
          splatBinned(c.P2, u);
        }

        const blurred = [];
        for (let b = 0; b < BINS; b++) blurred.push(gaussBlurField(binField[b], GW, GH, cell));

        const binColor = [];
        for (let b = 0; b < BINS; b++)
          binColor.push(cloudColorAt(BINS > 1 ? b / (BINS - 1) : 0));

        const totGrid = new Float32Array(GW * GH);
        const rGrid = new Float32Array(GW * GH);
        const gGrid = new Float32Array(GW * GH);
        const bGrid = new Float32Array(GW * GH);

        let maxV = 0;
        for (let i = 0; i < GW * GH; i++) {
          let sum = 0, colorSum = 0, r = 0, g = 0, b = 0;
          for (let k = 0; k < BINS; k++) {
            const v = blurred[k][i];
            if (v <= 0) continue;
            sum += v;
            const priority = 0.4 + 1.6 * (1 - k / Math.max(1, BINS - 1));
            const vw = v * priority;
            colorSum += vw;
            const c = binColor[k];
            r += vw * c[0];
            g += vw * c[1];
            b += vw * c[2];
          }
          totGrid[i] = sum;
          if (colorSum > 1e-12) {
            const inv = 1 / colorSum;
            rGrid[i] = r * inv;
            gGrid[i] = g * inv;
            bGrid[i] = b * inv;
          }
          if (sum > maxV) maxV = sum;
        }
        if (maxV <= 1e-12) return;
        const invMax = 1 / maxV;

        const img = suboptCtx.createImageData(W, H);
        const data = img.data;
        const sx = W / LW, sy = H / LH;

        const px0 = Math.max(0, Math.floor(PAD_L * sx));
        const px1 = Math.min(W - 1, Math.ceil((PAD_L + 2 * HW * SCALE) * sx));
        const py0 = Math.max(0, Math.floor((PAD_T + HL * SCALE) * sy));
        const py1 = Math.min(H - 1, Math.ceil((PAD_T + 2 * HL * SCALE) * sy));

        const sample = (grid, iA, iB, jA, jB, w00, w10, w01, w11) =>
          grid[jA * GW + iA] * w00 + grid[jA * GW + iB] * w10 +
          grid[jB * GW + iA] * w01 + grid[jB * GW + iB] * w11;

        for (let py = py0; py <= py1; py++) {
          const wy = HL - (py / sy - PAD_T) / SCALE;
          const fy = (wy - yMin) / cell;
          let jA, jB, tY;
          const jr = Math.floor(fy);
          if (jr < 0) {jA = jB = 0; tY = 0;}
          else if (jr > GH - 2) {jA = jB = GH - 1; tY = 0;}
          else {jA = jr; jB = jr + 1; tY = fy - jr;}

          for (let px = px0; px <= px1; px++) {
            const wx = (px / sx - PAD_L) / SCALE - HW;
            const fx = (wx - xMin) / cell;
            let iA, iB, tX;
            const ir = Math.floor(fx);
            if (ir < 0) {iA = iB = 0; tX = 0;}
            else if (ir > GW - 2) {iA = iB = GW - 1; tX = 0;}
            else {iA = ir; iB = ir + 1; tX = fx - ir;}

            const w00 = (1 - tX) * (1 - tY);
            const w10 = tX * (1 - tY);
            const w01 = (1 - tX) * tY;
            const w11 = tX * tY;

            const sum = sample(totGrid, iA, iB, jA, jB, w00, w10, w01, w11);
            const t = sum * invMax;
            if (t < CLOUD_CUT) continue;

            const o = (py * W + px) * 4;
            data[o] = sample(rGrid, iA, iB, jA, jB, w00, w10, w01, w11);
            data[o + 1] = sample(gGrid, iA, iB, jA, jB, w00, w10, w01, w11);
            data[o + 2] = sample(bGrid, iA, iB, jA, jB, w00, w10, w01, w11);
            data[o + 3] = Math.min(238, 235 * Math.pow(t, 0.8));
          }
        }

        suboptCtx.putImageData(img, 0, 0);
      }

      function drawSuboptCloud() {
        if (!showSubopt || !candidateList.length) return;
        if (suboptDirty || suboptCanvas.width !== canvas.width || suboptCanvas.height !== canvas.height) {
          rebuildSuboptCloud();
        }
        if (suboptCanvas.width < 2) return;
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        drawRotatedImage(
          ctx,
          suboptCanvas,
          LW,
          LH,
          PAD_L + HW * SCALE,
          PAD_T + HL * SCALE
        );
        ctx.restore();
      }

      function drawOpponent() {
        const p = opponents[0], c = w2c(p);

        ctx.beginPath(); ctx.fillStyle = 'rgba(0,0,0,.10)';
        ctx.arc(c.x, c.y, 21, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.3 / mainScale;
        ctx.setLineDash([3, 3]); ctx.arc(c.x, c.y, 15, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath(); ctx.fillStyle = C_PERSON;
        ctx.arc(c.x, c.y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 / mainScale; ctx.stroke();

        drawLabelWithHalo(
          lang === 'zh' ? '对手' : 'Opp',
          c.x,
          mirror180 ? c.y + 11 : c.y - 11,
          C_PERSON,
          FONT_PLAYER,
          'center',
          mirror180 ? 'top' : 'bottom'
        );
      }

      function speedDotRadius(vRun) {
        const k = (vRun != null ? vRun : SPEED_BASE) / SPEED_BASE;
        return 8 * clamp(0.45 + 0.55 * k, 0.62, 1.60);
      }

      function speedTag(v, otherV) {
        const d = v - otherV;
        if (Math.abs(d) < SPEED_TAG_EPS) return '';
        return d > 0 ? t('tagFast') : t('tagSlow');
      }

      function drawOurPoint(p, label, vRun, index) {
        const c = w2c(p);
        const col = C_PERSON;
        const lineCol = 'rgba(0,0,0,.30)';
        const rad = speedDotRadius(vRun);
        const arm = rad * 1.9;

        if (ourTurnEnabled[index]) {
          const longRadius = rad * 2.25;
          const shortRadius = Math.max(6.5, rad * 1.08);
          const bodyHeading = (Number.isFinite(p.heading) ? p.heading : 0) + (mirror180 ? Math.PI : 0);
          const screenHeading = Math.atan2(-Math.cos(bodyHeading), Math.sin(bodyHeading));
          const ellipseAngle = screenHeading + Math.PI / 2;
          const footSign = ourHand[index] === 'left' ? -1 : 1;
          const footLocalX = footSign * longRadius * 0.62;
          const footX = c.x + footLocalX * Math.cos(ellipseAngle);
          const footY = c.y + footLocalX * Math.sin(ellipseAngle);
          const footColor = ourHand[index] === 'left'
            ? '#62c6eb'
            : '#1e88e5';

          ctx.save();
          ctx.beginPath();
          ctx.ellipse(c.x, c.y, longRadius, shortRadius, ellipseAngle, 0, Math.PI * 2);
          ctx.fillStyle = '#fff';
          ctx.fill();
          ctx.strokeStyle = C_PERSON;
          ctx.lineWidth = 2 / mainScale;
          ctx.stroke();
          const faceLen = longRadius * 0.72;
          ctx.beginPath();
          ctx.moveTo(c.x, c.y);
          ctx.lineTo(
            c.x + Math.cos(screenHeading) * faceLen,
            c.y + Math.sin(screenHeading) * faceLen
          );
          ctx.strokeStyle = 'rgba(0,0,0,.42)';
          ctx.lineWidth = 1.4 / mainScale;
          ctx.stroke();
          ctx.font = FONT_PLAYER;
          ctx.fillStyle = C_PERSON;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, c.x, c.y + 0.5);
          ctx.beginPath();
          ctx.fillStyle = footColor;
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.2 / mainScale;
          ctx.arc(footX, footY, 2.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
          return;
        }

        ctx.beginPath(); ctx.fillStyle = col;
        ctx.arc(c.x, c.y, rad, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 / mainScale; ctx.stroke();

        ctx.save();
        ctx.strokeStyle = lineCol; ctx.lineWidth = 1 / mainScale; ctx.setLineDash([2, 3]);
        ctx.beginPath();
        ctx.moveTo(c.x - arm, c.y); ctx.lineTo(c.x + arm, c.y);
        ctx.moveTo(c.x, c.y - arm); ctx.lineTo(c.x, c.y + arm);
        ctx.stroke();
        ctx.restore();

        drawLabelWithHalo(
          label,
          c.x,
          mirror180 ? c.y - rad - 3 : c.y + rad + 3,
          col,
          FONT_OUR,
          'center',
          mirror180 ? 'bottom' : 'top'
        );
      }

      function drawOurs() {
        if (!result.valid) return;

        if (mode === 'single') {
          if (result.P1) {
            drawOurPoint(result.P1, 'A', PRM.v_run_a, 0);
          }
          return;
        }

        const P1 = result.P1, P2 = result.P2;
        if (!P1 || !P2) return;

        drawOurPoint(P1, 'A', PRM.v_run_a, 0);
        drawOurPoint(P2, 'B', PRM.v_run_b, 1);
      }

      function draw() {
        ctx.clearRect(0, 0, LW, LH);
        drawCourtBase();
        drawHeat();
        drawSuboptCloud();
        drawCourtLines();
        drawOpponent();
        drawOurs();
        drawCourtTags();
      }

      /* ============================================================
         十、DOM 引用与 UI
         ============================================================ */
      const infoLine = $('infoLine');
      const candidateCount = $('candidateCount');
      const candidateStatusDot = $('candidateStatusDot');
      const manualUpdateBtn = $('manualUpdateBtn');
      const calcWaitBubble = $('calcWaitBubble');
      const calcWaitBubbleText = $('calcWaitBubbleText');
      const pageSub = $('pageSub');
      const pageTitle = $('pageTitle');
      const modeToggle = $('modeToggle');
      const symmetryBtn = $('symmetryBtn');
      const ourFootLegend = $('ourFootLegend');
      const ourFootLegendText = $('ourFootLegendText');
      const ourHandCluster = $('ourHandCluster');
      const ourHandA = $('ourHandA');
      const ourHandB = $('ourHandB');
      const pillKill = $('pillKill');
      const pillDrop = $('pillDrop');
      const pillClear = $('pillClear');
      const pillHeight = $('pillHeight');
      const pillScore = $('pillScore');
      const pillTop = $('pillTop');
      const scoreValue = $('scoreValue');
      const topValue = $('topValue');
      const rankLegend = $('rankLegend');
      const footerText = $('footerText');
      const sidebarTitle = $('sidebarTitle');
      const resetBtn = $('resetBtn');
      const appEl = $('app');
      const collapseBtn = $('collapseBtn');
      const langBtnEl = $('langBtn');

      function updatePill(el, p, rgb) {
        const pct = Math.round(p * 100);
        el.textContent = el.dataset.label + ' ' + pct + '%';
        const k = Math.min(1, p / 0.70);
        el.style.background = `rgba(${rgb}, ${0.10 + 0.68 * k})`;
        el.style.borderColor = `rgba(${rgb}, ${0.18 + 0.42 * k})`;
        el.style.color = (p > 0.42) ? '#ffffff' : `rgb(${rgb})`;
      }

      function updateHeightPill() {
        pillHeight.textContent = t('pillHeight') + ' ' + PRM.hh.toFixed(1) + 'm';
        const k = clamp((PRM.hh - 0.8) / 2.7, 0, 1);
        const rgb = k < 0.5 ? '192,57,43' : '31,111,139';
        pillHeight.style.background = `rgba(${rgb}, ${0.12 + 0.22 * k})`;
        pillHeight.style.borderColor = `rgba(${rgb}, ${0.28 + 0.28 * k})`;
        pillHeight.style.color = (k > 0.6) ? '#1f6f8b' : `rgb(${rgb})`;
      }

      function updateScorePill() {
        pillScore.removeAttribute('hidden');
        scoreValue.textContent = String(selectedRank);
        topValue.textContent = String(topN);

        const rankK = candidateList.length
          ? 1 - clamp((selectedRank - 1) / Math.max(1, topN - 1), 0, 1)
          : 0;
        const topK = topMax > 1
          ? clamp((topN - 1) / (topMax - 1), 0, 1)
          : 1;
        const tint = (el, k) => {
          el.style.background = `rgba(108,60,225,${0.10 + 0.52 * k})`;
          el.style.borderColor = `rgba(108,60,225,${0.20 + 0.32 * k})`;
          el.style.color = k > 0.48 ? '#ffffff' : '#6c3ce1';
        };
        tint(pillScore, rankK);
        tint(pillTop, topK);
      }

      function updateStats() {
        updateOurHandUI();
        updateScorePill();
        updateHeightPill();
        const single = mode === 'single';
        const probs = getProbs();
        updatePill(pillKill, probs.ps, SHOT_RGB.kill);
        updatePill(pillDrop, probs.pd, SHOT_RGB.drop);
        updatePill(pillClear, probs.pc, SHOT_RGB.clear);
        candidateCount.innerHTML =
          `<b>${legalCandidateCount.toLocaleString('zh-CN')}</b> 条合法候选 · ` +
          `显示 <b>${Math.min(topN, candidateList.length).toLocaleString('zh-CN')}</b> 条`;
        const ready = !!result.precise && !needsSolve;
        candidateStatusDot.classList.toggle('is-ready', ready);
        candidateStatusDot.title = ready ? '完整计算完成' : '快速预览 / 正在计算';
        rankLegend.hidden = !showSubopt || showHeat || !candidateList.length;
        if (!result.valid) return;

        const ps = Math.round(probs.ps * 100);
        const pc = Math.round(probs.pc * 100);
        const pd = Math.round(probs.pd * 100);
        const hhStr = PRM.hh.toFixed(1);
        const shotPart = t('infoSmash') + ' ' + ps + '% / ' + t('infoClear') + ' ' + pc + '% / ' + t('infoDrop') + ' ' + pd + '%';

        let dispPart = '';
        if (showHeat) dispPart = ' · ' + t('infoHeatOn');
        else if (showSubopt && candidateList.length) {
          dispPart = ' · ' + t('infoSuboptOn') + ' ' + Math.min(topN, candidateList.length);
        }

        const clearPart = (result.clearTMin != null)
          ? ' · ' + t('infoClearMin') + ' ' + result.clearTMin.toFixed(2) + 's'
          : '';

        const rs = result.reachStats;
        let reachPart = '';
        if (rs) {
          const sm = Math.round((rs.smash || 0) * 100);
          const cl = Math.round((rs.clear || 0) * 100);
          const dr = Math.round((rs.drop || 0) * 100);
          reachPart = ' · ' + t('infoReachSmash') + ' ' + sm + '% / ' +
            t('infoReachClear') + ' ' + cl + '% / ' +
            t('infoReachDrop') + ' ' + dr + '%';
        }

        if (single) {
          infoLine.innerHTML =
            t('infoContact') + ' <b>' + hhStr + 'm</b> · ' + shotPart + reachPart + clearPart + dispPart;
          return;
        }

        const dx = result.P2.x - result.P1.x;
        const dy = result.P2.y - result.P1.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        infoLine.innerHTML =
          t('infoContact') + ' <b>' + hhStr + 'm</b> · ' + shotPart + reachPart +
          ' · ' + t('infoGap') + ' <b>' + dist.toFixed(1) + 'm</b>' + clearPart + dispPart;
      }

      function updateOurHandUI() {
        const single = mode === 'single';
        const showA = ourTurnEnabled[0];
        const showB = !single && ourTurnEnabled[1];
        ourHandCluster.classList.toggle('is-visible', showA || showB);
        ourFootLegend.classList.toggle('is-visible', showA || showB);
        ourHandA.hidden = !showA;
        ourHandB.hidden = !showB;
        ourHandA.textContent = 'A ' + (ourHand[0] === 'left' ? t('labelLeft') : t('labelRight'));
        ourHandB.textContent = 'B ' + (ourHand[1] === 'left' ? t('labelLeft') : t('labelRight'));
        ourHandA.classList.toggle('is-left-hand', ourHand[0] === 'left');
        ourHandB.classList.toggle('is-left-hand', ourHand[1] === 'left');
        ourHandA.setAttribute('aria-pressed', String(ourHand[0] === 'left'));
        ourHandB.setAttribute('aria-pressed', String(ourHand[1] === 'left'));
      }

      function fmtSliderVal(val, step, isProb, key) {
        if (key && key.startsWith('formation_')) {
          if (key === 'formation_weight') return (val * 100).toFixed(1).replace(/\.0$/, '') + '%/m';
          return val.toFixed(2).replace(/0+$/, '').replace(/\.$/, '') + ' m';
        }
        if (key && key.startsWith('our_')) {
          if (key === 'our_turn_deadzone') return Math.round(val) + '°';
          if (key === 'our_turn_tmax') return val.toFixed(2) + ' s';
          return Math.round(val * 100) + '%';
        }
        if (step >= 1) return Math.round(val) + (isProb ? '%' : '');
        const digits = step >= 0.1 ? 1 : 2;
        return val.toFixed(digits);
      }

      let reachCurveCanvas = null;
      let reachCurveCaption = null;

      const CURVE_COL_A = '#1f8a5b';
      const CURVE_COL_B = '#c0392b';

      function drawReachCurve() {
        if (!reachCurveCanvas) return;
        const el = reachCurveCanvas;
        const W = el.clientWidth || 240;
        const H = el.clientHeight || 64;
        const dpr = DPR;
        const cw = Math.round(W * dpr), chh = Math.round(H * dpr);
        if (el.width !== cw || el.height !== chh) {el.width = cw; el.height = chh;}
        const c = el.getContext('2d');
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        c.clearRect(0, 0, W, H);

        const padL = 24, padR = 8, padT = 6, padB = 14;
        const plotW = Math.max(10, W - padL - padR);
        const plotH = Math.max(10, H - padT - padB);

        const rpA = reachParams(PRM.t_react_a, PRM.t_full_a);
        const rpB = reachParams(PRM.t_react_b, PRM.t_full_b);
        const same = Math.abs(rpA.t0 - rpB.t0) < 1e-9 && Math.abs(rpA.t1 - rpB.t1) < 1e-9;
        const tMax = Math.max(1.0, rpA.t1 + 0.3, rpB.t1 + 0.3);

        const xOf = tt => padL + (tt / tMax) * plotW;
        const yOf = p => padT + (1 - p) * plotH;

        c.strokeStyle = 'rgba(31,138,91,0.10)';
        c.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
          const y = padT + (plotH / 4) * i;
          c.beginPath(); c.moveTo(padL, y); c.lineTo(padL + plotW, y); c.stroke();
        }

        c.strokeStyle = 'rgba(31,138,91,0.28)';
        c.setLineDash([3, 3]);
        c.beginPath(); c.moveTo(padL, yOf(0.5)); c.lineTo(padL + plotW, yOf(0.5)); c.stroke();
        c.setLineDash([]);

        const drawCurve = (rp, color, lw) => {
          c.beginPath();
          c.strokeStyle = color;
          c.lineWidth = lw;
          c.lineJoin = 'round';
          const N = 96;
          for (let i = 0; i <= N; i++) {
            const tt = (i / N) * tMax;
            const x = xOf(tt), y = yOf(reachProb(tt, rp));
            if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
          }
          c.stroke();
        };

        if (same) {
          drawCurve(rpA, CURVE_COL_A, 2.2);
        } else {
          drawCurve(rpA, CURVE_COL_A, 2.2);
          drawCurve(rpB, CURVE_COL_B, 2.2);
        }

        c.fillStyle = CURVE_COL_A;
        c.beginPath(); c.arc(xOf(rpA.t0), yOf(reachProb(rpA.t0, rpA)), 2.6, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(xOf(rpA.t1), yOf(reachProb(rpA.t1, rpA)), 2.6, 0, Math.PI * 2); c.fill();
        if (!same) {
          c.fillStyle = CURVE_COL_B;
          c.beginPath(); c.arc(xOf(rpB.t0), yOf(reachProb(rpB.t0, rpB)), 2.6, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.arc(xOf(rpB.t1), yOf(reachProb(rpB.t1, rpB)), 2.6, 0, Math.PI * 2); c.fill();
        }

        c.fillStyle = '#8a9a91';
        c.font = '9px system-ui';
        c.textAlign = 'right';
        c.textBaseline = 'middle';
        c.fillText('100%', padL - 3, padT + 2);
        c.fillText('0%', padL - 3, padT + plotH - 2);
        c.textAlign = 'center';
        c.textBaseline = 'top';
        c.fillText('0s', padL, padT + plotH + 2);
        c.fillText(tMax.toFixed(1) + 's', padL + plotW, padT + plotH + 2);

        c.textAlign = 'right';
        c.textBaseline = 'bottom';
        c.font = 'bold 8px system-ui';
        const legY = padT + plotH - 2;
        if (same) {
          c.fillStyle = CURVE_COL_A;
          c.fillText('A/B', padL + plotW - 2, legY);
        } else {
          c.fillStyle = CURVE_COL_A;
          c.fillText('A', padL + plotW - 12, legY);
          c.fillStyle = CURVE_COL_B;
          c.fillText('B', padL + plotW - 2, legY);
        }

        if (reachCurveCaption) {
          const f = rp => {
            const p0 = reachProb(rp.t0, rp) * 100;
            const p1 = reachProb(rp.t1, rp) * 100;
            return `${rp.t0.toFixed(2)}s→${p0.toFixed(0)}% · ${rp.t1.toFixed(2)}s→${p1.toFixed(0)}%`;
          };
          reachCurveCaption.textContent = same
            ? `A/B  ${f(rpA)}`
            : `A  ${f(rpA)}  |  B  ${f(rpB)}`;
        }
      }

      /* ============================================================
         十一、参数面板
         ============================================================ */
      let sliderInputs = {};
      let sliderVals = {};

      function refreshProbSliders() {
        for (const k of PROB_KEYS) {
          if (sliderInputs[k]) {
            sliderInputs[k].value = Math.round(PRM[k]);
            sliderVals[k].textContent = Math.round(PRM[k]) + '%';
          }
        }
      }

      function syncProbs(changedKey) {
        const others = PROB_KEYS.filter(k => k !== changedKey);
        const remain = Math.max(0, 100 - PRM[changedKey]);
        const sumOthers = PRM[others[0]] + PRM[others[1]];
        const r0 = sumOthers < 1e-6 ? remain / 2 : remain * PRM[others[0]] / sumOthers;
        PRM[others[0]] = r0;
        PRM[others[1]] = remain - r0;
      }

      function makeSingleRow(d, gname, markDirty, getSyncing, setSyncing) {
        const item = document.createElement('div');
        item.className = 's-item';

        const label = document.createElement('span');
        label.textContent = t('sl_' + d.key);

        const input = document.createElement('input');
        input.type = 'range';
        input.min = d.min; input.max = d.max; input.step = d.step;
        input.value = PRM[d.key];

        const val = document.createElement('b');
        val.textContent = fmtSliderVal(PRM[d.key], d.step, gname === 'prob', d.key);
        const meta = document.createElement('div');
        meta.className = 's-meta';
        meta.appendChild(label);
        meta.appendChild(val);

        sliderInputs[d.key] = input;
        sliderVals[d.key] = val;

        input.addEventListener('input', () => {
          if (gname === 'prob') {
            if (getSyncing()) return;
            setSyncing(true);
            PRM[d.key] = Math.max(0, Math.min(100, parseFloat(input.value)));
            syncProbs(d.key);
            refreshProbSliders();
            setSyncing(false);
          } else {
            PRM[d.key] = parseFloat(input.value);
            val.textContent = fmtSliderVal(PRM[d.key], d.step, false, d.key);
            if (gname === 'reach') requestAnimationFrame(drawReachCurve);
          }
          if (gname === 'subopt') {
            suboptDirty = true;
            updateStats();
          } else {
            markDirty(false);
          }
        });

        input.addEventListener('change', () => {
          if (gname === 'subopt') return;
          markDirty(true);
        });

        item.appendChild(meta);
        item.appendChild(input);
        return item;
      }

      function makeDualRow(d, gname, markDirty) {
        const item = document.createElement('div');
        item.className = 's-item dual';

        const label = document.createElement('span');
        label.textContent = t(d.label || ('sl_' + d.keys[0]));

        const wrap = document.createElement('div');
        wrap.className = 'r2';
        const track = document.createElement('div'); track.className = 'r2-track';
        const fill = document.createElement('div'); fill.className = 'r2-fill';
        const thLo = document.createElement('div'); thLo.className = 'r2-thumb';
        const thHi = document.createElement('div'); thHi.className = 'r2-thumb';
        wrap.appendChild(track); wrap.appendChild(fill);
        wrap.appendChild(thLo); wrap.appendChild(thHi);

        const val = document.createElement('b');

        const min = d.min, max = d.max, step = d.step;
        const gap = (d.gap != null) ? d.gap : step;
        let lo = PRM[d.keys[0]];
        let hi = PRM[d.keys[1]];
        if (lo > hi) {const tmp = lo; lo = hi; hi = tmp;}

        const span = Math.max(1e-9, max - min);
        const pct = v => ((v - min) / span) * 100;

        const render = () => {
          thLo.style.left = pct(lo) + '%';
          thHi.style.left = pct(hi) + '%';
          fill.style.left = pct(lo) + '%';
          fill.style.width = Math.max(0, pct(hi) - pct(lo)) + '%';
          val.textContent = fmtSliderVal(lo, step, false) + '–' + fmtSliderVal(hi, step, false);
        };

        const commit = final => {
          PRM[d.keys[0]] = lo;
          PRM[d.keys[1]] = hi;
          if (gname === 'reach') requestAnimationFrame(drawReachCurve);
          markDirty(!!final);
        };

        const valFromClientX = clientX => {
          const r = wrap.getBoundingClientRect();
          if (r.width <= 0) return lo;
          const u = clamp((clientX - r.left) / r.width, 0, 1);
          let v = min + u * span;
          v = Math.round(v / step) * step;
          return clamp(v, min, max);
        };

        const bindThumb = (el, which) => {
          el.addEventListener('pointerdown', ev => {
            if (ev.button !== undefined && ev.button !== 0) return;
            ev.preventDefault();
            ev.stopPropagation();
            try {el.setPointerCapture(ev.pointerId);} catch (e) { }

            const move = e2 => {
              e2.preventDefault();
              const v = valFromClientX(e2.clientX);
              if (which === 'lo') {
                lo = clamp(Math.min(v, hi - gap), min, max);
              } else {
                hi = clamp(Math.max(v, lo + gap), min, max);
              }
              render();
              commit(false);
            };
            const up = e2 => {
              el.removeEventListener('pointermove', move);
              el.removeEventListener('pointerup', up);
              el.removeEventListener('pointercancel', up);
              try {el.releasePointerCapture(ev.pointerId);} catch (e) { }
              commit(true);
            };
            el.addEventListener('pointermove', move);
            el.addEventListener('pointerup', up);
            el.addEventListener('pointercancel', up);
          });
        };
        bindThumb(thLo, 'lo');
        bindThumb(thHi, 'hi');

        wrap.addEventListener('pointerdown', ev => {
          if (ev.target === thLo || ev.target === thHi) return;
          ev.preventDefault();
          const v = valFromClientX(ev.clientX);
          if (Math.abs(v - lo) <= Math.abs(v - hi)) lo = clamp(Math.min(v, hi - gap), min, max);
          else hi = clamp(Math.max(v, lo + gap), min, max);
          render();
          commit(true);
        });

        render();

        const meta = document.createElement('div');
        meta.className = 's-meta';
        meta.appendChild(label);
        meta.appendChild(val);

        item.appendChild(meta);
        item.appendChild(wrap);
        return item;
      }

      function buildSliders() {
        const root = $('sliders');
        root.innerHTML = '';
        sliderInputs = {};
        sliderVals = {};
        reachCurveCanvas = null;
        reachCurveCaption = null;

        const groups = {};
        for (const d of SLIDER_DEFS) {
          if (!groups[d.group]) groups[d.group] = [];
          groups[d.group].push(d);
        }

        const groupTitles = {
          speed: 'gSpeed', prob: 'gProb', reach: 'gReach', turn: 'gTurn', formation: 'gFormation',
          filter: 'gFilter', zrange: 'gZRange', subopt: 'gSubopt'
        };
        const groupHints = {
          speed: 'gSpeedHint', prob: 'gProbHint', reach: 'gReachHint', turn: 'gTurnHint', formation: 'gFormationHint',
          filter: 'gFilterHint', zrange: 'gZRangeHint', subopt: 'gSuboptHint'
        };
        let syncing = false;

        const markDirtyFull = full => {
          markDirty(full);
          heatDirty = true;
          sideHeatDirty = true;
        };

        for (const gname of Object.keys(groups)) {
          const gEl = document.createElement('div');
          gEl.className = 's-group';

          const title = document.createElement('div');
          title.className = 's-title';
          title.innerHTML = `<span>${t(groupTitles[gname])}</span><span>${t(groupHints[gname])}</span>`;
          gEl.appendChild(title);

          const grid = document.createElement('div');
          grid.className = 's-grid';

          for (const d of groups[gname]) {
            if (d.type === 'd') {
              grid.appendChild(makeDualRow(d, gname, markDirtyFull));
            } else {
              grid.appendChild(makeSingleRow(
                d, gname, markDirtyFull,
                () => syncing, v => {syncing = v;}
              ));
            }
          }

          gEl.appendChild(grid);

          if (gname === 'reach') {
            const curveBox = document.createElement('div');
            curveBox.className = 's-curve';
            const cvs = document.createElement('canvas');
            const caption = document.createElement('div');
            caption.className = 's-curve-caption';
            curveBox.appendChild(cvs);
            curveBox.appendChild(caption);
            gEl.appendChild(curveBox);
            reachCurveCanvas = cvs;
            reachCurveCaption = caption;
          }

          root.appendChild(gEl);
        }

        requestAnimationFrame(drawReachCurve);
      }

      function setupPillDrag(el, key) {
        let drag = null;
        el.title = t('pillHint');

        el.addEventListener('pointerdown', ev => {
          if (ev.button !== undefined && ev.button !== 0) return;
          ev.preventDefault();
          ev.stopPropagation();
          try {el.setPointerCapture(ev.pointerId);} catch (e) { }
          if (selectedRank !== 1) {
            selectedRank = 1;
            applyScore();
          }

          drag = {startY: ev.clientY, startVal: PRM[key]};
        });

        el.addEventListener('pointermove', ev => {
          if (!drag) return;
          ev.preventDefault();
          const delta = Math.round((drag.startY - ev.clientY) / 4);
          const newVal = Math.max(0, Math.min(100, drag.startVal + delta));
          if (newVal === PRM[key]) return;
          PRM[key] = newVal;
          syncProbs(key);
          refreshProbSliders();
          markDirty(false);
          updateStats();
        });

        const finish = () => {
          if (!drag) return;
          drag = null;
          markDirty(true);
        };
        el.addEventListener('pointerup', finish);
        el.addEventListener('pointercancel', finish);
      }

      function setupHeightDrag(el) {
        let drag = null;
        el.title = t('heightHint');

        el.addEventListener('pointerdown', ev => {
          if (ev.button !== undefined && ev.button !== 0) return;
          ev.preventDefault();
          ev.stopPropagation();
          try {el.setPointerCapture(ev.pointerId);} catch (e) { }
          if (selectedRank !== 1) {
            selectedRank = 1;
            applyScore();
          }
          drag = {startY: ev.clientY, startVal: PRM.hh};
        });

        el.addEventListener('pointermove', ev => {
          if (!drag) return;
          ev.preventDefault();
          const delta = Math.round((drag.startY - ev.clientY) / 4) * 0.1;
          const newH = clamp(drag.startVal + delta, 0.8, 3.5);
          if (Math.abs(newH - PRM.hh) < 0.01) return;
          PRM.hh = Math.round(newH * 10) / 10;
          updateHeightPill();
          markDirty(false);
          updateStats();
        });

        const finish = () => {
          if (!drag) return;
          drag = null;
          markDirty(true);
        };
        el.addEventListener('pointerup', finish);
        el.addEventListener('pointercancel', finish);
      }

      function setupCompoundDrag(el, kind) {
        let drag = null;
        let lastTapTime = 0, lastTapX = 0, lastTapY = 0;
        el.title = kind === 'rank'
          ? '向上拖动增加，向下拖动减小；双击恢复优劣 1'
          : '向上拖动增加 Top 数量，向下拖动减小；双击恢复默认值';

        el.addEventListener('pointerdown', ev => {
          if (ev.button !== undefined && ev.button !== 0) return;

          const now = performance.now();
          const dt = now - lastTapTime;
          const dd = Math.sqrt((ev.clientX - lastTapX) ** 2 + (ev.clientY - lastTapY) ** 2);

          if (lastTapTime > 0 && dt < DOUBLE_TAP_MS && dd < DOUBLE_TAP_DIST) {
            lastTapTime = 0;
            drag = null;
            if (kind === 'rank') {
              selectedRank = 1;
              applyScore();
            } else {
              topN = topDefault;
              selectedRank = Math.min(selectedRank, topN);
              suboptDirty = true;
              applyScore();
            }
            ev.preventDefault();
            ev.stopPropagation();
            return;
          }

          lastTapTime = now;
          lastTapX = ev.clientX;
          lastTapY = ev.clientY;

          ev.preventDefault();
          ev.stopPropagation();
          try {el.setPointerCapture(ev.pointerId);} catch (e) { }
          drag = {
            startY: ev.clientY,
            startRank: selectedRank,
            startTop: topN
          };
        });

        el.addEventListener('pointermove', ev => {
          if (!drag) return;
          ev.preventDefault();
          const dy = drag.startY - ev.clientY;
          if (kind === 'rank') {
            const nv = clamp(drag.startRank + Math.round(dy * 2), 1, topN);
            if (nv === selectedRank) return;
            selectedRank = nv;
            applyScore();
          } else {
            const sensitivity = Math.max(1, topMax / 600);
            const nv = clamp(Math.round(drag.startTop + dy * sensitivity), 1, topMax);
            if (nv === topN) return;
            topN = nv;
            if (selectedRank > topN) selectedRank = topN;
            suboptDirty = true;
            applyScore();
          }
        });

        const finish = () => {if (!drag) return; drag = null;};
        el.addEventListener('pointerup', finish);
        el.addEventListener('pointercancel', finish);
      }

      /* ============================================================
         十五、画布交互
         ============================================================ */
      function getW(ev) {
        const r = canvas.getBoundingClientRect();
        return c2w((ev.clientX - r.left) / r.width * LW, (ev.clientY - r.top) / r.height * LH);
      }

      function hitOpponent(w) {
        const dx = w.x - opponents[0].x;
        const dy = w.y - opponents[0].y;
        if (dx * dx + dy * dy < DR_HIT * DR_HIT) return 0;
        return -1;
      }

      function hitOurPoint(w) {
        if (!result.valid) return -1;
        const points = mode === 'single'
          ? (result.P1 ? [result.P1] : [])
          : [result.P1, result.P2].filter(Boolean);
        let best = -1, bestDist = DR_HIT * DR_HIT;
        points.forEach((p, index) => {
          const dx = w.x - p.x;
          const dy = w.y - p.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestDist) {
            bestDist = d2;
            best = index;
          }
        });
        return best;
      }

      function toggleOurTurn() {
        const next = mode === 'single'
          ? !ourTurnEnabled[0]
          : !(ourTurnEnabled[0] && ourTurnEnabled[1]);
        ourTurnEnabled[0] = next;
        ourTurnEnabled[1] = next;
        selectedRank = 1;
        resetSolvePerformanceMode();
        markDirty(true);
        updateOurHandUI();
        updateStats();
      }

      function toggleOurHand(index) {
        if (index === 1 && mode === 'single') return;
        ourHand[index] = ourHand[index] === 'left' ? 'right' : 'left';
        selectedRank = 1;
        markDirty(true);
        if (slowMode) {
          needsSolve = true;
          manualSolvePending = true;
          quality = 'full';
          candidateStatusDot.classList.remove('is-ready');
          updateManualUpdateUI();
        }
        updateOurHandUI();
        updateStats();
      }

      modeToggle.addEventListener('click', () => {
        mode = (mode === 'double') ? 'single' : 'double';
        resetSolvePerformanceMode();
        markDirty(true);
        refreshStaticText();
      });

      ourHandA.addEventListener('click', () => toggleOurHand(0));
      ourHandB.addEventListener('click', () => toggleOurHand(1));

      symmetryBtn.addEventListener('click', () => {
        mirror180 = !mirror180;
        symmetryBtn.classList.toggle('is-active', mirror180);
        symmetryBtn.setAttribute('aria-pressed', String(mirror180));
      });

      canvas.addEventListener('pointerdown', ev => {
        const w = getW(ev);
        const now = performance.now();
        const oppIdx = hitOpponent(w);

        const ownIdx = hitOurPoint(w);
        if (ownIdx >= 0) {
          const dt = now - lastTap.time;
          const dd = Math.sqrt((ev.clientX - lastTap.x) ** 2 + (ev.clientY - lastTap.y) ** 2);
          if (lastTap.ownIdx === ownIdx && lastTap.time > 0 &&
              dt < DOUBLE_TAP_MS && dd < DOUBLE_TAP_DIST) {
            lastTap = {time: 0, x: 0, y: 0, ownIdx: -1};
            toggleOurTurn();
          } else {
            lastTap = {time: now, x: ev.clientX, y: ev.clientY, ownIdx};
          }
          ev.preventDefault();
          return;
        }

        if (oppIdx < 0) {
          const dt = now - lastTap.time;
          const dd = Math.sqrt((ev.clientX - lastTap.x) ** 2 + (ev.clientY - lastTap.y) ** 2);
          if (lastTap.time > 0 && dt < DOUBLE_TAP_MS && dd < DOUBLE_TAP_DIST) {
            lastTap = {time: 0, x: 0, y: 0, ownIdx: -1};
            const toHeat = showSubopt;
            showSubopt = !toHeat;
            showHeat = toHeat;
            heatDirty = true;
            sideHeatDirty = true;
            suboptDirty = true;
            updateStats();
            ev.preventDefault();
            return;
          }
          lastTap = {time: now, x: ev.clientX, y: ev.clientY, ownIdx: -1};
          return;
        }

        lastTap = {time: 0, x: 0, y: 0, ownIdx: -1};

        dragIdx = oppIdx;
        dragStarted = false;
        dragStartPos = {x: ev.clientX, y: ev.clientY};
        canvas.setPointerCapture(ev.pointerId);
        canvas.style.cursor = 'grabbing';
        ev.preventDefault();
      });

      canvas.addEventListener('pointermove', ev => {
        const w = getW(ev);
        if (dragIdx >= 0) {
          if (!dragStarted && dragStartPos) {
            const dx = ev.clientX - dragStartPos.x, dy = ev.clientY - dragStartPos.y;
            if (Math.sqrt(dx * dx + dy * dy) > DRAG_THRESHOLD) {dragStarted = true;}
            else return;
          }
          if (dragStarted) {
            opponents[dragIdx].x = clamp(w.x, -HW + .15, HW - .15);
            opponents[dragIdx].y = clamp(w.y, 0.25, HL - .15);
            selectedRank = 1;
            markDirty(false);
            ev.preventDefault();
          }
          return;
        }

        if (hitOpponent(w) >= 0) canvas.style.cursor = 'grab';
        else canvas.style.cursor = 'default';
      });

      function endDrag(ev) {
        if (dragIdx >= 0 && dragStarted) {
          markDirty(true);
        }
        dragIdx = -1; dragStarted = false; dragStartPos = null;
        canvas.style.cursor = 'default';
        if (ev && ev.pointerId !== undefined && canvas.hasPointerCapture(ev.pointerId)) {
          canvas.releasePointerCapture(ev.pointerId);
        }
      }
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);
      canvas.addEventListener('pointerleave', () => {if (dragIdx < 0) canvas.style.cursor = 'default';});

      /* 侧视图：拖动对手前后位置，拖动球拍调整击球高度与前后位置 */
      let sideDrag = null;

      function getSideLocal(ev) {
        const r = sideCanvas.getBoundingClientRect();
        return {
          x: ev.clientX - r.left,
          y: ev.clientY - r.top
        };
      }

      function hitSideTarget(px, py) {
        const sy = sideScreenY(opponents[0].y);
        const hx = sideGroundX + PRM.hh * sideScaleZ;
        const racketHit = ((px - hx) / 16) ** 2 + ((py - sy) / 12) ** 2 <= 1;
        if (racketHit) return 'racket';

        const fullLen = Math.max(10, personHeights[0] * sideScaleZ);
        const headR = clamp(fullLen * 0.13, 2.5, 4.5);
        const headX = sideGroundX + fullLen - headR;
        const onBody = px >= sideGroundX - 8 &&
          px <= headX + headR + 8 &&
          Math.abs(py - sy) <= 11;
        const onHead = Math.hypot(px - headX, py - sy) <= headR + 6;
        return onBody || onHead ? 'opponent' : null;
      }

      sideCanvas.addEventListener('pointerdown', ev => {
        const p = getSideLocal(ev);
        const target = hitSideTarget(p.x, p.y);
        if (!target) return;
        try {sideCanvas.setPointerCapture(ev.pointerId);} catch (e) { }
        sideDrag = {
          pointerId: ev.pointerId,
          type: target,
          moved: false,
          startX: p.x,
          startY: p.y
        };
        sideCanvas.style.cursor = 'grabbing';
        ev.preventDefault();
      });

      sideCanvas.addEventListener('pointermove', ev => {
        const p = getSideLocal(ev);
        if (!sideDrag) {
          sideCanvas.style.cursor = hitSideTarget(p.x, p.y) ? 'grab' : 'default';
          return;
        }
        if (ev.pointerId !== sideDrag.pointerId) return;
        if (Math.hypot(p.x - sideDrag.startX, p.y - sideDrag.startY) > 3) {
          sideDrag.moved = true;
        }
        if (!sideDrag.moved) return;

        const newY = clamp(sideWorldYFromScreen(p.y), 0.25, HL - 0.15);
        opponents[0].y = newY;
        if (sideDrag.type === 'racket') {
          PRM.hh = clamp(
            Math.round(((p.x - sideGroundX) / sideScaleZ) * 20) / 20,
            0.8,
            3.5
          );
          updateHeightPill();
        }
        selectedRank = 1;
        markDirty(false);
        updateStats();
        ev.preventDefault();
      });

      function endSideDrag(ev) {
        if (!sideDrag) return;
        if (sideDrag.moved) markDirty(true);
        sideDrag = null;
        sideCanvas.style.cursor = 'default';
        if (ev && ev.pointerId !== undefined && sideCanvas.hasPointerCapture(ev.pointerId)) {
          sideCanvas.releasePointerCapture(ev.pointerId);
        }
      }
      sideCanvas.addEventListener('pointerup', endSideDrag);
      sideCanvas.addEventListener('pointercancel', endSideDrag);
      sideCanvas.addEventListener('pointerleave', () => {
        if (!sideDrag) sideCanvas.style.cursor = 'default';
      });

      /* ============================================================
         十六、计算方法弹窗
         ============================================================ */
      (function () {
        const mask = $('principleModal');
        const credit = $('credit');

        const openM = () => {mask.classList.add('open'); document.body.style.overflow = 'hidden';};
        const closeM = () => {mask.classList.remove('open'); document.body.style.overflow = '';};

        credit.addEventListener('dblclick', openM);
        let lastTapTime = 0;
        credit.addEventListener('touchend', function (e) {
          const now = Date.now();
          if (now - lastTapTime < 350) {e.preventDefault(); openM(); lastTapTime = 0;}
          else {lastTapTime = now;}
        }, {passive: false});

        $('principleClose').addEventListener('click', closeM);
        mask.addEventListener('click', function (e) {if (e.target === mask) closeM();});
        document.addEventListener('keydown', function (e) {if (e.key === 'Escape') closeM();});
      })();

      /* ============================================================
         十七、主循环
         ============================================================ */
      let last = 0;
      function loop(ts) {
        const shouldSolve = manualSolvePending || (needsSolve && !slowMode);
        if (shouldSolve && (manualSolvePending || ts - last > (quality === 'fast' ? 70 : 0))) {
          const started = performance.now();
          const useFast = manualSolvePending ? false : quality === 'fast';
          const useJointWorker = mode === 'double' &&
            (ourTurnEnabled[0] || ourTurnEnabled[1]);
          if (useJointWorker) {
            startJointWorkerSolve(useFast);
          } else {
            try {
              result = solve(useFast);
              heatDirty = true;
              sideHeatDirty = true;
              suboptDirty = true;
            } catch (err) {
              console.error('solve error:', err);
            }
            needsSolve = false;
            manualSolvePending = false;
            manualResultsCleared = false;
            detectSlowSolve(performance.now() - started, useFast);
            updateStats();
            updateManualUpdateUI();
          }
          last = ts;
        }
        try {draw();}
        catch (err) {console.error('draw error:', err);}
        try {drawSide();}
        catch (err) {console.error('side draw error:', err);}
        requestAnimationFrame(loop);
      }

      try {
        const initStarted = performance.now();
        result = solve('full');
        detectSlowSolve(performance.now() - initStarted, false);
        heatDirty = true;
        sideHeatDirty = true;
        suboptDirty = true;
      } catch (e) {console.error('init error:', e);}

      buildSliders();
      refreshStaticText();
      setupPillDrag(pillClear, 'p_clear');
      setupPillDrag(pillDrop, 'p_drop');
      setupPillDrag(pillKill, 'p_smash');
      setupHeightDrag(pillHeight);
      setupCompoundDrag(pillScore, 'rank');
      setupCompoundDrag(pillTop, 'top');
      manualUpdateBtn.addEventListener('click', () => {
        if (manualSolvePending) return;
        manualSolvePending = true;
        needsSolve = true;
        quality = 'full';
        candidateStatusDot.classList.remove('is-ready');
        candidateStatusDot.title = '手动更新中';
        updateManualUpdateUI();
      });
      updateManualUpdateUI();
      requestAnimationFrame(loop);

      window.addEventListener('resize', () => {
        setup();
        heatDirty = true;
        sideHeatDirty = true;
        suboptDirty = true;
        if (calcWaitBubble.classList.contains('is-visible')) positionCalcWaitBubble();
      });
      window.addEventListener('orientationchange', () => setTimeout(() => {
        setup();
        heatDirty = true;
        sideHeatDirty = true;
        suboptDirty = true;
      }, 250));

    })();
  </script>
</body>

</html>
