                const v = totalV(pos, items, null, cP, null);
                if (v > bv + 1e-9) {bx = nx; by = ny; bv = v; moved = true;}
              }
            }
            if (!moved) break;
            ax = bx; ay = by; av = bv;
          }
          h *= 0.5;
        }

        cands.sort((a, b) => b.V - a.V);
        const bestPosFinal = {x: ax, y: ay};
        const bestCtx = ctxForPosition(bestPosFinal, items, ctxA);
        return {best: {...bestPosFinal, heading: bestCtx.heading}, cands};
      }

      function optimizeDouble(items, fast, ctxA, ctxB) {
        const N = items.length;
        if (!N) {
          const a = {x: -1.5, y: -3}, b = {x: 1.5, y: -3};
          return {best: [a, b], cands: [{P1: a, P2: b, V: 0}]};
        }

        const sameV = ctxEqual(ctxA, ctxB);

        const aArr = new Float32Array(N);
        let sumW = 0;
        for (let i = 0; i < N; i++) {
          sumW += items[i].w;
          aArr[i] = items[i].w * (cValue(items[i].type, items[i].L.y) + 1);
        }

        const gridStep = fast ? 0.6 : 0.4;
        const xs = symmetricAxisGrid(2.6, gridStep);
        const ys = [];
        for (let y = -0.5; y >= -6.3 - 1e-9; y -= gridStep) ys.push(+y.toFixed(2));

        const pos = [];
        for (const y of ys) for (const x of xs) pos.push({x, y});
        const M = pos.length;

        const PA = new Array(M), PB = new Array(M);
        const headingAGrid = new Float32Array(M), headingBGrid = new Float32Array(M);
        const SA = new Float32Array(M), SB = new Float32Array(M);
        for (let p = 0; p < M; p++) {
          const arrA = new Float32Array(N);
          const arrB = new Float32Array(N);
          const ctxAP = ctxForPosition(pos[p], items, ctxA);
          const ctxBP = ctxForPosition(pos[p], items, ctxB);
          headingAGrid[p] = ctxAP.heading;
          headingBGrid[p] = ctxBP.heading;
          let sa = 0, sb = 0;
          for (let i = 0; i < N; i++) {
            const it = items[i];
            const sA = interceptStats(pos[p], it, ctxAP);
            const pa = sA.p * sA.q;
            let pb;
            if (sameV && Math.abs(ctxAP.heading - ctxBP.heading) < 1e-9) {
              pb = pa;
            } else {
              const sB = interceptStats(pos[p], it, ctxBP);
              pb = sB.p * sB.q;
            }
            arrA[i] = pa; arrB[i] = pb;
            sa += aArr[i] * pa; sb += aArr[i] * pb;
          }
          PA[p] = arrA; PB[p] = arrB; SA[p] = sa; SB[p] = sb;
        }

        const cands = [];
        for (let i = 0; i < M; i++) {
          const Pi = PA[i], pi = pos[i];
          for (let j = 0; j < M; j++) {
            const Pj = PB[j];
            let s = SA[i] + SB[j];
            for (let k = 0; k < N; k++) s -= aArr[k] * Pi[k] * Pj[k];
            const V = (s - sumW) / sumW -
              overlapPenalty(pi, pos[j]) -
              formationPenalty(pi, pos[j]);
            cands.push({
              P1: {...pi, heading: headingAGrid[i]},
              P2: {...pos[j], heading: headingBGrid[j]},
              V
            });
          }
        }
        cands.sort((a, b) => b.V - a.V);
        if (sameV) {
          for (const cand of cands) {
            if (cand.P1.x > cand.P2.x + 1e-9) {
              const tmp = cand.P1;
              cand.P1 = cand.P2;
              cand.P2 = tmp;
            }
          }
        }

        let pA = {x: cands[0].P1.x, y: cands[0].P1.y};
        let pB = {x: cands[0].P2.x, y: cands[0].P2.y};
        let bestV = cands[0].V;
        if (sameV && pA.x > pB.x + 1e-9) {
          const tmp = pA;
          pA = pB;
          pB = tmp;
        }

        const scoreAt = (a, b) => {
          const ctxAP = ctxForPosition(a, items, ctxA);
          const ctxBP = ctxForPosition(b, items, ctxB);
          const samePositionCtx = sameV &&
            Math.abs(a.x - b.x) < 1e-9 &&
            Math.abs(a.y - b.y) < 1e-9 &&
            Math.abs(ctxAP.heading - ctxBP.heading) < 1e-9;
          let s = 0;
          for (let k = 0; k < N; k++) {
            const it = items[k];
            const sA = interceptStats(a, it, ctxAP);
            const pa = sA.p * sA.q;
            let pb;
            if (samePositionCtx) {
              pb = pa;
            } else {
              const sB = interceptStats(b, it, ctxBP);
              pb = sB.p * sB.q;
            }
            const r = 1 - (1 - pa) * (1 - pb);
            s += aArr[k] * r;
          }
          return (s - sumW) / sumW -
            overlapPenalty(a, b) -
            formationPenalty(a, b);
        };

        const clampX = v => clamp(v, -2.7, 2.7);
        const clampY = v => clamp(v, -6.3, -0.5);

        let h = 0.20;
        const MIN_H = fast ? 0.10 : 0.01;

        while (h >= MIN_H - 1e-9) {
          let guard = 0;
          let updateAFirst = true;
          while (guard++ < 200) {
            let improved = false;

            const improveA = () => {
              let bv = bestV, bA = pA;
              for (let k = -1; k <= 1; k++) {
                for (let m = -1; m <= 1; m++) {
                  if (k === 0 && m === 0) continue;
                  const cand = {x: clampX(pA.x + k * h), y: clampY(pA.y + m * h)};
                  const v = scoreAt(cand, pB);
                  if (v > bv + 1e-9) {bv = v; bA = cand;}
                }
              }
              if (bv <= bestV + 1e-9) return false;
              pA = bA;
              bestV = bv;
              return true;
            };

            const improveB = () => {
              let bv = bestV, bB = pB;
              for (let k = -1; k <= 1; k++) {
                for (let m = -1; m <= 1; m++) {
                  if (k === 0 && m === 0) continue;
                  const cand = {x: clampX(pB.x + k * h), y: clampY(pB.y + m * h)};
                  const v = scoreAt(pA, cand);
                  if (v > bv + 1e-9) {bv = v; bB = cand;}
                }
              }
              if (bv <= bestV + 1e-9) return false;
              pB = bB;
              bestV = bv;
              return true;
            };

            if (updateAFirst) {
              improved = improveA() || improved;
              improved = improveB() || improved;
            } else {
              improved = improveB() || improved;
              improved = improveA() || improved;
            }
            updateAFirst = !updateAFirst;

            if (!improved) break;
          }
          h *= 0.5;
        }

        // With identical A/B settings the two players are interchangeable.
        // Keep their labels stable so moving an opponent to the mirrored side
        // does not arbitrarily swap which side A and B occupy.
        if (sameV && pA.x > pB.x + 1e-9) {
          const tmp = pA;
          pA = pB;
          pB = tmp;
        }

        const headingA = bestHeadingForPosition(pA, items, ctxA);
        const headingB = bestHeadingForPosition(pB, items, ctxB);
        return {
          best: [{...pA, heading: headingA}, {...pB, heading: headingB}],
          cands
        };
      }

      function pruneDominatedHeadingProfiles(profiles) {
        const sorted = profiles.slice().sort((a, b) => b.weightedReach - a.weightedReach);
        const kept = [];
        for (const profile of sorted) {
          let dominated = false;
          for (const other of kept) {
            let coversAll = true;
            for (let i = 0; i < profile.values.length; i++) {
              if (other.values[i] + 1e-12 < profile.values[i]) {
                coversAll = false;
                break;
              }
            }
            if (coversAll) {
              dominated = true;
              break;
            }
          }
          if (!dominated) kept.push(profile);
        }
        return kept;
      }

      function aggregateProfileGroupMins(profiles) {
        const count = profiles[0] && profiles[0].groupMins
          ? profiles[0].groupMins.length
          : 0;
        if (!count) return null;
        const out = new Float64Array(count).fill(1);
        for (const profile of profiles) {
          for (let i = 0; i < count; i++) {
            if (profile.groupMins[i] < out[i]) out[i] = profile.groupMins[i];
          }
        }
        return out;
      }

      function groupedIntersectionLower(minA, minB, groupWeights, scalarLower) {
        let lower = scalarLower;
        if (minA && minB && groupWeights) {
          for (let i = 0; i < groupWeights.length; i++) {
            const grouped = groupWeights[i] * minA[i] * minB[i];
            if (grouped > lower) lower = grouped;
          }
        }
        return lower;
      }

      function jointHeadingAngles(enabled) {
        if (!enabled) return [0];
        const out = [];
        for (let i = 0; i < 12; i++) out.push(wrapMotionAngle(i * Math.PI / 6));
        return out;
      }

      function descendingAxisGrid(start, end, requestedStep) {
        const span = Math.abs(end - start);
        const count = Math.max(1, Math.ceil(span / requestedStep - 1e-9));
        const step = (end - start) / count;
        const out = [];
        for (let i = 0; i <= count; i++) out.push(+(start + i * step).toFixed(8));
        return out;
      }

      function buildHeadingProfiles(pos, headings, items, ctx, itemWeights, groupMap, groupCount) {
        const out = [];
        const candidates = headings.slice();
        if (ctx.turnEnabled) {
          candidates.push(weightedHeadingForPosition(pos, items, ctx));
        }
        const evaluated = new Set();
        for (const raw of candidates) {
          const heading = wrapMotionAngle(raw);
          const key = heading.toFixed(6);
          if (evaluated.has(key)) continue;
          evaluated.add(key);
          const poseCtx = {
            ...ctx,
            heading,
            headingSin: Math.sin(heading),
            headingCos: Math.cos(heading)
          };
          const values = new Float32Array(items.length);
          const groupMins = groupCount
            ? new Float64Array(groupCount).fill(1)
            : null;
          let weightedReach = 0;
          for (let i = 0; i < items.length; i++) {
            const stats = interceptStats(pos, items[i], poseCtx);
            const probability = stats.p * stats.q;
            values[i] = probability;
            if (groupMins) {
              const group = groupMap[i];
              if (probability < groupMins[group]) groupMins[group] = probability;
            }
            weightedReach += itemWeights[i] * probability;
          }
          out.push({heading, values, weightedReach, groupMins});
        }
        return out;
      }

      function makeJointPoseEvaluator(items, itemWeights, sumW, ctxA, ctxB) {
        const cache = new Map();
        const profileFor = (pose, ctx, side) => {
          const key = [
            side,
            pose.x.toFixed(5),
            pose.y.toFixed(5),
            (Number.isFinite(pose.heading) ? pose.heading : 0).toFixed(6)
          ].join(':');
          let profile = cache.get(key);
          if (profile) return profile;
          const poseCtx = {
            ...ctx,
            heading: Number.isFinite(pose.heading) ? pose.heading : 0,
            headingSin: Math.sin(Number.isFinite(pose.heading) ? pose.heading : 0),
            headingCos: Math.cos(Number.isFinite(pose.heading) ? pose.heading : 0)
          };
          const values = new Float32Array(items.length);
          let weightedReach = 0;
          for (let i = 0; i < items.length; i++) {
            const stats = interceptStats(pose, items[i], poseCtx);
            const probability = stats.p * stats.q;
            values[i] = probability;
            weightedReach += itemWeights[i] * probability;
          }
          profile = {values, weightedReach};
          cache.set(key, profile);
          return profile;
        };

        return (poseA, poseB) => {
          const a = profileFor(poseA, ctxA, 'a');
          const b = profileFor(poseB, ctxB, 'b');
          let overlap = 0;
          for (let i = 0; i < items.length; i++) overlap += itemWeights[i] * a.values[i] * b.values[i];
          return (a.weightedReach + b.weightedReach - overlap - sumW) / sumW -
            overlapPenalty(poseA, poseB) -
            formationPenalty(poseA, poseB);
        };
      }

      function refineJointPose(seed, evaluate, ctxA, ctxB, positionSteps, headingSteps, record) {
        let poseA = {
          x: seed.P1.x,
          y: seed.P1.y,
          heading: Number.isFinite(seed.P1.heading) ? seed.P1.heading : 0
        };
        let poseB = {
          x: seed.P2.x,
          y: seed.P2.y,
          heading: Number.isFinite(seed.P2.heading) ? seed.P2.heading : 0
        };
        let bestV = evaluate(poseA, poseB);
        if (record) record(poseA, poseB, bestV);
        const clampX = value => clamp(value, -2.7, 2.7);
        const clampY = value => clamp(value, -6.3, -0.5);

        const movesFor = (pose, positionStep, headingStep, turnEnabled) => {
          const moves = [];
          for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
              if (dx === 0 && dy === 0) continue;
              moves.push({
                x: clampX(pose.x + dx * positionStep),
                y: clampY(pose.y + dy * positionStep),
                heading: pose.heading
              });
            }
          }
          if (turnEnabled) {
            moves.push({x: pose.x, y: pose.y, heading: wrapMotionAngle(pose.heading - headingStep)});
            moves.push({x: pose.x, y: pose.y, heading: wrapMotionAngle(pose.heading + headingStep)});
          }
          return moves;
        };

        const stageCount = Math.min(positionSteps.length, headingSteps.length);
        for (let stage = 0; stage < stageCount; stage++) {
          const positionStep = positionSteps[stage];
          const headingStep = headingSteps[stage];
          let updateAFirst = true;
          let guard = 0;

          while (guard++ < 16) {
            let improved = false;
            const improveA = () => {
              let candidateV = bestV;
              let candidatePose = poseA;
              for (const move of movesFor(poseA, positionStep, headingStep, ctxA.turnEnabled)) {
                const value = evaluate(move, poseB, bestV);
                if (value > candidateV + 1e-9) {
                  candidateV = value;
                  candidatePose = move;
                }
              }
              if (candidateV <= bestV + 1e-9) return false;
              poseA = candidatePose;
              bestV = candidateV;
              return true;
            };

            const improveB = () => {
              let candidateV = bestV;
              let candidatePose = poseB;
              for (const move of movesFor(poseB, positionStep, headingStep, ctxB.turnEnabled)) {
                const value = evaluate(poseA, move, bestV);
                if (value > candidateV + 1e-9) {
                  candidateV = value;
                  candidatePose = move;
                }
              }
              if (candidateV <= bestV + 1e-9) return false;
              poseB = candidatePose;
              bestV = candidateV;
              return true;
            };

            if (updateAFirst) {
              improved = improveA() || improved;
              improved = improveB() || improved;
            } else {
              improved = improveB() || improved;
              improved = improveA() || improved;
            }
            updateAFirst = !updateAFirst;
            if (!improved) break;
          }
          if (record) record(poseA, poseB, bestV);
        }

        return {P1: poseA, P2: poseB, V: bestV};
      }

      function refineSequentialPose(seed, evaluate, ctxA, ctxB, positionSteps, headingSteps, record) {
        const EPS = 1e-7;
        let poseA = {
          x: seed.P1.x,
          y: seed.P1.y,
          heading: Number.isFinite(seed.P1.heading) ? seed.P1.heading : 0
        };
        let poseB = {
          x: seed.P2.x,
          y: seed.P2.y,
          heading: Number.isFinite(seed.P2.heading) ? seed.P2.heading : 0
        };
        let bestV = evaluate(poseA, poseB);
        const clampX = value => clamp(value, -2.7, 2.7);
        const clampY = value => clamp(value, -6.3, -0.5);

        const improveOne = (pose, otherPose, side, positionStep, headingStep) => {
          let current = {...pose};
          let currentV = bestV;
          let moved = false;
          let guard = 0;
          while (guard++ < 24) {
            const moves = [];
            for (let dx = -1; dx <= 1; dx++) {
              for (let dy = -1; dy <= 1; dy++) {
                if (dx === 0 && dy === 0) continue;
                moves.push({
                  x: clampX(current.x + dx * positionStep),
                  y: clampY(current.y + dy * positionStep),
                  heading: current.heading
                });
              }
            }
            const turnEnabled = side === 'a' ? ctxA.turnEnabled : ctxB.turnEnabled;
            if (turnEnabled) {
              moves.push({
                x: current.x,
                y: current.y,
                heading: wrapMotionAngle(current.heading - headingStep)
              });
              moves.push({
                x: current.x,
                y: current.y,
                heading: wrapMotionAngle(current.heading + headingStep)
              });
            }

            let next = current;
            let nextV = currentV;
            for (const move of moves) {
              const value = side === 'a'
                ? evaluate(move, otherPose)
                : evaluate(otherPose, move);
              if (value > nextV + EPS) {
                nextV = value;
                next = move;
              }
            }
            if (nextV <= currentV + EPS) break;
            current = next;
            currentV = nextV;
            bestV = currentV;
            moved = true;
          }
          return {pose: current, moved};
        };

        const stageCount = Math.min(positionSteps.length, headingSteps.length);
        for (let stage = 0; stage < stageCount; stage++) {
          const stageStartV = bestV;
          const nextA = improveOne(poseA, poseB, 'a', positionSteps[stage], headingSteps[stage]);
          poseA = nextA.pose;
          const nextB = improveOne(poseB, poseA, 'b', positionSteps[stage], headingSteps[stage]);
          poseB = nextB.pose;
          if (record) record(poseA, poseB, bestV);
          if ((!nextA.moved && !nextB.moved) || bestV - stageStartV <= EPS) break;
        }
        return {P1: poseA, P2: poseB, V: bestV};
      }

      function optimizeDoubleJoint(items, fast, ctxA, ctxB) {
        const N = items.length;
        if (!N) {
          const a = {x: -1.5, y: -3, heading: 0};
          const b = {x: 1.5, y: -3, heading: 0};
          return {best: [a, b], cands: [{P1: a, P2: b, V: 0}]};
        }

        const coarseItems = buildItemsFromLandings(cachedLandings, fast ? 1.2 : 0.9);
        const searchItems = coarseItems.length ? coarseItems : items;
        const aArr = new Float32Array(searchItems.length);
        let sumW = 0;
        for (let i = 0; i < searchItems.length; i++) {
          sumW += searchItems[i].w;
          aArr[i] = searchItems[i].w * (cValue(searchItems[i].type, searchItems[i].L.y) + 1);
        }

        const xs = symmetricAxisGrid(2.7, 0.9);
        const ys = descendingAxisGrid(-0.5, -6.3, 0.9);
        const positions = [];
        for (const y of ys) for (const x of xs) positions.push({x, y});

        const headingsA = jointHeadingAngles(ctxA.turnEnabled);
        const headingsB = jointHeadingAngles(ctxB.turnEnabled);
        const profilesA = positions.map(pos =>
          buildHeadingProfiles(pos, headingsA, searchItems, ctxA, aArr)
        );
        const profilesB = positions.map(pos =>
          buildHeadingProfiles(pos, headingsB, searchItems, ctxB, aArr)
        );

        const cands = [];
        for (let i = 0; i < positions.length; i++) {
          const posA = positions[i];
          for (let j = 0; j < positions.length; j++) {
            const posB = positions[j];
            const overlap = overlapPenalty(posA, posB);
            const formation = formationPenalty(posA, posB);
            for (const profileA of profilesA[i]) {
              for (const profileB of profilesB[j]) {
                let intersection = 0;
                for (let k = 0; k < searchItems.length; k++) {
                  intersection += aArr[k] * profileA.values[k] * profileB.values[k];
                }
                const value =
                  (profileA.weightedReach + profileB.weightedReach - intersection - sumW) / sumW -
                  overlap - formation;
                cands.push({
                  P1: {...posA, heading: profileA.heading},
                  P2: {...posB, heading: profileB.heading},
                  V: value
                });
              }
            }
          }
        }
        cands.sort((a, b) => b.V - a.V);
        const coarseEvaluator = makeJointPoseEvaluator(searchItems, aArr, sumW, ctxA, ctxB);
        const coarseSeeds = Math.min(cands.length, fast ? 6 : 16);
        for (let i = 0; i < coarseSeeds; i++) {
          cands[i] = refineJointPose(
            cands[i],
            coarseEvaluator,
            ctxA,
            ctxB,
            fast ? [0.45, 0.225, 0.1125] : [0.45, 0.225, 0.1125, 0.05],
            fast
              ? [Math.PI / 12, Math.PI / 24, Math.PI / 48]
              : [Math.PI / 12, Math.PI / 24, Math.PI / 48, Math.PI / 96]
          );
        }
        cands.sort((a, b) => b.V - a.V);

        const fineWeights = new Float32Array(items.length);
        let fineSumW = 0;
        for (let i = 0; i < items.length; i++) {
          fineSumW += items[i].w;
          fineWeights[i] = items[i].w * (cValue(items[i].type, items[i].L.y) + 1);
        }
        const fineEvaluator = makeJointPoseEvaluator(items, fineWeights, fineSumW, ctxA, ctxB);
        const exactCount = Math.min(cands.length, fast ? 24 : 64);
        for (let i = 0; i < exactCount; i++) cands[i].V = fineEvaluator(cands[i].P1, cands[i].P2);
        cands.sort((a, b) => b.V - a.V);

        const fineSeeds = Math.min(cands.length, fast ? 3 : 6);
        for (let i = 0; i < fineSeeds; i++) {
          cands[i] = refineJointPose(
            cands[i],
            fineEvaluator,
            ctxA,
            ctxB,
            [0.10, 0.05, 0.02],
            [Math.PI / 24, Math.PI / 48, Math.PI / 96]
          );
        }
        cands.sort((a, b) => b.V - a.V);

        if (ctxEqual(ctxA, ctxB)) {
          for (const cand of cands) {
            if (cand.P1.x > cand.P2.x + 1e-9) {
              const tmp = cand.P1;
              cand.P1 = cand.P2;
              cand.P2 = tmp;
            }
          }
        }

        return {
          best: [cands[0].P1, cands[0].P2],
          cands
        };
      }

      function optimizeDoubleSequential(items, fast, ctxA, ctxB) {
        const N = items.length;
        if (!N) {
          const a = {x: -1.5, y: -3, heading: 0};
          const b = {x: 1.5, y: -3, heading: 0};
          return {best: [a, b], cands: [{P1: a, P2: b, V: 0}], legalCount: 1, basePoseCount: 1};
        }

        const searchStep = fast ? 0.70 : 0.45;
        const xs = symmetricAxisGrid(2.7, searchStep);
        const ys = descendingAxisGrid(-0.5, -6.3, searchStep);
        const positions = [];
        for (const y of ys) for (const x of xs) positions.push({x, y});

        const itemWeights = new Float32Array(N);
        let sumW = 0;
        for (let i = 0; i < N; i++) {
          sumW += items[i].w;
          itemWeights[i] = items[i].w * (cValue(items[i].type, items[i].L.y) + 1);
        }
        const evaluator = makeJointPoseEvaluator(items, itemWeights, sumW, ctxA, ctxB);
        const sameContext = ctxEqual(ctxA, ctxB);

        const pairKey = (a, b) => [
          a.x.toFixed(5), a.y.toFixed(5), (a.heading || 0).toFixed(6),
          b.x.toFixed(5), b.y.toFixed(5), (b.heading || 0).toFixed(6)
        ].join(':');
        const candidateMap = new Map();
        const addCandidate = (a, b, v) => {
          let p1 = {...a}, p2 = {...b};
          if (sameContext && p1.x > p2.x + 1e-9) {
            const tmp = p1;
            p1 = p2;
            p2 = tmp;
          }
          const key = pairKey(p1, p2);
          const previous = candidateMap.get(key);
          if (!previous || v > previous.V + 1e-12) candidateMap.set(key, {P1: p1, P2: p2, V: v});
        };

        const coarsePose = (ctx) => {
          let best = null;
          let bestValue = -Infinity;
          const localCandidates = [];
          for (const pos of positions) {
            const heading = ctx.turnEnabled
              ? weightedHeadingForPosition(pos, items, ctx)
              : 0;
            const pose = {...pos, heading};
            const value = totalV(pos, items, null, {...ctx, heading}, null);
            localCandidates.push({pose, value});
            if (value > bestValue + 1e-9) {
              bestValue = value;
              best = pose;
            }
          }
          return {best, cands: localCandidates};
        };

        const coarseA = coarsePose(ctxA);
        const coarseB = sameContext ? coarseA : coarsePose(ctxB);
        const poseA = {...coarseA.best};
        let poseB = {...coarseB.best};
        let bestV = -Infinity;
        for (const item of coarseB.cands.slice(0, fast ? 8 : 16)) {
          const value = evaluator(poseA, item.pose);
          if (value > bestV + 1e-9) {
            bestV = value;
            poseB = item.pose;
          }
        }
        addCandidate(poseA, poseB, bestV);

        const refined = refineJointPose(
          {P1: poseA, P2: poseB, V: bestV},
          evaluator,
          ctxA,
          ctxB,
          [searchStep, searchStep * 0.5, searchStep * 0.25, searchStep * 0.125],
          [Math.PI / 12, Math.PI / 24, Math.PI / 48, Math.PI / 96],
          addCandidate
        );
        addCandidate(refined.P1, refined.P2, refined.V);

        const cands = Array.from(candidateMap.values());
        cands.sort((a, b) => b.V - a.V);
        const basePoseCount = positions.length * positions.length;
        return {
          best: [cands[0].P1, cands[0].P2],
          cands,
          legalCount: basePoseCount,
          basePoseCount
        };
      }

      function optimizeDoubleJointExact(items, fast, ctxA, ctxB) {
        const searchItems = items.slice().sort((a, b) =>
          b.w * cValue(b.type, b.L.y) - a.w * cValue(a.type, a.L.y)
        );
        const N = searchItems.length;
        if (!N) {
          const a = {x: -1.5, y: -3, heading: 0};
          const b = {x: 1.5, y: -3, heading: 0};
          return {best: [a, b], cands: [{P1: a, P2: b, V: 0}], legalCount: 1};
        }

        const itemWeights = new Float32Array(N);
        const tailMax = new Float32Array(N + 1);
        const groupMap = new Uint8Array(N);
        const groupCount = 16;
        const groupWeights = new Float64Array(groupCount);
        const typeGroup = {smash: 0, clear: 1, drop: 2, drive: 3};
        let sumW = 0;
        for (let i = 0; i < N; i++) {
          sumW += searchItems[i].w;
          itemWeights[i] =
            searchItems[i].w * (cValue(searchItems[i].type, searchItems[i].L.y) + 1);
          const typeIndex = typeGroup[searchItems[i].type] != null
            ? typeGroup[searchItems[i].type]
            : 3;
          const weightBand = Math.min(3, Math.floor(i / Math.max(1, N) * 4));
          const group = typeIndex * 4 + weightBand;
          groupMap[i] = group;
          groupWeights[group] += itemWeights[i];
        }
        for (let i = N - 1; i >= 0; i--) {
          tailMax[i] = tailMax[i + 1] +
            searchItems[i].w * cValue(searchItems[i].type, searchItems[i].L.y);
        }
        const evaluator = (poseA, poseB, cutoff) => {
          const overlap = overlapPenalty(poseA, poseB);
          const formation = formationPenalty(poseA, poseB);
          const ctxAP = {
            ...ctxA,
            heading: Number.isFinite(poseA.heading) ? poseA.heading : 0,
            headingSin: Math.sin(Number.isFinite(poseA.heading) ? poseA.heading : 0),
            headingCos: Math.cos(Number.isFinite(poseA.heading) ? poseA.heading : 0)
          };
          const ctxBP = {
            ...ctxB,
            heading: Number.isFinite(poseB.heading) ? poseB.heading : 0,
            headingSin: Math.sin(Number.isFinite(poseB.heading) ? poseB.heading : 0),
            headingCos: Math.cos(Number.isFinite(poseB.heading) ? poseB.heading : 0)
          };
          let unionScore = 0;
          for (let i = 0; i < N; i++) {
            const statsA = interceptStats(poseA, searchItems[i], ctxAP);
            const statsB = interceptStats(poseB, searchItems[i], ctxBP);
            const pa = statsA.p * statsA.q;
            const pb = statsB.p * statsB.q;
            unionScore += itemWeights[i] * (pa + pb - pa * pb);
            const upper =
              (unionScore + tailMax[i + 1] - sumW) / sumW - overlap - formation;
            if (upper <= cutoff + 1e-9) return -Infinity;
          }
          return (unionScore - sumW) / sumW - overlap - formation;
        };

        const step = fast ? 0.70 : 0.45;
        const xs = symmetricAxisGrid(2.7, step);
        const ys = descendingAxisGrid(-0.5, -6.3, step);
        const positions = [];
        for (const y of ys) for (const x of xs) positions.push({x, y});

        const headingsA = jointHeadingAngles(ctxA.turnEnabled);
        const headingsB = jointHeadingAngles(ctxB.turnEnabled);
        let profilesA = positions.map(pos =>
          buildHeadingProfiles(
            pos, headingsA, searchItems, ctxA, itemWeights, groupMap, groupCount
          )
        );
        const sameContext = ctxEqual(ctxA, ctxB);
        let profilesB = sameContext
          ? profilesA
          : positions.map(pos =>
            buildHeadingProfiles(
              pos, headingsB, searchItems, ctxB, itemWeights, groupMap, groupCount
            )
          );

        profilesA = profilesA.map(pruneDominatedHeadingProfiles);
        if (!sameContext) profilesB = profilesB.map(pruneDominatedHeadingProfiles);
        const positionGroupMinsA = profilesA.map(aggregateProfileGroupMins);
        const positionGroupMinsB = sameContext
          ? positionGroupMinsA
          : profilesB.map(aggregateProfileGroupMins);

        const legalCount =
          positions.length * positions.length * headingsA.length * headingsB.length;
        const basePoseCount = positions.length * positions.length;
        const pairs = [];
        for (let i = 0; i < positions.length; i++) {
          const posA = positions[i];
          const maxA = profilesA[i][0].weightedReach;
          const minA = profilesA[i][profilesA[i].length - 1].weightedReach;
          for (let j = 0; j < positions.length; j++) {
            const overlap = overlapPenalty(posA, positions[j]);
            const formation = formationPenalty(posA, positions[j]);
            const maxB = profilesB[j][0].weightedReach;
            const minB = profilesB[j][profilesB[j].length - 1].weightedReach;
            const intersectionLower = groupedIntersectionLower(
              positionGroupMinsA[i],
              positionGroupMinsB[j],
              groupWeights,
              Math.max(0, minA + minB - sumW)
            );
            pairs.push({
              i,
              j,
              overlap,
              formation,
              upperBound:
                (maxA + maxB - intersectionLower - sumW) / sumW - overlap - formation
            });
          }
        }
        pairs.sort((a, b) => b.upperBound - a.upperBound);

        const cands = [];
        let bestV = -Infinity;
        let bestPoseA = null;
        let bestPoseB = null;

        for (const pair of pairs) {
          if (pair.upperBound <= bestV + 1e-9) break;
          const posA = positions[pair.i];
          const posB = positions[pair.j];

          for (const profileA of profilesA[pair.i]) {
            for (const profileB of profilesB[pair.j]) {
              const sumProfiles = profileA.weightedReach + profileB.weightedReach;
              const intersectionLower = groupedIntersectionLower(
                profileA.groupMins,
                profileB.groupMins,
                groupWeights,
                Math.max(0, sumProfiles - sumW)
              );
              const headingUpperBound =
                (sumProfiles - intersectionLower - sumW) / sumW -
                pair.overlap - pair.formation;
              if (headingUpperBound <= bestV + 1e-9) continue;

              let unionScore = 0;
              let aborted = false;
              for (let k = 0; k < N; k++) {
                const pa = profileA.values[k];
                const pb = profileB.values[k];
                unionScore += itemWeights[k] * (pa + pb - pa * pb);
                const runningUpper =
                  (unionScore + tailMax[k + 1] - sumW) / sumW -
                  pair.overlap - pair.formation;
                if (runningUpper <= bestV + 1e-9) {
                  aborted = true;
                  break;
                }
              }
              if (aborted) continue;
              const value =
                (unionScore - sumW) / sumW - pair.overlap - pair.formation;
              const poseA = {...posA, heading: profileA.heading};
              const poseB = {...posB, heading: profileB.heading};
              cands.push({P1: poseA, P2: poseB, V: value});

              if (value > bestV + 1e-9) {
                bestV = value;
                bestPoseA = poseA;
                bestPoseB = poseB;
              }
            }
          }
        }

        if (bestPoseA) {
          const catalogLimit = Math.min(
            8192,
            Math.max(512, Math.round(basePoseCount * 0.20))
          );
          const catalogEvaluateLimit = catalogLimit + cands.length;
          let evaluatedCatalogPoses = 0;
          const seen = new Set(cands.map(cand =>
            [
              cand.P1.x.toFixed(5), cand.P1.y.toFixed(5), cand.P1.heading.toFixed(6),
              cand.P2.x.toFixed(5), cand.P2.y.toFixed(5), cand.P2.heading.toFixed(6)
            ].join(':')
          ));

          for (const pair of pairs) {
            if (evaluatedCatalogPoses >= catalogEvaluateLimit) break;
            const posA = positions[pair.i];
            const posB = positions[pair.j];

            for (const profileA of profilesA[pair.i]) {
              for (const profileB of profilesB[pair.j]) {
                let unionScore = 0;
                for (let k = 0; k < N; k++) {
                  const pa = profileA.values[k];
                  const pb = profileB.values[k];
                  unionScore += itemWeights[k] * (pa + pb - pa * pb);
                }
                evaluatedCatalogPoses++;

                const value =
                  (unionScore - sumW) / sumW - pair.overlap - pair.formation;
                const poseA = {...posA, heading: profileA.heading};
                const poseB = {...posB, heading: profileB.heading};
                const key = [
                  poseA.x.toFixed(5), poseA.y.toFixed(5), poseA.heading.toFixed(6),
                  poseB.x.toFixed(5), poseB.y.toFixed(5), poseB.heading.toFixed(6)
                ].join(':');
                if (seen.has(key)) continue;
                seen.add(key);
                cands.push({P1: poseA, P2: poseB, V: value});
                if (evaluatedCatalogPoses >= catalogEvaluateLimit) break;
              }
              if (evaluatedCatalogPoses >= catalogEvaluateLimit) break;
            }
          }
        }

        if (!bestPoseA) {
          const pair = pairs[0];
          bestPoseA = {...positions[pair.i], heading: headingsA[0]};
          bestPoseB = {...positions[pair.j], heading: headingsB[0]};
          bestV = evaluator(bestPoseA, bestPoseB);
          cands.push({P1: bestPoseA, P2: bestPoseB, V: bestV});
        }

        cands.sort((a, b) => b.V - a.V);
        const exactSeeds = Math.min(cands.length, fast ? 3 : 8);
        for (let i = 0; i < exactSeeds; i++) {
          cands[i] = refineSequentialPose(
            cands[i],
            evaluator,
            ctxA,
            ctxB,
            [step, step * 0.5, step * 0.25, step * 0.125],
            [Math.PI / 12, Math.PI / 24, Math.PI / 48, Math.PI / 96]
          );
        }
        cands.sort((a, b) => b.V - a.V);

        if (sameContext) {
          for (const cand of cands) {
            if (cand.P1.x > cand.P2.x + 1e-9) {
              const tmp = cand.P1;
              cand.P1 = cand.P2;
              cand.P2 = tmp;
            }
          }
        }

        return {
          best: [cands[0].P1, cands[0].P2],
          cands,
          legalCount,
          basePoseCount
        };
      }

      function sampleCandidates(list, n) {
        if (!list.length) return [];
        if (list.length <= n) return list.slice();
        const out = new Array(n);
        const M = list.length;
        const denom = n - 1;
        let lastIdx = -1;
        for (let i = 0; i < n; i++) {
          const u = denom > 0 ? i / denom : 0;
          let idx = Math.round((M - 1) * Math.pow(u, SCORE_SAMPLE_POW));
          if (idx <= lastIdx) idx = lastIdx + 1;
          if (idx > M - 1) idx = M - 1;
          out[i] = list[idx];
          lastIdx = idx;
        }
        return out;
      }

      function finalizeSolve(r, items, fast, clearTMin, useJointPose) {
        const precise = !fast;
        legalCandidateCount = 0;
        let topUnitCount = 0;
        const ctxA = ctxOf('a');
        const ctxB = ctxOf('b');
        const bestP1 = mode === 'single' ? r.best : r.best[0];
        const bestP2 = mode === 'single' ? null : r.best[1];
        const cands = r.cands;
        if (mode === 'single') {
          topUnitCount = ctxA.turnEnabled
            ? Math.max(1, Math.round(cands.length / 12))
            : cands.length;
        } else {
          if (r.legalCount) legalCandidateCount = r.legalCount;
          topUnitCount = useJointPose
            ? (r.basePoseCount || r.cands.length)
            : cands.length;
        }
        const totalCandidates = Math.max(1, legalCandidateCount || cands.length);
        legalCandidateCount = totalCandidates;
        topMax = Math.max(1, Math.round(topUnitCount * 0.20));
        topDefault = Math.max(1, Math.round(topUnitCount * 0.001));
        topMax = Math.min(topMax, Math.max(1, cands.length));
        topDefault = Math.min(topDefault, topMax);
        topN = topDefault;
        selectedRank = 1;

        candidateItems = items;
        candidateList = sampleCandidates(cands, topMax);
        if (candidateList.length) {
          candidateList[0] = {P1: bestP1, P2: bestP2, V: cands.length ? cands[0].V : 0};
        } else {
          candidateList = [{P1: bestP1, P2: bestP2, V: 0}];
          topMax = 1;
          topDefault = 1;
          topN = 1;
        }

        const pick = candidateList[Math.min(selectedRank - 1, candidateList.length - 1)];
        const ctxAP = ctxForStoredPose(pick.P1, items, ctxA);
        const ctxBP = pick.P2 ? ctxForStoredPose(pick.P2, items, ctxB) : null;
        const reachStats = mode === 'single'
          ? avgReachByType(items, pick.P1, null, ctxAP, null)
          : avgReachByType(items, pick.P1, pick.P2, ctxAP, ctxBP);

        return {P1: pick.P1, P2: pick.P2, valid: true, precise, reachStats, clearTMin};
      }

      function solve(fast) {
        const stepPos = fast ? 0.45 : 0.20;
        headingCache.clear();

        const probs = getProbs();
        rebuildLandings(probs, fast);

        let clearTMin = null;
        for (const Ld of cachedLandings) {
          if (Ld.type === 'clear') {
            if (clearTMin == null || Ld.t < clearTMin) clearTMin = Ld.t;
          }
        }

        const cellSize = fast ? 0.25 : 0.18;
        let items = buildItemsFromLandings(cachedLandings, cellSize);

        if (!items.length) {
          items = [{L: {x: 0, y: -PRM.clearLineY}, w: 1, type: 'clear', t: 0.6, trace: null}];
        }
        const ctxA = ctxOf('a');
        const ctxB = ctxOf('b');
        const useJointPose = mode === 'double' && (ctxA.turnEnabled || ctxB.turnEnabled);
        if (useJointPose) {
          const exactPaths = buildExactPathItems(cachedLandings);
          if (exactPaths.length) items = exactPaths;
        }

        const r = mode === 'single'
          ? optimizeSolo(items, stepPos, ctxA)
          : useJointPose
            ? optimizeDoubleJointExact(items, fast, ctxA, ctxB)
            : optimizeDouble(items, fast, ctxA, ctxB);
        return finalizeSolve(r, items, fast, clearTMin, useJointPose);
      }

      function cancelJointWorkerSolve() {
        if (!jointWorkerBusy) return;
        jointWorkerJobId++;
        if (jointWorker) jointWorker.terminate();
        jointWorker = null;
        jointWorkerBusy = false;
        jointWorkerPrepared = null;
      }

      function createJointWorker() {
        const constantSource = [
          'const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);',
          `const PRM = ${JSON.stringify(PRM)};`,
          `const REACH_PMAX = ${REACH_PMAX};`,
          `const DROP_EXTRA_T = ${DROP_EXTRA_T};`,
          `const T_INTERCEPT = ${JSON.stringify(T_INTERCEPT)};`,
          `const V_FWD_K = ${V_FWD_K};`,
          `const V_SIDE_K = ${V_SIDE_K};`,
          `const LAMBDA_RUN = ${LAMBDA_RUN};`,
          `const OUR_HEADING = ${OUR_HEADING};`,
          `const SEP_MIN_DIST = ${SEP_MIN_DIST};`,
          `const SEP_PEN_K = ${SEP_PEN_K};`,
          'let headingCache = new Map();'
        ].join('\n');
        const workerFunctions = [
          touchScale,
          smoothRamp,
          wrapMotionAngle,
          motionTimeToPoint,
          cValue,
          reachProb,
          runTime,
          interceptFallback,
          interceptStats,
          ctxEqual,
          overlapPenalty,
          formationRingGeometry,
          formationRingTargets,
          formationMatchForPositions,
          formationPenalty,
          singleRecoveryPenalty,
          weightedHeadingForPosition,
          headingMotionScore,
          bestHeadingForPosition,
          ctxForPosition,
          symmetricAxisGrid,
          descendingAxisGrid,
          itemV,
          totalV,
          optimizeSolo,
          makeJointPoseEvaluator,
          jointHeadingAngles,
          buildHeadingProfiles,
          pruneDominatedHeadingProfiles,
          aggregateProfileGroupMins,
          groupedIntersectionLower,
          refineJointPose,
          refineSequentialPose,
          optimizeDoubleJointExact
        ].map(fn => fn.toString()).join('\n\n');
        const handler = `
self.onmessage = function (event) {
  const data = event.data;
  try {
    const result = optimizeDoubleJointExact(
      data.items,
      data.fast,
      data.ctxA,
      data.ctxB
    );
    self.postMessage({jobId: data.jobId, ok: true, result});
  } catch (error) {
    self.postMessage({
      jobId: data.jobId,
      ok: false,
      error: String(error && (error.stack || error.message) || error)
    });
  }
};`;
        const source = `'use strict';\n${constantSource}\n${workerFunctions}\n${handler}`;
        const url = URL.createObjectURL(new Blob([source], {type: 'text/javascript'}));
        const worker = new Worker(url);
        URL.revokeObjectURL(url);
        worker.onmessage = handleJointWorkerMessage;
        worker.onerror = event => {
          jointWorkerBusy = false;
          jointWorkerPrepared = null;
          console.error('joint worker error:', event.message || event);
          needsSolve = true;
          manualSolvePending = true;
          candidateStatusDot.classList.remove('is-ready');
          candidateStatusDot.title = '后台计算失败，请重新更新';
          updateManualUpdateUI();
          updateStats();
        };
        return worker;
      }

      function prepareJointWorkerSolve(fast) {
        headingCache.clear();
        rebuildLandings(getProbs(), fast);
        let clearTMin = null;
        for (const landing of cachedLandings) {
          if (landing.type === 'clear' &&
              (clearTMin == null || landing.t < clearTMin)) {
            clearTMin = landing.t;
          }
        }
        let items = buildExactPathItems(cachedLandings);
        if (!items.length) {
          items = [{
            L: {x: 0, y: -PRM.clearLineY},
            w: 1, type: 'clear', t: 0.6, trace: null
          }];
        }
        return {
          items,
          clearTMin,
          ctxA: ctxOf('a'),
          ctxB: ctxOf('b')
        };
      }

      function startJointWorkerSolve(fast) {
        if (jointWorkerBusy) return false;
        const prepared = prepareJointWorkerSolve(fast);
        const jobId = ++jointWorkerJobId;
        if (!jointWorker) jointWorker = createJointWorker();
        jointWorkerPrepared = prepared;
        jointWorkerBusy = true;
        jointWorkerStarted = performance.now();
        jointWorkerFast = fast;
        needsSolve = false;
        manualSolvePending = false;
        manualResultsCleared = true;
        candidateStatusDot.classList.remove('is-ready');
        candidateStatusDot.title = '后台计算中';
        updateManualUpdateUI();
        jointWorker.postMessage({
          jobId,
          fast,
          items: prepared.items,
          ctxA: prepared.ctxA,
          ctxB: prepared.ctxB
        });
        return true;
      }

      function handleJointWorkerMessage(event) {
        const data = event.data || {};
        if (data.jobId !== jointWorkerJobId) return;
        const prepared = jointWorkerPrepared;
        const elapsed = performance.now() - jointWorkerStarted;
        jointWorkerBusy = false;
        jointWorkerPrepared = null;
        if (!data.ok || !prepared) {
          console.error('joint worker solve failed:', data.error);
          needsSolve = true;
          manualSolvePending = true;
          candidateStatusDot.classList.remove('is-ready');
          candidateStatusDot.title = '后台计算失败，请重新更新';
          updateManualUpdateUI();
          return;
        }

        result = finalizeSolve(
          data.result,
          prepared.items,
          jointWorkerFast,
          prepared.clearTMin,
          true
        );
        needsSolve = false;
        manualSolvePending = false;
        manualResultsCleared = false;
        heatDirty = true;
        sideHeatDirty = true;
        suboptDirty = true;
        detectSlowSolve(elapsed, jointWorkerFast);
        updateStats();
        updateManualUpdateUI();
      }

      function applyScore() {
        if (!candidateList.length) return;
        const c = candidateList[Math.min(selectedRank - 1, candidateList.length - 1)];
        if (!c) return;

        result.P1 = c.P1;
        result.P2 = c.P2;
        result.valid = true;

        if (candidateItems) {
          const ctxA = ctxOf('a');
          const ctxB = ctxOf('b');
          const ctxAP = ctxForStoredPose(c.P1, candidateItems, ctxA);
          const ctxBP = c.P2 ? ctxForStoredPose(c.P2, candidateItems, ctxB) : null;
          result.reachStats = mode === 'single'
            ? avgReachByType(candidateItems, c.P1, null, ctxAP, null)
            : avgReachByType(candidateItems, c.P1, c.P2, ctxAP, ctxBP);
        }

        updateStats();
      }

      /* ============================================================
         九、主视图绘制
         ============================================================ */
      function drawCourtBase() {
        const tl = w2c({x: -HW, y: HL}), br = w2c({x: HW, y: -HL});
        const x = Math.min(tl.x, br.x), y = Math.min(tl.y, br.y);
        const w = Math.abs(br.x - tl.x), h = Math.abs(br.y - tl.y);
        ctx.fillStyle = '#f7fbf9';
        ctx.fillRect(x, y, w, h);
      }

      function drawCourtLines() {
        const tl = w2c({x: -HW, y: HL}), br = w2c({x: HW, y: -HL});
        const x = Math.min(tl.x, br.x), y = Math.min(tl.y, br.y);
        const w = Math.abs(br.x - tl.x), h = Math.abs(br.y - tl.y);

        ctx.save();
        ctx.strokeStyle = C_COURT_LINE;
        ctx.lineWidth = 1 / mainScale;
        ctx.globalAlpha = 0.68;
        ctx.setLineDash([]);
        for (const yy of [HL, HL - LONG_SVC, SHORT_SVC, -SHORT_SVC, -(HL - LONG_SVC), -HL]) {
          lineStroke(w2c({x: -HW, y: yy}), w2c({x: HW, y: yy}));
        }
        for (const xx of [-HW, HW, -SINGLES_HW, SINGLES_HW]) {
          lineStroke(w2c({x: xx, y: -HL}), w2c({x: xx, y: HL}));
        }
        for (const s of [-1, 1]) {
          lineStroke(w2c({x: 0, y: s * SHORT_SVC}), w2c({x: 0, y: s * HL}));
        }
        ctx.restore();

        ctx.strokeStyle = C_COURT_FRAME; ctx.lineWidth = 2 / mainScale;
        ctx.strokeRect(x, y, w, h);

        const n1 = w2c({x: -HW, y: 0}), n2 = w2c({x: HW, y: 0});
        ctx.beginPath(); ctx.strokeStyle = C_NET; ctx.lineWidth = 4 / mainScale;
        ctx.lineCap = 'round';
        ctx.moveTo(n1.x, n1.y); ctx.lineTo(n2.x, n2.y); ctx.stroke();
        ctx.lineCap = 'butt';

        ctx.save();
        ctx.setLineDash([3, 4]);
        ctx.lineWidth = 1 / mainScale;
        ctx.strokeStyle = C_REF_BLUE;
        for (const dn of [DROP_NEAR_EDGE, DROP_FAR_EDGE]) {
          lineStroke(w2c({x: -HW, y: -dn}), w2c({x: HW, y: -dn}));
        }
        ctx.setLineDash([2, 6]);
        ctx.strokeStyle = C_REF_RED;
        lineStroke(w2c({x: -HW, y: -PRM.clearLineY}), w2c({x: HW, y: -PRM.clearLineY}));
        ctx.restore();
      }
