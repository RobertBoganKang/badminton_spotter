<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>羽毛球场站位点</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦵</text></svg>">
  <style>
    :root {
      --bg: #eef2f6;
      --card: #fff;
      --text: #1a2b22;
      --text-2: #5b6b62;
      --text-3: #8a9a91;
      --border: #e4ebe6;
      --shadow: 0 1px 2px rgba(20, 50, 35, .04), 0 8px 24px rgba(20, 50, 35, .05);
      --primary: #166b46;
      --primary-2: #1f8a5b;
      --primary-bright: #22a06b;
      --velocity-blue: #1e88e5;
      --velocity-blue-light: #62c6eb;
      --seg-clear: 45, 90, 200;
      --seg-drop: 40, 170, 80;
      --seg-kill: 192, 57, 43;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px 12px;
      background: radial-gradient(1000px 500px at 15% -5%, #d9ece1 0%, transparent 55%),
        radial-gradient(800px 400px at 90% 0%, #e3e9f7 0%, transparent 50%), var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .header {
      padding: 14px 18px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: nowrap;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(31, 138, 91, .10) 0%, transparent 65%);
      pointer-events: none;
    }

    .header-left {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      flex: 1;
      min-width: 0;
      position: relative;
    }

    .header-left>div:not(.logo) {
      min-width: 0;
      flex: 1;
    }

    .logo {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-bright), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      box-shadow: 0 4px 12px rgba(22, 107, 70, .28), inset 0 1px 0 rgba(255, 255, 255, .2);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: .2px;
      line-height: 1.35;
    }

    .header p {
      margin: 0;
      font-size: 11.5px;
      color: var(--text-3);
      line-height: 1.55;
      word-break: break-word;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      position: relative;
    }

    .lang-btn {
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 7px;
      background: transparent;
      border: none;
      border-radius: 5px;
      color: var(--text-3);
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1;
      letter-spacing: .3px;
      opacity: .85;
      transition: color .15s, opacity .15s, transform .12s;
    }

    .lang-btn:hover {
      color: var(--primary);
      opacity: 1;
    }

    .lang-btn:active {
      transform: scale(.92);
    }

    .app.collapsed .header {
      display: none;
    }

    .canvas-card {
      padding: 0;
      overflow: hidden;
    }

    .canvas-topbar {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      padding: 9px 12px;
      border-bottom: 1px solid #f0f4f1;
      font-size: 11.5px;
      color: var(--text-2);
    }

    .sidebar-btn {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f0f5f2;
      border: 1px solid var(--border);
      color: var(--text-2);
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      transition: background .15s, color .15s, transform .12s;
    }

    .sidebar-btn:hover {
      background: #e6efe9;
      color: var(--primary);
    }

    .sidebar-btn:active {
      transform: scale(.92);
    }

    .sidebar-btn svg {
      width: 13px;
      height: 13px;
      stroke-width: 2.4;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
    }

    .collapse-btn {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      padding: 0;
      opacity: .75;
      transition: color .15s, transform .12s, opacity .15s;
      font-family: inherit;
    }

    .collapse-btn:hover {
      color: var(--primary);
      opacity: 1;
    }

    .collapse-btn:active {
      transform: scale(.9);
    }

    .collapse-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .collapse-btn .chev-down {
      display: none;
    }

    .app.collapsed .collapse-btn .chev-up {
      display: none;
    }

    .app.collapsed .collapse-btn .chev-down {
      display: inline;
    }

    .manual-update-btn {
      height: 24px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text-2);
      background: #eef2f0;
      font: 700 10.5px inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      outline: none;
    }

    .manual-update-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .manual-update-btn[hidden] {
      display: none;
    }

    .mode-toggle {
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 13px;
      background: #e8eee9;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      font-family: inherit;
      line-height: 1;
      letter-spacing: .3px;
      min-width: 46px;
      transition: background .15s, color .15s, transform .12s;
    }

    .mode-toggle:hover {
      background: #dde6e0;
    }

    .mode-toggle:active {
      transform: scale(.96);
    }

    .mode-toggle[data-mode="single"] {
      background: #e8f0f7;
      color: #1e6bb8;
    }

    .mode-toggle[data-mode="single"]:hover {
      background: #dbe7f3;
    }

    .symmetry-toggle {
      display: inline-flex;
      width: 28px;
      height: 24px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid rgba(22, 107, 70, .38);
      border-radius: 7px;
      color: var(--primary);
      background: rgba(22, 107, 70, .08);
      font: 700 16px/1 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      touch-action: manipulation;
      transition: color .15s, background .15s, border-color .15s;
    }

    .symmetry-toggle.is-active {
      border-color: var(--primary);
      color: #fff;
      background: var(--primary);
    }

    .our-hand-cluster {
      display: none;
      align-items: stretch;
      height: 22px;
      flex: 0 0 auto;
    }

    .our-hand-cluster.is-visible {
      display: inline-flex;
    }

    .our-hand-pill {
      min-width: 34px;
      padding: 0 7px;
      border: 1px solid rgba(30, 136, 229, .32);
      color: var(--velocity-blue);
      background: rgba(30, 136, 229, .10);
      font: 700 10px system-ui;
      cursor: pointer;
      touch-action: manipulation;
    }

    .our-hand-pill:first-child {
      border-radius: 999px 3px 3px 999px;
    }

    .our-hand-pill:last-child {
      margin-left: -1px;
      border-radius: 3px 999px 999px 3px;
    }

    .our-hand-pill.is-left-hand {
      border-color: rgba(98, 198, 235, .56);
      color: var(--velocity-blue-light);
      background: rgba(98, 198, 235, .18);
    }

    .our-hand-pill[hidden] {
      display: none;
    }

    .tb-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: 0;
    }

    .pill-group {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .2px;
      border: 1px solid transparent;
      white-space: nowrap;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      cursor: ns-resize;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .pill:active {
      transform: scale(.96);
    }

    .pill-height {
      background: rgba(31, 111, 139, .12);
      border-color: rgba(31, 111, 139, .28);
      color: #1f6f8b;
    }

    .pill-score {
      background: rgba(108, 60, 225, .12);
      border-color: rgba(108, 60, 225, .28);
      color: #6c3ce1;
    }

    .rank-cluster {
      display: inline-flex;
      align-items: stretch;
      height: 20px;
    }

    .rank-cluster .pill-score {
      height: 20px;
      gap: 4px;
      padding: 1px 8px;
      cursor: ns-resize;
    }

    .rank-cluster .pill-score b {
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1;
      color: inherit;
      font-variant-numeric: tabular-nums;
    }

    .score-left {
      border-radius: 999px 4px 4px 999px !important;
    }

    .score-right {
      margin-left: -1px;
      border-radius: 4px 999px 999px 4px !important;
    }

    .pill-score[hidden] {
      display: none !important;
    }

    .seg-group {
      display: inline-flex;
      align-items: stretch;
      flex-shrink: 0;
      border-radius: 999px;
    }

    .seg {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 9px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .2px;
      border: 1px solid transparent;
      white-space: nowrap;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      cursor: ns-resize;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      margin-left: -1px;
      transition: filter .15s;
    }

    .seg:first-child {
      margin-left: 0;
    }

    .seg:hover {
      z-index: 1;
      filter: brightness(.96);
    }

    .seg:active {
      filter: brightness(.92);
    }

    .seg-clear {
      border-radius: 999px 0 0 999px;
      background: rgba(var(--seg-clear), .12);
      border-color: rgba(var(--seg-clear), .28);
      color: rgb(var(--seg-clear));
    }

    .seg-drop {
      border-radius: 0;
      background: rgba(var(--seg-drop), .12);
      border-color: rgba(var(--seg-drop), .28);
      color: rgb(var(--seg-drop));
    }

    .seg-kill {
      border-radius: 0 999px 999px 0;
      background: rgba(var(--seg-kill), .12);
      border-color: rgba(var(--seg-kill), .28);
      color: rgb(var(--seg-kill));
    }

    .canvas-wrap {
      position: relative;
      padding: 9px 10px 8px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 8px;
    }

    .calc-wait-bubble {
      position: absolute;
      z-index: 30;
      display: none;
      padding: 7px 13px;
      border: 1px solid rgba(31, 111, 139, .24);
      border-radius: 999px;
      color: #111827;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 5px 18px rgba(20, 50, 35, .12);
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .calc-wait-bubble.is-visible {
      display: block;
    }

    .rank-legend {
      position: static;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 3px;
      border: 0;
      border-radius: 0;
      color: var(--text-3);
      background: transparent;
      box-shadow: none;
      font-size: 9.5px;
      font-weight: 600;
      pointer-events: none;
    }

    .rank-legend[hidden] {
      display: none !important;
    }

    .rank-legend i {
      display: block;
      width: 30px;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, #d73027, #fc8d59, #ffffbf, #91bfdb, #4575b4);
    }

    .our-foot-legend {
      display: none;
      align-items: center;
      gap: 4px;
      min-width: 0;
      color: #1e88e5;
      font-size: 9.5px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
    }

    .our-foot-legend.is-visible {
      display: inline-flex;
    }

    .our-foot-legend i {
      display: block;
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #1e88e5;
    }

    canvas {
      display: block;
      border-radius: 10px;
      touch-action: none;
      background: #f7fbf9;
      max-width: 100%;
      box-shadow: 0 1px 3px rgba(20, 50, 35, .06), 0 4px 14px rgba(20, 50, 35, .05);
    }

    #sideCanvas {
      flex: 0 0 auto;
      touch-action: none;
    }

    .info-line {
      padding: 0 12px 10px;
      font-size: 11px;
      color: var(--text-3);
      text-align: center;
      line-height: 1.6;
      font-variant-numeric: tabular-nums;
    }

    .candidate-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px 3px;
      color: var(--text-3);
      font-size: 10.5px;
      line-height: 1.5;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .candidate-status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #d6a128;
      box-shadow: 0 0 0 3px rgba(214, 161, 40, .12);
      transition: background .18s, box-shadow .18s;
    }

    .candidate-status-dot.is-ready {
      background: #22a06b;
      box-shadow: 0 0 0 3px rgba(34, 160, 107, .12);
    }

    .candidate-line b {
      color: var(--text-2);
      font-weight: 700;
    }

    .info-line b {
      color: var(--text-2);
      font-weight: 600;
    }

    .footer {
      padding: 2px 8px 6px;
      text-align: center;
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: .3px;
      line-height: 1.7;
    }

    .footer b {
      color: var(--text-2);
      font-weight: 600;
    }

    #credit {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(330px, 88vw);
      background: #fff;
      z-index: 60;
      transform: translateX(-103%);
      transition: transform .26s cubic-bezier(.4, 0, .2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 26px rgba(20, 50, 35, .14);
    }

    .sidebar.open {
      transform: none;
    }

    .sidebar-mask {
      position: fixed;
      inset: 0;
      background: rgba(10, 30, 20, .40);
      opacity: 0;
      pointer-events: none;
      transition: opacity .26s;
      z-index: 59;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
    }

    .sidebar-mask.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      flex-shrink: 0;
    }

    .sidebar-head h2 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .sidebar-close {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
      font-family: inherit;
    }

    .sidebar-close:active {
      transform: scale(.9);
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      user-select: none;
      -webkit-user-select: none;
    }

    .sidebar-foot {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-foot button {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f5f9f6;
      color: var(--text-2);
      font-family: inherit;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background .15s;
    }

    .sidebar-foot button:hover {
      background: #eaf2ed;
    }

    .sidebar-foot button:active {
      transform: scale(.98);
    }

    .s-group {
      padding: 9px 14px 10px;
      border-bottom: 1px solid #f0f4f1;
    }

    .s-group:last-child {
      border-bottom: none;
    }

    .s-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }

    .s-title span {
      font-weight: 500;
      color: var(--text-3);
      font-size: 9.5px;
      text-align: right;
    }

    .s-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .s-item {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: var(--text-2);
      min-width: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .s-item.dual {
      grid-template-columns: 76px minmax(0, 1fr);
    }

    .s-meta {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 0;
    }

    .s-meta span {
      white-space: nowrap;
      overflow: hidden;
      max-width: 100%;
      text-overflow: ellipsis;
    }

    .s-meta b {
      font-weight: 700;
      color: var(--primary);
      text-align: left;
      font-variant-numeric: tabular-nums;
      font-size: 9px;
    }

    .s-item.dual .s-meta b {
      font-size: 9px;
    }

    .s-item input[type=range] {
      width: 100%;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
      margin: 0;
      outline: none;
    }

    .s-item input[type=range]:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .r2 {
      position: relative;
      height: 20px;
      width: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    .r2-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 4px;
      margin-top: -2px;
      border-radius: 2px;
      background: #e4ebe6;
    }

    .r2-fill {
      position: absolute;
      top: 50%;
      height: 4px;
      margin-top: -2px;
      border-radius: 2px;
      background: var(--primary);
      opacity: .45;
    }

    .r2-thumb {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--primary);
      box-shadow: 0 1px 3px rgba(20, 50, 35, .25);
      cursor: grab;
      touch-action: none;
      transition: background .12s;
    }

    .r2-thumb:active {
      cursor: grabbing;
      background: #e6f2ec;
    }

    .s-curve {
      margin-top: 8px;
      padding: 6px 0 2px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .s-curve canvas {
      width: 100%;
      height: 64px;
      border-radius: 6px;
      background: #f7fbf9;
      border: 1px solid var(--border);
      display: block;
      box-shadow: none;
    }

    .s-curve-caption {
      font-size: 9.5px;
      color: var(--text-3);

          collapseHide: '隐藏标题', collapseShow: '展开标题',
          langBtn: 'EN',
          pillHint: '拖动调整（上增下减）',
          heightHint: '上下拖动调整击球高度',
          scoreHint: '上下拖动浏览候选站位（上 = 更优）· 双击恢复最优 1',
          pillHeight: '击球高',
          pillScore: '优劣',
          ourBack: '后', ourFront: '前', ourSolo: '站位',
          labelLeft: '左', labelRight: '右',
          ourFootLegend: '执拍侧脚',
          tagFast: '快', tagSlow: '慢',
          infoContact: '击球高',
          infoSmash: '杀', infoClear: '高', infoDrop: '吊',
          infoGap: '间距',
          infoHeatOn: '热力图开',
          infoSuboptOn: '点云',
          infoClearMin: '高最快',
          infoReachSmash: '杀接', infoReachDrop: '吊接', infoReachClear: '高接',
          pillLabelSm: '杀', pillLabelDr: '吊', pillLabelCl: '高',
          principleHTML: `
      <p class="lead"><b>一句话：</b>用物理模拟生成所有可能的杀/高/吊落点（含多初速度与过滤），按概率加权，求让<b>期望净得分 V 最大</b>的站位。目标是最小化总体失球率。</p>

      <h3>一、坐标系与真实物理</h3>
      <ul>
        <li>场地长 <code>13.40 m</code>、宽 <code>6.10 m</code>，球网位于 <code>y = 0</code>；我方 <code>y &lt; 0</code>，对手 <code>y &gt; 0</code></li>
        <li>阻力系数随速度变化：<code>CD(v) = 0.50 + 0.30/(1+(v/8)²)</code>。低速（&lt;10 m/s）约 0.65–0.80，高速（&gt;40 m/s）约 0.50–0.55。</li>
      </ul>

      <h3>二、三种球路的生成（两端等角切分 + 多初速度扫描）</h3>
      <p><b>落点方向由目标线上的等距采样点决定</b>：把参考线两端各向外延伸 1 m 得到一条扩展线段，在这条线段上<b>等距离取 N+1 个采样点</b>；从击球点分别连向每个采样点，就得到 N+1 条扫描方位角——中间角度疏、两侧角度密，更贴近“瞄点”直觉，而 1 m 的外延仍保证边线附近有足够可选角度；仰角在该方位角下扫描，找出物理可行的弹道。<b>所有方位角等权</b>，落点再按距离核（落点深浅偏好）与初速度权重加权。</p>
      <p><b>杀球</b>：瞄<b>控高线</b>。「杀球最大初速度」滑块范围为 15–120 m/s，默认 60 m/s，代表个人能打出的<b>最大</b>球速；实际生成时在 <code>0.55×～1.00×（最大值 × 高度因子）</code> 之间做多档速度扫描（快模式 4 档 / 完整模式 6 档），速度权重 <code>0.20 + 0.80·u²</code> 向高速端倾斜。仰角只扫「球拍→球网上沿连线角」到 +10° 这一段，始终平射或向下，略微向上不超过 10°。</p>
      <p><b>吊球</b>：瞄<b>球网线</b>，初速度在「吊球初速度」区间内多档扫描，接近上限的权重按 <code>exp(−2.5·u²)</code> 衰减；仰角 <b>−80°~+88° 全扫</b>并用几何预筛分段（保留近网陡压与向上挑吊）。</p>
      <p><b>高球</b>：瞄<b>控高线</b>，目标是“<b>最快到达控高参考线</b>”。初速度在「高球初速度」区间内几何扫描（粗筛 + 几何插值加密），仰角 −10~60° 扫描，直接模拟到真实落地：</p>
      <ul>
        <li>过网高度必须 ≥ <code>高球过网最低</code>（默认 2.7 m）——<b>只限下限，不限上限</b></li>
        <li>落点必须 ≤ <code>−控高参考线</code>（默认 −4.0 m），未到底线丢弃</li>
        <li>落点必须在场地内（y ∈ (−6.7, 0)，|x| ≤ 半场宽）</li>
        <li>如果一轮扫描没有任何合格路径，整体提高初速度（×1.12）重试，最多 6 轮</li>
      </ul>
      <p>初速度权重按温和钟形（mid 在 55% 处），落点分布是真实落点；信息栏显示“高最快”= 所有合格路径中的最短落地时间。得分系数随落点深度增加（3 m→0.45，6 m→0.70），深的高球更难接。</p>
      <p><b>截击轨迹</b>：每条最终落点都会在<b>我方半场、z ∈ [z_min, z_max]</b> 高度区间（默认 0.1 ~ 2.5 m，可在参数面板调整）内按仿真步长采样截击点（快模式每 125 ms 一个点，完整模式每 50 ms 一个点），供下一步求最优截击时刻。</p>

      <h3>三、可达概率（最优截击点 + 真实反应曲线 + 方向速度 + 触及半径）</h3>
      <div class="formula">p(t<sub>avail</sub>) = 0.92 · σ( k · (t<sub>avail</sub> − t<sub>mid</sub>) )</div>
      <p>反应曲线由「下限」与「上限」两个参数标定：下限 <code>t₀</code> 处 p≈2%（纯反应时），上限 <code>t₁</code> 处 p≈88%（充分反应 + 一步 + 出手），上限 92%（判断/技术/回球质量损耗）。<b>A、B 两名球员各自拥有一条独立的反应曲线、独立的触及半径与独立的跑动速度</b>，在同一个曲线图里用绿色（A）与红色（B）同时画出；参数完全相同时自动合并为一条并标注“A/B”。</p>
      <p><b>最优截击点</b>：不再假设只能在落地点接球。对每条轨迹，<b>从后往前</b>遍历所有可接高度的点（<code>z ∈ [z_min, z_max]</code>，默认 0.1~2.5 m，可调），求 <code>t<sub>avail</sub> = t_point − runTime(pos, point)</code> 的最大值——球员可以选择“提前在空中截击”或“等到落地”，取最有利的时机。由于轨迹按时间递增，遍历时一旦发现当前点的 <code>t_point ≤ bestT<sub>avail</sub></code> 就直接提前终止（后续点 t 只会更小，不可能更优）。</p>
      <p><b>方向速度分离</b>：上网 <code>1.15 × v_run</code>、横向 <code>0.95 × v_run</code>、后退 <code>v_run / k₂</code>；合成 <code>t<sub>run</sub> = d<sub>touch</sub> / v<sub>eff</sub></code>。双打中 A、B 各用自己的跑动速度，站位大小与“快/慢”标签随之变化。</p>
      <p><b>触及半径随球种缩放</b>：杀球 ×0.72（贴地，半径最小）、吊球 ×0.95（下落慢 + 0.08 s 缓冲）、高球 ×1.0。</p>
      <p>双打联合接球率：<code>reach = 1 − (1−p₁)(1−p₂)</code>。</p>

      <h3>四、期望净得分与优化器</h3>

      /* ---- 运行时状态 ---- */

      function resetSolvePerformanceMode() {
        slowMode = false;
        manualSolvePending = false;
        manualResultsCleared = false;
        updateManualUpdateUI();
      }

      function randHeight() {return 1.60 + Math.random() * 0.25;}
      const personHeights = [randHeight(), randHeight(), randHeight()];

      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      const DR_HIT = ('ontouchstart' in window) ? 1.0 : 0.55;
      const DOUBLE_TAP_MS = 300;
      const DOUBLE_TAP_DIST = 32;
      const DRAG_THRESHOLD = 6;

      const SCALE = 52;
      const PAD_R = 20, PAD_T = 20, PAD_B = 20;
      let PAD_L = 0;
      let LW = 0;
      let LH = 0;

      const canvas = $('canvas');
      const ctx = canvas.getContext('2d');

      const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

      /* ============================================================
         三、坐标与绘制辅助
         ============================================================ */
      function mirrorPoint(p) {
        return mirror180 ? {x: -p.x, y: -p.y} : p;
      }
      function w2c(p) {
        const d = mirrorPoint(p);
        return {x: PAD_L + (d.x + HW) * SCALE, y: PAD_T + (HL - d.y) * SCALE};
      }
      function c2w(cx, cy) {
        const world = {x: (cx - PAD_L) / SCALE - HW, y: HL - (cy - PAD_T) / SCALE};
        return mirror180 ? {x: -world.x, y: -world.y} : world;
      }
      function sideDisplayY(y) { return mirror180 ? -y : y; }
      function sideScreenY(y) { return sideCourtTop + (HL - sideDisplayY(y)) * sideScaleY; }
      function sideWorldYFromScreen(cssY) {
        const world = HL - (cssY - sideCourtTop) / sideScaleY;
        return mirror180 ? -world : world;
      }
      function drawRotatedImage(c, image, w, h, centerX, centerY, flipX = true, flipY = true) {
        if (!mirror180) {
          c.drawImage(image, 0, 0, w, h);
          return;
        }
        c.save();
        c.translate(centerX, centerY);
        c.scale(flipX ? -1 : 1, flipY ? -1 : 1);
        c.drawImage(image, -centerX, -centerY, w, h);
        c.restore();
      }

      function tagTextWidth(line1, line2) {
        ctx.save();
        ctx.font = FONT_TAG_MAIN;
        const w1 = ctx.measureText(line1).width;
        ctx.font = FONT_TAG_SUB;
        const w2 = line2 ? ctx.measureText(line2).width : 0;
        ctx.restore();
        return Math.max(w1, w2);
      }

      function measureTagWidth(line1, line2) {
        return tagTextWidth(line1, line2) + TAG_PADX * 2;
      }

      function nearDropLabel() {return DROP_NEAR_EDGE.toFixed(1) + ' m';}
      function farDropLabel() {return DROP_FAR_EDGE.toFixed(1) + ' m';}

      function computePadL() {
        const w = Math.max(
          measureTagWidth(t('net'), null),
          measureTagWidth(t('lblNearDrop'), nearDropLabel()),
          measureTagWidth(t('lblFrontPen'), PRM.clearLineY.toFixed(1) + ' m'),
          measureTagWidth(t('lblFarDrop'), farDropLabel())
        );
        return Math.ceil(w) + 12;
      }

      function lineStroke(a, b) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function roundRectPath(c, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      }

      function drawLabelWithHalo(text, x, y, color, font, align, baseline) {
        ctx.save();
        ctx.font = font;
        ctx.textAlign = align;
        ctx.textBaseline = baseline;
        ctx.lineWidth = HALO_W;
        ctx.strokeStyle = '#fff';
        ctx.fillStyle = color;
        ctx.strokeText(text, x, y);
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      function drawCourtTag(line1, line2, anchorX, anchorY, color, align) {
        ctx.save();
        const tw = tagTextWidth(line1, line2);

        const padX = TAG_PADX, padY = 4, lineH = 12;
        const rows = line2 ? 2 : 1;
        const w = tw + padX * 2;
        const h = lineH * rows + padY * 2;

        let bx;
        if (align === 'right') bx = anchorX - w;
        else if (align === 'center') bx = anchorX - w / 2;
        else bx = anchorX;
        const by = anchorY - h / 2;

        roundRectPath(ctx, bx, by, w, h, 3.5);
        ctx.fillStyle = 'rgba(255,255,255,0.94)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.06)';
        ctx.lineWidth = 0.8;
        ctx.stroke();

        const cx = bx + w / 2;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = color;

        if (line2) {
          ctx.font = FONT_TAG_MAIN;
          ctx.fillText(line1, cx, by + padY + lineH * 0.5 + 0.3);
          ctx.font = FONT_TAG_SUB;
          ctx.globalAlpha = 0.85;
          ctx.fillText(line2, cx, by + padY + lineH * 1.5 + 0.3);
          ctx.globalAlpha = 1;
        } else {
          ctx.font = FONT_TAG_MAIN;
          ctx.fillText(line1, cx, by + h / 2 + 0.3);
        }
        ctx.restore();
      }

      /* ============================================================
         四、侧视图（比例尺与主视图严格一致）
         ============================================================ */
      const sideCanvas = $('sideCanvas');
      const sctx = sideCanvas.getContext('2d');

      const SIDE_Z_MAX_HEAT = 11.0;   // 热力图开启时的名义最大高度
      const SIDE_Z_MAX_PLAIN = 4.0;   // 热力图关闭时的名义最大高度
      let SIDE_Z_MAX = SIDE_Z_MAX_PLAIN;
      const SIDE_GAP = 8;
      const SIDE_HEAD_R = 5.2;      // 头半径上限（CSS 像素）
      const SIDE_BODY_LW = 5.0;

      let sideW = 150, sideH = 400;
      let mainScale = 1;            // 主视图：CSS 像素 / 逻辑单位
      const sideGroundX = 12;
      let sideScaleZ = 40;          // 高度方向：CSS 像素 / 米
      let sideScaleY = 40;          // 场地长度方向：CSS 像素 / 米
      let sideCourtTop = 0;         // 场地顶边在侧视图中的 y 坐标
      let sideZMax = SIDE_Z_MAX;    // 侧视图实际能显示的最大高度（米）

      const sideHeatCanvas = document.createElement('canvas');
      const sideHeatCtx = sideHeatCanvas.getContext('2d');
      let sideHeatReady = false;

      /* 关键：横纵共用主视图比例尺，场地长度与主视图严格一致；
         实际最大显示高度由侧视图宽度决定（sideZMax）。 */
      function setupSide() {
        const dpr = DPR;

        sideScaleY = SCALE * mainScale;                  // 纵轴：场地长度，与主视图一致
        sideCourtTop = (sideH - L * sideScaleY) / 2;

        const availW = Math.max(20, sideW - sideGroundX - 8);

        // 横轴：高度方向独立比例尺，保证 [0, SIDE_Z_MAX] 全部可见
        // 若宽度富余（桌面端），最多放大到与纵轴一致，避免人变“胖高”
        sideScaleZ = Math.min(availW / SIDE_Z_MAX, sideScaleY);
        sideZMax = SIDE_Z_MAX;                         // ← 固定 12，不再被 min 截断

        sideCanvas.style.width = sideW + 'px';
        sideCanvas.style.height = sideH + 'px';
        sideCanvas.width = Math.round(sideW * dpr);
        sideCanvas.height = Math.round(sideH * dpr);
        sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        sideHeatDirty = true;
        sideHeatReady = false;
      }

      function buildSideHeatGrid() {
        const cell = 0.15;
        const Y0 = -HL, Z0 = 0;
        const GY = Math.ceil((2 * HL) / cell) + 1;
        const GZ = Math.ceil(sideZMax / cell) + 1;

        const smash = new Float32Array(GY * GZ);
        const clear = new Float32Array(GY * GZ);
        const drop = new Float32Array(GY * GZ);
        const grids = {smash, clear, drop};

        const sigma = 0.20;
        const inv2s2 = 1 / (2 * sigma * sigma);
        const R = 3;

        const hitter = opponents[0];
        const h0 = PRM.hh;

        for (const Ld of cachedLandings) {
          if (Ld.v0 == null) continue;

          const trace = [];
          const opts = {trace};
          if (Ld.type === 'drop') opts.maxOverNet = PRM.dropMaxOverNet;
          else if (Ld.type === 'clear') opts.minNetH = PRM.clearHeight;

          simulate(Ld.v0, h0, Ld.elev, Ld.azim, hitter.x, hitter.y, opts);

          const n = trace.length >> 1;
          if (!n) continue;
          const wPer = Ld.w / n;
          const g = grids[Ld.type];

          for (let k = 0; k < n; k++) {
            const py = trace[k * 2];
            const pz = trace[k * 2 + 1];
            if (pz < 0 || pz > sideZMax) continue;

            const ci = (py - Y0) / cell;
            const cj = (pz - Z0) / cell;
            const i0 = Math.max(0, Math.floor(ci) - R);
            const i1 = Math.min(GY - 1, Math.ceil(ci) + R);
            const j0 = Math.max(0, Math.floor(cj) - R);
            const j1 = Math.min(GZ - 1, Math.ceil(cj) + R);
            for (let j = j0; j <= j1; j++) {
              const dz = Z0 + j * cell - pz;
              const dz2 = dz * dz;
              const rowBase = j * GY;
              for (let i = i0; i <= i1; i++) {
                const dy = Y0 + i * cell - py;
                g[rowBase + i] += wPer * Math.exp(-(dy * dy + dz2) * inv2s2);
              }
            }
          }
        }

        return {GY, GZ, cell, Y0, Z0, grids};
      }

      function computeSideHeat() {
        sideHeatReady = false;
        const grid = buildSideHeatGrid();
        const GY = grid.GY, GZ = grid.GZ, cell = grid.cell, Y0 = grid.Y0, Z0 = grid.Z0;
        const smash = grid.grids.smash, clear = grid.grids.clear, drop = grid.grids.drop;

        let maxV = 0;
        const total = GY * GZ;
        for (let k = 0; k < total; k++) {
          const tt = smash[k] + clear[k] + drop[k];
          if (tt > maxV) maxV = tt;
        }
        if (maxV <= 1e-9) return;

        const W = sideCanvas.width, H = sideCanvas.height;
        if (sideHeatCanvas.width !== W || sideHeatCanvas.height !== H) {
          sideHeatCanvas.width = W;
          sideHeatCanvas.height = H;
        }

        const dpr = W / sideW;
        const invMax = 1 / maxV;
        const img = sideHeatCtx.createImageData(W, H);
        const data = img.data;

        for (let py = 0; py < H; py++) {
          const cssY = py / dpr;
          const wy = HL - (cssY - sideCourtTop) / sideScaleY;
          if (wy > HL || wy < -HL) continue;

          const fy = (wy - Y0) / cell;
          let iA, iB, tX;
          const i0raw = Math.floor(fy);
          if (i0raw < 0) {iA = 0; iB = 0; tX = 0;}
          else if (i0raw > GY - 2) {iA = GY - 1; iB = GY - 1; tX = 0;}
          else {iA = i0raw; iB = i0raw + 1; tX = fy - i0raw;}

          for (let px = 0; px < W; px++) {
            const cssX = px / dpr;
            const wz = (cssX - sideGroundX) / sideScaleZ;
            if (wz < 0 || wz > sideZMax) continue;

            const fz = (wz - Z0) / cell;
            let jA, jB, tY;
            const j0raw = Math.floor(fz);
            if (j0raw < 0) {jA = 0; jB = 0; tY = 0;}
            else if (j0raw > GZ - 2) {jA = GZ - 1; jB = GZ - 1; tY = 0;}
            else {jA = j0raw; jB = j0raw + 1; tY = fz - j0raw;}

            const r0 = jA * GY, r1 = jB * GY;
            const w00 = (1 - tX) * (1 - tY), w10 = tX * (1 - tY);
            const w01 = (1 - tX) * tY, w11 = tX * tY;
            const i00 = r0 + iA, i10 = r0 + iB, i01 = r1 + iA, i11 = r1 + iB;

            const s = smash[i00] * w00 + smash[i10] * w10 + smash[i01] * w01 + smash[i11] * w11;
            const c = clear[i00] * w00 + clear[i10] * w10 + clear[i01] * w01 + clear[i11] * w11;
            const d = drop[i00] * w00 + drop[i10] * w10 + drop[i01] * w01 + drop[i11] * w11;

            const sum = s + c + d;
            const o = (py * W + px) * 4;
            if (sum < maxV * HEAT_CUT) continue;

            const norm = Math.min(1, Math.sqrt(sum * invMax));
            const inv = 1 / sum;
            data[o] = (s * SHOT_COLOR.smash[0] + c * SHOT_COLOR.clear[0] + d * SHOT_COLOR.drop[0]) * inv;
            data[o + 1] = (s * SHOT_COLOR.smash[1] + c * SHOT_COLOR.clear[1] + d * SHOT_COLOR.drop[1]) * inv;
            data[o + 2] = (s * SHOT_COLOR.smash[2] + c * SHOT_COLOR.clear[2] + d * SHOT_COLOR.drop[2]) * inv;
            data[o + 3] = Math.min(230, norm * 220);
          }
        }

        sideHeatCtx.putImageData(img, 0, 0);
        sideHeatReady = true;
      }

      /* 身高 = 头顶高度；头圆心 = 头顶 − 头半径 */
      function drawSidePerson(y, color, heightM) {
        const sy = sideScreenY(y);
        const fullLen = Math.max(10, heightM * sideScaleZ);

        const headR = clamp(fullLen * 0.13, 2.5, SIDE_HEAD_R);
        const bodyLen = Math.max(2, fullLen - headR * 2);
        const headX = sideGroundX + bodyLen + headR;   // 圆心
        // 头顶 = headX + headR = sideGroundX + fullLen

        sctx.strokeStyle = color;
        sctx.lineWidth = SIDE_BODY_LW;
        sctx.lineCap = 'round';
        sctx.beginPath();
        sctx.moveTo(sideGroundX, sy);
        sctx.lineTo(sideGroundX + bodyLen, sy);
        sctx.stroke();
        sctx.lineCap = 'butt';

        sctx.beginPath();
        sctx.fillStyle = color;
        sctx.arc(headX, sy, headR, 0, Math.PI * 2);
        sctx.fill();
        sctx.strokeStyle = 'rgba(255,255,255,.9)';
        sctx.lineWidth = 1.0;
        sctx.stroke();
      }

      function drawRacketContact() {
        const sy = sideScreenY(opponents[0].y);
        const hx = sideGroundX + PRM.hh * sideScaleZ;

        const fullLen = Math.max(10, personHeights[0] * sideScaleZ);
        const headRight = sideGroundX + fullLen;

        sctx.save();
        sctx.strokeStyle = 'rgba(31,111,139,0.35)';
        sctx.lineWidth = 1;
        sctx.setLineDash([2, 3]);
        sctx.beginPath();
        sctx.moveTo(sideGroundX + 2, sy);
        sctx.lineTo(hx, sy);
        sctx.stroke();
        sctx.restore();

        const rx = 11.0, ry = 7.0;
        const fromX = headRight + 1;
        const toX = Math.max(fromX, hx - rx);
        if (toX > fromX) {
          sctx.strokeStyle = '#111';
          sctx.lineWidth = 1.8;
          sctx.lineCap = 'round';
          sctx.beginPath();
          sctx.moveTo(fromX, sy);
          sctx.lineTo(toX, sy);
          sctx.stroke();
          sctx.lineCap = 'butt';
        }

        sctx.beginPath();
        sctx.ellipse(hx, sy, rx, ry, 0, 0, Math.PI * 2);
        sctx.fillStyle = '#ffffff';
        sctx.fill();
        sctx.strokeStyle = '#111';
        sctx.lineWidth = 1.6;
        sctx.stroke();

        sctx.beginPath();
        sctx.fillStyle = '#111';
        sctx.arc(hx, sy, 2.2, 0, Math.PI * 2);
        sctx.fill();
        sctx.strokeStyle = '#fff';
        sctx.lineWidth = 0.9;
        sctx.stroke();

        const label = lang === 'zh' ? '击球点' : 'Contact';
        const hLabel = PRM.hh.toFixed(1) + ' m';
        sctx.font = 'bold 8px system-ui';
        const tw1 = sctx.measureText(label).width;
        sctx.font = '7px system-ui';
        const tw2 = sctx.measureText(hLabel).width;
        const tw = Math.max(tw1, tw2);

        let lx = hx + rx + 3;
        if (lx + tw > sideW - 1) lx = Math.max(1, sideW - 1 - tw);

        let ly = sy - ry - 8;
        if (ly - 4 < 2) ly = sy + ry + 8;

        sctx.textAlign = 'left';
        sctx.textBaseline = 'middle';
        sctx.lineWidth = 2.6;
        sctx.strokeStyle = '#fff';

        sctx.font = 'bold 8px system-ui';
        sctx.strokeText(label, lx, ly - 4);
        sctx.fillStyle = '#111';
        sctx.fillText(label, lx, ly - 4);

        sctx.font = '7px system-ui';
        sctx.strokeText(hLabel, lx, ly + 5);
        sctx.fillStyle = '#111';
        sctx.fillText(hLabel, lx, ly + 5);
      }

      function drawSideHeightGuides() {
        const yTop = sideCourtTop - 2;
        const yBot = sideCourtTop + L * sideScaleY + 2;
        sctx.save();
        sctx.strokeStyle = '#b7c9bf';
        sctx.lineWidth = 1;
        sctx.setLineDash([3, 5]);
        sctx.font = '600 11.5px system-ui';
        sctx.fillStyle = '#4d6256';
        sctx.textAlign = 'left';
        sctx.textBaseline = 'bottom';
        sctx.lineWidth = 2.2;
        for (let z = 2; z <= 10; z += 2) {
          const x = sideGroundX + z * sideScaleZ;
          sctx.strokeStyle = '#b7c9bf';
          sctx.lineWidth = 1;
          sctx.beginPath();
          sctx.moveTo(x, yTop);
          sctx.lineTo(x, yBot);
          sctx.stroke();
          const text = z + ' m';
          sctx.strokeStyle = 'rgba(255,255,255,.94)';
          sctx.lineWidth = 2.6;
          sctx.strokeText(text, x + 2, sideCourtTop - 6);
          sctx.fillStyle = '#4d6256';
          sctx.fillText(text, x + 2, sideCourtTop - 6);
        }
        const maxText = '总高 ' + SIDE_Z_MAX_HEAT.toFixed(1) + ' m';
        sctx.textAlign = 'right';
        sctx.textBaseline = 'top';
        sctx.strokeStyle = 'rgba(255,255,255,.94)';
        sctx.lineWidth = 2.6;
        sctx.strokeText(maxText, sideW - 2, sideCourtTop + 12);
        sctx.fillStyle = '#4d6256';
        sctx.fillText(maxText, sideW - 2, sideCourtTop + 12);
        sctx.restore();
      }

      function drawSide() {
        if (!sideCanvas.width || !sideCanvas.height) return;

        if (SIDE_Z_MAX !== (showHeat ? SIDE_Z_MAX_HEAT : SIDE_Z_MAX_PLAIN)) {
          setup();
          heatDirty = true;
          sideHeatDirty = true;
          suboptDirty = true;
          if (calcWaitBubble.classList.contains('is-visible')) positionCalcWaitBubble();
        }

        sctx.clearRect(0, 0, sideW, sideH);
        sctx.fillStyle = '#f7fbf9';
        sctx.fillRect(0, 0, sideW, sideH);

        if (showHeat && result.valid && cachedLandings.length) {
          if (sideHeatDirty && quality === 'full') {
            try {computeSideHeat();} catch (e) {console.error('side heat error:', e);}
            sideHeatDirty = false;
          }
          if (sideHeatReady) {
            sctx.imageSmoothingEnabled = true;
            drawRotatedImage(
              sctx,
              sideHeatCanvas,
              sideW,
              sideH,
              0,
              sideCourtTop + HL * sideScaleY,
              false,
              true
            );
          }
        }
        drawSideHeightGuides();

        const yTop = sideCourtTop - 2;
        const yBot = sideCourtTop + L * sideScaleY + 2;

        sctx.strokeStyle = C_COURT_FRAME;
        sctx.lineWidth = 2.4;
        sctx.lineCap = 'round';
        sctx.beginPath();
        sctx.moveTo(sideGroundX, yTop);
        sctx.lineTo(sideGroundX, yBot);
        sctx.stroke();
        sctx.lineCap = 'butt';

        const ticks = [HL, HL - LONG_SVC, SHORT_SVC, -SHORT_SVC, -(HL - LONG_SVC), -HL];
        for (const ty of ticks) {
          const sy = sideScreenY(ty);
          const isEnd = Math.abs(Math.abs(ty) - HL) < 1e-6;
          sctx.fillStyle = isEnd ? C_COURT_FRAME : C_COURT_LINE;
          const tw = isEnd ? 6 : 4;
          const th = isEnd ? 2.6 : 1.8;
          sctx.fillRect(sideGroundX + 1, sy - th / 2, tw, th);
        }

        /* 网：butt 端点，长度严格 = NET_H × sideScaleZ */
        const netSy = sideCourtTop + HL * sideScaleY;
        const netLen = NET_H * sideScaleZ;
        sctx.strokeStyle = C_NET;
        sctx.lineWidth = 5;
        sctx.lineCap = 'butt';
        sctx.beginPath();
        sctx.moveTo(sideGroundX, netSy);
        sctx.lineTo(sideGroundX + netLen, netSy);
        sctx.stroke();
        sctx.lineCap = 'butt';

        sctx.save();
        sctx.font = '9px system-ui';
        sctx.fillStyle = '#8a9a91';
        sctx.textAlign = 'left';
        sctx.textBaseline = 'bottom';
        sctx.fillText('地面', sideGroundX + 3, sideCourtTop - 6);
        sctx.textAlign = 'center';
        sctx.fillText('网 1.55 m', sideGroundX + netLen / 2, netSy - 6);
        sctx.textAlign = 'left';
        if (mirror180) {
          sctx.textBaseline = 'bottom';
          sctx.fillText('对手', sideGroundX + 3, sideCourtTop + L * sideScaleY - 4);
          sctx.textBaseline = 'top';
          sctx.fillText('我方', sideGroundX + 3, sideCourtTop + 5);
        } else {
          sctx.textBaseline = 'top';
          sctx.fillText('对手', sideGroundX + 3, sideCourtTop + 5);
          sctx.textBaseline = 'bottom';
          sctx.fillText('我方', sideGroundX + 3, sideCourtTop + L * sideScaleY - 4);
        }
        sctx.restore();

        const ourColor = C_PERSON;
        drawSidePerson(opponents[0].y, C_PERSON, personHeights[0]);

        if (result.valid) {
          if (result.P1) drawSidePerson(result.P1.y, ourColor, personHeights[1]);
          if (mode === 'double' && result.P2) drawSidePerson(result.P2.y, ourColor, personHeights[2]);
        }

        if (result.valid) drawRacketContact();
      }

      /* ============================================================
         五、主画布尺寸与布局
         ============================================================ */
      function setup() {
        SIDE_Z_MAX = showHeat ? SIDE_Z_MAX_HEAT : SIDE_Z_MAX_PLAIN;
        PAD_L = computePadL();
        LW = W * SCALE + PAD_L + PAD_R;
        LH = L * SCALE + PAD_T + PAD_B;

        const dpr = DPR;
        const wrap = canvas.parentElement, cs = getComputedStyle(wrap);
        const availTotal = wrap.clientWidth
          - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
        const maxH = Math.min(window.innerHeight * 0.75, 900);

        const K = SIDE_Z_MAX * SCALE / LW;
        const B = sideGroundX + 8;

        const cwByHeight = Math.min(LW, maxH * LW / LH);
        const cwByWidthZ = (availTotal - SIDE_GAP - B) / (1 + K);

        let cw = Math.min(LW, cwByHeight, cwByWidthZ);
        cw = Math.max(cw, 110);
        let ch = cw * LH / LW;

        let sideWc = availTotal - cw - SIDE_GAP;
        const sideNeed = B + K * cw;   // 侧视图实际绘制内容所需宽度
        if (sideWc > sideNeed) sideWc = sideNeed;
        sideWc = Math.max(120, sideWc);

        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        canvas.width = Math.round(cw * dpr);
        canvas.height = Math.round(ch * dpr);
        const s = canvas.width / LW;
        ctx.setTransform(s, 0, 0, s, 0, 0);

        mainScale = cw / LW;
        sideW = sideWc;
        sideH = ch;
        setupSide();
      }

      function setShowHeat(on) {
        on = !!on;
        if (showHeat === on) return;
        showHeat = on;
        SIDE_Z_MAX = on ? SIDE_Z_MAX_HEAT : SIDE_Z_MAX_PLAIN;
        setup();              // 重算主视图/侧视图布局与比例尺
        heatDirty = true;     // 主视图热力图需重算（画布尺寸变了）
        sideHeatDirty = true; // 侧视图热力图需重算
        suboptDirty = true;   // 次优解点云需重绘
      }

      setup();

      /* ============================================================
         六、物理与可达性
         ============================================================ */
      function touchScale(type) {
        if (type === 'smash') return 0.72;
        if (type === 'drop') return 0.95;
        return 1.0;
      }

      function reachParams(t0, t1in) {
        const t1 = Math.max(t1in, t0 + 0.05);
        const l0 = Math.log(REACH_P0 / (REACH_PMAX - REACH_P0));
        const l1 = Math.log(REACH_P1 / (REACH_PMAX - REACH_P1));
        const k = (l1 - l0) / (t1 - t0);
        const tMid = t0 - l0 / k;
        return {t0, t1, k, tMid};
      }

      function reachProb(tAvail, rp) {
        return REACH_PMAX / (1 + Math.exp(-rp.k * (tAvail - rp.tMid)));
      }

      function ctxOf(which) {
        const s = (which === 'b') ? 'b' : 'a';
        const index = s === 'b' ? 1 : 0;
        return {
          side: s,
          vRun: PRM['v_run_' + s],
          rTouch: PRM['r_touch_' + s],
          rp: reachParams(PRM['t_react_' + s], PRM['t_full_' + s]),
          turnEnabled: ourTurnEnabled[index],
          hand: ourHand[index]
        };
      }

      function ctxEqual(a, b) {
        return a.vRun === b.vRun && a.rTouch === b.rTouch &&
          Math.abs(a.rp.t0 - b.rp.t0) < 1e-9 && Math.abs(a.rp.t1 - b.rp.t1) < 1e-9 &&
          a.turnEnabled === b.turnEnabled && a.hand === b.hand;
      }

      function weightedHeadingForPosition(pos, items, c) {
        if (!c.turnEnabled) return 0;
        let sx = 0, sy = 0, total = 0;
        for (const item of items) {
          const dx = item.L.x - pos.x;
          const dy = item.L.y - pos.y;
          if (Math.hypot(dx, dy) < 1e-8) continue;
          const weight = item.w * (cValue(item.type, item.L.y) + 1);
          const angle = Math.atan2(dx, dy);
          sx += Math.sin(angle) * weight;
          sy += Math.cos(angle) * weight;
          total += weight;
        }
        if (total <= 1e-9 || Math.hypot(sx, sy) < 1e-9) return 0;
        return Math.atan2(sx, sy);
      }

      function headingMotionScore(pos, items, c, heading) {
        let score = 0;
        const ctx = {...c, heading};
        for (const item of items) {
          const tau = motionTimeToPoint(pos, item.L, item.type, ctx).tau;
          score += item.w * Math.exp(-LAMBDA_RUN * tau);
        }
        return score;
      }

      function bestHeadingForPosition(pos, items, c) {
        if (!c.turnEnabled) return 0;
        const cacheKey = `${c.side || 'a'}:${pos.x.toFixed(4)}:${pos.y.toFixed(4)}`;
        if (headingCache.has(cacheKey)) return headingCache.get(cacheKey);

        const mean = weightedHeadingForPosition(pos, items, c);
        const candidates = [0, mean];
        for (let i = 0; i < 12; i++) candidates.push(i * Math.PI / 6);

        let bestHeading = 0;
        let bestScore = -Infinity;
        const evaluated = new Set();
        for (const raw of candidates) {
          const heading = wrapMotionAngle(raw);
          const key = heading.toFixed(6);
          if (evaluated.has(key)) continue;
          evaluated.add(key);
          const score = headingMotionScore(pos, items, c, heading);
          if (score > bestScore + 1e-12) {
            bestScore = score;
            bestHeading = heading;
          }
        }

        let step = Math.PI / 12;
        for (let pass = 0; pass < 3; pass++) {
          for (const delta of [-step, step]) {
            const heading = wrapMotionAngle(bestHeading + delta);
            const score = headingMotionScore(pos, items, c, heading);
            if (score > bestScore + 1e-12) {
              bestScore = score;
              bestHeading = heading;
            }
          }
          step *= 0.5;
        }
        headingCache.set(cacheKey, bestHeading);
        return bestHeading;
      }

      function ctxForPosition(pos, items, c) {
        const heading = bestHeadingForPosition(pos, items, c);
        return {...c, heading, headingSin: Math.sin(heading), headingCos: Math.cos(heading)};
      }

      function ctxForStoredPose(pos, items, c) {
        if (Number.isFinite(pos.heading)) {
          return {
            ...c,
            heading: pos.heading,
            headingSin: Math.sin(pos.heading),
            headingCos: Math.cos(pos.heading)
          };
        }
        return ctxForPosition(pos, items, c);
      }

      function abDiffers() {
        return Math.abs(PRM.v_run_a - PRM.v_run_b) > 1e-9 ||
          Math.abs(PRM.r_touch_a - PRM.r_touch_b) > 1e-9 ||
          Math.abs(PRM.t_react_a - PRM.t_react_b) > 1e-9 ||
          Math.abs(PRM.t_full_a - PRM.t_full_b) > 1e-9 ||
          ourTurnEnabled[0] !== ourTurnEnabled[1] || ourHand[0] !== ourHand[1];
      }

      function smoothRamp(v, lo, hi) {
        if (v <= lo) return 0;
        if (v >= hi) return 1;
        const u = (v - lo) / (hi - lo);
        return u * u * (3 - 2 * u);
      }

      function wrapMotionAngle(a) {
        return ((a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      }

      function motionTimeToPoint(pos, point, type, c) {
        const dx = point.x - pos.x;
        const dy = point.y - pos.y;
        const d = Math.hypot(dx, dy);
        if (d < 1e-9) {
          return {tau: 0, translationTime: 0, rotationTime: 0, stepDelay: 0, limitPenalty: 0};
        }

        const ux = dx / d;
        const uy = dy / d;
        const vSide = c.vRun * V_SIDE_K;
        const vFwd = c.vRun * V_FWD_K;
        const vBack = c.vRun / Math.max(1.0, PRM.k2);
        const baseSpeed = 1 / Math.sqrt(
          ux * ux / (vSide * vSide) + uy * uy / ((uy >= 0 ? vFwd : vBack) ** 2)
        );

        if (!c.turnEnabled) {
          const rTouch = c.rTouch * touchScale(type);
          const runDistance = Math.max(0, d - rTouch);
          return {
            tau: runDistance / baseSpeed,
            translationTime: runDistance / baseSpeed,
            rotationTime: 0,
            stepDelay: 0,
            limitPenalty: 0
          };
        }

        const heading = Number.isFinite(c.heading) ? c.heading : OUR_HEADING;
        const headingSin = Number.isFinite(c.headingSin) ? c.headingSin : Math.sin(heading);
        const headingCos = Number.isFinite(c.headingCos) ? c.headingCos : Math.cos(heading);
        const cosDelta = clamp(ux * headingSin + uy * headingCos, -1, 1);
        const sinDelta = ux * headingCos - uy * headingSin;
        const absTheta = Math.acos(cosDelta);
        const rawDelta = sinDelta < 0 ? -absTheta : absTheta;
        const backhand = c.hand === 'right' ? sinDelta < 0 : sinDelta > 0;
        const backhandBlend = backhand ? smoothRamp(absTheta, 0, Math.PI / 2) : 0;
        const rTouch = c.rTouch * touchScale(type) *
          (1 - (1 - PRM.our_backhand_touch) * backhandBlend);
        const runDistance = Math.max(0, d - rTouch);
        if (runDistance <= 0) {
          return {tau: 0, translationTime: 0, rotationTime: 0, stepDelay: 0, limitPenalty: 0};
        }

        const fhSign = c.hand === 'left' ? -1 : 1;
        const forehandBias = Math.max(0.2, 1 + PRM.our_fh_bias * fhSign * sinDelta);
        const turnSpeedFactor = clamp(
          1 - PRM.our_turn_speed_loss * Math.pow(absTheta / Math.PI, 1),
          0.22,
          1
        );

        const forwardMove = Math.max(0, cosDelta);
        const backwardMove = Math.max(0, -cosDelta);
        const lateralMove = Math.abs(sinDelta);
        const footInv = Math.sqrt(
          (forwardMove / (1 + PRM.our_lead_boost)) ** 2 +
          (lateralMove / PRM.our_cross_line) ** 2 +
          backwardMove ** 2
        );
        const footFactor = 1 / Math.max(1e-9, footInv);
        const vEff = Math.max(0.01, baseSpeed * forehandBias * turnSpeedFactor * footFactor);
        const translationTime = runDistance / vEff;

        const deadzone = PRM.our_turn_deadzone * Math.PI / 180;
        const u = clamp(
          (absTheta - deadzone) / (Math.PI - deadzone),
          0,
          1
        );
        const backhandScale = 1 + PRM.our_backhand_turn * backhandBlend;
        const rotationTime = PRM.our_turn_tmax * Math.pow(u, 1.4) * backhandScale;
        const stepDelay = absTheta > 60 * Math.PI / 180
          ? 0.10 * (1 + PRM.our_backhand_turn * 0.6 * backhandBlend)
          : 0;
        const limitPenalty = absTheta > 70 * Math.PI / 180
          ? (absTheta >= 120 * Math.PI / 180 ? 0.30 : 0.15) *
            (1 + PRM.our_backhand_turn * 0.5 * backhandBlend)
          : 0;
        const tau = Math.max(translationTime, rotationTime) +
          PRM.our_turn_overlap * Math.min(translationTime, rotationTime) +
          stepDelay + limitPenalty;
        return {tau, translationTime, rotationTime, stepDelay, limitPenalty};
      }

      function cValue(type, y) {
        const d = -y;
        if (type === 'smash') return 0.30 + 0.15 * (1 - smoothRamp(d, 1, 3));
        if (type === 'clear') {
          const depth = Math.max(0, Math.min(1, (d - 3.0) / 3.0));
          return 0.45 + 0.25 * depth;
        }
        return 0.30 + 0.20 * (1 - smoothRamp(d, 1, 3));
      }

      function landingKernel(type, y, oppDist) {
        const dn = -y;
        const baseCenter = type === 'smash' ? 5.8 : 2.8;
        const shiftK = type === 'drop' ? 0.8 : 0.5;
        const hShift = Math.max(0, Math.min(1.2, (HH_DEFAULT - PRM.hh) * 0.6));
        const center = Math.max(0.5, baseCenter - (4.6 - oppDist) * shiftK - hShift);
        const sigma = type === 'smash' ? 1.2 : 1.6;
        const u = (dn - center) / sigma;
        return Math.exp(-u * u);
      }

      function v0WeightDrop(v0) {
        const lo = PRM.v0_drop_lo;
        const hi = PRM.v0_drop_hi;
        if (hi <= lo) return v0 >= lo ? 1 : 0;
        const u = (v0 - lo) / (hi - lo);
        return Math.exp(-2.5 * u * u);
      }

      function runTime(pos, Lp, type, c) {
        return motionTimeToPoint(pos, Lp, type, c).tau;
      }

      function interceptFallback(item, tau, c) {
        const extra = (item.type === 'drop' ? DROP_EXTRA_T : 0);
        const tInt = T_INTERCEPT[item.type] || 0;
        const tAvail = item.t - tau + tInt + extra;
        return {tAvail, p: reachProb(tAvail, c.rp), q: Math.exp(-LAMBDA_RUN * tau)};
      }

      function interceptStats(pos, item, c) {
        const type = item.type;
        const trace = item.trace;

        if (!trace || trace.length < 2) {
          return interceptFallback(item, runTime(pos, item.L, type, c), c);
        }

        const extra = (type === 'drop' ? DROP_EXTRA_T : 0);
        const px = pos.x, py = pos.y;
        const n = trace.length;

        let bestAvail = -Infinity;
        let bestTau = 0;

        for (let i = n - 1; i >= 0; i--) {
          const pt = trace[i];
          // tau is always non-negative, so earlier trajectory samples cannot
          // beat an availability value already larger than this sample time.
          if (pt.t <= bestAvail) break;

          const dx = pt.x - px;
          const dy = pt.y - py;
          const d2 = dx * dx + dy * dy;

          if (d2 < 1e-12) {
            if (pt.t > bestAvail) {bestAvail = pt.t; bestTau = 0;}
            continue;
          }

          const tau = motionTimeToPoint(pos, pt, type, c).tau;
          const avail = pt.t - tau;

          if (avail > bestAvail) {bestAvail = avail; bestTau = tau;}
        }

        if (bestAvail === -Infinity) {
          return interceptFallback(item, runTime(pos, item.L, type, c), c);
        }

        const tAvail = bestAvail + extra;
        return {tAvail, p: reachProb(tAvail, c.rp), q: Math.exp(-LAMBDA_RUN * bestTau)};
      }

      function smashSpeedFactor() {
        return Math.max(0.3, Math.min(1.0, (PRM.hh - NET_H + 0.3) / 1.0));
      }

      function getProbs() {
        const smashF = Math.max(0, Math.min(1, (PRM.hh - NET_H) / 0.8));
        const clearF = Math.max(0, Math.min(1, (PRM.hh - 1.0) / 1.0));
        const ps = PRM.p_smash / 100 * smashF;
        const pc = PRM.p_clear / 100 * clearF;
        const pd = PRM.p_drop / 100;
        const total = ps + pc + pd || 1;
        return {ps: ps / total, pc: pc / total, pd: pd / total};
      }

      function simulate(v0, h0, elevDeg, azimDeg, x0, y0, opts) {
        opts = opts || {};
        const maxOverNet = opts.maxOverNet;
        const minNetH = opts.minNetH != null ? opts.minNetH : NET_H;
        const trace = opts.trace || null;
        const capture = opts.capture || null;
        const captureStep = opts.captureStep || CAPTURE_STEP;

        const elev = elevDeg * Math.PI / 180;
        const azim = azimDeg * Math.PI / 180;
        let px = x0, py = y0, pz = h0;
        let vx = v0 * Math.cos(elev) * Math.sin(azim);
        let vy = -v0 * Math.cos(elev) * Math.cos(azim);
        let vz = v0 * Math.sin(elev);
        let t = 0;
        const dt = AERO.dt;
        const dropLimit = (maxOverNet != null) ? NET_H + maxOverNet : Infinity;
        const zLo = Math.min(PRM.z_min, PRM.z_max);
        const zHi = Math.max(PRM.z_min, PRM.z_max);
        let crossedNet = false;
        let traceStepI = 0;
        let captureStepI = 0;

        while (t < AERO.tMax) {
          const sp = Math.sqrt(vx * vx + vy * vy + vz * vz);
          const km = AERO_K * cdOf(sp);
          vx += -km * sp * vx * dt;
          vy += -km * sp * vy * dt;
          vz += (-km * sp * vz - AERO.g) * dt;

          const nx = px + vx * dt;
          const ny = py + vy * dt;
          const nz = pz + vz * dt;

          if (py > 0 && ny <= 0) {
            const f = py / (py - ny);
            const zc = pz + (nz - pz) * f;
            if (zc < minNetH) return null;
            if (zc > dropLimit) return null;
            crossedNet = true;
          }
          if (crossedNet && nz > dropLimit) return null;

          if (nz <= 0) {
            const f = pz / (pz - nz);
            const rx = px + (nx - px) * f;
            const ry = py + (ny - py) * f;
            if (capture && ry < 0) {
              capture.push({x: rx, y: ry, z: 0, t: t + f * dt});
            }
            return {x: rx, y: ry, t: t + f * dt};
          }

          if (capture && ny < 0 && nz >= zLo && nz <= zHi) {
            captureStepI++;
            if (captureStepI % captureStep === 0) {
              capture.push({x: nx, y: ny, z: nz, t: t + dt});
            }
          }

          px = nx; py = ny; pz = nz;
          t += dt;

          if (trace) {
            traceStepI++;
            if (traceStepI % SIDE_TRACE_EVERY === 0) trace.push(ny, nz);
          }
        }
        return null;
      }

      /* ============================================================
         七、球路落点生成
         ============================================================ */

      function halfWidth() {
        return mode === 'single' ? SINGLES_HW : HW;
      }

      function targetAzims(hitter, hw, ty, n) {
        if (n <= 0) return [0];

        const xHalf = hw + TARGET_X_MARGIN;
        const dy = hitter.y - ty;
        const azims = new Array(n + 1);

        if (Math.abs(dy) < 1e-6) {
          for (let i = 0; i <= n; i++) azims[i] = 0;
          return azims;
        }

        for (let i = 0; i <= n; i++) {
          const px = -xHalf + (2 * xHalf) * i / n;
          azims[i] = Math.atan2(px - hitter.x, dy) * 180 / Math.PI;
        }
        return azims;
      }

      function probe(v0, hitter, elev, azim, hw, opts) {
        const r = simulate(v0, PRM.hh, elev, azim, hitter.x, hitter.y, opts || {});
        if (!r) return null;
        if (r.y >= 0 || r.y < -HL || Math.abs(r.x) > hw) return null;
        return r;
      }

      function coarseElevRanges(v0, hitter, hw, fast, opts, coarseMode, azims) {
        const step = coarseMode ? 2.0 : (fast ? 1.2 : 0.8);
        if (!azims || !azims.length) {
          azims = coarseMode ? [0] : (fast ? [0] : [-20, -10, 0, 10, 20]);
        }
        const ranges = [];
        let lo = null, last = null;

        for (let elev = ELEV_MIN; elev <= ELEV_MAX + 1e-9; elev += step) {
          let ok = false;
          for (const az of azims) {
            if (probe(v0, hitter, elev, az, hw, opts)) {ok = true; break;}
          }
          if (ok) {
            if (lo === null) lo = elev;
            last = elev;
          } else if (lo !== null) {
            ranges.push([Math.max(ELEV_MIN, lo - step), Math.min(ELEV_MAX, last + step)]);
            lo = null; last = null;
          }
        }
        if (lo !== null) {
          ranges.push([Math.max(ELEV_MIN, lo - step), Math.min(ELEV_MAX, last + step)]);
        }
        return ranges;
      }

      function smashV0Weight(u) {
        return 0.20 + 0.80 * u * u;
      }

      function genSmashLandings(hitter, fast) {
        const hw = halfWidth();
        const v0Max = PRM.v0_smash * smashSpeedFactor();
        const v0Min = v0Max * SMASH_V0_MIN_REL;
        const ty = -PRM.clearLineY;
        const azims = targetAzims(hitter, hw, ty, fast ? 10 : 20);

        const elevStep = fast ? 1.5 : 0.6;
        const nV = fast ? 4 : 6;

        const landings = new Map();
        let maxW = 0;

        for (const azim of azims) {
          const azimRad = azim * Math.PI / 180;
          const elevCrit = Math.atan2(
            (NET_H - PRM.hh) * Math.cos(azimRad),
            hitter.y
          ) * 180 / Math.PI;

          const elevLo = Math.max(ELEV_MIN, elevCrit);
          const elevHi = SMASH_ELEV_MAX_UP;
          if (elevLo > elevHi) continue;

          for (let k = 0; k < nV; k++) {
            const u = nV > 1 ? k / (nV - 1) : 1;
            const v0 = v0Min + (v0Max - v0Min) * u;
            const wV = smashV0Weight(u);

            for (let elev = elevLo; elev <= elevHi + 1e-9; elev += elevStep) {
              const r = probe(v0, hitter, elev, azim, hw, null);
              if (!r) continue;

              const w = wV * landingKernel('smash', r.y, hitter.y);
              if (w <= 1e-12) continue;
              if (w > maxW) maxW = w;

              const key = azim.toFixed(2) + '_' + elev.toFixed(2) + '_' + k;
              if (!landings.has(key)) {
                landings.set(key, {x: r.x, y: r.y, type: 'smash', w, t: r.t, v0, elev, azim});
              }
            }
          }
        }

        if (maxW <= 1e-9) return [];
        const th = maxW * W_MIN_REL;
        return Array.from(landings.values()).filter(Ld => Ld.w >= th);
      }

      function genDropLandings(hitter, fast) {
        const hw = halfWidth();
        const opts = {maxOverNet: PRM.dropMaxOverNet};
        const ty = 0;
        const azimList = targetAzims(hitter, hw, ty, fast ? 10 : 18);

        const nProbe = Math.min(fast ? 4 : 5, azimList.length);
        const azimProbe = [];
        for (let i = 0; i < nProbe; i++) {
          const idx = Math.round(i * (azimList.length - 1) / Math.max(1, nProbe - 1));
          azimProbe.push(azimList[idx]);
        }

        const vLo = PRM.v0_drop_lo;
        const vHi = Math.max(vLo + 1, PRM.v0_drop_hi);
        const nCoarse = fast ? 4 : 5;

        const validV0 = [];
        for (let k = 0; k < nCoarse; k++) {
          const v0 = vLo * Math.pow(vHi / vLo, k / (nCoarse - 1));
          const ranges = coarseElevRanges(v0, hitter, hw, fast, opts, true, azimProbe);
          if (ranges.length) validV0.push(v0);
        }
        if (!validV0.length) return [];

        const v0Final = [];
        for (let k = 0; k < validV0.length; k++) {
          v0Final.push(validV0[k]);
          if (k + 1 < validV0.length) v0Final.push(Math.sqrt(validV0[k] * validV0[k + 1]));
        }

        const elevStep = fast ? 0.8 : 0.30;

        const landings = new Map();
        let maxW = 0;

        for (const v0 of v0Final) {
          const vw = v0WeightDrop(v0);
          if (vw < 1e-6) continue;

          const ranges = coarseElevRanges(v0, hitter, hw, fast, opts, false, azimProbe);
          if (!ranges.length) continue;

          for (const [lo, hi] of ranges) {
            for (let elev = lo; elev <= hi + 1e-9; elev += elevStep) {
              for (let i = 0; i < azimList.length; i++) {
                const azim = azimList[i];
                const r = probe(v0, hitter, elev, azim, hw, opts);
                if (!r) continue;
                const w = vw * landingKernel('drop', r.y, hitter.y);
                if (w <= 1e-12) continue;
                if (w > maxW) maxW = w;
                const key = v0.toFixed(1) + '_' + azim.toFixed(2) + '_' + elev.toFixed(2);
                if (!landings.has(key)) {
                  landings.set(key, {x: r.x, y: r.y, type: 'drop', w, t: r.t, v0, elev, azim});
                }
              }
            }
          }
        }

        if (maxW <= 1e-9) return [];
        const th = maxW * W_MIN_REL;
        return Array.from(landings.values()).filter(Ld => Ld.w >= th);
      }

      function genClearLandings(hitter, fast) {
        const hw = halfWidth();
        const lineY = -PRM.clearLineY;
        const opts = {minNetH: PRM.clearHeight};
        const azimList = targetAzims(hitter, hw, lineY, fast ? 10 : 18);

        const elevLo = -10, elevHi = 60;
        const elevStep = fast ? 2.0 : 1.0;
        const nCoarse = fast ? 4 : 5;

        let vLo = PRM.v0_clear_lo;
        let vHi = Math.max(vLo + 1, PRM.v0_clear_hi);

        for (let attempt = 0; attempt < 6; attempt++) {
          const coarse = [];
          for (let k = 0; k < nCoarse; k++)
            coarse.push(vLo * Math.pow(vHi / vLo, k / (nCoarse - 1)));
          const v0s = [];
          for (let k = 0; k < coarse.length; k++) {
            v0s.push(coarse[k]);
            if (k + 1 < coarse.length) v0s.push(Math.sqrt(coarse[k] * coarse[k + 1]));
          }

          const mid = vLo + (vHi - vLo) * 0.55;
          const sig = Math.max(0.5, (vHi - vLo) * 0.40);

          const landings = new Map();
          let maxW = 0;

          for (const v0 of v0s) {
            const vw = Math.exp(-Math.pow((v0 - mid) / sig, 2));
            if (vw < 1e-6) continue;
            for (let i = 0; i < azimList.length; i++) {
              const azim = azimList[i];
              for (let elev = elevLo; elev <= elevHi + 1e-9; elev += elevStep) {
                const r = probe(v0, hitter, elev, azim, hw, opts);
                if (!r) continue;
                if (r.y > lineY) continue;

                const w = vw;
                if (w <= 1e-12) continue;
                if (w > maxW) maxW = w;

                const key = v0.toFixed(1) + '_' + azim.toFixed(2) + '_' + elev.toFixed(1);
                if (!landings.has(key)) {
                  landings.set(key, {x: r.x, y: r.y, type: 'clear', w, t: r.t, v0, elev, azim});
                }
              }
            }
          }

          if (landings.size > 0) {
            const th = maxW * W_MIN_REL;
            return Array.from(landings.values()).filter(Ld => Ld.w >= th);
          }

          vLo *= 1.12;
          vHi *= 1.12;
        }
        return [];
      }

      function genLandings(type, hitter, fast) {
        if (type === 'drop') return genDropLandings(hitter, fast);
        if (type === 'clear') return genClearLandings(hitter, fast);
        return genSmashLandings(hitter, fast);
      }

      let cachedLandings = [];

      function rebuildLandings(probs, fast) {
        const hitter = opponents[0];
        const capStep = fast ? CAPTURE_STEP_FAST : CAPTURE_STEP;
        const out = [];

        for (const type of SHOT_TYPES) {
          const arr = genLandings(type, hitter, fast);
          if (!arr.length) continue;

          let sumW = 0;
          for (const Ld of arr) sumW += Ld.w;
          if (sumW <= 1e-9) continue;

          const targetW = type === 'smash' ? probs.ps
            : type === 'clear' ? probs.pc
              : probs.pd;
          const scale = targetW / sumW;

          for (const Ld of arr) {
            const trace = [];
            const opts = {capture: trace, captureStep: capStep};
            if (type === 'drop') opts.maxOverNet = PRM.dropMaxOverNet;
            else if (type === 'clear') opts.minNetH = PRM.clearHeight;

            simulate(Ld.v0, PRM.hh, Ld.elev, Ld.azim, hitter.x, hitter.y, opts);

            out.push({
              x: Ld.x, y: Ld.y, type, w: Ld.w * scale, t: Ld.t,
              v0: Ld.v0, elev: Ld.elev, azim: Ld.azim,
              trace
            });
          }
        }
        cachedLandings = out;
      }

      function buildItemsFromLandings(landings, cellSize) {
        const buckets = new Map();
        for (const Ld of landings) {
          if (Ld.w <= 0) continue;
          const gx = Math.round(Ld.x / cellSize);
          const gy = Math.round(Ld.y / cellSize);
          const tBin = Math.round(Ld.t / 0.12);
          const key = Ld.type + '_' + gx + '_' + gy + '_' + tBin;
          let b = buckets.get(key);
          if (!b) {
            b = {sx: 0, sy: 0, w: 0, tSum: 0, type: Ld.type, repW: -1, repTrace: null};
            buckets.set(key, b);
          }
          b.sx += Ld.x * Ld.w;
          b.sy += Ld.y * Ld.w;
          b.w += Ld.w;
          b.tSum += Ld.t * Ld.w;
          if (Ld.w > b.repW && Ld.trace && Ld.trace.length) {
            b.repW = Ld.w;
            b.repTrace = Ld.trace;
          }
        }
        const items = [];
        for (const b of buckets.values()) {
          if (b.w <= 1e-9) continue;
          items.push({
            L: {x: b.sx / b.w, y: b.sy / b.w},
            w: b.w,
            type: b.type,
            t: b.tSum / b.w,
            trace: b.repTrace
          });
        }
        return items;
      }

      function buildExactPathItems(landings) {
        const buckets = new Map();
        for (const Ld of landings) {
          if (Ld.w <= 0) continue;
          const traceKey = Ld.trace && Ld.trace.length
            ? Ld.trace.join(',')
            : `no-trace:${Ld.x}:${Ld.y}`;
          const key = `${Ld.type}:${Ld.t}:${Ld.y}:${traceKey}`;
          let item = buckets.get(key);
          if (!item) {
            item = {
              L: {x: Ld.x, y: Ld.y},
              w: 0,
              type: Ld.type,
              t: Ld.t,
              trace: Ld.trace || null
            };
            buckets.set(key, item);
          }
          item.w += Ld.w;
        }
        return Array.from(buckets.values());
      }

      function avgReachByType(items, P1, P2, ctxA, ctxB) {
        const acc = {
          smash: {s: 0, w: 0},
          clear: {s: 0, w: 0},
          drop: {s: 0, w: 0}
        };
        for (const it of items) {
          const sA = interceptStats(P1, it, ctxA);
          let r = sA.p;
          if (P2 && ctxB) {
            const sB = interceptStats(P2, it, ctxB);
            r = 1 - (1 - sA.p) * (1 - sB.p);
          }
          acc[it.type].s += r * it.w;
          acc[it.type].w += it.w;
        }
        const out = {};
        for (const k in acc) {
          out[k] = acc[k].w > 0 ? acc[k].s / acc[k].w : 0;
        }
        return out;
      }

      /* ============================================================
         八、站位优化
         ============================================================ */
      function itemV(pos1, pos2, item, ctxA, ctxB) {
        const sA = interceptStats(pos1, item, ctxA);
        const pa = sA.p * sA.q;
        let r = pa;
        if (pos2 && ctxB) {
          const sB = interceptStats(pos2, item, ctxB);
          const pb = sB.p * sB.q;
          r = 1 - (1 - pa) * (1 - pb);
        }
        const cv = cValue(item.type, item.L.y);
        return r * (cv + 1) - 1;
      }

      function overlapPenalty(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const sep = Math.sqrt(dx * dx + dy * dy);
        if (sep >= SEP_MIN_DIST) return 0;
        const u = (SEP_MIN_DIST - sep) / SEP_MIN_DIST;
        return SEP_PEN_K * u * u;
      }

      function formationRingGeometry() {
        const centerY = -PRM.formation_side_depth;
        const frontOffset = Math.max(0.05, Math.abs(centerY + PRM.formation_front_depth));
        const backOffset = Math.max(0.05, Math.abs(-PRM.formation_back_depth - centerY));
        return {
          centerX: 0,
          centerY,
          radiusX: Math.max(0.1, PRM.formation_half_width),
          radiusY: Math.max(0.1, (frontOffset + backOffset) * 0.5)
        };
      }

      function formationRingTargets(angle, geometry) {
        const ring = geometry || formationRingGeometry();
        const dx = ring.radiusX * Math.cos(angle);
        const dy = ring.radiusY * Math.sin(angle);
        return {
          p1: {x: ring.centerX - dx, y: ring.centerY - dy},
          p2: {x: ring.centerX + dx, y: ring.centerY + dy}
        };
      }

      function formationMatchForPositions(a, b) {
        const ring = formationRingGeometry();
        const project = q => {
          const magnitude = Math.hypot(q.x / ring.radiusX, q.y / ring.radiusY);
          if (magnitude < 1e-9) {
            return {x: ring.radiusX, y: 0};
          }
          return {
            x: q.x / magnitude,
            y: q.y / magnitude
          };
        };
        const evaluate = raw => {
          const q = project(raw);
          const p1 = {
            x: ring.centerX - q.x,
            y: ring.centerY - q.y
          };
          const p2 = {
            x: ring.centerX + q.x,
            y: ring.centerY + q.y
          };
          const direct = (
            Math.hypot(a.x - p1.x, a.y - p1.y) +
            Math.hypot(b.x - p2.x, b.y - p2.y)
          ) * 0.5;
          const swapped = (
            Math.hypot(a.x - p2.x, a.y - p2.y) +
            Math.hypot(b.x - p1.x, b.y - p1.y)
          ) * 0.5;
          const useSwapped = swapped < direct;
          return {
            distance: useSwapped ? swapped : direct,
            swapped: useSwapped,
            q
          };
        };

        const direct = evaluate({
          x: (b.x - a.x) * 0.5,
          y: (b.y - a.y) * 0.5
        });
        const swapped = evaluate({
          x: (a.x - b.x) * 0.5,
          y: (a.y - b.y) * 0.5
        });
        const best = swapped.distance < direct.distance ? swapped : direct;
        return {
          distance: best.distance,
          swapped: best.swapped,
          angle: Math.atan2(
            best.q.y / ring.radiusY,
            best.q.x / ring.radiusX
          )
        };
      }

      function formationPenalty(a, b) {
        const weight = PRM.formation_weight;
        if (weight <= 0) return 0;
        return weight * formationMatchForPositions(a, b).distance;
      }

      function singleRecoveryPenalty(pos) {
        const weight = PRM.formation_weight;
        if (weight <= 0) return 0;
        const center = {x: 0, y: -PRM.formation_single_depth};
        return weight * Math.hypot(pos.x - center.x, pos.y - center.y);
      }

      function symmetricAxisGrid(limit, requestedStep) {
        const count = Math.max(1, Math.ceil(limit / requestedStep - 1e-9));
        const step = limit / count;
        const out = [];
        for (let i = -count; i <= count; i++) {
          out.push(+(i * step).toFixed(8));
        }
        return out;
      }

      function totalV(pos, items, otherPos, ctxA, ctxB) {
        let sumWV = 0, sumW = 0;
        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          sumWV += it.w * itemV(pos, otherPos, it, ctxA, ctxB);
          sumW += it.w;
        }
        const value = sumW > 0 ? sumWV / sumW : -1;
        return value - (otherPos ? 0 : singleRecoveryPenalty(pos));
      }

      function optimizeSolo(items, step, ctxA) {
        const x0 = -HW + 0.30, x1 = HW - 0.30;
        const y0 = -HL + 0.40, y1 = -0.5;
        const xs = symmetricAxisGrid(HW - 0.30, step);

        const cands = [];
        let bestPos = null, bestV = -Infinity;

        for (const x of xs) {
          for (let y = y0; y <= y1 + 1e-9; y += step) {
            const pos = {x, y};
            const cP = ctxForPosition(pos, items, ctxA);
            const v = totalV(pos, items, null, cP, null);
            cands.push({P1: {...pos, heading: cP.heading}, P2: null, V: v});
            if (v > bestV) {bestV = v; bestPos = {...pos, heading: cP.heading};}
          }
        }

        if (!bestPos) {
          const a = {x: 0, y: -4.0};
          return {best: a, cands: [{P1: a, P2: null, V: 0}]};
        }

        let ax = bestPos.x, ay = bestPos.y, av = bestV;
        let h = Math.max(0.10, step * 0.5);
        const MIN_H = step > 0.25 ? 0.10 : 0.01;

        while (h >= MIN_H - 1e-9) {
          let guard = 0;
          while (guard++ < 400) {
            let bx = ax, by = ay, bv = av, moved = false;
            for (let k = -1; k <= 1; k++) {
              for (let m = -1; m <= 1; m++) {
                if (k === 0 && m === 0) continue;
                 const nx = ax + k * h, ny = ay + m * h;
                if (nx < x0 || nx > x1 || ny < y0 || ny > y1) continue;
                const pos = {x: nx, y: ny};
                const cP = ctxForPosition(pos, items, ctxA);
